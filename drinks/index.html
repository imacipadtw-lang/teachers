<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10/28 雙語研習 飲料訂單</title>
<style>
:root{
  --bg:#f6efe6; --card:#fffdf9; --ink:#2b221b; --muted:#7a6a5c;
  --brand:#6b3f2a; --brand-2:#a46a4a; --line:#e5d8c9;
  --hot:#c9542f; --cold:#2f7fc1; --ok:#2e7d4f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:20px 20px 18px;margin-bottom:14px}
.hero .k{font-size:13px;opacity:.85;letter-spacing:.08em}
.hero h1{margin:4px 0 10px;font-size:24px;line-height:1.25}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;opacity:.95}
.lect{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.lect .t{font-size:13px;color:var(--muted)}
.lect .name{font-size:18px;font-weight:700;margin:2px 0}
.lect .name em{font-style:normal;font-weight:500;font-size:14px;color:var(--brand-2);margin-left:6px}
.lect .org{font-size:14px;color:var(--muted)}
.lect .topic{margin-top:8px;font-size:15px;font-weight:600;color:var(--brand)}
.tabs{display:flex;gap:6px;margin:6px 0 14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:15px;color:var(--muted)}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label.l{display:block;font-weight:700;margin-bottom:8px;font-size:15px}
label.l small{font-weight:400;color:var(--muted);margin-left:6px}
select,input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:block;text-align:center;padding:16px 8px;border:2px solid var(--line);border-radius:14px;font-size:17px;font-weight:600;background:#fff}
.opt span b{display:block;font-size:26px;margin-bottom:2px}
.opt input:checked+span{border-color:var(--brand);background:#fbf1e8;color:var(--brand)}
.opt.hot input:checked+span{border-color:var(--hot);background:#fdeee8;color:var(--hot)}
.opt.cold input:checked+span{border-color:var(--cold);background:#e9f2fb;color:var(--cold)}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:18px;font-weight:700;margin-top:6px}
.btn:disabled{opacity:.55}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);font-size:15px;padding:11px}
.msg{padding:12px 14px;border-radius:12px;font-size:15px;margin-top:10px;display:none}
.msg.ok{display:block;background:#e6f4ec;color:var(--ok)}
.msg.err{display:block;background:#fdeee8;color:var(--hot)}
.sum{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;font-size:16px}
.sum .h{font-size:12px;color:var(--muted);font-weight:400}
.sum .n{font-weight:700;font-size:20px;text-align:right}
.sum .hot{color:var(--hot)} .sum .cold{color:var(--cold)}
.sum .row{display:contents}
.sum .total{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700}
.tag.hot{background:#fdeee8;color:var(--hot)} .tag.cold{background:#e9f2fb;color:var(--cold)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
pre.copy{white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px;font-family:inherit}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<div class="hero">
  <div class="k">南投縣草屯鎮土城國小｜115學年度雙語生活化研習</div>
  <h1>10/28 研習飲料訂單</h1>
  <div class="meta"><span>10/28（三）13:30–16:30</span><span>土城國小 檔案室</span></div>
</div>

<div class="lect">
  <div class="t">第一場講師</div>
  <div class="name">陳淑珠<em>副教授</em></div>
  <div class="org">國立雲林科技大學應用外語系</div>
  <div class="topic">從數位到互動：生成式 AI 在雙語課堂的應用與實踐</div>
</div>

<div class="tabs">
  <button id="tabForm" class="on" onclick="show('form')">我要點飲料</button>
  <button id="tabList" onclick="show('list')">訂單統整</button>
</div>

<!-- 點餐 -->
<div id="vForm">
  <form id="f" class="card" onsubmit="return submitOrder(event)">
    <label class="l" for="nameSel">姓名</label>
    <select id="nameSel" name="nameSel" required onchange="onNameSel()">
      <option value="" disabled selected>請選擇姓名</option>
      <option>陳順興校長</option>
      <option>簡玉惠</option><option>郭玉雪</option><option>劉佳雯</option><option>林家玉</option><option>陳佳君</option>
      <option>黃羽瑄</option><option>林繼于</option><option>李致德</option><option>陳怡璇</option><option>黃詠裕</option>
      <option>廖恒慈</option>
      <option value="__other">其他（自行填寫）</option>
    </select>
    <input type="text" id="name" name="name" class="hide" style="margin-top:8px" placeholder="請填姓名" maxlength="20" autocomplete="name">

    <label class="l" style="margin-top:16px">飲料 <small>四選一</small></label>
    <div class="grid">
      <label class="opt"><input type="radio" name="drink" value="美式咖啡" required><span><b>☕</b>美式咖啡</span></label>
      <label class="opt"><input type="radio" name="drink" value="拿鐵咖啡"><span><b>🥛</b>拿鐵咖啡</span></label>
      <label class="opt"><input type="radio" name="drink" value="英式奶茶"><span><b>🫖</b>英式奶茶</span></label>
      <label class="opt"><input type="radio" name="drink" value="水果茶"><span><b>🍑</b>水果茶</span></label>
    </div>

    <label class="l" style="margin-top:16px">冷 / 熱 <small>一定要選</small></label>
    <div class="grid">
      <label class="opt cold"><input type="radio" name="temp" value="冷" required><span><b>🧊</b>冷的</span></label>
      <label class="opt hot"><input type="radio" name="temp" value="熱"><span><b>🔥</b>熱的</span></label>
    </div>

    <label class="l" style="margin-top:16px" for="note">甜度 / 備註 <small>選填</small></label>
    <input type="text" id="note" name="note" placeholder="例：半糖、少冰、去冰" maxlength="30">

    <button class="btn" id="go" type="submit">送出訂單</button>
    <div id="m" class="msg"></div>
  </form>
  <div class="foot">送出後可以再點「訂單統整」看大家點了什麼。要改的話用同一個姓名再送一次就好。</div>
</div>

<!-- 統整 -->
<div id="vList" class="hide">
  <div class="card">
    <label class="l">數量統整 <small id="cnt"></small></label>
    <div class="sum" id="sum"></div>
    <button class="btn ghost" onclick="load()" style="margin-top:12px">重新整理</button>
    <button class="btn ghost" onclick="copyText()" style="margin-top:8px">複製統整文字（貼到 LINE / 給飲料店）</button>
    <div id="m2" class="msg"></div>
  </div>
  <div class="card">
    <label class="l">每個人的訂單</label>
    <table><thead><tr><th>姓名</th><th>飲料</th><th>冷熱</th><th>備註</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
  <pre class="copy hide" id="copybox"></pre>
</div>

</div>

<script>
/* ===== 設定：把 Google Apps Script 部署後的「網頁應用程式網址」貼在下面引號裡 ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwusPoywi1BiCi0rkx1bqJCE4Bxy8dM7kc5qZfQptOgqlcdnu01IerJPoZcJRkur-2yQ/exec";
/* ======================================================================== */

const DRINKS = ["美式咖啡","拿鐵咖啡","英式奶茶","水果茶"];
const $ = s => document.querySelector(s);

function show(v){
  $('#vForm').classList.toggle('hide', v!=='form');
  $('#vList').classList.toggle('hide', v!=='list');
  $('#tabForm').classList.toggle('on', v==='form');
  $('#tabList').classList.toggle('on', v==='list');
  if(v==='list') load();
}

function onNameSel(){
  const other = $('#nameSel').value==='__other';
  $('#name').classList.toggle('hide', !other);
  $('#name').required = other;
  if(other) $('#name').focus();
}

function msg(el, text, kind){ el.textContent=text; el.className='msg '+kind; }

async function submitOrder(e){
  e.preventDefault();
  const f = e.target;
  const sel = f.nameSel.value;
  const data = {
    name: (sel==='__other' ? f.name.value : sel).trim(),
    drink: f.drink.value,
    temp: f.temp.value,
    note: f.note.value.trim()
  };
  if(!data.name||!data.drink||!data.temp){ msg($('#m'),'姓名、飲料、冷熱都要填喔。','err'); return false; }
  if(!SCRIPT_URL){ msg($('#m'),'表單還沒連接到後端（SCRIPT_URL 尚未設定），請先完成設定。','err'); return false; }
  $('#go').disabled = true; msg($('#m'),'送出中…','ok');
  try{
    // text/plain 避免 CORS preflight；Apps Script 會收到 e.postData.contents
    await fetch(SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(data)});
    msg($('#m'), `已送出：${data.name}｜${data.drink}（${data.temp}）${data.note?'｜'+data.note:''}`, 'ok');
    try{ localStorage.setItem('drink_name', data.name); }catch(_){}
  }catch(err){
    msg($('#m'),'送出失敗，請再試一次或直接在 LINE 告訴承辦人。','err');
  }
  $('#go').disabled = false;
  return false;
}

let cache = [];
async function load(){
  if(!SCRIPT_URL){ msg($('#m2'),'SCRIPT_URL 尚未設定，還讀不到資料。','err'); return; }
  msg($('#m2'),'讀取中…','ok');
  try{
    const r = await fetch(SCRIPT_URL + '?action=list&t=' + Date.now());
    const j = await r.json();
    cache = j.rows || [];
    render();
    $('#m2').className='msg';
  }catch(err){ msg($('#m2'),'讀取失敗，請重新整理。','err'); }
}

function render(){
  const c = {};
  DRINKS.forEach(d=>c[d]={'冷':0,'熱':0});
  cache.forEach(r=>{ if(c[r.drink]) c[r.drink][r.temp]=(c[r.drink][r.temp]||0)+1; });
  let hot=0,cold=0;
  let html = `<div class="row"><span class="h">飲料</span><span class="h cold">冷</span><span class="h hot">熱</span></div>`;
  DRINKS.forEach(d=>{
    hot+=c[d]['熱']; cold+=c[d]['冷'];
    html += `<div class="row"><span>${d}</span><span class="n cold">${c[d]['冷']||'–'}</span><span class="n hot">${c[d]['熱']||'–'}</span></div>`;
  });
  html += `<div class="row"><span class="total">合計 ${cache.length} 杯</span><span class="n cold total">${cold}</span><span class="n hot total">${hot}</span></div>`;
  $('#sum').innerHTML = html;
  $('#cnt').textContent = `共 ${cache.length} 人填寫`;
  $('#rows').innerHTML = cache.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.drink)}</td><td><span class="tag ${r.temp==='熱'?'hot':'cold'}">${esc(r.temp)}</span></td><td>${esc(r.note||'')}</td></tr>`).join('') || `<tr><td colspan="4" style="color:var(--muted)">還沒有人填寫</td></tr>`;

  // 複製用文字
  let t = `10/28 雙語研習飲料訂單（共 ${cache.length} 杯）\n`;
  DRINKS.forEach(d=>{
    const parts=[]; if(c[d]['冷']) parts.push(`冷 ${c[d]['冷']}`); if(c[d]['熱']) parts.push(`熱 ${c[d]['熱']}`);
    if(parts.length) t += `・${d}：${parts.join('、')}\n`;
  });
  const notes = cache.filter(r=>r.note);
  if(notes.length){ t += `備註：\n` + notes.map(r=>`　${r.name} ${r.drink}（${r.temp}）${r.note}`).join('\n') + '\n'; }
  t += `\n名單：\n` + cache.map(r=>`${r.name}－${r.drink}（${r.temp}）${r.note?'，'+r.note:''}`).join('\n');
  $('#copybox').textContent = t;
}

async function copyText(){
  if(!cache.length){ msg($('#m2'),'還沒有資料可以複製。','err'); return; }
  const t = $('#copybox').textContent;
  try{ await navigator.clipboard.writeText(t); msg($('#m2'),'已複製，直接貼到 LINE 即可。','ok'); }
  catch(_){ $('#copybox').classList.remove('hide'); msg($('#m2'),'請長按下方文字複製。','ok'); }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

try{ const n=localStorage.getItem('drink_name'); if(n){
  const sel=$('#nameSel'); const has=[...sel.options].some(o=>o.value===n);
  if(has){ sel.value=n; } else { sel.value='__other'; $('#name').value=n; }
  onNameSel();
} }catch(_){}
if(location.hash==='#list') show('list');
</script>
</body>
</html>
