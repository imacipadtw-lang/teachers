<title>Lunch Box Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: a lunch box seen from above. Thick tray dividers, one oversized "main dish" compartment, side dishes around it. */
:root{
  --rice:#F1F4EE; --tray:#FFFFFF; --tray2:#E7ECE4; --nori:#1D2A22; --muted:#56665C; --line:#C9D2C5;
  --lacquer:#B23A28; --lacquer-ink:#FFFFFF; --egg:#EFB024; --leaf:#2E7D50; --sky:#2563A8;
  --good:#2A7149; --good-bg:#DDF0E3; --warn:#8A5A00; --warn-bg:#FBEBC6; --bad:#B42318; --bad-bg:#FBE0DC;
  --display:'Baloo 2','Noto Sans TC',system-ui,sans-serif;
  --body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --rice:#121814; --tray:#1C241F; --tray2:#26302A; --nori:#ECF1EA; --muted:#A3B2A8; --line:#38443C;
  --lacquer:#E0644F; --lacquer-ink:#1A0C08; --egg:#F4C24E; --leaf:#5FBF85; --sky:#7CB1EE;
  --good:#6FD09A; --good-bg:#183A26; --warn:#F2C25A; --warn-bg:#3B2E10; --bad:#FF8A7A; --bad-bg:#43201B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --rice:#121814; --tray:#1C241F; --tray2:#26302A; --nori:#ECF1EA; --muted:#A3B2A8; --line:#38443C;
  --lacquer:#E0644F; --lacquer-ink:#1A0C08; --egg:#F4C24E; --leaf:#5FBF85; --sky:#7CB1EE;
  --good:#6FD09A; --good-bg:#183A26; --warn:#F2C25A; --warn-bg:#3B2E10; --bad:#FF8A7A; --bad-bg:#43201B;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{background:var(--rice);color:var(--nori);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lacquer)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,input,select{font:inherit;color:inherit}
select{background:var(--tray);color:var(--nori);border:2px solid var(--line);border-radius:8px;padding:3px 8px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
a{color:var(--sky)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:var(--lacquer);color:var(--lacquer-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:8px}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;color:inherit;white-space:nowrap}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{color:inherit;text-decoration:none;padding:6px 8px;border-radius:999px;white-space:nowrap;font-weight:700;font-size:14px;opacity:.85}
.nav a.on{background:var(--lacquer-ink);color:var(--lacquer);opacity:1}
@media (max-width:720px){.bar-in{flex-wrap:wrap;row-gap:4px}.nav{order:3;flex-basis:100%}.mini{margin-left:auto}}
@media (max-width:480px){.mini .mn{display:none}.brand{font-size:18px}}
.mini{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;background:var(--lacquer-ink);color:var(--lacquer);padding:4px 10px;border-radius:999px;white-space:nowrap;text-decoration:none}

main{max-width:1100px;margin:0 auto;padding-top:24px;padding-bottom:64px}
.view{display:flex;flex-direction:column;gap:20px;overflow-x:clip;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
@supports not (overflow:clip){body{overflow-x:hidden}}
.vhead{display:flex;flex-direction:column;gap:6px}
.vhead h1{font-size:clamp(30px,5vw,44px);font-weight:800}
.vhead p{color:var(--muted);max-width:62ch}
.vhead .mission{color:var(--sky);font-weight:800;font-size:15px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{justify-content:center;text-align:center}

/* buttons */
.btn{border:2px solid var(--line);background:var(--tray);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:48px}
@media (hover:hover){.btn:hover{border-color:var(--nori)}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--lacquer);border-color:var(--lacquer);color:var(--lacquer-ink)}
.btn.big{font-size:22px;padding:12px 32px;font-family:var(--display)}
.btn.ghost{background:transparent}
.btn.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.btn.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.sel{outline:3px solid var(--nori);outline-offset:2px}

.panel{background:var(--tray);border:3px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn);border-radius:12px;padding:10px 14px;font-weight:700}
.note a{color:inherit}

/* home bento */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:8px;padding-bottom:4px}
.eyebrow{font-weight:700;letter-spacing:.06em;color:var(--lacquer);font-size:14px}
.hero h1{font-size:clamp(44px,9vw,84px);font-weight:800;letter-spacing:-.01em}
.hero .lede{color:var(--muted);font-size:18px}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--nori);padding:10px;border-radius:22px}
.cell{background:var(--tray);border-radius:12px;padding:16px;text-decoration:none;color:var(--nori);display:flex;flex-direction:column;gap:6px;min-width:0;min-height:150px;position:relative;transition:transform .15s}
@media (hover:hover){.cell:hover{transform:translateY(-2px)}}
.cell .pic{font-size:38px;line-height:1}
.cell h2{font-size:26px;font-weight:800}
.cell p{color:var(--muted);font-size:14px}
.cell .who{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tray2);color:var(--muted)}
.cell.main{grid-column:span 2;grid-row:span 2;background:var(--egg);color:#24190A}
.cell.main p{color:#3E2F12}
.cell.main .who{background:#24190A;color:var(--egg)}
.cell.main .pic{font-size:88px;margin-top:auto}
.cell.main h2{font-size:44px}
.cell.wide{grid-column:span 2}
.cell.rice{background:var(--tray2)}
@media (max-width:720px){.bento{grid-template-columns:repeat(2,1fr)}.cell.main{grid-row:span 1}.cell.main .pic{font-size:60px}}

/* spin */
.stage{background:var(--tray);border:6px solid var(--nori);border-radius:28px;padding:clamp(12px,2.5vh,28px) 16px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.stage-pic{font-size:clamp(72px,min(18vw,14vh),170px);line-height:1.1}
.stage-pic .ico{width:clamp(110px,min(22vw,24vh),230px);margin:0 auto}
/* icons: real photos (default), clay characters (inline SVG) or emoji */
.ico img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 5px 5px rgba(0,0,0,.24));user-select:none;-webkit-user-drag:none;pointer-events:none}
.tileimg{display:block;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.22))}
.cell .pic img{width:58px;height:58px;animation:bob 3.4s ease-in-out infinite}
.cell.main .pic img{width:128px;height:128px}
.cell:nth-child(3n) .pic img{animation-delay:-1.2s}.cell:nth-child(3n+1) .pic img{animation-delay:-2.3s}
.cell:hover .pic img{animation-duration:1.1s}
.stage-pic .ico img{animation:bob 3s ease-in-out infinite}
.hf img{width:100%;height:auto;display:block;animation:bob 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*-500ms)}
.ico-chip img{filter:none}
button,a{touch-action:manipulation}
.ico{display:block;line-height:0;aspect-ratio:1}
.ico svg{width:100%;height:100%;display:block}
.emo{line-height:1}
.ico-chip{display:inline-block;width:24px;height:24px;vertical-align:-6px;margin-right:2px}
.emo.ico-chip{font-size:18px;vertical-align:0}
.qpic .ico{width:clamp(96px,16vw,170px);margin:0 auto}
.opt .ico{width:min(72%,150px)}
.opt .emo{font-size:clamp(52px,11vw,96px)}
.cell .pic svg{width:58px;height:58px}
.cell.main .pic svg{width:128px;height:128px}
/* spin wheel */
.spinwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:820px){.spinwrap{grid-template-columns:1fr;justify-items:center}}
.wheelbox{--wsz:min(54vh,86vw,560px);--wr:calc(var(--wsz)*0.37);position:relative;width:var(--wsz);height:var(--wsz);margin:14px auto 6px}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid var(--nori);box-shadow:0 12px 30px rgba(0,0,0,.2),inset 0 0 0 5px rgba(255,255,255,.7);position:relative;will-change:transform}
.wseg{position:absolute;left:50%;top:50%;width:calc(var(--wsz)*.15);height:calc(var(--wsz)*.15);margin:calc(var(--wsz)*-.075) 0 0 calc(var(--wsz)*-.075);display:grid;place-items:center}
.wseg .ico{width:100%}
.wseg .emo{font-size:calc(var(--wsz)*.09)}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid var(--lacquer);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));z-index:3}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--wsz)*.2);height:calc(var(--wsz)*.2);border-radius:50%;border:6px solid var(--nori);background:var(--egg);color:#24190A;font:800 clamp(16px,calc(var(--wsz)*.055),30px) var(--display);cursor:pointer;z-index:2;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hub:disabled{cursor:default}
.spinv .stage{min-width:0}
button[data-del]{white-space:nowrap}
.sronly{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.confetti{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:50}
@keyframes toastin{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(1);opacity:1}}
@media (max-width:720px){.toast{top:calc(env(safe-area-inset-top,0px) + 112px)!important}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--nori);color:var(--tray);padding:10px 20px;border-radius:999px;font:800 18px var(--display);z-index:70;animation:toastin .4s both;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:520px){.stamps{grid-template-columns:repeat(3,1fr)}}
.stampwrap{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.stampwrap span{font:700 12px var(--body);color:var(--muted);text-align:center}
.stamp{width:100%;aspect-ratio:1;border:3px dashed var(--line);border-radius:50%;display:grid;place-items:center;font:800 26px var(--display);color:var(--line);overflow:hidden}
.stamp.on{border:4px solid var(--egg);background:var(--tray2);color:var(--nori);box-shadow:0 3px 0 rgba(0,0,0,.18);transform:rotate(-6deg)}
.stampwrap:nth-child(2n) .stamp.on{transform:rotate(5deg)}
.stamp img{width:68%;height:68%;object-fit:contain}.stamp svg{width:68%;height:68%}
.celebrate{background:var(--good-bg);border-color:var(--good);text-align:center}
.celebrate h2{color:var(--good)}
/* motion polish */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes viewin{from{opacity:0}to{opacity:1}}
.view.enter{animation:viewin .3s ease backwards}
.cell .pic svg,.stage-pic .ico svg{animation:bob 3.4s ease-in-out infinite}
.cell:nth-child(3n) .pic svg{animation-delay:-1.2s}.cell:nth-child(3n+1) .pic svg{animation-delay:-2.3s}
.cell:hover .pic svg{animation-duration:1.1s}
.btn{transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
@media (hover:hover){.btn:not(:disabled):hover{transform:translateY(-1px)}}
.btn:not(:disabled):active{transform:translateY(1px) scale(.98)}
.btn.primary{box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn.primary:not(:disabled):active{box-shadow:0 1px 0 rgba(0,0,0,.22)}
.opt{transition:transform .12s ease,border-color .12s,background .15s}
@media (hover:hover){.opt:not(:disabled):hover{transform:translateY(-3px) rotate(-1deg)}}
.opt:not(:disabled):active{transform:scale(.96)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.hero-art{position:relative;width:min(34vw,360px);aspect-ratio:1.15}
.hf{position:absolute;display:block;line-height:0;animation:popin .7s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*110ms)}
.hf svg{width:100%;height:auto;display:block;animation:bob 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*-500ms)}
.hf0{width:54%;left:23%;bottom:0}.hf1{width:30%;left:0;top:8%}.hf2{width:26%;right:2%;top:0}
.hf3{width:28%;left:3%;bottom:7%}.hf4{width:30%;right:0;bottom:12%}.hf5{width:22%;left:39%;top:0}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-art{width:min(78vw,300px);margin:0 auto;order:-1}}
/* speed round */
.speedstage{position:relative;gap:6px}
.seatbadge{font:800 clamp(26px,5vw,48px) var(--display);background:var(--nori);color:var(--tray);border-radius:999px;padding:2px 26px}
.speedstage .frame{font:800 clamp(30px,6vw,72px)/1.1 var(--display);min-height:1.2em;text-wrap:balance}
.ringwrap{position:relative;width:clamp(76px,13vh,116px);aspect-ratio:1;margin:2px auto 0}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.rbg{fill:none;stroke:var(--tray2);stroke-width:10}
.rfg{fill:none;stroke:var(--lacquer);stroke-width:10;stroke-linecap:round;stroke-dasharray:276.46;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.rfg.low{stroke:var(--bad)}
.ringwrap span{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;font:800 clamp(24px,5vh,38px) var(--display);font-variant-numeric:tabular-nums}
.sr-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:620px){.sr-board{grid-template-columns:repeat(2,1fr)}}
.sr-seat{background:var(--tray2);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.sr-seat b{font:800 26px var(--display)}
.sr-seat.off{opacity:.4}
.sr-seat.now{outline:3px solid var(--egg)}
@media (max-height:900px){.speedv .vhead p{display:none}}
/* Pack the Box */
.packwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.packwrap{grid-template-columns:1fr}}
.lunchbox{background:linear-gradient(160deg,#ff7bb0,#ff4fa3 60%,#e8358f);border-radius:28px;padding:14px;box-shadow:0 12px 0 #b3186c,0 18px 30px rgba(0,0,0,.18);width:min(100%,520px);margin:0 auto;position:relative}
.lunchbox::before{content:"";position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:34%;height:22px;border-radius:12px 12px 0 0;background:#ff4fa3;box-shadow:inset 0 -4px 0 #b3186c}
.lb-in{background:#fff6e9;border-radius:20px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pslot{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;border:3px dashed rgba(179,24,108,.35);background:rgba(255,255,255,.55);position:relative;min-width:0}
.pslot:nth-child(1),.pslot:nth-child(4){background:#ffe4ee}.pslot:nth-child(2),.pslot:nth-child(5){background:#e4fbff}.pslot:nth-child(3),.pslot:nth-child(6){background:#fff5d6}
.pslot.filled{border-style:solid;border-color:rgba(179,24,108,.25)}
.pslot .ico{width:74%}.pslot .emo{font-size:clamp(28px,6vw,52px)}
.pslot .n{position:absolute;right:6px;bottom:4px;font:800 12px var(--display);color:#b3186c;opacity:.7}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.shelf .opt{aspect-ratio:1.15}
.listen{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;font-family:var(--display);font-weight:800;font-size:clamp(20px,3.6vw,30px);text-align:center}
.listen .ear{font-size:34px;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.flyghost{position:fixed;z-index:60;pointer-events:none;will-change:transform}
.stars{font-size:26px;letter-spacing:2px}
.menu-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px;margin:0 auto}
.menu-item{display:flex;align-items:center;gap:10px;background:var(--tray);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,24px);cursor:pointer;text-align:left}
.menu-item .ico{width:44px;height:44px;flex:none}.menu-item .emo{font-size:30px}

@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:popin .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .35s ease-in-out}
@media (max-height:900px){.spinv .vhead p{display:none}.spinv{gap:14px}}
.stage-word{font-family:var(--display);font-weight:800;font-size:clamp(40px,min(9vw,9vh),90px);line-height:1}
.stage-zh{color:var(--muted);font-size:20px;min-height:1.6em}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:720px){.boxes{grid-template-columns:1fr}}
.box{border-radius:var(--r);padding:14px;border:3px solid;display:flex;flex-direction:column;gap:8px;min-width:0}
.box h3{font-size:20px;display:flex;justify-content:space-between}
.box.b1{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.box.b2{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.box.b3{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tray);color:var(--nori);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:700}
button.chip{cursor:pointer;min-height:40px}
button.chip.on{background:var(--nori);color:var(--tray);border-color:var(--nori)}
.empty{font-size:14px}

/* games */
.hud{display:flex;flex-wrap:wrap;gap:8px 20px;font-weight:700;font-variant-numeric:tabular-nums;font-size:18px}
.hud b{font-family:var(--display);font-size:24px}
.timebar{height:12px;background:var(--tray2);border-radius:999px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--egg)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:620px){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{aspect-ratio:1;max-width:100%;font-size:clamp(52px,11vw,96px);background:var(--tray);border:4px solid var(--line);border-radius:22px;cursor:pointer;display:grid;place-items:center}
@media (hover:hover){.opt:hover{border-color:var(--nori)}}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.feedback{font-weight:800;font-size:22px;text-align:center;min-height:1.6em;font-family:var(--display)}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.big-emoji{font-size:72px;line-height:1}

function stopVoice(){try{if(curSrc)curSrc.stop();}catch(e){}curSrc=null;try{if(clipEl)clipEl.pause();}catch(e){}try{speechSynthesis.cancel();}catch(e){}}
/* say(text, {slow}) — slow uses the <audio> element so pitch is kept; it is only offered on buttons (a tap). */
function say(t,o={}){
  ANIMEHOOK('heard',t);
  if(muted)return;
  const k=clipFor(t),uri=CLIPS[k];stopVoice();
  if(uri){
    const buf=buffers[k];
    if(buf&&actx&&actx.state==='running'&&!o.slow){
      try{const s=actx.createBufferSource();s.buffer=buf;s.connect(actx.destination);s.start(0);curSrc=s;return;}catch(e){}
    }
    try{clipEl=clipEl||new Audio();clipEl.src=uri;clipEl.defaultPlaybackRate=o.slow?.75:1;clipEl.playbackRate=o.slow?.75:1;
      if('preservesPitch' in clipEl)clipEl.preservesPitch=true;if('webkitPreservesPitch' in clipEl)clipEl.webkitPreservesPitch=true;
      const p=clipEl.play();if(p&&p.catch)p.catch(()=>{});return;}catch(e){}
  }
  try{
    if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=o.slow?.6:.85;
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
    const v=vs.find(v=>/samantha|aaron|nicky|ava|allison|susan|google us/i.test(v.name))||vs.find(v=>v.default)||vs[0];if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* short synthesized effects, no files needed */
function tone(seq){
  if(muted)return;const c=ctx();if(!c||c.state!=='running')return;
  try{seq.forEach(([f,d,len,type,vol])=>{const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);
    const t=c.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.25,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.start(t);o.stop(t+len+.02);});}catch(e){}
}
const ANIMEHOOK=(k,a)=>{try{const A=window.ANIME;if(A&&A[k])A[k](a);}catch(e){}};
const sfx={
  good:()=>{tone([[784,0,.14],[1175,.09,.22]]);ANIMEHOOK('good');},
  bad:()=>{tone([[196,0,.28,'square',.12],[147,.12,.3,'square',.1]]);ANIMEHOOK('bad');},
  tick:()=>tone([[1400,0,.04,'triangle',.08]]),
  win:()=>{tone([[523,0,.15],[659,.12,.15],[784,.24,.15],[1047,.36,.35]]);ANIMEHOOK('win');}
};
function beep(){tone([[660,0,.22,'sine',.3],[880,.25,.22,'sine',.3],[990,.5,.22,'sine',.3]]);}
const PRAISE=['Great job!','Awesome!','You got it!'];
const praise=()=>say(pick(PRAISE.filter(hasClip).length?PRAISE.filter(hasClip):['Great job!']));
/* screen wake lock for the projector views */
let wakeLock=null;
async function keepAwake(on){
  try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}
    else if(!on&&wakeLock){await wakeLock.release();wakeLock=null;}}catch(e){wakeLock=null;}
}

  let wheelRot=0;
  const buildWheel=()=>{const ws=words();const el=$('#sp-wheel');if(!ws.length){el.innerHTML='';return;}const n=ws.length,seg=360/n;
    const cols=['#FFD9D0','#FFEBB8','#D9F2E3','#D6E8FF','#F3DDFF','#FFF1D6','#E3F4FF'];

    const frame=now=>{if(!el.isConnected)return;const pr=dur?Math.min(1,(now-t0)/dur):1;const rot=start+(total-start)*ease(pr);el.style.transform=`rotate(${rot}deg)`;
      const sIdx=Math.floor((((360-rot%360)%360)+360)%360/seg);if(sIdx!==lastSeg){lastSeg=sIdx;sfx.tick();}

  $('#sp-pre').onclick=()=>setMode('pre');$('#sp-post').onclick=()=>setMode('post');

  nl.onclick=()=>{if($('#sp-go').disabled)return;if(nl.dataset.armed){delete nl.dataset.armed;S.boxes={};S.post={};S.speed={};S.stamps={};S.groups=[0,0];S.rubric={};S.mode='pre';save();spin();}

  $$('#sp-mark button').forEach(b=>b.onclick=()=>mark(+b.dataset.b));
  const noFull=()=>{$('#sp-full').textContent='這台裝置不支援全螢幕';$('#sp-full').disabled=true;};
  $('#sp-full').onclick=()=>{try{const d=document,el=d.documentElement;const rf=el.requestFullscreen||el.webkitRequestFullscreen,ex=d.exitFullscreen||d.webkitExitFullscreen;

/* ---------- catch ---------- */
function catchView(){
  const ROUNDS=10,LIMIT=6000;
  let r=0,score=0,combo=0,hits=0,missed=[],target=null,opts=[],locked=false;
  if(words().length<4){app.innerHTML=`<div class="view">${head('Catch 聽力接接樂','')}<p class="note">至少要有 4 個單字才能玩。請到 <a href="#words">單字設定</a> 加字。</p></div>`;return;}
  const start=()=>{
    app.innerHTML=`<div class="view">${head('Catch 聽力接接樂','只聽不看字。聽到哪個食物，就點那張圖。連對 3 題以上，每題分數 ×2。')}
    <div class="panel center"><p class="big-emoji">🎧</p><p>先把 iPad 音量打開。按下開始後馬上會念第一個字。</p>
    <div class="row center"><button class="btn primary big" id="c-start">開始（10 題）</button></div>
    <p class="note" id="mute-note" ${muted?'':'hidden'}>聲音目前關閉，Catch 需要聲音。<button class="btn" id="c-unmute">🔊 打開聲音</button></p>
    <p class="muted">這台 iPad 最高分：${S.scores.catchBest??'—'}</p></div></div>`;
    $('#c-unmute').onclick=()=>setMuted(false);
    $('#c-start').onclick=()=>{say('Listen and catch!');next(1400);};
  };
  const next=(delay=0)=>{
    if(r>=ROUNDS)return end();
    r++;locked=false;const ws=words();target=weightedPick(ws);
    /* distractors must look and sound different from the target and from each other */
    const pics=new Set([target.pic]),ens=new Set([target.en.trim().toLowerCase()]),others=[];
    shuffle(ws).forEach(w=>{const e=w.en.trim().toLowerCase();if(others.length<3&&!pics.has(w.pic)&&!ens.has(e)){pics.add(w.pic);ens.add(e);others.push(w);}});
    const showLabels=others.length<3;/* not enough different pictures: show the words so the round is still answerable */
    if(showLabels)shuffle(ws).forEach(w=>{const e=w.en.trim().toLowerCase();if(others.length<3&&!ens.has(e)){ens.add(e);others.push(w);}});
    opts=shuffle([target,...others]);
    app.innerHTML=`<div class="view">${head('Catch 聽力接接樂','')}
    <div class="hud"><span>第 ${r}/${ROUNDS} 題</span><span>分數 <b>${score}</b></span><span>${combo>=3?'🔥 連擊 ×2':'連擊 '+combo}</span></div>
    <div class="timebar"><i id="c-bar"></i></div>
    <div class="row center"><button class="btn" id="c-again">🔊 再聽一次</button>${slowBtn('c-slow')}</div>
    <div class="opts">${opts.map((w,i)=>`<button class="opt" data-i="${i}" aria-label="選項 ${i+1}" disabled>${pic(w,'opt')}<span class="lbl" ${showLabels?'':'hidden'}>${esc(w.en)}</span></button>`).join('')}</div>
    <p class="feedback" id="c-fb" aria-live="polite">&nbsp;</p></div>`;
    $('#c-again').onclick=()=>say(target.en);
    $('#c-slow').onclick=()=>say(target.en,{slow:true});
    $$('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
    const go=()=>{$$('.opt').forEach(b=>b.disabled=false);const bar=$('#c-bar');
      if(bar&&!reduce){bar.style.transition='none';bar.style.width='100%';void bar.offsetWidth;bar.style.transition=`width ${LIMIT}ms linear`;bar.style.width='0%';}
      say(target.en);later(()=>answer(-1),LIMIT);};
    if(delay)later(go,delay);else go();
  };
  const answer=i=>{
    if(locked)return;locked=true;clearView();
    const btns=$$('.opt');const ti=opts.indexOf(target);const fb=$('#c-fb');
    const bar=$('#c-bar');if(bar){const w=getComputedStyle(bar).width;bar.style.transition='none';bar.style.width=w;}
    btns.forEach(b=>{b.disabled=true;const l=b.querySelector('.lbl');if(l)l.hidden=false;});
    setFace(btns[ti],target,'open');if(i>=0&&i!==ti)setFace(btns[i],opts[i],'flat');
    if(i===ti){combo++;hits++;const pts=combo>=3?20:10;score+=pts;btns[ti].classList.add('right','pop');fb.className='feedback good';fb.textContent=`✅ ${target.en}！ +${pts}`;sfx.good();later(praise,250);later(()=>next(),1600);}
    else{combo=0;missed.push(target);if(i>=0)btns[i].classList.add('wrong','shake');btns[ti].classList.add('right');fb.className='feedback bad';fb.textContent=(i<0?'⏰ 時間到！':'❌ ')+`答案是 ${target.en}`;sfx.bad();later(()=>say(target.en),450);later(()=>next(),2000);}
  };

      ${uniq.length?`<p>這幾個字要再聽一次：</p><div class="chips" style="justify-content:center">${uniq.map(w=>`<button class="chip" data-en="${esc(w.en)}">🔊 ${pic(w,'chip')}${esc(w.en)}</button>`).join('')}</div>`:'<p>全部都聽對了！</p>'}
      <p class="note">沒聽對的字，點 🔊 再聽一次、跟著唸；都對了就再玩一次，挑戰最高分。</p>
      <div class="row center"><button class="btn primary" id="c-re">再玩一次</button><a class="btn" href="#party" style="text-decoration:none;display:inline-flex;align-items:center">下一站 Party Menu →</a></div>
    </div></div>`;
    $$('[data-en]').forEach(b=>b.onclick=()=>say(b.dataset.en));
    $('#c-re').onclick=()=>{r=0;score=0;combo=0;hits=0;missed=[];say("Let's go!");next(1100);};

}

/* ---------- pack the box ---------- */
function pack(){
  const ws0=words();
  if(ws0.length<4){app.innerHTML=`<div class="view">${head('Pack the Box 裝便當','')}<p class="note">至少要有 4 個單字才能玩。請到 <a href="#words">單字設定</a> 加字。</p></div>`;return;}
  const ROUNDS=Math.min(6,ws0.length);let r=0,stars=0,target=null,opts=[],locked=false,tries=0,order=[];const packed=[];
  const sentence=w=>`I want some ${form(w)}.`;
  const slots=()=>Array.from({length:ROUNDS},(_,i)=>`<div class="pslot ${packed[i]?'filled':''}">${packed[i]?pic(packed[i],'slot'):`<span class="n">${i+1}</span>`}</div>`).join('');
  const start=()=>{
    app.innerHTML=`<div class="view">${head('Pack the Box 裝便當',`聽一句 I want some ___.，點對的食物，它就會跳進便當盒。裝滿 ${ROUNDS} 格，便當就完成了。`)}
    <div class="panel center"><div class="lunchbox"><div class="lb-in">${slots()}</div></div>
    <p>先把 iPad 音量打開。第一次點對有 3 顆星，第二次 2 顆，第三次 1 顆。</p>
    <div class="row center"><button class="btn primary big" id="pk-start">開始裝便當</button></div>
    <p class="muted">這台 iPad 最高：${S.scores.packBest!=null?S.scores.packBest+' ★':'—'}</p></div></div>`;
    $('#pk-start').onclick=e=>{e.currentTarget.disabled=true;order=weightedOrder(ws0,ROUNDS);say("Let's go!");later(next,1000);};
  };
  const next=()=>{
    if(r>=ROUNDS)return end();
    target=order[r];r++;tries=0;locked=false;
    const pics=new Set([target.pic]),ens=new Set([target.en.trim().toLowerCase()]),others=[];
    shuffle(ws0).forEach(w=>{const e=w.en.trim().toLowerCase();if(others.length<3&&!pics.has(w.pic)&&!ens.has(e)){pics.add(w.pic);ens.add(e);others.push(w);}});
    const showLabels=others.length<3;
    if(showLabels)shuffle(ws0).forEach(w=>{const e=w.en.trim().toLowerCase();if(others.length<3&&!ens.has(e)){ens.add(e);others.push(w);}});
    opts=shuffle([target,...others]);
    app.innerHTML=`<div class="view">${head('Pack the Box 裝便當','')}
    <div class="hud"><span>第 ${r}/${ROUNDS} 格</span><span>星星 <b class="stars" style="color:var(--egg)">★ ${stars}</b> / ${ROUNDS*3}</span></div>
    <div class="packwrap">
      <div><div class="lunchbox"><div class="lb-in" id="pk-slots">${slots()}</div></div>
        <p class="listen" id="pk-listen"><span class="ear">👂</span><span id="pk-text">Listen…</span></p>
        <div class="row center"><button class="btn" id="pk-again">🔊 再聽一次</button>${slowBtn('pk-slow')}</div></div>
      <div class="shelf">${opts.map((w,i)=>`<button class="opt" data-i="${i}" aria-label="選項 ${i+1}" disabled>${pic(w,'opt')}${showLabels?`<span class="lbl">${esc(w.en)}</span>`:''}</button>`).join('')}</div>
    </div></div>`;
    const sent=sentence(target);
    $('#pk-again').onclick=()=>say(sent);$('#pk-slow').onclick=()=>say(sent,{slow:true});
    $$('.shelf .opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i,b));
    later(()=>{say(sent);$$('.shelf .opt').forEach(b=>b.disabled=false);},350);
  };
  const choose=(i,btn)=>{
    if(locked)return;
    if(opts[i]!==target){
      tries++;sfx.bad();btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');setFace(btn,opts[i],'flat');
      later(()=>say('Try again!'),250);
      if(tries>=2){const ti=opts.indexOf(target);const tb=$$('.shelf .opt')[ti];tb.classList.add('right','pop');}
      return;
    }
    locked=true;const got=tries===0?3:tries===1?2:1;stars+=got;
    $$('.shelf .opt').forEach(b=>b.disabled=true);btn.classList.add('right');setFace(btn,target,'open');sfx.good();
    $('#pk-text').textContent=sentence(target);$('#pk-listen').querySelector('.ear').textContent='✅';
    const slot=$$('#pk-slots .pslot')[r-1];
    fly(btn,slot,()=>{packed[r-1]=target;slot.classList.add('filled');slot.innerHTML=pic(target,'slot');slot.classList.add('pop');});
    later(praise,350);later(next,1700);
  };
  const fly=(from,to,done)=>{
    const ic=from.querySelector('.ico,.emo');
    if(reduce||!ic){done();return;}
    try{const a=ic.getBoundingClientRect(),b=to.getBoundingClientRect();const g=ic.cloneNode(true);g.className=(ic.classList.contains('ico')?'ico':'emo')+' flyghost';g.style.fontSize=getComputedStyle(ic).fontSize;
      g.style.left=a.left+'px';g.style.top=a.top+'px';g.style.width=a.width+'px';g.style.height=a.height+'px';document.body.appendChild(g);
      const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);const sc=(b.width*.74)/a.width;
      const an=g.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5-80}px) scale(${(1+sc)/2})`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${sc})`}],{duration:700,easing:'cubic-bezier(.2,.8,.2,1)'});
      an.onfinish=()=>{g.remove();done();};}catch(e){done();}
  };
  const end=()=>{
    S.scores.packLast=stars;S.scores.packBest=Math.max(S.scores.packBest||0,stars);save();sfx.win();confetti();say('Great job!');stamp('pack');
    app.innerHTML=`<div class="view">${head('便當完成！Your lunch box is ready!','')}
    <div class="panel center"><div class="lunchbox pop"><div class="lb-in">${slots()}</div></div>
      <div class="hud" style="justify-content:center"><span>星星 <b>${stars}</b> / ${ROUNDS*3}</span><span>最高 <b>${S.scores.packBest}</b></span></div>
      <p>現在換你說。點一句，跟著念：</p>
      <div class="menu-list">${packed.map(w=>`<button class="menu-item" data-say="${esc(sentence(w))}">${pic(w,'chip')}<span>${esc(sentence(w))}</span><span style="margin-left:auto">🔊</span></button>`).join('')}</div>
      <div class="row center"><button class="btn primary" id="pk-re">再裝一次</button><a class="btn" href="#build" style="text-decoration:none;display:inline-flex;align-items:center">下一站 Build It →</a></div>
    </div></div>`;
    $$('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
    $('#pk-re').onclick=e=>{e.currentTarget.disabled=true;r=0;stars=0;packed.length=0;order=weightedOrder(ws0,ROUNDS);say("Let's go!");later(next,1000);};
  };
  start();
}

/* ---------- party menu (co-learning: one iPad per group of three) ----------
   Each member brings one food to Ankita's Diwali party. The group picks 3 foods (at least one from India),
   then decides the right form for "I want some ___." A wrong choice gets a guiding question, not the answer.
   The finished menu stays on screen for the group-to-group sharing. */
const INDIA=['naan','curry','samosa'];
const fromIndia=w=>INDIA.includes((w.en||'').trim().toLowerCase());
function party(){
  const ws=words();
  if(ws.length<3){app.innerHTML=`<div class="view">${head('Party Menu 派對菜單','')}<p class="note">至少要有 3 個單字。請到 <a href="#words">單字設定</a> 加字。</p></div>`;return;}
  const needIndia=ws.some(fromIndia);
  const sentence=w=>`I want some ${form(w)}.`;
  let group=(S.party&&S.party.group)||'';
  let chosen=[],k=0,first=0,missed=false;
  const plate=()=>`<div class="lunchbox"><div class="lb-in">${[0,1,2].map(i=>`<div class="pslot ${chosen[i]?'filled':''}">${chosen[i]?pic(chosen[i],'slot'):`<span class="n">${i+1}</span>`}</div>`).join('')}</div></div>`;
  const pickView=()=>{
    clearView();
    const hasIndia=!needIndia||chosen.some(fromIndia);const full=chosen.length===3;
    const msg=!full?`再選 ${3-chosen.length} 種。Choose ${3-chosen.length} more.`:!hasIndia?'還少一種印度食物。Add one food from India!':'選好了！Ready!';
    app.innerHTML=`<div class="view">${head('Party Menu 派對菜單','Ankita 的排燈節派對要開始了。三個人一組，一人選一種食物帶去派對，至少一種要是印度食物。')}
    <div class="row"><b>我們是</b><div class="seg" role="group" aria-label="我們是哪一組">${['A','B'].map(g=>`<button data-g="${g}" aria-pressed="${group===g}">${g} 組</button>`).join('')}</div><span class="muted">點食物會唸出來；再點一次可以取消。</span></div>
    ${plate()}
    <p class="feedback ${full&&hasIndia?'good':''}" id="pm-msg" aria-live="polite">${msg}</p>
    <div class="pm-grid">${ws.map((w,i)=>`<button class="pm-food ${chosen.includes(w)?'on':''}" data-i="${i}" aria-pressed="${chosen.includes(w)}">${fromIndia(w)?'<span class="tag">INDIA</span>':''}${pic(w,'opt')}<span class="lbl">${esc(w.en)}</span></button>`).join('')}</div>
    <div class="row center"><button class="btn primary big" id="pm-next" ${full&&hasIndia?'':'disabled'}>下一步：說說看 →</button></div>
    </div>`;
    $$('.seg [data-g]').forEach(b=>b.onclick=()=>{group=b.dataset.g;pickView();});
    $$('.pm-food').forEach(b=>b.onclick=()=>{const w=ws[+b.dataset.i];
      if(chosen.includes(w)){chosen=chosen.filter(x=>x!==w);pickView();return;}
      if(chosen.length>=3){sfx.bad();$('#pm-msg').textContent='已經 3 種了。先點掉一種，再換別的。';return;}
      chosen=[...chosen,w];stopVoice();say(w.en);pickView();});
    $('#pm-next').onclick=()=>{k=0;first=0;formView();};
  };
  const formView=()=>{
    clearView();stopVoice();
    if(k>=chosen.length)return menuView(true);
    const w=chosen[k];const good=form(w);const bad=w.count?w.en.trim():w.en.trim()+'s';
    const opts=good===bad?[good]:shuffle([good,bad]);missed=false;
    app.innerHTML=`<div class="view">${head('Party Menu 派對菜單','哪一句才對？三個人討論好再點。')}
    <div class="hud"><span>第 ${k+1}/${chosen.length} 種食物</span><span>輪到第 ${k+1} 位組員點</span></div>
    <div class="qpic">${pic(w,'q')}</div>
    <div class="row center" style="flex-direction:column;align-items:stretch;max-width:520px;margin:0 auto;width:100%">${opts.map(o=>`<button class="btn big" data-o="${esc(o)}">I want some ${esc(o)}.</button>`).join('')}</div>
    <div class="explain" id="pm-fb" hidden></div></div>`;
    later(()=>say(w.en),300);
    $$('[data-o]').forEach(b=>b.onclick=()=>{
      const fb=$('#pm-fb');fb.hidden=false;
      if(b.dataset.o!==good){
        missed=true;sfx.bad();b.disabled=true;b.classList.add('bad','shake');setFace($('.qpic'),w,'flat');
        fb.innerHTML=`<p class="feedback">🤔 Can you count it? 數得出來嗎？</p>`+(w.count
          ?`<div class="pm-many" aria-hidden="true">${pic(w,'many')}${pic(w,'many')}${pic(w,'many')}</div><p>${esc(w.en)} 可以一個、兩個、三個數。派對上要帶很多個，字尾要怎麼變？再選一次。</p>`
          :`<p>${esc(w.en)} 沒辦法一個、兩個數。這種字要加 s 嗎？再選一次。</p>`);
        later(()=>say('Can you count it?'),250);
        return;
      }
      if(!missed)first++;
      stopVoice();sfx.good();$$('[data-o]').forEach(x=>x.disabled=true);b.classList.add('good');setFace($('.qpic'),w,'open');
      const sn=sentence(w);const last=k+1>=chosen.length;
      fb.innerHTML=`<p class="feedback good">✅ ${missed?'改對了！':'第一次就對了！'}</p><p>${rule(w)}</p><p class="say">${esc(sn)}</p>
        <p class="muted">三個人一起唸一次，再按下一步。</p>
        <div class="row center"><button class="btn" id="pm-say">🔊 聽一次</button>${slowBtn('pm-slow')}<button class="btn primary" id="pm-go">${last?'看我們的菜單 →':'下一種 →'}</button></div>`;
      $('#pm-say').onclick=()=>say(sn);$('#pm-slow').onclick=()=>say(sn,{slow:true});$('#pm-go').onclick=()=>{k++;formView();};
      later(()=>say(sn),450);
    });
  };
  const menuView=isNew=>{
    clearView();
    if(isNew){S.party={group,foods:chosen.map(w=>w.en),first};S.scores.partyFirst=first;S.scores.partyTotal=chosen.length;save();sfx.win();confetti();stamp('party');later(()=>say('Great job!'),300);}
    const title=group?`Group ${group}’s Party Menu`:'Our Party Menu';
    app.innerHTML=`<div class="view">${head('🎉 '+esc(title),'這是我們要帶去 Ankita 排燈節派對的食物。')}
    <div class="panel center">${plate()}
      <div class="menu-list">${chosen.map((w,i)=>`<button class="menu-item" data-say="${esc(sentence(w))}"><span class="pm-no">${i+1}</span>${pic(w,'chip')}<span>${esc(sentence(w))}</span><span style="margin-left:auto">🔊</span></button>`).join('')}</div>
      <p class="muted">第一次就選對：${first}/${chosen.length}</p>
    </div>
    <section class="panel"><h2>互學：唸給另一組聽</h2>
      <p>把 iPad 舉起來，一人唸一句。聽的那一組回答：</p>
      <p class="pm-reply">Yummy! I like your ___.</p>
      <p class="muted">把 ___ 換成你聽到的食物，例如 ${esc(form(chosen[0]))}。</p></section>
    <div class="row center"><button class="btn" id="pm-again">重新選一次</button><a class="btn" href="#home" style="text-decoration:none;display:inline-flex;align-items:center">回首頁</a></div>
    </div>`;
    $$('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
    $('#pm-again').onclick=()=>{chosen=[];first=0;pickView();};
  };
  /* a finished menu survives a reload or a sleeping iPad */
  const saved=S.party&&Array.isArray(S.party.foods)?S.party.foods.map(en=>ws.find(w=>w.en===en)).filter(Boolean):[];
  if(saved.length===3){chosen=saved;first=+S.party.first||0;menuView(false);}else pickView();
}

/* ---------- speed round ---------- */
function speed(){
  const ws=words();
  if(!ws.length){app.innerHTML=`<div class="view">${head('Speed Round 快問快答','')}<p class="note">請先到 <a href="#words">單字設定</a> 加字。</p></div>`;return;}
  const LIMIT=10,C=276.46;let cur=null,run=0;
  const grp=n=>n%2?'A':'B';
  app.innerHTML=`<div class="view speedv">
   ${head('Speed Round 快問快答','抽一位同學，10 秒內說出這一句。說對老師按 ✓，所屬組別 +1；時間到會自動念出示範句，全班跟著唸。')}
   <div class="hud" id="sr-teams" style="justify-content:center;font-size:24px" aria-live="polite"></div>
    <div class="stage speedstage">
     <div class="seatbadge" id="sr-seat" aria-live="polite">? 號</div>
     <div class="stage-pic" id="sr-pic">${pic(null,'stage')}</div>
     <div class="frame" id="sr-frame" aria-live="polite">Ready?</div>
     <div class="ringwrap"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rbg" cx="50" cy="50" r="44"/><circle class="rfg" id="sr-ring" cx="50" cy="50" r="44"/></svg><span id="sr-sec">${LIMIT}</span></div>
   </div>
   <div class="row center"><button class="btn primary big" id="sr-draw">🎲 抽一位 <kbd>空白</kbd></button><button class="btn good" id="sr-ok" disabled>✓ 說對了 +1 <kbd>1</kbd></button><button class="btn bad" id="sr-no" disabled>✗ 再練 <kbd>2</kbd></button><button class="btn" id="sr-say" disabled>🔊 示範句</button></div>
   <section class="panel"><h2>每位同學的開口次數</h2><div class="sr-board" id="sr-board"></div><p class="muted">輪到次數最少的同學會先被抽到，每人都有機會開口。缺席的座號請在「教師工具」點掉。</p></section>
  </div>`;
  const board=()=>{const tm=$('#sr-teams');if(tm)tm.innerHTML=`<span>A 組（1、3、5 號） <b>${S.groups[0]||0}</b></span><span>B 組（2、4、6 號） <b>${S.groups[1]||0}</b></span>`;$('#sr-board').innerHTML=[1,2,3,4,5,6].map(n=>{const x=S.speed[n]||{ok:0,t:0};const off=S.absent.includes(n);
    return `<div class="sr-seat ${off?'off':''} ${cur&&cur.seat===n&&!cur.done?'now':''}"><span class="muted">${n} 號・${grp(n)} 組${off?'（缺席）':''}</span><b>✓ ${x.ok} / ${x.t}</b></div>`;}).join('');};
  const setBtns=active=>{$('#sr-ok').disabled=!active;$('#sr-no').disabled=!active;$('#sr-say').disabled=!cur;$('#sr-draw').disabled=active;};
  const reveal=()=>{if(!cur)return;$('#sr-frame').textContent=cur.sentence;};
  const timeUp=()=>{if(!cur||cur.done)return;const c=cur;beep();reveal();later(()=>{if(cur===c)say(c.sentence);},600);};
  const countdown=()=>{const id=++run;const t0=Date.now();const ring=$('#sr-ring');ring.classList.remove('low');ring.style.transition='none';ring.style.strokeDashoffset='0';void ring.getBoundingClientRect();ring.style.transition='';
    const tick=()=>{if(id!==run||!cur||cur.done)return;const left=Math.max(0,LIMIT-(Date.now()-t0)/1000);$('#sr-sec').textContent=Math.ceil(left);
      ring.style.strokeDashoffset=String(C*(1-left/LIMIT));ring.classList.toggle('low',left<=3);if(left<=3&&left>0&&Math.ceil(left)!==cur.lastTick){cur.lastTick=Math.ceil(left);sfx.tick();}
      if(left<=0){timeUp();return;}later(tick,200);};tick();};
  const draw=()=>{
    if(cur&&!cur.done)return;
    const present=[1,2,3,4,5,6].filter(n=>!S.absent.includes(n));
    if(!present.length){$('#sr-frame').textContent='全部標成缺席了';return;}
    const cnt=n=>(S.speed[n]&&S.speed[n].t)||0;const min=Math.min(...present.map(cnt));
    const seat=pick(present.filter(n=>cnt(n)===min));
    const goal=ws.filter(w=>S.boxes[w.en]===1);const w=(goal.length&&Math.random()<.6)?pick(goal):pick(ws);
    const like=false; /* this lesson's finale drills the target frame only */const frame=like?'I like':'I want some';
    cur={seat,w,sentence:`${frame} ${form(w)}.`,done:false,lastTick:0};
    $('#sr-seat').textContent=`${seat} 號・${grp(seat)} 組`;
    $('#sr-pic').innerHTML=pic(w,'stage');$('#sr-pic').classList.remove('pop');void $('#sr-pic').offsetWidth;$('#sr-pic').classList.add('pop');
    $('#sr-frame').textContent=`${frame} ___.`;sfx.tick();setBtns(true);board();countdown();
  };
  const mark=ok=>{
    if(!cur||cur.done)return;cur.done=true;run++;const c=cur;
    const x=S.speed[c.seat]||(S.speed[c.seat]={ok:0,t:0});x.t++;if(ok)x.ok++;
    if(ok){const g=c.seat%2?0:1;S.groups[g]=(S.groups[g]||0)+1;sfx.good();setFace($('#sr-pic'),c.w,'open');later(praise,250);later(()=>{if(cur===c)say(c.sentence);},1100);}
    else{sfx.bad();setFace($('#sr-pic'),c.w,'flat');later(()=>{if(cur===c)say(c.sentence,{slow:true});},450);}
    reveal();save();setBtns(false);board();
  };
  $('#sr-draw').onclick=draw;$('#sr-ok').onclick=()=>mark(true);$('#sr-no').onclick=()=>mark(false);
  $('#sr-say').onclick=()=>cur&&say(cur.sentence);
  viewKeys=e=>{if(e.key===' '){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();draw();}
    else if(e.key==='1')mark(true);else if(e.key==='2')mark(false);};
  keepAwake(true);board();
}

/* ---------- impostor ---------- */
function makeImpostor(){
  const w=pick(words());const like=Math.random()<.5;const frame=like?['I','like']:['I','want','some'];
  const good=[...frame,form(w)];
  const ok={tokens:good,bad:-1,w,good,why:'整句都對，沒有內鬼！'};
  if(Math.random()<.25)return ok;
  if(w.count){
    if(form(w)===w.en.trim())return ok;
    return {tokens:[...frame,w.en.trim()],bad:frame.length,w,good,why:`內鬼是 ${esc(w.en)}：${rule(w)}`};
  }
  if(like){const a=art(w.en);return {tokens:['I','like',a,w.en.trim()],bad:2,w,good,why:`內鬼是 ${a}：${rule(w)}`};}
  return {tokens:[...frame,w.en.trim()+'s'],bad:3,w,good,why:`內鬼是 ${esc(w.en)}s：${rule(w)}`};
}
function impostor(){
  const ROUNDS=8;let r=0,pts=0,item=null;
  if(!words().length){app.innerHTML=`<div class="view">${head('Impostor 抓內鬼','')}<p class="note">請先到 <a href="#words">單字設定</a> 加字。</p></div>`;return;}
  const round=()=>{
    clearView();stopVoice();
    if(r>=ROUNDS)return end();
    r++;item=makeImpostor();if(r===1)say('Find the impostor!');
    app.innerHTML=`<div class="view">${head('Impostor 抓內鬼','每句最多一個內鬼：多了 a／an，或 -s 用錯。點那個字把它丟出去；整句都對就按「沒有內鬼」。')}
    <div class="hud"><span>第 ${r}/${ROUNDS} 句</span><span>抓對 <b>${pts}</b></span></div>
    <div class="qpic">${pic(item.w,'q')}</div>
    <div class="tokens">${item.tokens.map((t,i)=>`<button class="tok" data-i="${i}">${esc(t)}</button>`).join('')}<span class="dot">.</span></div>
    <div class="row center"><button class="btn good" id="i-none">✅ 沒有內鬼</button></div>
    <div class="explain" id="i-fb" hidden></div></div>`;
    $$('.tok').forEach(b=>b.onclick=()=>pickIt(+b.dataset.i));
    $('#i-none').onclick=()=>pickIt(-1);
  };
  const pickIt=i=>{
    const right=i===item.bad;if(right)pts++;right?sfx.good():sfx.bad();setFace($('.qpic'),item.w,right?'open':'flat');
    $$('.tok').forEach((b,k)=>{b.disabled=true;if(k===item.bad)b.classList.add('impostor');if(k===i&&!right)b.classList.add('miss');});
    $('#i-none').disabled=true;
    const sentence=item.good.join(' ')+'.';
    const fb=$('#i-fb');fb.hidden=false;
    fb.innerHTML=`<p class="feedback ${right?'good':'bad'}">${right?'✅ 判斷正確！':'❌ 再看一次'}</p><p>${item.why}</p>
      <p class="say">${esc(sentence)}</p><div class="row center"><button class="btn" id="i-say">🔊 聽正確句子</button>${slowBtn('i-slow')}<button class="btn primary" id="i-next">${r>=ROUNDS?'看結果':'下一句 →'}</button></div>`;
    $('#i-say').onclick=()=>say(sentence);$('#i-slow').onclick=()=>say(sentence,{slow:true});$('#i-next').onclick=round;later(()=>say(sentence),450);
  };
  const end=()=>{
    S.scores.impostorLast=pts;save();if(pts>=6){sfx.win();confetti();stamp('impostor');}
    app.innerHTML=`<div class="view">${head('Impostor 結果','')}<div class="panel center"><p class="big-emoji">🕵️</p>
      <div class="hud" style="justify-content:center"><span>抓對 <b>${pts}/${ROUNDS}</b></span></div>
      <p>記住：數得出來的字加 -s（apples）；數不出來的字不加 a、不加 -s（rice）。</p>
      <div class="row center"><button class="btn primary" id="i-re">再玩一次</button><a class="btn" href="#check" style="text-decoration:none;display:inline-flex;align-items:center">下一站 Check →</a></div></div></div>`;
    $('#i-re').onclick=()=>{r=0;pts=0;round();};
  };
  round();
}

/* ---------- build it ---------- */
function makeBuild(){
  const w=pick(words());const like=Math.random()<.5;const frame=like?['I','like']:['I','want','some'];
  const ans=[...frame,form(w)];const wrong=w.count?w.en.trim():w.en.trim()+'s';
  const extra=[art(form(w))];if(wrong!==form(w))extra.push(wrong);
  const tiles=shuffle([...ans,...extra]).map((t,id)=>({t,id}));
  return {w,like,ans,tiles,zh:like?`我喜歡${w.zh}。`:`我想要一些${w.zh}。`};
}
function build(){
  const ROUNDS=6;let r=0,ok=0,item=null,picked=[],done=false;
  if(!words().length){app.innerHTML=`<div class="view">${head('Build It 組句子','')}<p class="note">請先到 <a href="#words">單字設定</a> 加字。</p></div>`;return;}
  const round=()=>{clearView();stopVoice();if(r>=ROUNDS)return end();r++;item=makeBuild();picked=[];done=false;if(r===1)say('Build the sentence!');render();};
  const render=()=>{
    const left=item.tiles.filter(x=>!picked.includes(x.id));
    app.innerHTML=`<div class="view">${head('Build It 組句子','看圖和中文，點字卡排出英文句子。有些字卡是陷阱，不一定全部用到。')}
    <div class="hud"><span>第 ${r}/${ROUNDS} 句</span><span>答對 <b>${ok}</b></span></div>
    <div class="qpic">${pic(item.w,'q')}</div><p class="prompt">${esc(item.zh)}</p>
    <div class="slot" id="b-slot">${picked.length?picked.map(id=>`<button class="tok" data-out="${id}">${esc(item.tiles[id].t)}</button>`).join('')+'<span class="dot">.</span>':'<span class="hint">點下面的字卡放到這裡</span>'}</div>
    <div class="tray">${left.map(x=>`<button class="tok" data-in="${x.id}">${esc(x.t)}</button>`).join('')}</div>
    <div class="row center"><button class="btn ghost" id="b-clear">清除</button><button class="btn primary" id="b-check" ${picked.length?'':'disabled'}>檢查</button></div>
    <div class="explain" id="b-fb" hidden></div></div>`;
    if(done)return;
    $$('[data-in]').forEach(b=>b.onclick=()=>{picked.push(+b.dataset.in);sfx.tick();render();});
    $$('[data-out]').forEach(b=>b.onclick=()=>{picked=picked.filter(id=>id!==+b.dataset.out);render();});
    $('#b-clear').onclick=()=>{picked=[];render();};
    $('#b-check').onclick=check;
  };
  const check=()=>{
    done=true;const mine=picked.map(id=>item.tiles[id].t).join(' ');const goal=item.ans.join(' ');const right=mine===goal;if(right)ok++;right?sfx.good():sfx.bad();setFace($('.qpic'),item.w,right?'open':'flat');
    $$('.tok').forEach(b=>b.disabled=true);$('#b-check').disabled=true;$('#b-clear').disabled=true;
    const fb=$('#b-fb');fb.hidden=false;
    fb.innerHTML=`<p class="feedback ${right?'good':'bad'}">${right?'✅ 完全正確！':'❌ 差一點'}</p><p>${rule(item.w)}</p><p class="say">${esc(goal)}.</p>
      <div class="row center"><button class="btn" id="b-say">🔊 聽一次</button>${slowBtn('b-slow')}<button class="btn primary" id="b-next">${r>=ROUNDS?'看結果':'下一句 →'}</button></div>`;
    $('#b-say').onclick=()=>say(goal);$('#b-slow').onclick=()=>say(goal,{slow:true});$('#b-next').onclick=round;later(()=>say(goal),450);
  };
  const end=()=>{
    S.scores.buildLast=ok;save();if(ok>=5){sfx.win();confetti();stamp('build');}
    app.innerHTML=`<div class="view">${head('Build It 結果','')}<div class="panel center"><p class="big-emoji">🧱</p>
      <div class="hud" style="justify-content:center"><span>答對 <b>${ok}/${ROUNDS}</b></span></div>
      <div class="row center"><button class="btn primary" id="b-re">再玩一次</button><a class="btn" href="#impostor" style="text-decoration:none;display:inline-flex;align-items:center">下一站 Impostor →</a></div></div></div>`;
    $('#b-re').onclick=()=>{r=0;ok=0;round();};
  };
  round();
}

/* ---------- check (exit ticket) ---------- */
function makeCheck(){
  const ws=shuffle(words());const items=[];
  ws.slice(0,3).forEach(w=>items.push({type:'sort',w}));
  ws.slice(3).filter(w=>w.en.trim()).slice(0,3).forEach(w=>{
    const good=`I like ${form(w)}.`;
    const set=new Set([good,`I like ${w.count?w.en.trim():w.en.trim()+'s'}.`,`I like ${art(form(w))} ${form(w)}.`]);
    items.push({type:'choice',w,good,opts:shuffle([...set])});
  });
  return items;
}
function check(){
  if(words().length<6){app.innerHTML=`<div class="view">${head('Check 離場檢核','')}<p class="note">至少要有 6 個單字。請到 <a href="#words">單字設定</a> 加字。</p></div>`;return;}
  const items=makeCheck();let k=0,ok=0;
  const q=()=>{
    clearView();stopVoice();
    if(k>=items.length)return end();
    const it=items[k];const n=k+1;
    const body=it.type==='sort'
      ?`<div class="qpic">${pic(it.w,'q')}</div><p class="prompt">${esc(it.w.en)}　Can you count it? 數得出來嗎？</p>
        <div class="row center"><button class="btn big" data-a="1">數得出來（用複數）</button><button class="btn big" data-a="0">數不出來</button></div>`
      :`<div class="qpic">${pic(it.w,'q')}</div><p class="prompt">我喜歡${esc(it.w.zh)}。選對的英文句子：</p>
        <div class="row center" style="flex-direction:column;align-items:stretch;max-width:520px;margin:0 auto;width:100%">${it.opts.map((o,i)=>`<button class="btn big" data-o="${i}">${esc(o)}</button>`).join('')}</div>`;
    app.innerHTML=`<div class="view">${head('Check 離場檢核','6 題，做完會產生你的結果卡。')}
      <div class="hud"><span>第 ${n}/${items.length} 題</span></div>${body}<div class="explain" id="k-fb" hidden></div></div>`;
    if(it.type==='sort')say('Can you count it?');
    const done=(right,btn,goodBtn)=>{
      if(right)ok++;right?sfx.good():sfx.bad();setFace($('.qpic'),it.w,right?'open':'flat');$$('[data-a],[data-o]').forEach(b=>b.disabled=true);
      btn.classList.add(right?'good':'bad');if(goodBtn)goodBtn.classList.add('good');
      const fb=$('#k-fb');fb.hidden=false;
      fb.innerHTML=`<p class="feedback ${right?'good':'bad'}">${right?'✅ 對了':'❌ 再想想'}</p><p>${rule(it.w)}</p>
        <div class="row center"><button class="btn primary" id="k-next">${n>=items.length?'產生結果卡':'下一題 →'}</button></div>`;
      $('#k-next').onclick=()=>{k++;q();};
    };
    if(it.type==='sort'){$$('[data-a]').forEach(b=>b.onclick=()=>{const right=(b.dataset.a==='1')===!!it.w.count;done(right,b,$(`[data-a="${it.w.count?1:0}"]`));});}
    else{$$('[data-o]').forEach(b=>b.onclick=()=>{const right=it.opts[+b.dataset.o]===it.good;done(right,b,$(`[data-o="${it.opts.indexOf(it.good)}"]`));later(()=>say(it.good),450);});}
  };
  const end=()=>{S.scores.checkLast=ok;S.scores.checkTotal=items.length;save();if(ok>=5){sfx.win();confetti();stamp('check');}location.hash='#card';};
  q();
}

/* ---------- teacher ---------- */
const T=Object.assign({idx:0,left:null,running:false,endAt:0,id:null},(S.timer&&typeof S.timer==='object')?S.timer:{});T.id=null;
const saveTimer=()=>{S.timer={idx:T.idx,left:T.left,running:T.running,endAt:T.endAt};save();};
const phaseSec=i=>Math.max(0,Math.round((+S.phases[i].min||0)*60));
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
/* the remaining time is always computed from the clock, so hidden tabs and reloads cannot make it drift */
function syncTimer(){
  if(!T.running)return;
  if(T.idx>=S.phases.length)T.idx=S.phases.length-1;
  let changed=false;
  while(T.running&&Date.now()>=T.endAt){
    changed=true;
    if(T.idx<S.phases.length-1){T.idx++;T.endAt+=phaseSec(T.idx)*1000;}else{T.running=false;T.left=0;}
  }
  if(T.running)T.left=Math.max(0,Math.ceil((T.endAt-Date.now())/1000));
  if(changed){beep();saveTimer();}
}
function startTicking(){clearInterval(T.id);T.id=setInterval(()=>{syncTimer();paintTimer();if(!T.running)clearInterval(T.id);},500);}
function tick(){syncTimer();paintTimer();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){syncTimer();paintTimer();}});
function paintTimer(){
  if(T.left==null)T.left=phaseSec(T.idx);
  const mini=$('#mini');
  mini.hidden=!T.running;mini.innerHTML=`<span class="mn">${esc(S.phases[T.idx].name)} </span>${mmss(T.left)}`;
  const c=$('#t-clock');if(!c)return;
  c.textContent=mmss(T.left);c.classList.toggle('low',T.left<=60);
  $('#t-name').textContent=S.phases[T.idx].name;$('#t-note').textContent=S.phases[T.idx].note;
  $('#t-go').textContent=T.running?'⏸ 暫停':'▶ 開始';
  $$('.ph').forEach((p,i)=>p.classList.toggle('cur',i===T.idx));
}

  showTotal();paintTimer();keepAwake(true);
  const paintFx=()=>{const A=window.ANIME,b=$('#fx-toggle');if(!b)return;if(!A){b.hidden=true;return;}const o=A.isOn();b.setAttribute('aria-pressed',o);b.textContent=o?'✨ 動畫角色與特效：開（按一下關閉）':'✨ 動畫角色與特效：關（按一下開啟）';};
  paintFx();$('#fx-toggle').onclick=()=>{const A=window.ANIME;if(A){A.set(!A.isOn());paintFx();}};
  $('#snd-test').onclick=async()=>{unlock();const m=$('#snd-msg');
    if(muted){m.textContent='🔇 目前是靜音（右上角 🔊）。先打開聲音再測。';return;}
    m.textContent='測試中…';try{await decodeAll();}catch(e){}
    say('Great job!');sfx.good();
    m.textContent=`有聽到「Great job!」嗎？（聲音狀態：${actx?actx.state:'此瀏覽器沒有 Web Audio'}）沒聽到：先確認 iPad 側邊的靜音開關、音量，再按一次；仍然沒有就換一台。`;};
  const selUrl=()=>{const r=document.createRange();r.selectNodeContents($('#app-url'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);$('#url-msg').textContent='網址已選取，請按複製。';};
  if(ON_PAGES){const u=$('#app-url'),bx=u&&u.previousElementSibling;if(bx&&bx.classList.contains('qr'))bx.innerHTML=PAGES_QR;}
  $('#url-copy').onclick=()=>{try{navigator.clipboard.writeText(APP_URL).then(()=>{$('#url-msg').textContent='已複製網址。';},selUrl);}catch(e){selUrl();}};
  $('#t-go').onclick=()=>{if(T.running){syncTimer();T.running=false;clearInterval(T.id);}else{if(T.left==null||T.left<=0){T.left=phaseSec(T.idx);}T.running=true;T.endAt=Date.now()+T.left*1000;startTicking();}saveTimer();paintTimer();};
  $('#t-next').onclick=()=>{if(T.idx<S.phases.length-1){T.idx++;T.left=phaseSec(T.idx);if(T.running)T.endAt=Date.now()+T.left*1000;saveTimer();paintTimer();}};
  $('#t-reset').onclick=()=>{T.running=false;clearInterval(T.id);T.idx=0;T.left=phaseSec(0);saveTimer();paintTimer();};
  S.phases.forEach((p,i)=>{$('#ph-'+i).onchange=e=>{const oldSec=phaseSec(i);p.min=Math.max(0,Math.min(40,+e.target.value||0));e.target.value=p.min;save();showTotal();
    if(i===T.idx){if(T.running){T.endAt+=(phaseSec(i)-oldSec)*1000;syncTimer();}else{T.left=phaseSec(i);}saveTimer();}paintTimer();};});
  $$('[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;S.groups[g]=Math.max(0,(S.groups[g]||0)+(+b.dataset.d));save();$('#g-'+g).textContent=S.groups[g];});
  const gr=$('#g-reset');gr.onclick=()=>{if(gr.dataset.armed){S.groups=[0,0];save();$('#g-0').textContent=0;$('#g-1').textContent=0;gr.textContent='兩組歸零';delete gr.dataset.armed;}else{gr.dataset.armed='1';gr.textContent='再按一次確認歸零';later(()=>{gr.textContent='兩組歸零';delete gr.dataset.armed;},4000);}};

  $('#s-pick').onclick=()=>{
    const pool=[1,2,3,4,5,6].filter(n=>!S.absent.includes(n));if(!pool.length){$('#s-out').textContent='全部標成缺席了';return;}
    const target=pick(pool);let i=0;const steps=reduce?1:14;$('#s-pick').disabled=true;
    const step=()=>{i++;const n=i<steps?pick(pool):target;$$('.seat').forEach(s=>s.classList.toggle('hit',+s.dataset.seat===n));
      if(i<steps)later(step,50+i*i*1.5);else{$('#s-out').textContent=`${target} 號（${target%2?'A':'B'} 組）`;$('#s-pick').disabled=false;}};
    step();
  };
}

/* ---------- words ---------- */
function wordsView(){
  const preview=w=>w.en&&w.en.trim()?`I like ${esc(form(w))}. ／ I want some ${esc(form(w))}.`:'';
  const row=(w,i)=>`<tr>
    <td><input type="text" class="picin" id="w-pic-${i}" value="${esc(w.pic)}" aria-label="第 ${i+1} 個字的圖"></td>
    <td><input type="text" id="w-en-${i}" value="${esc(w.en)}" aria-label="第 ${i+1} 個字的英文" autocapitalize="off" spellcheck="false"></td>
    <td><input type="text" id="w-zh-${i}" value="${esc(w.zh)}" aria-label="第 ${i+1} 個字的中文"></td>
    <td><input type="checkbox" id="w-ct-${i}" ${w.count?'checked':''} aria-label="第 ${i+1} 個字可數"></td>
    <td><input type="text" id="w-pl-${i}" value="${esc(w.pl)}" ${w.count?'':'disabled'} placeholder="${w.count?esc(autoPlural(w.en)):'不用填'}" aria-label="第 ${i+1} 個字的複數" autocapitalize="off" spellcheck="false"></td>
    <td><span class="pv" id="w-pv-${i}">${preview(w)}</span></td>
    <td><button class="btn ghost" data-del="${i}" aria-label="刪除第 ${i+1} 個字">刪除</button></td></tr>`;
  app.innerHTML=`<div class="view">${head('單字設定','換成英語護照的字。勾選「可數」的字，句子會自動用複數（apple→apples、cherry→cherries、sandwich→sandwiches）；不規則的複數請自己填。改完立刻生效，存在這台裝置。')}
  ${exampleNote()}
  <div class="row"><span class="muted">遊戲裡的圖：</span><div class="seg" role="group" aria-label="圖示樣式"><button id="ic-photo" aria-pressed="${(S.icons||'photo')==='photo'}">實物照片</button><button id="ic-clay" aria-pressed="${S.icons==='clay'}">黏土角色</button><button id="ic-emoji" aria-pressed="${S.icons==='emoji'}">Emoji</button></div><span class="muted">13 個護照字都有實物照片；自己新加的字會用下表的 emoji。</span></div>
  <div class="tablewrap"><table><thead><tr><th>圖</th><th>英文（單數）</th><th>中文</th><th>可數</th><th>複數</th><th>句子預覽</th><th><span class="sronly">操作</span></th></tr></thead>
  <tbody id="w-body">${S.words.map(row).join('')}</tbody></table></div>
  <div class="row"><button class="btn primary" id="w-add">＋ 新增一個字</button><button class="btn ghost" id="w-reset">恢復護照單字</button><span class="muted" id="w-count"></span></div>
  <p class="muted">提示：圖可以直接貼 emoji。學生 iPad 和大螢幕是分開存的，換字後請在每台裝置都設定一次，或用同一台大螢幕示範。</p>
  <details class="panel" id="w-bulk"><summary>一次貼上整份單字表</summary>
    <p>每行一個字，用逗號隔開：<b>英文, 中文, 圖, 可數(y/n), 複數</b>。圖、可數、複數可以省略或換順序（沒寫 y 就當作不可數）。複數會自動算（cherry→cherries、sandwich→sandwiches），特殊的再自己寫。</p>
    <p class="muted">例：<code>apple, 蘋果, 🍎, y</code>　<code>rice, 米飯, 🍚, n</code>　<code>noodle, 麵, 🍜, y, noodles</code></p>
    <textarea id="w-text" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="單字表"></textarea>
    <div class="row"><button class="btn" id="w-export">把目前清單放進來</button><button class="btn primary" id="w-append">加到清單後面</button><button class="btn warn" id="w-replace">取代整個清單</button></div>
    <p id="w-msg" aria-live="polite"></p>
  </details>
  </div>`;
  const count=()=>{$('#w-count').textContent=`目前 ${words().length} 個字（Catch 至少 4 個，Check 至少 6 個）`;};
  $('#ic-photo').onclick=()=>{S.icons='photo';save();wordsView();};$('#ic-clay').onclick=()=>{S.icons='clay';save();wordsView();};$('#ic-emoji').onclick=()=>{S.icons='emoji';save();wordsView();};
  count();
  S.words.forEach((w,i)=>{
    const upd=()=>{w.pic=$('#w-pic-'+i).value;w.en=$('#w-en-'+i).value;w.zh=$('#w-zh-'+i).value;w.count=$('#w-ct-'+i).checked;w.pl=$('#w-pl-'+i).value;
      S.example=false;save();const pl=$('#w-pl-'+i);pl.disabled=!w.count;pl.placeholder=w.count?autoPlural(w.en):'不用填';$('#w-pv-'+i).innerHTML=preview(w);count();};
    ['pic','en','zh','pl'].forEach(k=>$(`#w-${k}-${i}`).oninput=upd);$('#w-ct-'+i).onchange=upd;
  });
  $$('[data-del]').forEach(b=>b.onclick=()=>{S.words.splice(+b.dataset.del,1);S.example=false;save();wordsView();});
  $('#w-add').onclick=()=>{S.words.push({pic:'🍽️',en:'',zh:'',count:false,pl:''});save();wordsView();const i=S.words.length-1;const el=$('#w-en-'+i);if(el){el.focus();}};
  const rs=$('#w-reset');
  rs.onclick=()=>{if(rs.dataset.armed){S.words=DEFAULT_WORDS.map(w=>({...w}));S.example=false;save();wordsView();}else{rs.dataset.armed='1';rs.textContent='再按一次確認恢復';later(()=>{rs.textContent='恢復護照單字';delete rs.dataset.armed;},4000);}};
  const msg=(t,bad)=>{const m=$('#w-msg');m.textContent=t;m.className=bad?'errs':'muted';};
  $('#w-export').onclick=()=>{$('#w-text').value=words().map(w=>[w.en.trim(),(w.zh||'').replace(/[,，]/g,'、'),w.pic,w.count?'y':'n',w.count?form(w):''].filter((x,i)=>i<4||x).join(', ')).join('\n');msg('已放入目前的單字，可以直接修改後按「取代整個清單」。');};
  const parse=()=>{const out=[],errs=[];
    $('#w-text').value.split(/\r?\n/).forEach((line,n)=>{if(!line.trim())return;
      const f=line.split(/[,，\t]/).map(x=>x.trim());
      if(!/^[A-Za-z][A-Za-z '\-]*$/.test(f[0]||'')){errs.push(`第 ${n+1} 行的英文「${f[0]||''}」看不懂`);return;}
      /* after 英文, 中文 the other fields may come in any order and may be left out:
         a y/n flag, an emoji picture, and an English plural */
      const YN=/^(y|yes|n|no|1|0|可|可數|不可數|c|u|true|false)$/i,YES=/^(y|yes|1|可|可數|c|true)$/i;
      const CJK=/[\u3400-\u9fff]/;
      const hasZh=f[1]&&CJK.test(f[1])&&!YN.test(f[1]);
      const rest=f.slice(hasZh?2:1).filter(Boolean);
      const flag=rest.find(x=>YN.test(x));
      const pic=rest.find(x=>!YN.test(x)&&/[^\x00-\x7F]/.test(x)&&!CJK.test(x))||'🍽️';
      const pl=rest.find(x=>!YN.test(x)&&/^[A-Za-z][A-Za-z '\-]*$/.test(x))||'';
      const c=flag?YES.test(flag):!!pl;
      out.push({en:f[0],zh:hasZh?f[1]:'',pic,count:c,pl:c?pl:''});});
    return {out,errs};};
  const apply=mode=>{const {out,errs}=parse();if(errs.length){msg(errs.join('；')+'。請修正後再按一次。',true);return;}
    if(!out.length){msg('沒有讀到任何單字。',true);return;}
    const seen=new Set(mode==='replace'?[]:S.words.map(w=>(w.en||'').trim().toLowerCase()).filter(Boolean));let dup=0;
    const add=out.filter(w=>{const k=(w.en||'').trim().toLowerCase();if(k&&seen.has(k)){dup++;return false;}seen.add(k);return true;});
    S.words=mode==='replace'?add:[...S.words,...add];
    S.example=false;save();wordsView();
    $('#w-bulk').open=true;msg(`已${mode==='replace'?'取代為':'加入'} ${out.length-dup} 個字${dup?`（${dup} 個重複的字已略過）`:''}。`);};
  $('#w-append').onclick=()=>apply('append');
  const wr=$('#w-replace');
  wr.onclick=()=>{if(wr.dataset.armed){delete wr.dataset.armed;wr.textContent='取代整個清單';apply('replace');}else{wr.dataset.armed='1';wr.textContent='再按一次確認取代';later(()=>{wr.textContent='取代整個清單';delete wr.dataset.armed;},4000);}};
}

/* ---------- evidence: pre vs post Spin rounds ---------- */
/* group observation rubric for the Party Menu task: same three levels students use on their own card (? / △ / ✔) */
const RUB=[['listen','聽與選','英-E-B1','聽出食物字並選對，含一種印度食物'],['say','說句子','英-E-B1','說出 I want some ___.，a／-s 用對'],['team','合作','英-E-C2','三人輪流、討論、互相幫忙'],['culture','文化理解','英-E-C3','知道哪一種是印度食物，說得出來'],['self','自我調整','英-E-A1','說得出自己還要練哪一個字']];
const RUBLV={1:['?','還需要幫忙'],2:['△','大部分做到'],3:['✔','做到，能教別人']};
function evidence(){
  const ws=words();const MK={0:'—',1:'?',2:'△',3:'✔'};
  const count=src=>{const c={0:0,1:0,2:0,3:0};ws.forEach(w=>c[src[w.en]||0]++);return c;};
  const pre=count(S.boxes),post=count(S.post),n=ws.length||1;
  const bar=(c)=>`<div class="ev-bar" role="img" aria-label="✔ ${c[3]}、△ ${c[2]}、? ${c[1]}、未轉到 ${c[0]}">${[3,2,1,0].map(b=>c[b]?`<span class="s${b}" style="width:${c[b]/n*100}%">${MK[b]} ${c[b]}</span>`:'').join('')}</div>`;
  const both=ws.filter(w=>S.boxes[w.en]&&S.post[w.en]);
  const up=both.filter(w=>S.post[w.en]>S.boxes[w.en]),down=both.filter(w=>S.post[w.en]<S.boxes[w.en]);
  const stillBox1=ws.filter(w=>S.post[w.en]===1);
  const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
  const hasPost=ws.some(w=>S.post[w.en]);
  /* only words that were rated both before and after: how many were "?" before, and are still "?" after */
  const qB=both.filter(w=>S.boxes[w.en]===1).length,qA=both.filter(w=>S.boxes[w.en]===1&&S.post[w.en]===1).length;
  const celebrate=both.length>=Math.min(3,ws.length)&&qB>qA&&up.length>down.length;
  const present6=[1,2,3,4,5,6].filter(n=>!S.absent.includes(n));const spoke=present6.filter(n=>(S.speed[n]||{}).t>0);
  app.innerHTML=`<div class="view">${head('學習證據','比較 Spin 的課前定標和課後再測：每個字從 ? → △ → ✔ 的變化，加上兩組得分。給觀課、議課時說明「學習被看見」。')}
  ${celebrate?`<section class="panel celebrate pop"><p class="big-emoji">🎉</p><h2>全班進步了！Great job!</h2><p>前後都測過的 ${both.length} 個字裡，課前有 <b>${qB}</b> 個「?」，${qA?`課後只剩 <b>${qA}</b> 個`:'課後<b>全部</b>不再是「?」'}。</p></section>`:''}
  ${hasPost?'':'<p class="note">還沒有課後資料。下課前到 <a href="#spin">Spin</a> 切到「課後再測」，再轉一輪。</p>'}
  <div class="ev-grid">
    <section class="panel"><h2>課前定標</h2>${bar(pre)}<p class="muted">✔ 會了 ${pct(pre[3],ws.length)}（${pre[3]}/${ws.length}）</p></section>
    <section class="panel"><h2>課後再測</h2>${bar(post)}<p class="muted">✔ 會了 ${pct(post[3],ws.length)}（${post[3]}/${ws.length}）</p></section>
  </div>
  <div class="ev-grid">
    <section class="panel"><span class="bignum">${up.length}<small style="font-size:20px"> / ${both.length}</small></span><p>前後都轉到的字裡，往上升一格以上的字</p></section>
    <section class="panel"><span class="bignum">${stillBox1.length}</span><p>課後仍在 Box 1（下一節的目標字）${stillBox1.length?'：'+stillBox1.map(w=>esc(w.en)).join('、'):''}</p></section>
  </div>
  <div class="ev-table"><table><thead><tr><th>字</th><th>課前</th><th>課後</th><th>變化</th></tr></thead><tbody>
  ${ws.map(w=>{const a=S.boxes[w.en]||0,b=S.post[w.en]||0;const ch=a&&b?(b>a?'<span class="up">⬆ 進步</span>':b<a?'<span class="down">⬇ 退步</span>':'持平'):(!a&&!b?'<span class="muted">沒轉到</span>':'<span class="muted">只轉到一次</span>');
    return `<tr><td>${pic(w,'chip')}${esc(w.en)}</td><td><span class="mk b${a}">${MK[a]}</span></td><td><span class="mk b${b}">${MK[b]}</span></td><td>${ch}</td></tr>`;}).join('')}

  <section class="panel" id="rub"><h2>小組表現觀察（Party Menu・議課用）</h2>

  <div class="row"><button class="btn primary" id="ev-copy">📋 複製文字摘要（貼到觀課紀錄）</button></div>

  <p class="muted">這些資料只存在這一台裝置（建議用大螢幕電腦轉 Spin）。</p>
  </div>`;
  if(celebrate){const key=`${qB}/${qA}/${both.length}/${up.length}`;let seen=null;try{seen=sessionStorage.getItem('lbl.cel');}catch(e){}

  S.rubric=S.rubric||{};

  paintRub();
  const rubLine=['A','B'].map(g=>{const r=S.rubric[g]||{};const parts=RUB.filter(([k])=>r[k]).map(([k,nm])=>`${nm}${RUBLV[r[k]][0]}`);return parts.length?`${g} 組：${parts.join('、')}`:'';}).filter(Boolean);
  const d=new Date();

    `課前：✔ ${pre[3]}、△ ${pre[2]}、? ${pre[1]}、未轉到 ${pre[0]}（共 ${ws.length} 字）`,

    `退步的字：${down.length?down.map(w=>`${w.en}（${MK[S.boxes[w.en]]}→${MK[S.post[w.en]]}）`).join('、'):'—'}`,
    `? 的字（前後都測過的 ${both.length} 字）：課前 ${qB} → 課後 ${qA}`,
    `課後仍在 Box 1：${stillBox1.length?stillBox1.map(w=>w.en).join('、'):'—'}`,
    `口說：${[1,2,3,4,5,6].map(n=>{const x=S.speed[n]||{ok:0,t:0};return `${n}號 ✓${x.ok}/${x.t}`;}).join('、')}`,
    ...(rubLine.length?[`小組表現觀察（Party Menu）：${rubLine.join('；')}`]:[]),
    `兩組得分：A 組 ${S.groups[0]||0}、B 組 ${S.groups[1]||0}`].join('\n');
  $('#ev-copy').onclick=()=>{const ta=$('#ev-text');const fb=()=>{ta.hidden=false;ta.value=text;ta.focus();ta.select();$('#ev-msg').textContent='請選取上面的文字再複製。';};
    try{navigator.clipboard.writeText(text).then(()=>{$('#ev-msg').textContent='已複製。';ta.hidden=true;},fb);}catch(e){fb();}};
}

    <h3>課綱核心素養原文（國民小學英語文）</h3>
    <ul>
      <li><b>英-E-A1</b> 具備認真專注的特質及良好的學習習慣，嘗試運用基本的學習策略，強化個人英語文能力。</li>
      <li><b>英-E-B1</b> 具備入門的聽、說、讀、寫英語文能力。在引導下，能運用所學字詞及句型進行簡易日常溝通。</li>
  <li><b>英-E-B2</b> 具備使用各種資訊科技媒材進行自我學習的能力，以增進英語文聽說讀寫綜合應用能力及文化習俗之理解。</li>
      <li><b>英-E-C2</b> 積極參與課內英語文小組學習活動，培養團隊合作精神。</li>
      <li><b>英-E-C3</b> 認識國內外主要節慶習俗及風土民情。</li>
    </ul>
    <p class="muted">以上五條是查各校公開的英語課程計畫轉引的課綱文字，沒有直接核對教育部課綱原文，正式引用請對照原文。學習表現的編號這裡不列，因為沒有查到可核對的原文。</p>

      <li><b>真實情境與任務</b>：為派對準備食物，不是背單字表。</li>
      <li><b>學習歷程看得見</b>：✔ △ ? 的課前課後變化，讓學生和老師都知道自己進步在哪裡。</li>
      <li><b>合作與表達</b>：一組一台、每人一種食物、兩組互相說給對方聽。</li>
      <li><b>文化理解</b>：印度的 naan、curry、samosa 與臺灣的食物並列，節慶是學習的理由，不是裝飾。</li>
      <li><b>給鷹架，不給答案</b>：錯了先問問題，再讓學生自己想。</li>
      <li><b>回饋要快、要短、要溫和</b>：答對有慶祝，答錯只是「hmm?」，再聽一次。</li>
    </ul>

/* ---------- router ---------- */
const VIEWS={home,spin,catch:catchView,party,pack,speed,impostor,build,check,card,teacher,words:wordsView,guide,evidence};
function route(){
  clearView();stopVoice();viewKeys=null;
  let name=(location.hash||'#home').slice(1);if(!Object.prototype.hasOwnProperty.call(VIEWS,name))name='home';
  curView=name;if(!['spin','teacher','speed'].includes(name))keepAwake(false);
  $$('#nav a').forEach(a=>{const on=a.getAttribute('href')==='#'+name;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  VIEWS[name]();paintTimer();window.scrollTo(0,0);
  const vw=app.querySelector('.view');if(vw)vw.classList.add('enter');
  const act=$('#nav a.on'),nv=$('#nav');if(act&&nv)nv.scrollLeft=Math.max(0,act.offsetLeft-(nv.clientWidth-act.offsetWidth)/2);
}
addEventListener('storage',e=>{
  if(e.key!==KEY||!e.newValue)return;
  const fresh2=load();Object.keys(S).forEach(k=>{if(!(k in fresh2))delete S[k];});Object.assign(S,fresh2);delete S.mute;
  if(S.timer&&typeof S.timer==='object'){const wasRunning=T.running;Object.assign(T,S.timer);if(T.running){syncTimer();if(!wasRunning||!T.id)startTicking();}else{clearInterval(T.id);T.id=null;}}
  /* re-draw only screens without a game in progress */
  if(['home','spin','teacher','evidence','words','card','guide'].includes(curView)&&!($('#sp-go')&&$('#sp-go').disabled))route();else paintTimer();
});
const muteBtn=$('#mute');
const paintMute=()=>{muteBtn.textContent=muted?'🔇':'🔊';muteBtn.setAttribute('aria-label',muted?'打開聲音':'關閉聲音');muteBtn.setAttribute('aria-pressed',String(muted));

muteBtn.onclick=()=>setMuted(!muted);
delete S.mute;
paintMute();
addEventListener('hashchange',route);
if(T.running){syncTimer();if(T.running)startTicking();}
route();
