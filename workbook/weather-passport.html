<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>英語天氣護照</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=DM+Mono:wght@500&family=Huninn&family=Lilita+One&display=swap">
<style>
/* Layout: a single game column floating over a live, full-screen weather sky; every screen is a sticker-style card on top of it. */
:root{
  --sky:#3FAEE6;
  --sun:#FFC83D;
  --ticket:#EF4F3B;
  --leaf:#2A9D63;
  --grape:#6E55E8;
  --ink:#1D2540;
  --paper:#FFF8EA;
  --card:#FFFFFF;
  --soft:#EEF6FB;
  --soft2:#FFF3D6;
  --muted:#535C78;
  --border:#1D2540;
  --on-sun:#1D2540;
  --on-accent:#FFFFFF;
  --ok:#22915A;
  --ok-bg:#DDF5E7;
  --bad:#D9442F;
  --bad-bg:#FFE3DD;
  --board:#1A2033;
  --board-row:#232B42;
  --board-text:#FFD25E;
  --board-dim:#8D97B5;
  --f-display:"Lilita One","Huninn","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-word:"Andika","Huninn","Segoe UI",system-ui,sans-serif;
  --f-zh:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:20px;
  --pop:5px 5px 0 var(--border);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F6F1E4;--paper:#10162A;--card:#20294A;--soft:#283357;--soft2:#3A3420;--muted:#B9C1DA;--border:#05070F;
    --ok:#4BCB86;--ok-bg:#173D2D;--bad:#FF7A63;--bad-bg:#47221E;--board:#0A0E1A;--board-row:#151B2E;--board-dim:#7E89AA;
    --sky:#58BDF0;--leaf:#46C384;--grape:#9C88FF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F6F1E4;--paper:#10162A;--card:#20294A;--soft:#283357;--soft2:#3A3420;--muted:#B9C1DA;--border:#05070F;
  --ok:#4BCB86;--ok-bg:#173D2D;--bad:#FF7A63;--bad-bg:#47221E;--board:#0A0E1A;--board-row:#151B2E;--board-dim:#7E89AA;
  --sky:#58BDF0;--leaf:#46C384;--grape:#9C88FF;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-zh);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
#skyBg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* ---------- HUD ---------- */
.hud{position:relative;z-index:20;display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.hud-logo{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--border);border-radius:99px;padding:4px 14px 4px 6px;box-shadow:3px 3px 0 var(--border);font-family:var(--f-display);font-size:18px;letter-spacing:.02em;text-decoration:none;color:var(--ink)}
.hud-logo svg{width:38px;height:32px}
.hud-sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--border);border-radius:99px;padding:5px 12px;box-shadow:3px 3px 0 var(--border);font-weight:700;font-size:14px;white-space:nowrap}
.pill b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px}
.pill.btnlike:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--border)}
.pill.btnlike:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border)}

/* ---------- generic ---------- */
.card{background:var(--card);border:3px solid var(--border);border-radius:var(--r);box-shadow:var(--pop)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--border);border-radius:14px;background:var(--card);color:var(--ink);padding:10px 18px;font-weight:700;font-size:16px;box-shadow:4px 4px 0 var(--border);transition:transform .08s,box-shadow .08s;min-height:48px;text-decoration:none}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--border)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--border)}
.btn:disabled{opacity:.45}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.red{background:var(--ticket);color:var(--on-accent)}
.btn.blue{background:var(--sky);color:var(--on-sun)}
.btn.big{font-size:20px;padding:12px 26px;min-height:58px;border-radius:16px}
.btn.small{font-size:14px;padding:6px 12px;min-height:40px;box-shadow:3px 3px 0 var(--border)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.kicker{display:inline-block;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;background:var(--border);color:var(--board-text);padding:3px 10px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:22px}
.muted{color:var(--muted)}
.en{font-family:var(--f-word)}
.screen{display:flex;flex-direction:column;gap:22px;padding-top:8px;animation:screenIn .35s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.spk{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:3px solid var(--border);background:var(--sun);color:var(--on-sun);font-size:19px;box-shadow:2px 2px 0 var(--border);vertical-align:middle;flex:0 0 auto;padding:0}
.human{font-size:12px;font-weight:700;border:2px solid var(--border);border-radius:99px;padding:2px 9px;background:var(--ok-bg);color:var(--ink)}
.spk.slow{background:var(--soft);color:var(--ink);font-size:18px}
.spk:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--border)}

/* ---------- illustration + icons ---------- */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:0 0 auto;overflow:visible}
.ui{width:1.15em;height:1.15em;display:block;flex:0 0 auto}
i[data-ui]{font-style:normal;display:inline-flex;vertical-align:-.2em}
.medal{width:46px;height:46px;display:block;flex:0 0 auto}
.badge-pop .medal{width:30px;height:30px;display:inline-block;vertical-align:-9px}
.hearts{color:var(--ticket)}
.stk-float .ic,.ficon .ic{vertical-align:0}

/* ---------- opening ---------- */
.splash{position:fixed;inset:-24px 0;z-index:100;display:grid;place-items:center;background:linear-gradient(180deg,#3FAEE6 0%,#BFEAFD 100%);overflow:hidden;transition:transform .55s cubic-bezier(.7,0,.3,1);cursor:pointer}
.splash.out{transform:translateY(-103%)}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 16px}
.sp-in .puffy{width:150px;height:auto;animation:spPop .7s cubic-bezier(.3,1.5,.5,1) both}
.sp-logo{font-family:var(--f-display);font-size:clamp(44px,11vw,88px);color:#fff;-webkit-text-stroke:3px #1D2540;paint-order:stroke fill;text-shadow:5px 5px 0 #1D2540;line-height:1.05;white-space:nowrap}
.sp-logo span{display:inline-block;animation:spLetter .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(.25s + var(--i) * .05s)}
.sp-in p{font-size:22px;letter-spacing:.34em;color:#1D2540;margin:8px 0 0;font-weight:700;animation:spFade .5s ease .9s both}
.sp-plane{position:absolute;left:-130px;top:20%;width:110px;animation:spFly 1.7s ease-in-out .1s both}
@keyframes spPop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
@keyframes spLetter{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes spFade{from{opacity:0}to{opacity:1}}
@keyframes spFly{from{transform:translate(0,40px) rotate(-8deg)}to{transform:translate(calc(100vw + 260px),-60px) rotate(-8deg)}}

/* ---------- mascot ---------- */
.puffy{display:block;overflow:visible}
.puffy .pf-body{animation:bob 3.2s ease-in-out infinite;transform-origin:60px 80px}
.puffy .eyes{animation:blink 4.5s infinite;transform-origin:60px 59px}
.puffy.jump .pf-body{animation:jump .6s ease}
.puffy.shake .pf-body{animation:shake .5s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-4deg)}70%{transform:translateY(0) scaleY(.92)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px 26px;align-items:center;padding:24px 28px;position:relative;overflow:hidden}
.hero-art{position:relative;display:grid;place-items:center;min-height:250px}
.hero-art .puffy{width:min(100%,270px);height:auto;filter:drop-shadow(0 10px 0 rgba(29,37,64,.12))}
.hero-arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hero-arc path{fill:none;stroke:var(--sky);stroke-width:4;stroke-dasharray:1 12;stroke-linecap:round;vector-effect:non-scaling-stroke}
.hero-plane{position:absolute;right:3%;top:4%;width:70px;rotate:-24deg;filter:drop-shadow(3px 4px 0 rgba(29,37,64,.18))}
.stk-float{position:absolute;width:60px;height:60px;border-radius:50%;background:var(--card);border:3px solid var(--border);box-shadow:3px 3px 0 var(--border);display:grid;place-items:center;font-size:38px;animation:bob 3.6s ease-in-out infinite}
.stk-float.f1{left:1%;top:4%;rotate:-9deg}
.stk-float.f2{right:-1%;top:46%;rotate:9deg;animation-delay:-1.2s}
.stk-float.f3{left:-1%;bottom:10%;rotate:7deg;animation-delay:-2.1s}
.stk-float.f4{right:10%;bottom:0;rotate:-6deg;animation-delay:-.6s}
.logo{font-family:var(--f-display);font-size:clamp(40px,7vw,66px);line-height:1;letter-spacing:.01em;color:var(--ink);margin:10px 0 4px;font-weight:400}
.logo .sub{display:block;font-family:var(--f-zh);font-size:clamp(20px,3vw,26px);letter-spacing:.12em;color:var(--ticket);margin-top:8px}
.bubble{position:relative;background:var(--soft);border:3px solid var(--border);border-radius:18px;padding:12px 16px;margin:14px 0 18px;font-size:17px;max-width:46ch}
.bubble b{color:var(--ticket)}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:15px}
.namebox input{flex:1 1 140px;min-width:0;max-width:220px;border:3px solid var(--border);border-radius:12px;padding:9px 12px;font:inherit;background:var(--card);color:var(--ink)}

.board{background:var(--board);border:3px solid var(--border);border-radius:var(--r);box-shadow:var(--pop);padding:16px 16px 18px;color:#fff}
.board-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:0 6px 12px}
.board-head h2{font-family:var(--f-mono);font-size:22px;letter-spacing:.18em;color:var(--board-text);font-weight:500}
.board-head span{color:#D7DCEA;font-size:15px}
.board-head .clock{margin-left:auto;font-family:var(--f-mono);color:var(--board-text);font-size:18px;font-variant-numeric:tabular-nums}
.board-cols,.frow{display:grid;grid-template-columns:76px minmax(0,1.6fr) 70px minmax(0,1.1fr);gap:12px;align-items:center}
.board-cols{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--board-dim);padding:0 14px 6px}
.frow{width:100%;text-align:left;background:var(--board-row);border:2px solid #000;border-radius:12px;padding:12px 14px;margin-top:8px;color:#fff;transition:transform .12s,background .12s}
.frow:hover:not(.locked),.frow:focus-visible{background:#2E3857;transform:translateX(4px)}
.frow.locked{opacity:.55}
.flap{font-family:var(--f-mono);color:var(--board-text);letter-spacing:.06em;display:inline-flex;gap:2px;flex-wrap:wrap}
.flap i{font-style:normal;display:inline-block;min-width:.66em;text-align:center;background:#0E1222;border-radius:3px;padding:0 1px;line-height:1.45}
.fcode .flap{font-size:15px}
.fdest{display:flex;align-items:center;gap:12px;min-width:0}
.fdt{min-width:0}
.ficon{flex:0 0 auto;width:46px;height:46px;border-radius:13px;background:#fff;border:2px solid #000;display:grid;place-items:center;font-size:34px;color:#1D2540;--border:#1D2540}
.ficon .stormy{width:38px;height:auto}
.ficon .ui{width:26px;height:26px}
.fdest b{display:block;font-weight:500}
.fdest .flap{font-size:17px}
.fdest small{display:block;color:#D7DCEA;font-size:14px;margin-top:3px}
.fwords{font-family:var(--f-mono);color:#D7DCEA;font-size:14px}
.fstat{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st-board{color:#0E1222;background:var(--sun);border-radius:6px;padding:1px 8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;animation:blinkTag 1.4s steps(2) infinite}
.st-lock{color:var(--board-dim);font-size:14px}
.st-done{color:var(--board-text);font-size:19px;letter-spacing:2px}
.st-done em{font-style:normal;color:#4E5674}
.st-danger{color:#fff;background:var(--ticket);border-radius:6px;padding:1px 8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;animation:blinkTag 1s steps(2) infinite}
@keyframes blinkTag{50%{opacity:.35}}
.home-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

/* ---------- stop (boarding pass + learn) ---------- */
.pass{display:grid;grid-template-columns:minmax(0,1fr) 170px;overflow:hidden;padding:0}
.pass-main{padding:16px 22px 18px;display:grid;grid-template-columns:repeat(4,minmax(0,auto));gap:6px 22px;align-content:start}
.pass-main .pass-title{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;color:var(--muted)}
.pass-main .pass-title i{flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--ticket) 0 10px,transparent 10px 16px)}
.pf{display:flex;flex-direction:column;min-width:0}
.pf small{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.pf b{font-size:18px;overflow-wrap:anywhere}
.pf.dest{grid-column:1/-1}
.pf.dest b{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.05;letter-spacing:.02em}
.pf.dest b span{font-family:var(--f-zh);font-size:.5em;color:var(--ticket);margin-left:10px;letter-spacing:.08em}
.pass-stub{background:var(--ticket);color:#fff;border-left:3px dashed var(--border);padding:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;text-align:center;position:relative}
.pass-stub small{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;opacity:.9}
.pass-stub b{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1}
.pass-stub .stars{color:var(--sun);font-size:22px;letter-spacing:3px;text-shadow:1px 1px 0 var(--border)}
.barcode{height:30px;width:120px;margin-top:6px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 7px,transparent 7px 9px,#fff 9px 10px,transparent 10px 13px)}
.talk{display:flex;gap:16px;align-items:center;padding:14px 18px}
.talk .puffy{width:110px;flex:0 0 110px}
.talk .bubble{margin:0;flex:1;min-width:0;max-width:none;cursor:pointer;min-height:64px}
.talk .bubble small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.learn{padding:20px 22px 24px;display:flex;flex-direction:column;gap:16px}
.learn-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.learn-head p{margin:2px 0 0;color:var(--muted);font-size:15px}
.seen-count{font-family:var(--f-mono);font-size:14px;background:var(--soft);border:2px solid var(--border);border-radius:99px;padding:4px 12px;font-variant-numeric:tabular-nums}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.wcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px 12px;border:3px solid var(--border);border-radius:16px;background:var(--card);box-shadow:3px 3px 0 var(--border);transition:transform .12s,box-shadow .12s}
.wcard:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:4px 6px 0 var(--border)}
.wcard .wp{font-size:60px;line-height:1.15}
.wcard .we{font-family:var(--f-word);font-weight:700;font-size:20px;line-height:1.2}
.wcard .wz{font-size:14px;color:var(--muted)}
.wcard.seen::after{content:"✓";position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;border:3px solid var(--border);display:grid;place-items:center;font-size:14px;font-weight:700}
.wcard.on{background:var(--soft2);transform:translateY(-3px);box-shadow:4px 6px 0 var(--border)}
.detail{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;padding:18px;border:3px dashed var(--border);border-radius:18px;background:var(--soft);animation:screenIn .3s ease both}
.detail .dpic{font-size:132px;line-height:1;text-align:center}
.dword{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dword b{font-family:var(--f-word);font-size:clamp(34px,5vw,48px);line-height:1.1}
.dzh{font-size:22px;margin:2px 0 8px}
.dzh small{font-size:15px;color:var(--muted);margin-left:6px}
.dsent{font-family:var(--f-word);font-size:21px;margin:6px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dsent mark{background:var(--sun);color:var(--on-sun);border-radius:6px;padding:0 5px;font-weight:700}
.dsentzh{margin:2px 0 0;color:var(--muted)}
.tip{margin:10px 0 0;padding:8px 12px;background:var(--card);border:2px solid var(--border);border-radius:12px;font-size:15px}
.tip b{color:var(--ticket)}
.learn-cta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.learn-cta p{margin:0;color:var(--muted);font-size:15px}

/* ---------- quiz ---------- */
.quiz-top{display:flex;align-items:center;gap:12px}
.route{position:relative;flex:1;height:44px;min-width:0}
.route::before{content:"";position:absolute;left:12px;right:34px;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,var(--border) 0 8px,transparent 8px 14px);opacity:.55}
.route .rfill{position:absolute;left:12px;top:50%;height:6px;margin-top:-3px;background:var(--ticket);border-radius:3px;transition:width .5s ease}
.route .rplane{position:absolute;top:50%;width:40px;height:30px;margin:-15px 0 0 -8px;transition:left .5s ease}
.route .rflag{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:26px}
.qcard{padding:20px 22px 24px;display:flex;flex-direction:column;gap:16px;position:relative}
.qcard.enter{animation:qIn .35s cubic-bezier(.2,1.3,.5,1) both}
@keyframes qIn{from{opacity:0;transform:translateX(40px) rotate(1deg)}to{opacity:1;transform:none}}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qtype{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;background:var(--accent,#1D2540);color:#fff;padding:4px 11px;border-radius:7px;font-weight:500}
.qnum{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

    <button class="hud-logo" data-act="home" aria-label="回到出發看板"><svg viewBox="0 0 120 100" aria-hidden="true"><g stroke="#1D2540" stroke-width="7" fill="#fff"><circle cx="34" cy="62" r="20"/><circle cx="60" cy="48" r="27"/><circle cx="87" cy="62" r="20"/><rect x="22" y="58" width="76" height="26" rx="13"/></g><g fill="#fff"><circle cx="34" cy="62" r="20"/><circle cx="60" cy="48" r="27"/><circle cx="87" cy="62" r="20"/><rect x="22" y="58" width="76" height="26" rx="13"/></g><ellipse cx="49" cy="59" rx="4.5" ry="6" fill="#1D2540"/><ellipse cx="71" cy="59" rx="4.5" ry="6" fill="#1D2540"/></svg><span>Sky Passport</span></button>
    <div class="hud-sp"></div>
    <div class="pill" title="哩程數"><span aria-hidden="true"><i data-ui="plane"></i></span><b id="hudMiles">0</b><span>哩</span></div>
    <button class="pill btnlike" data-act="passport"><span aria-hidden="true"><i data-ui="passport"></i></span>護照</button>
    <button class="pill btnlike" data-act="sound" id="soundBtn" aria-label="音效開關"><i data-ui="speaker"></i></button>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
/*ART-START*/
/* =========================================================
   Sky Passport illustration set
   One visual language for every picture in the game:
   64×64 grid, 3px ink outline, round joins, flat palette.
   ========================================================= */
const K = 'var(--border)';          // outline (follows the theme)
const F = '#1D2540';                // small features (eyes, glasses) — always dark
const C = {sun:'#FFC83D', ray:'#F59E0B', red:'#EF4F3B', sky:'#3FAEE6', leaf:'#2A9D63', grape:'#6E55E8', skin:'#FFD9B8', pink:'#FF9AA8', white:'#FFFFFF', grey:'#C9D3E0', road:'#7B8497', wood:'#D9A86C'};
const svg = body => `<svg class="ic" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${body}</g></svg>`;
const r1 = n => Math.round(n * 10) / 10;

/* building blocks */
const CLOUD = '<circle cx="-11" cy="3" r="8"/><circle cx="0" cy="-4" r="11"/><circle cx="11" cy="3" r="8"/><rect x="-13" y="2" width="26" height="10" rx="5"/>';
const cl = (x, y, s, fill) => `<g transform="translate(${x} ${y}) scale(${s})"><g stroke-width="${r1(6 / s)}" fill="${fill}">${CLOUD}</g><g stroke="none" fill="${fill}">${CLOUD}</g></g>`;
const rays = (cx, cy, a, b, n = 8, col = C.ray, w = 4) => { let d = ''; for (let i = 0; i < n; i++) { const t = i * 2 * Math.PI / n - Math.PI / 2; d += `M${r1(cx + Math.cos(t) * a)} ${r1(cy + Math.sin(t) * a)}L${r1(cx + Math.cos(t) * b)} ${r1(cy + Math.sin(t) * b)}`; } return `<path d="${d}" stroke="${col}" stroke-width="${w}"/>`; };
const face = (cx, cy, s = 1) => `<g stroke="none" fill="${F}"><circle cx="${r1(cx - 4.6 * s)}" cy="${r1(cy - 1.5 * s)}" r="${r1(1.8 * s)}"/><circle cx="${r1(cx + 4.6 * s)}" cy="${r1(cy - 1.5 * s)}" r="${r1(1.8 * s)}"/></g><path d="M${r1(cx - 4 * s)} ${r1(cy + 3 * s)}q${r1(4 * s)} ${r1(4 * s)} ${r1(8 * s)} 0" stroke="${F}" stroke-width="2.4"/>`;
const blush = (cx, cy, d = 9) => `<g stroke="none" fill="${C.pink}" opacity=".85"><circle cx="${cx - d}" cy="${cy}" r="2.4"/><circle cx="${cx + d}" cy="${cy}" r="2.4"/></g>`;
const flake = (cx, cy, r, w = 2.6) => { let d = ''; for (let i = 0; i < 3; i++) { const t = i * Math.PI / 3; d += `M${r1(cx - Math.cos(t) * r)} ${r1(cy - Math.sin(t) * r)}L${r1(cx + Math.cos(t) * r)} ${r1(cy + Math.sin(t) * r)}`; } return `<path d="${d}" stroke="${C.sky}" stroke-width="${w}"/>`; };
const thermo = (col, top) => `<path d="M26 12a6 6 0 0 1 12 0v25a10.5 10.5 0 1 1-12 0z" fill="${C.white}"/><path d="M32 ${top}V44" stroke="${col}" stroke-width="5"/><circle cx="32" cy="46" r="6.5" fill="${col}" stroke="none"/><path d="M43 23h4M43 30h4" stroke-width="2.5"/>`;
const drops = pts => `<path d="${pts.map(([x, y, l = 8]) => `M${x} ${y}l-${r1(l * .35)} ${l}`).join('')}" stroke="${C.sky}" stroke-width="4"/>`;

/* people */
const torso = fill => `<path d="M14 60q0-15 18-15t18 15z" fill="${fill}"/>`;
const head = (cy = 27, r = 12) => `<circle cx="32" cy="${cy}" r="${r}" fill="${C.skin}"/>`;
const pface = (cy = 29) => `<g stroke="none" fill="${F}"><circle cx="27.5" cy="${cy}" r="1.7"/><circle cx="36.5" cy="${cy}" r="1.7"/></g><path d="M28.5 ${cy + 5}q3.5 3.4 7 0" stroke="${F}" stroke-width="2.2"/>${blush(32, cy + 3.5, 8)}`;
const BOY = torso(C.sky) + head() + `<path d="M20 25a12 12 0 0 1 24 0q-4-5-9-4q-3 3-8 2q-4 0-7 2z" fill="#6B4A2B"/>` + pface();
const GIRL = `<circle cx="17" cy="32" r="6" fill="#3B2A1E"/><circle cx="47" cy="32" r="6" fill="#3B2A1E"/>` + torso(C.red) + head() + `<path d="M20 26a12 12 0 0 1 24 0q-6-7-12-7t-12 7z" fill="#3B2A1E"/><path d="M32 13l-6-4v8zM32 13l6-4v8z" fill="${C.sun}"/>` + pface();
const BOY2 = torso(C.leaf) + head() + `<path d="M20 25a12 12 0 0 1 24 0q-12-6-24 0z" fill="#E0A23B"/>` + pface();
const mini = (inner, x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" stroke-width="${r1(3 / s)}">${inner}</g>`;

const ART = {
  /* ----- places ----- */
  airport: svg(`<path d="M4 57h56"/><rect x="43" y="28" width="9" height="29" fill="${C.white}"/><path d="M38 19h19l-3 9H41z" fill="${C.sky}"/><path d="M40 13h15v6H40z" fill="${C.red}"/><path d="M47.5 13V8"/>
    <g transform="translate(23 37) rotate(-20) scale(.44)" stroke-width="6.8"><path d="M-34-2l-10-18h8l14 16z" fill="${C.red}"/><ellipse rx="40" ry="9" fill="${C.white}"/><path d="M-6 2l-12 18h9L8 2z" fill="${C.sun}"/><g stroke="none" fill="${C.sky}"><circle cx="-14" cy="-1" r="3"/><circle cx="-2" cy="-1" r="3"/><circle cx="10" cy="-1" r="3"/></g></g>`),
  classroom: svg(`<rect x="6" y="8" width="52" height="30" rx="3" fill="#2F7A5F"/><text x="32" y="29" text-anchor="middle" font-family="Andika,'Segoe UI',sans-serif" font-weight="700" font-size="15" fill="#fff" stroke="none">ABC</text><path d="M44 33h8" stroke="#fff" stroke-width="2.5"/>
    <rect x="17" y="45" width="30" height="6" rx="2" fill="${C.wood}"/><path d="M22 51v9M42 51v9"/>`),
  street: svg(`<rect x="5" y="12" width="17" height="46" fill="${C.sky}"/><g stroke="none" fill="#fff"><rect x="8.5" y="17" width="4" height="5"/><rect x="14.5" y="17" width="4" height="5"/><rect x="8.5" y="27" width="4" height="5"/><rect x="14.5" y="27" width="4" height="5"/><rect x="8.5" y="37" width="4" height="5"/><rect x="14.5" y="37" width="4" height="5"/></g>
    <rect x="42" y="24" width="17" height="34" fill="${C.sun}"/><g stroke="none" fill="#fff"><rect x="45.5" y="29" width="4" height="5"/><rect x="51.5" y="29" width="4" height="5"/><rect x="45.5" y="39" width="4" height="5"/><rect x="51.5" y="39" width="4" height="5"/></g>
    <path d="M22 58L28 30h8l6 28z" fill="${C.road}"/><path d="M32 34v4M32 43v5M32 52v4" stroke="#fff" stroke-width="2.4"/><path d="M3 58h58"/>`),

  /* ----- weather ----- */
  weather: svg(rays(21, 19, 12.5, 16.5, 8, C.ray, 3.4) + `<circle cx="21" cy="19" r="9.5" fill="${C.sun}"/>` + cl(37, 31, 1.2, C.white) + drops([[24, 50, 7], [36, 50, 7], [48, 50, 7]])),
  sunny: svg(rays(32, 32, 19.5, 27) + `<circle cx="32" cy="32" r="15" fill="${C.sun}"/>` + face(32, 32, 1.25) + blush(32, 36, 10.5)),
  hot: svg(thermo(C.red, 17) + `<circle cx="53" cy="12" r="5.5" fill="${C.sun}"/>` + rays(53, 12, 8, 10.5, 8, C.ray, 2.4) + `<path d="M13 22c-3.5 3.5 3.5 5.5 0 9M13 38c-3.5 3.5 3.5 5.5 0 9M51 34c-3.5 3.5 3.5 5.5 0 9" stroke="${C.red}" stroke-width="3.2"/>`),
  cloudy: svg(rays(17, 18, 12, 15.5, 8, C.ray, 3.2) + `<circle cx="17" cy="18" r="9" fill="${C.sun}"/>` + cl(27, 29, 1.05, C.grey) + cl(37, 41, 1.25, C.white)),
  rainy: svg(cl(32, 23, 1.4, '#DCE5EE') + drops([[19, 45, 9], [32, 45, 9], [45, 45, 9]])),
  cold: svg(thermo(C.sky, 37) + flake(52, 15, 7.5, 3) + flake(12, 30, 5.5, 2.6) + flake(52, 42, 5, 2.4)),
  windy: svg(`<path d="M5 22h28a7 7 0 1 0-7-7M5 34h40a7 7 0 1 1-7 7M5 46h17" stroke="${C.sky}" stroke-width="4"/><path d="M45 23q1-11 13-12q0 12-13 12z" fill="${C.leaf}"/><path d="M47 21l8-7" stroke-width="2"/>`),
  warm: svg(rays(32, 38, 18.5, 24.5, 8, C.ray, 3.6) + `<circle cx="32" cy="38" r="14.5" fill="#FFB347"/>` + face(32, 34, 1.15) + `<path d="M3 60q29-22 58 0z" fill="#7FCB6A"/><path d="M51 56v-8" stroke="${C.leaf}" stroke-width="3"/><circle cx="51" cy="45" r="4" fill="${C.pink}"/><path d="M13 57v-6" stroke="${C.leaf}" stroke-width="3"/><circle cx="13" cy="48.5" r="3.4" fill="${C.sun}"/>`),
  cloud: svg(cl(32, 33, 1.45, C.white) + face(32, 37, 1.3) + blush(32, 41.5, 11)),
  raining: svg(`<path d="M9 37a23 23 0 0 1 46 0z" fill="${C.red}"/><path d="M32 14v23M20.5 37q1-14 11.5-23q10.5 9 11.5 23" stroke-width="2.2"/><path d="M32 37v14a5 5 0 0 1-10 0"/><path d="M32 14v-4"/>` + drops([[15, 5, 6], [27, 2, 5], [45, 3, 6], [56, 13, 6], [7, 17, 6]])),
  snow: svg([0, 60, 120].map(a => `<g transform="rotate(${a} 32 32)"><path d="M32 7v50M25.5 13.5l6.5 6.5 6.5-6.5M25.5 50.5l6.5-6.5 6.5 6.5" stroke="${C.sky}" stroke-width="4"/></g>`).join('') + `<circle cx="32" cy="32" r="4" fill="${C.white}" stroke="${C.sky}"/>`),
  snowy: svg(cl(32, 22, 1.4, C.white) + flake(18, 48, 5.5) + flake(32, 55, 5.5) + flake(46, 48, 5.5)),

  /* ----- seasons ----- */
  spring: svg(`<path d="M32 42v19" stroke="${C.leaf}" stroke-width="4"/><path d="M32 55q9-9 17-5q-5 9-17 5z" fill="${C.leaf}"/>` + [0, 1, 2, 3, 4].map(i => { const t = (i * 72 - 90) * Math.PI / 180; return `<circle cx="${r1(32 + Math.cos(t) * 11)}" cy="${r1(25 + Math.sin(t) * 11)}" r="8.5" fill="#FFB3C8"/>`; }).join('') + `<circle cx="32" cy="25" r="6.5" fill="${C.sun}"/>`),
  summer: svg(rays(32, 24, 17, 23) + `<circle cx="32" cy="24" r="13.5" fill="${C.sun}"/><g fill="${F}" stroke="${F}" stroke-width="1.5"><rect x="21" y="18.5" width="9.5" height="7" rx="3"/><rect x="33.5" y="18.5" width="9.5" height="7" rx="3"/></g><path d="M30.5 21h3" stroke="${F}" stroke-width="2"/><path d="M27 30q5 4.4 10 0" stroke="${F}" stroke-width="2.4"/>
    <path d="M3 50q5-5 10 0t10 0t10 0t10 0t10 0t8 0v11H3z" fill="${C.sky}"/><path d="M9 56q3-3 6 0M29 56q3-3 6 0M49 56q3-3 6 0" stroke="#fff" stroke-width="2"/>`),
  fall: svg(`<path d="M30 8c10 6 18 16 16 28c-1 8-8 14-16 16c-8-2-15-8-16-16C12 24 20 14 30 8z" fill="#E8762B"/><path d="M30 15v46M30 30l-8-6M30 30l8-6M30 41l-9-5M30 41l9-5" stroke="#9A4A1E" stroke-width="2.5"/><path d="M49 7q9 2 9 11q-9 0-9-11z" fill="${C.sun}"/><path d="M52 45q7 1 7 9q-7 0-7-9z" fill="#D94F2B"/>`),
  winter: svg(`<path d="M20 43l-9-6M44 43l9-6" stroke="#9A6A3C"/><circle cx="32" cy="46" r="13" fill="${C.white}"/><circle cx="32" cy="24" r="10" fill="${C.white}"/><path d="M27 15V7h10v8" fill="${C.grape}"/><path d="M23 15h18"/><g stroke="none" fill="${F}"><circle cx="28.3" cy="22.5" r="1.6"/><circle cx="35.7" cy="22.5" r="1.6"/><circle cx="32" cy="42" r="1.7"/><circle cx="32" cy="49" r="1.7"/></g><path d="M32 25l8 2-8 2z" fill="#F08A24" stroke-width="2"/><path d="M23.5 32.5q8.5 5 17 0" stroke="${C.red}" stroke-width="4.5"/>`),
  santa: svg(`<path d="M19 31h26v6a13 13 0 0 1-26 0z" fill="${C.skin}"/><path d="M16 38q-1 22 16 22t16-22q-6 7-16 7t-16-7z" fill="${C.white}"/><path d="M32 43q-5-4-10 1q6 4 10-1zM32 43q5-4 10 1q-6 4-10-1z" fill="${C.white}" stroke-width="2.4"/><circle cx="32" cy="40" r="3" fill="${C.pink}" stroke-width="2"/><g stroke="none" fill="${F}"><circle cx="27" cy="35.5" r="1.7"/><circle cx="37" cy="35.5" r="1.7"/></g>
    <path d="M15 26L33 7l15 19z" fill="${C.red}"/><rect x="12" y="24" width="40" height="8" rx="4" fill="${C.white}"/><circle cx="33" cy="7" r="4.5" fill="${C.white}"/>`),

  /* ----- people ----- */
  boy: svg(BOY),
  girl: svg(GIRL),
  children: svg(mini(BOY2, 12.2, 9, .62) + mini(BOY, -7, 24, .58) + mini(GIRL, 34, 24, .58)),
  friend: svg(`<path d="M32 21c-8-5-10-9-8-12c2-3 6-3 8 0c2-3 6-3 8 0c2 3 0 7-8 12z" fill="${C.red}"/>` + mini(BOY, -4, 16, .72) + mini(GIRL, 22, 16, .72)),
  lady: svg(`<path d="M17 30a15 15 0 0 1 30 0v15H17z" fill="#8A4B2B"/>` + torso(C.grape) + head(28, 11) + `<path d="M21 27a11 11 0 0 1 22 0q-8-2-11-7q-3 5-11 7z" fill="#8A4B2B"/>` + pface(30) + `<g stroke="none" fill="${C.sun}"><circle cx="20.5" cy="34" r="2"/><circle cx="43.5" cy="34" r="2"/></g><path d="M26 47.5q6 5 12 0" stroke="${C.sun}" stroke-width="2.6"/>`),
  mr: svg(torso('#2E4A8C') + `<path d="M25 45.5l7 9 7-9z" fill="${C.white}" stroke-width="2.4"/><path d="M32 49l-2.6 3.2L32 60l2.6-7.8z" fill="${C.red}" stroke-width="2"/>` + head() + `<path d="M20 26a12 12 0 0 1 24 0q-2-6-10-6t-14 6z" fill="#3B2A1E"/>` + pface() + `<g stroke="${F}" stroke-width="2"><circle cx="27.5" cy="29" r="3.8"/><circle cx="36.5" cy="29" r="3.8"/><path d="M31.3 29h1.4"/></g>`),
  mrs: svg(`<circle cx="32" cy="12" r="5.5" fill="#6B4A2B"/>` + torso(C.white) + `<path d="M26 46l6 8 6-8" stroke-width="2.4"/><path d="M43 50v7M39.5 53.5h7" stroke="${C.red}" stroke-width="3"/><path d="M23 47q-3 9 3 11" stroke="${C.sky}" stroke-width="2.6"/><circle cx="27.5" cy="58" r="2" fill="${C.sky}" stroke-width="1.6"/>` + head() + `<path d="M20 26a12 12 0 0 1 24 0q-12-9-24 0z" fill="#6B4A2B"/>` + pface()),
  miss: svg(`<path d="M42 19q11 2 9 15q-6-3-9-9z" fill="#E0A23B"/>` + torso(C.leaf) + head() + `<path d="M20 26a12 12 0 0 1 24 0q-3-6-12-6t-12 6z" fill="#E0A23B"/>` + pface() + `<rect x="37" y="47" width="15" height="12" rx="2" fill="${C.sun}"/><path d="M41 51.5h7M41 55h5" stroke-width="2"/>`),
};

/* ---------- interface icons (24×24, inherit text colour) ---------- */
const ui = (body, cls = 'ui') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${body}</g></svg>`;
const G = {
  speaker: '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.3a8 8 0 0 1 0 11.4"/>',
  mute: '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
  slow: '<path d="M4.5 15a7 6.5 0 0 1 14 0z" fill="currentColor"/><circle cx="20.3" cy="12.6" r="1.9" fill="currentColor"/><path d="M7.5 15v3M15.5 15v3M4.5 15l-2 1"/>',
  plane: '<path d="M21.5 3L2.5 10.5l7 2.7 2.7 7.3z" fill="currentColor"/><path d="M9.5 13.2L21.5 3" stroke="var(--card)" stroke-width="1.6"/>',
  passport: '<rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="10" r="3"/><path d="M9 16.5h6"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  unlock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 7.6-1.7"/>',
  flame: '<path d="M13 2.5c.5 3.5 4.5 5.5 4.5 10.5a5.5 5.5 0 0 1-11 0c0-2 .8-3.6 2-4.7c.2 1.7.9 2.7 2 3.3c.3-3.3 1.2-6.4 2.5-9.1z" fill="currentColor"/>',
  bolt: '<path d="M13.500 2.500L5 13.500h5.500L9.500 21.500l9-11.500H13z" fill="currentColor"/>',
  bulb: '<path d="M12 3a6 6 0 0 0-3.500 10.900c.600.500 1 1.100 1 1.900h5c0-.800.400-1.400 1-1.900A6 6 0 0 0 12 3z" fill="var(--sun)"/><path d="M10 18.500h4M10.800 21h2.400"/>',
  flag: '<path d="M6 21.500V3.500"/><path d="M6 4.500h12l-3 4 3 4H6z" fill="currentColor"/>',
  umbrella: '<path d="M3.500 12.500a8.500 8.500 0 0 1 17 0z" fill="currentColor"/><path d="M12 12.500V18a2 2 0 0 1-4 0M12 4V2.800"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z" fill="currentColor"/><path d="M8 6H5a3 3 0 0 0 3 3.500M16 6h3a3 3 0 0 1-3 3.500M12 13v4M8.500 20.500h7M9.500 17h5"/>',
  check: '<path d="M4.500 12.500l5 5L19.500 7"/>',
  spark: '<path d="M12 2.500l2.300 6.700 6.700 2.300-6.700 2.300L12 20.500l-2.300-6.700L3 11.500l6.700-2.300z" fill="currentColor"/>',
  star: '<path d="M12 3l2.700 5.600 6.100.800-4.500 4.200 1.200 6L12 16.600 6.500 19.600l1.200-6L3.200 9.400l6.100-.800z" fill="currentColor"/>',
  ear: '<path d="M4.500 14v-2a7.500 7.500 0 0 1 15 0v2"/><rect x="3.500" y="13.500" width="4" height="6.500" rx="1.500" fill="currentColor"/><rect x="16.500" y="13.500" width="4" height="6.500" rx="1.500" fill="currentColor"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.500 3 3.500 15 0 18M12 3c-3.500 3-3.500 15 0 18"/>',
  shield: '<path d="M12 3l7.500 3v5.500c0 4.500-3.200 7.800-7.500 9.500c-4.300-1.700-7.500-5-7.500-9.500V6z" fill="currentColor"/>',

let AC = null;
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .12, type = 'sine', v = .16, delay = 0, slide){
  if (!S.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
function noise(d = .2, v = .3, delay = 0, lp = 900){
  if (!S.sound) return; const a = ac(); if (!a) return;
  const len = Math.max(1, Math.floor(a.sampleRate * d)), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + delay;
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = v;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t);
}

/* ---------- Question factory ---------- */
const TYPE_NAME = {pic2en:'看圖選單字', en2pic:'看字選圖', listen:'聽聽看', zh2en:'中翻英', fill:'句子填空', spell:'拼字挑戰', sky:'看窗外天氣'};
function eligible(w, t){
  switch (t) {
    case 'pic2en': case 'en2pic': return !w.noPic;
    case 'listen': return !!canListen(w);
    case 'zh2en': return true;
    case 'fill': return !!w.fill;
    case 'spell': return /^[a-z]+$/i.test(w.en) && w.en.length <= 9;
    case 'sky': return SKYQ.includes(w.id);
  }
  return false;
}
function chooseType(w, list, avoid){
  const c = list.filter(t => eligible(w, t) && t !== avoid);
  if (!c.length) return 'zh2en';
  if (c.includes('sky') && Math.random() < .55) return 'sky';
  return pick(c);
}
function distractors(w, n, type){
  const ban = new Set([w.id, ...(CONF[w.id] || [])]);
  let c = WORDS.filter(x => !ban.has(x.id));
  if (type === 'en2pic' || type === 'pic2en') c = c.filter(x => !x.noPic);
  const pri = type === 'fill' ? c.filter(x => x.cat === w.cat) : c.filter(x => x.stop === w.stop);
  const rest = c.filter(x => !pri.includes(x));
  return [...shuffle(pri), ...shuffle(rest)].slice(0, n);
}
function buildQ(item){
  const q = Object.assign({}, item), w = q.w;
  if (q.type === 'spell') {
    const letters = [...w.en.toLowerCase()];
    let sh = shuffle(letters.map((ch, i) => ({ch, i}))); let tries = 0;
    while (letters.length > 2 && sh.map(x => x.ch).join('') === letters.join('') && tries++ < 8) sh = shuffle(sh);
    q.tiles = sh; q.filled = []; return q;
  }
  if (q.type === 'sky') { const pool = SKYQ.filter(id => id !== w.id && !SKYCONF[w.id].includes(id)).map(id => W[id]); q.opts = shuffle([w, ...shuffle(pool).slice(0, 3)]); return q; }
  q.opts = shuffle([w, ...distractors(w, 3, q.type)]);
  return q;
}
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
function qPromptHTML(q){
  const w = q.w;
  switch (q.type) {
    case 'pic2en': return `<div class="qpic" aria-hidden="true">${w.pic}</div><p class="qask"><span class="en">What is it?</span> 這是什麼？</p>`;
    case 'en2pic': return `<div class="qword">${esc(w.en)}<button class="spk" data-act="sayq" aria-label="唸單字"><i data-ui="speaker"></i></button></div><p class="qask">哪一張圖是這個字？</p>`;
    case 'listen': return `<div class="row" style="justify-content:center"><button class="bigspk" data-act="sayq" id="bigspk" aria-label="再聽一次"><i data-ui="speaker"></i></button><button class="spk slow" data-act="sayqslow" aria-label="慢慢唸"><i data-ui="slow"></i></button></div><p class="qask">仔細聽，你聽到哪一個字？</p>`;
    case 'zh2en': return `<div class="qzh">${w.zh}${w.zhNote ? `<small>（${w.zhNote}）</small>` : ''}</div><p class="qask">英文怎麼說？</p>`;
    case 'fill': { const parts = esc(w.fill).split('___'); return `<p class="qsent">${parts[0]}<span class="blank" id="blank">&nbsp;?&nbsp;</span>${parts[1] || ''}</p><p class="qsentzh">${w.sz}</p>`; }
    case 'sky': return `<div class="window"><canvas id="winCv"></canvas></div><p class="qask"><span class="en">How is the weather?</span> 看看窗外，天氣怎麼樣？</p>`;
    case 'spell': return `<div class="row" style="justify-content:center;gap:16px"><span class="qpic" style="font-size:64px" aria-hidden="true">${w.noPic ? '' : w.pic}</span><div><div class="qzh" style="font-size:30px">${w.zh}</div><button class="spk" data-act="sayq" aria-label="唸單字"><i data-ui="speaker"></i></button></div></div>
      <div class="slots" id="slots" style="--n:${w.en.length}">${[...w.en].map((_, i) => `<button class="slot" data-act="unspell" data-i="${i}" aria-label="第 ${i + 1} 格"></button>`).join('')}</div>
      <div class="tiles" id="tiles">${q.tiles.map((t, k) => `<button class="tile" data-act="spell" data-k="${k}">${t.ch}</button>`).join('')}</div>
      <div class="spell-tools"><button class="btn small" data-act="unspell" data-i="last"><i data-ui="back"></i> 擦掉</button><button class="btn small" data-act="hint"><i data-ui="bulb"></i> 提示一個字母</button></div>`;
  }
  return '';
}
function qOptsHTML(q){
  if (q.type === 'spell') return '';
  const startCap = q.type === 'fill' && q.w.fill.startsWith('___');
  return `<div class="opts" role="group" aria-label="選項">${q.opts.map((o, i) => q.type === 'en2pic'

}
function mountQ(q){
  const card = $('#qcard'); if (!card) return;
  card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
  $('#qbody').innerHTML = `<div class="qprompt">${qPromptHTML(q)}</div>${qOptsHTML(q)}<div id="fbArea"></div>`;

function playQ(q, slow){ const b = $('#bigspk'); b && b.classList.add('playing'); sayWord(q.w, slow, () => { const bb = $('#bigspk'); bb && bb.classList.remove('playing'); }); }
function updateSlots(q){
  const slots = $$('#slots .slot'), w = q.w;
  slots.forEach((s, i) => { const k = q.filled[i]; s.textContent = k === undefined ? '' : q.tiles[k].ch; s.classList.toggle('f', k !== undefined); s.classList.toggle('next', i === q.filled.length); });
  $$('#tiles .tile').forEach((t, k) => { t.disabled = q.filled.includes(k) || q.done; });
  if (q.filled.length === w.en.length && !q.done) { const guess = q.filled.map(k => q.tiles[k].ch).join(''); later(() => resolve(guess === w.en.toLowerCase(), null), 160); }

/* ---------- Shared answering flow (stop quiz / boss / speed) ---------- */
const CHEER = ['Great job! 太棒了！','Excellent! 好厲害！','You got it! 答對了！','Super! 超強！','Nice! 漂亮！','Wonderful! 真了不起！'];
const OOPS = ['沒關係，看一次就記住了！','差一點點！這個字等一下會再出現。','Almost! 再看一次正確答案。','錯了也是在學習喔！'];
const THINK = ['慢慢想，你可以的！','先唸唸看再選。','想想看單字卡上的樣子。','相信你自己！'];
function coach(text, mood){ const c = $('#coach'); if (c) c.innerHTML = text; const p = $('.coach .puffy'); if (p) { const holder = p.parentNode; p.outerHTML = puffy(mood || 'idle', mood === 'happy' ? 'jump' : mood === 'oops' ? 'shake' : ''); } }
function answerAt(i){
  const q = run && run.cur; if (!q || q.done || q.type === 'spell') return;
  const o = q.opts[i]; if (!o) return;
  const btns = $$('.opt'); const right = o.id === q.w.id;
  btns.forEach((b, j) => { b.disabled = true; if (q.opts[j].id === q.w.id) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); else b.classList.add('dim'); });
  if (q.type === 'fill') { const bl = $('#blank'); if (bl) bl.textContent = q.w.fill.startsWith('___') ? cap1(q.w.en) : q.w.en; }
  resolve(right, btns[i]);
}
function resolve(right, el){
  const q = run.cur; if (q.done) return; q.done = true;
  if (q.type === 'spell') { const sl = $('#slots'); sl && sl.classList.add(right ? 'right' : 'wrong'); $$('#tiles .tile').forEach(t => t.disabled = true); if (!right) { later(() => { $$('#slots .slot').forEach((s, i) => { s.textContent = q.w.en[i]; }); }, 500); } }
  if (right) { run.combo++; S.maxCombo = Math.max(S.maxCombo, run.combo); if (q.type === 'listen') S.listen++; }
  else { run.combo = 0; S.wrong[q.w.id] = (S.wrong[q.w.id] || 0) + 1; }
  save();
  run.onResolve(q, right, el || $('#qcard'));
}

/* ---------- STOP QUIZ ---------- */
function quizShell(st, extraTop){
  return `<div class="quiz-top">${extraTop || ''}<button class="btn small" data-act="quit" id="quitBtn">✕ 離開</button>
    <div class="route" aria-hidden="true"><div class="rfill" id="rfill" style="width:0"></div><div class="rplane" id="rplane" style="left:12px">${planeSVG()}</div><div class="rflag"><i data-ui="flag"></i></div></div>
    <div class="pill"><span aria-hidden="true"><i data-ui="plane"></i></span>+<b id="qMiles">0</b></div></div>
  <section class="qcard card" id="qcard"${st ? ` style="--accent:${st.color}"` : ''}><div class="qhead"><span class="qtype" id="qtype"></span><span class="qnum" id="qnum"></span><span class="combo" id="combo"></span></div><div id="qbody"></div></section>
  <div class="coach">${puffy('idle')}<p class="bubble" id="coach">${pick(THINK)}</p></div>`;
}
function startQuiz(id){
  const st = STOPS.find(s => s.id === id); if (!st) return;
  bg.set(st.sky);
  const ws = st.words.map(x => W[x]);
  const EASY = ['pic2en','en2pic','listen'], HARD = ['zh2en','fill','spell','sky'];
  const r1 = shuffle(ws).map(w => ({w, type: chooseType(w, EASY)}));
  const r2 = shuffle(ws).map(w => ({w, type: chooseType(w, HARD)}));
  if (r2.length > 1 && r2[0].w === r1[r1.length - 1].w) [r2[0], r2[1]] = [r2[1], r2[0]];
  run = {mode:'stop', st, queue:[...r1, ...r2], i:0, firstWrong:0, extra:{}, combo:0, miles:0, correct:0, got:new Set(), cur:null, onResolve: stopResolve, quitArm:false};
  show(quizShell(st), 'quiz');
  nextQ();
}
function setRoute(){ const p = run.i / run.queue.length, r = $('.route'); if (!r) return; const w = r.clientWidth - 46; $('#rfill').style.width = (p * w) + 'px'; $('#rplane').style.left = (12 + p * w) + 'px'; }
function nextQ(){
  if (run.i >= run.queue.length) return run.finish ? run.finish() : finishStop();
  const q = buildQ(run.queue[run.i]); run.cur = q;
  $('#qnum').textContent = `第 ${run.i + 1} 題 / 共 ${run.queue.length} 題`;
  setRoute(); mountQ(q);
  coach(q.retry ? '這個字剛剛錯過，再試一次！' : pick(THINK), 'idle');
}
function stopResolve(q, right, el){
  const comboEl = $('#combo');
  if (right) {
    const gain = (q.retry ? 5 : 10) + (run.combo >= 3 ? 5 : 0); run.miles += gain; run.correct++; run.got.add(q.w.id);
    if (run.mode === 'review' && !q.retry) { S.wrong[q.w.id] = Math.max(0, (S.wrong[q.w.id] || 0) - 1); save(); }
    $('#qMiles').textContent = run.miles; floaty('+' + gain, el); SFX.ok();
    if (run.combo >= 2) { comboEl.innerHTML = `<i data-ui="flame"></i> ${run.combo} 連擊`; comboEl.classList.remove('on'); void comboEl.offsetWidth; comboEl.classList.add('on'); }
    if ([3, 5, 8, 10, 15].includes(run.combo)) { later(() => { SFX.combo(run.combo); banner(run.combo + ' Combo!'); }, 250); }
    coach(pick(CHEER), 'happy');
    if (q.type !== 'listen') later(() => sayWord(q.w), 250);
    run.i++; later(nextQ, 1250);
  } else {
    SFX.bad(); comboEl.classList.remove('on');
    if (!q.retry) run.firstWrong++;
    const n = run.extra[q.w.id] || 0;
    if (n < 2) { run.extra[q.w.id] = n + 1; const pos = Math.min(run.queue.length, run.i + 3); run.queue.splice(pos, 0, {w: q.w, type: chooseType(q.w, ['pic2en','en2pic','zh2en','listen','fill'], q.type), retry: true}); }
    coach(pick(OOPS), 'oops');
    later(() => sayWord(q.w), 450);
    $('#fbArea').innerHTML = `<div class="fb"><div class="fbt"><p>正確答案是 <b class="en">${esc(q.w.en)}</b>　${q.w.zh}</p>${q.w.tip ? `<p class="muted" style="font-size:15px"><i data-ui="bulb"></i> ${q.w.tip}</p>` : ''}</div><button class="btn sun" data-act="next" id="nextBtn">知道了，下一題 ▸</button></div>`;
    $('#nextBtn').focus({preventScroll: true});
    run.i++;
  }
}
function finishStop(){
  const st = run.st, wrong = run.firstWrong;
  const stars = wrong === 0 ? 3 : wrong <= 2 ? 2 : 1;
  const prev = S.stars[st.id] || 0; S.stars[st.id] = Math.max(prev, stars);

  } else {
    r.lock = true; coach(pick(['不是一對喔，記住它們的位置！', '再試試看，你快找到了！', '差一點點！']), 'oops');
    later(() => { r.open.forEach(k => { const e = $(`.mcard[data-i="${k}"]`); if (e) { e.classList.remove('open'); e.setAttribute('aria-label', `第 ${k + 1} 張牌`); } }); r.open = []; r.lock = false; }, 1000);
  }
}
function finishMemo(){
  const r = run; clearInterval(r.tick);
  const secs = Math.round((performance.now() - r.t0) / 1000);
  const stars = r.moves <= Math.floor(r.pairs * 1.5) + 1 ? 3 : r.moves <= Math.floor(r.pairs * 2.5) ? 2 : 1;
  S.memoBest = S.memoBest || {};
  const prevBest = S.memoBest[r.pairs], best = !prevBest || r.moves < prevBest; if (best) S.memoBest[r.pairs] = r.moves;
  S.memoStars = Math.max(S.memoStars || 0, stars);
  const fresh = r.cards.map(c => c.w.id).filter((id, i, arr) => arr.indexOf(id) === i && !S.stickers[id]); fresh.forEach(id => S.stickers[id] = 1);
  const miles = r.miles + stars * 10; addMiles(miles);
  const badges = checkBadges(); save();
  renderResult({kind: 'memo', stars, moves: r.moves, pairs: r.pairs, secs, best: best && !!prevBest, miles, fresh, badges});
}

/* ---------- WEAK-SPOT TRAINING ---------- */
function startReview(){
  const weak = WORDS.filter(w => (S.wrong[w.id] || 0) > 0).sort((a, b) => S.wrong[b.id] - S.wrong[a.id]).slice(0, 8);
  if (!weak.length) { toast('目前沒有要特訓的字，太棒了！'); return; }
  bg.set('weather');
  const EASY = ['pic2en','en2pic','listen'], HARD = ['zh2en','fill','spell','sky'];
  const r1 = shuffle(weak).map(w => ({w, type: chooseType(w, EASY)}));
  const r2 = shuffle(weak).map(w => ({w, type: chooseType(w, HARD)}));
  if (r2.length > 1 && r2[0].w === r1[r1.length - 1].w) [r2[0], r2[1]] = [r2[1], r2[0]];
  run = {mode: 'review', st: null, queue: [...r1, ...r2], i: 0, firstWrong: 0, extra: {}, combo: 0, miles: 0, correct: 0, got: new Set(), cur: null, onResolve: stopResolve, quitArm: false, finish: finishReview, words: weak};
  show(quizShell(null), 'quiz');
  nextQ();
  coach(`特訓 <b>${weak.length}</b> 個常錯的字！第一次就答對，它就會慢慢離開「需要多練習」名單。`, 'idle');
}
function finishReview(){
  const words = run.words, fixed = words.filter(w => !(S.wrong[w.id] > 0)), left = words.filter(w => S.wrong[w.id] > 0);
  addMiles(run.miles);
  const fresh = [...run.got].filter(id => !S.stickers[id]); run.got.forEach(id => S.stickers[id] = 1);
  const badges = checkBadges(); save();
  renderResult({kind: 'review', miles: run.miles, correct: run.correct, fixed, left, fresh, badges});
}

/* ---------- PASSPORT ---------- */
function renderPassport(){

  const rk = rankOf(S.miles), pct = rk.next ? Math.min(100, (S.miles - rk.at) / (rk.next[0] - rk.at) * 100) : 100;
  const weak = WORDS.filter(w => (S.wrong[w.id] || 0) > 0).sort((a, b) => S.wrong[b.id] - S.wrong[a.id]).slice(0, 10);
  const stampCell = (f, n, ok, label) => ok ? `<div class="mini-stamp" style="--c:${f.color};--rot:${(n % 2 ? 7 : -9)}deg"><small>${f.code}</small><b>${f.en}</b><small>${f.zh}</small>${label || ''}</div>` : `<div class="mini-stamp empty"><small>${f.code}</small><b>？</b><small>${f.zh}</small></div>`;
  show(`
  <section class="pp-cover card">
    <div class="crest">SKY<br>PASS<br>PORT</div>
    <div><h2>${S.name ? esc(S.name) : '小旅客'} 的護照</h2><p>等級：<b>${rk.name}</b>　累積 <b>${S.miles.toLocaleString('en-US')}</b> 哩</p>
    <div class="rankbar"><i style="width:${pct}%"></i></div><p style="font-size:14px">${rk.next ? `再飛 ${rk.next[0] - S.miles} 哩升級為「${rk.next[1]}」` : '你已經是最高等級！'}</p></div>
  </section>
  <section class="card sec"><div class="sec-head"><h2>入境印章</h2><span>${STOPS.filter(s => cleared(s.id)).length + (S.bossWin ? 1 : 0)} / 6</span></div>
    <div class="stamps">${STOPS.map((s, i) => stampCell(s, i, cleared(s.id), `<span class="ms">${'★'.repeat(S.stars[s.id] || 0)}</span>`)).join('')}${stampCell(BOSS, 5, S.bossWin > 0, '<small><i data-ui="trophy"></i> 勝利</small>')}</div></section>
  <section class="card sec"><div class="sec-head"><h2>單字貼紙簿</h2><span>${WORDS.filter(w => S.stickers[w.id]).length} / 28</span></div>
    <p class="muted" style="margin:0">在挑戰中答對單字，就會得到那個字的貼紙。點貼紙可以聽發音。</p>
    <div class="album">${STOPS.map(s => `<h3>${s.zh} · ${s.theme}</h3><div class="stickers">${s.words.map(id => { const w = W[id], has = S.stickers[id]; return `<button class="stk ${has ? '' : 'no'}" data-act="sayw" data-w="${id}" aria-label="${esc(w.en)} ${has ? '已收集' : '未收集'}"><span class="sp" aria-hidden="true">${w.pic}</span><span class="se">${has ? esc(w.en) : '?'}</span></button>`; }).join('')}</div>`).join('')}</div></section>
  <section class="card sec"><div class="sec-head"><h2>徽章</h2><span>${BADGES.filter(b => S.badges[b.id]).length} / ${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b => `<div class="bdg ${S.badges[b.id] ? '' : 'no'}"><span class="bi" aria-hidden="true">${b.icon}</span><div><b>${b.name}</b><small>${b.desc}</small></div></div>`).join('')}</div></section>
  <section class="card sec"><div class="sec-head"><h2>需要多練習的字</h2>${weak.length ? '<button class="btn small sun" data-act="review"><i data-ui="bolt"></i> 弱點特訓</button>' : ''}</div>
    ${weak.length ? `<div class="weak">${weak.map(w => `<button data-act="sayw" data-w="${w.id}">${w.noPic ? '' : w.pic} ${esc(w.en)} <small>${w.zh} · 錯 ${S.wrong[w.id]} 次</small></button>`).join('')}</div>` : '<p class="muted" style="margin:0">目前沒有答錯的字，太厲害了！</p>'}
  </section>
  <details class="card sec teacher" id="teacher"><summary>給老師：課程設定與單字表</summary>
    <label class="switch"><input type="checkbox" id="unlockAll" ${S.unlockAll ? 'checked' : ''}> 全部關卡直接開放（上課示範、投影用）</label>
    <label class="switch"><input type="checkbox" id="soundChk" ${S.sound ? 'checked' : ''}> 音效</label>
    <p class="muted" style="margin:0;font-size:14px">單字發音：<b>${Object.keys(AUDIO).length} / 28</b> 個字使用真人錄音${Object.keys(AUDIO).length < 28 ? '，其餘用裝置的語音合成' : ''}。例句發音使用裝置的語音合成${TTS.ok ? '' : '（這台裝置不支援，例句將不會發聲）'}。學習紀錄只存在這台裝置的這個瀏覽器裡。</p>
    <div class="tbl-wrap"><table class="wl"><thead><tr><th>站</th><th>英文</th><th>中文</th><th>例句</th></tr></thead><tbody>${WORDS.map(w => `<tr><td>${STOPS[w.stop - 1].zh}</td><td class="en">${esc(w.en)}</td><td>${w.zh}</td><td><span class="en">${esc(w.s)}</span><br><span class="muted">${w.sz}</span></td></tr>`).join('')}</tbody></table></div>
    ${Object.keys(CREDITS).length ? `<h3 style="font-size:17px">真人發音來源與授權</h3><p class="muted" style="margin:0;font-size:14px">錄音來自 Wikimedia Commons（Wiktionary 使用的發音檔）。為了課堂使用，音檔已剪去前後空白、統一音量並轉成 MP3；修改後的音檔依原檔授權釋出。</p>
    <div class="tbl-wrap"><table class="wl"><thead><tr><th>單字</th><th>錄音者</th><th>口音</th><th>授權</th><th>原始檔案</th></tr></thead><tbody>${WORDS.filter(w => CREDITS[w.id]).map(w => { const c = CREDITS[w.id]; return `<tr><td class="en">${esc(w.en)}</td><td>${esc(c.artist)}</td><td>${esc(c.accent)}</td><td>${c.licurl ? `<a href="${esc(c.licurl)}" target="_blank" rel="noopener">${esc(c.license)}</a>` : esc(c.license)}</td><td><a href="${esc(c.page)}" target="_blank" rel="noopener">${esc(c.file)}</a></td></tr>`; }).join('')}</tbody></table></div>` : ''}
    <div id="resetArea"><button class="btn small" data-act="resetAsk">清除這台裝置的學習紀錄</button></div>
  </details>
  <div class="row"><button class="btn" data-act="home">← 回出發看板</button></div>`, 'passport');
  $('#unlockAll').addEventListener('change', e => { S.unlockAll = e.target.checked; save(); toast(S.unlockAll ? '已開放全部關卡' : '已恢復依序解鎖'); });
  $('#soundChk').addEventListener('change', e => { S.sound = e.target.checked; save(); updateHud(); });
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  ac();
  switch (a) {
    case 'home': SFX.tap(); renderHome(); break;
    case 'passport': SFX.tap(); renderPassport(); break;
    case 'sound': S.sound = !S.sound; save(); updateHud(); if (S.sound) SFX.ok(); break;
    case 'go': { SFX.tap(); const nx = nextStop(); if (nx) renderStop(nx.id); else if (unlocked('boss') && !S.bossWin) startBoss(); else { const low = STOPS.find(s => (S.stars[s.id] || 0) < 3); low ? renderStop(low.id) : startSpeed(); } break; }
    case 'stop': if (b.getAttribute('aria-disabled') === 'true') { SFX.bad(); toast('先完成上一站，才能登機喔！'); break; } SFX.tap(); renderStop(+id); break;
    case 'boss': if (b.getAttribute('aria-disabled') === 'true') { SFX.bad(); toast('完成五個站，暴風城堡才會出現！'); break; } startBoss(); break;
    case 'speed': if (b.getAttribute('aria-disabled') === 'true') { SFX.bad(); toast('先完成第一站，才能玩閃電挑戰！'); break; } startSpeed(); break;
    case 'memo': if (b.getAttribute('aria-disabled') === 'true') { SFX.bad(); toast('先完成第一站，才能玩記憶翻牌！'); break; } startMemo(); break;
    case 'flip': memoFlip(+b.dataset.i); break;
    case 'review': SFX.tap(); startReview(); break;
    case 'card': showCard(b.dataset.w); break;
    case 'sayw': sayWord(W[b.dataset.w]); break;
    case 'saywslow': sayWord(W[b.dataset.w], true); break;
    case 'says': saySentence(W[b.dataset.w]); break;
    case 'quiz': SFX.tap(); startQuiz(+(id || (stopState && stopState.st.id))); break;
    case 'ans': answerAt(+b.dataset.i); break;
    case 'next': if (run && (run.mode === 'stop' || run.mode === 'review')) nextQ(); break;
    case 'sayq': if (run && run.cur) { run.cur.type === 'listen' ? playQ(run.cur) : sayWord(run.cur.w); } break;
    case 'sayqslow': if (run && run.cur) playQ(run.cur, true); break;
    case 'spell': { const q = run && run.cur; if (!q || q.done) break; const k = +b.dataset.k; if (q.filled.includes(k)) break; q.filled.push(k); SFX.tap(); updateSlots(q); break; }
    case 'unspell': { const q = run && run.cur; if (!q || q.done || q.type !== 'spell') break; const i = b.dataset.i === 'last' ? q.filled.length - 1 : +b.dataset.i; if (i >= 0 && i < q.filled.length) { q.filled.splice(i); SFX.tap(); updateSlots(q); } break; }
    case 'hint': { const q = run && run.cur; if (!q || q.done || q.type !== 'spell') break; const target = q.w.en.toLowerCase();
      let ok = 0; while (ok < q.filled.length && q.tiles[q.filled[ok]].ch === target[ok]) ok++;
      q.filled.splice(ok); const need = target[ok]; const k = q.tiles.findIndex((t, kk) => t.ch === need && !q.filled.includes(kk));
      if (k >= 0) { q.filled.push(k); q.hinted = (q.hinted || 0) + 1; coach(`下一個字母是 <b class="en">${need}</b>`, 'idle'); updateSlots(q); } break; }
    case 'quit': { const qb = $('#quitBtn'); if (!run.quitArm) { run.quitArm = true; qb.textContent = '再按一次離開'; later(() => { if (run) { run.quitArm = false; const q2 = $('#quitBtn'); q2 && (q2.textContent = '✕ 離開'); } }, 2500); break; }
      if (run.mode === 'stop') renderStop(run.st.id); else if (run.mode === 'review') renderPassport(); else renderHome(); run = null; break; }
    case 'speedgo': speedGo(); break;
    case 'resetAsk': $('#resetArea').innerHTML = `<div class="confirm"><span>確定要清除全部星星、貼紙和哩程嗎？清除後無法復原。</span><button class="btn small red" data-act="resetYes">確定清除</button><button class="btn small" data-act="resetNo">取消</button></div>`; break;
    case 'resetNo': $('#resetArea').innerHTML = '<button class="btn small" data-act="resetAsk">清除這台裝置的學習紀錄</button>'; break;
    case 'resetYes': S = JSON.parse(JSON.stringify(DEF)); save(); toast('學習紀錄已清除'); renderHome(); break;
  }
});
document.addEventListener('keydown', e => {
  if (!run || !run.cur || e.target.matches('input,textarea')) return;
  const q = run.cur;
  if (['quiz', 'boss', 'speed'].includes(screen)) {
    if (q.type === 'spell' && !q.done && /^[a-z]$/i.test(e.key)) { const k = q.tiles.findIndex((t, kk) => t.ch === e.key.toLowerCase() && !q.filled.includes(kk)); if (k >= 0) { q.filled.push(k); SFX.tap(); updateSlots(q); } return; }
    if (q.type === 'spell' && e.key === 'Backspace' && !q.done) { e.preventDefault(); q.filled.pop(); updateSlots(q); return; }
    if (/^[1-4]$/.test(e.key) && !q.done) { answerAt(+e.key - 1); return; }
    if (e.key === 'Enter' && q.done && $('#nextBtn') && document.activeElement !== $('#nextBtn')) { e.preventDefault(); nextQ(); }
  }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { bg.resize(); fxResize(); if (run && run.mode === 'stop' && $('.route')) setRoute(); }, 120); });
document.addEventListener('visibilitychange', () => { if (document.hidden) bg.stop(); else bg.start(); });
const mq = matchMedia('(prefers-color-scheme: dark)'); const rebuildNight = () => { bg.build(); if (!bg.running || reduced()) bg.draw(performance.now() / 1000, true); };
mq.addEventListener && mq.addEventListener('change', rebuildNight);
new MutationObserver(rebuildNight).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
const fillUI = root => root.querySelectorAll('[data-ui]:empty').forEach(e => { e.innerHTML = U[e.dataset.ui] || ''; });
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType !== 1) return; if (n.matches('[data-ui]:empty')) n.innerHTML = U[n.dataset.ui] || ''; fillUI(n); }))).observe(document.body, {childList: true, subtree: true});
fillUI(document);
function splash(){
  let seen = false; try { seen = sessionStorage.getItem('sp.splash') === '1'; sessionStorage.setItem('sp.splash', '1'); } catch (e) {}
  if (seen || reduced()) return;
  const el = document.createElement('div'); el.className = 'splash'; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = `<div class="sp-in">${puffy('happy')}<div class="sp-logo">${[...'Sky Passport'].map((ch, i) => `<span style="--i:${i}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')}</div><p>英語天氣護照</p></div><div class="sp-plane">${planeSVG()}</div>`;
  document.body.appendChild(el);
  const done = () => { el.classList.add('out'); setTimeout(() => el.remove(), 600); };
  const t = setTimeout(done, 1700); el.addEventListener('click', () => { clearTimeout(t); done(); });
}
fxResize();
updateHud();
renderHome();
splash();
window.__sp = {get run(){ return run; }, get S(){ return S; }, W, STOPS, answer: answerAt, playClip, AUDIO};
})();
</script>
