<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭與我・課前課後診斷遊戲（三年級社會）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#151033;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:#2b2150;user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center;flex:none;overflow:hidden;border-radius:18px;background:linear-gradient(160deg,#ffe0ec,#d9e4ff 55%,#fff3d6);box-shadow:0 20px 80px #0008}
#view{position:absolute;inset:0}
.scr{position:absolute;inset:0;padding:28px 40px;display:flex;flex-direction:column;animation:in .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes in{from{opacity:0;transform:scale(.95)}}
h1{font-size:54px;font-weight:900;line-height:1.1}
h2{font-size:34px;font-weight:900}
.btn{border:none;cursor:pointer;font:inherit;font-weight:800;border-radius:30px;padding:10px 26px;font-size:22px;background:#ff5d8f;color:#fff;box-shadow:0 6px 0 #c23468;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c23468}
.btn.alt{background:#5b7cff;box-shadow:0 6px 0 #3149c2}
.btn.gold{background:#ffb703;color:#4a3000;box-shadow:0 6px 0 #c98900}
.btn.gray{background:#8a86a8;box-shadow:0 6px 0 #5d5a78}
.btn.sm{font-size:16px;padding:6px 16px;box-shadow:0 4px 0 #0003}
.zh{color:#6a5fa0;font-size:20px;font-weight:700}
.speak{cursor:pointer;width:38px;height:38px;border-radius:50%;background:#5b7cff;color:#fff;border:none;font-size:18px;vertical-align:middle;margin-left:8px}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.05)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes jump{40%{transform:translateY(-24px) scale(1.15)}}
.tbar{height:14px;background:#fff8;border-radius:8px;overflow:hidden;flex:1}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5d8f,#ffb703)}
canvas#fx{position:absolute;inset:0;pointer-events:none;z-index:50}

/* home */
.home{align-items:center;text-align:center;justify-content:center}
.home .bg{position:absolute;inset:0;background:linear-gradient(#6b4cff,#ff8fb8 70%,#ffd89e);z-index:-1}
.home h1{color:#fff;text-shadow:0 5px 0 #4b2aa8,0 12px 24px #0006}
.home .tag{display:inline-block;background:#fff;color:#4b2aa8;border-radius:30px;padding:6px 20px;font-weight:900;font-size:20px;margin-bottom:12px;animation:wob 2s infinite}
.gcards{display:flex;gap:34px;margin:26px 0 18px}
.gcard{width:400px;background:#fff;border-radius:30px;padding:22px;cursor:pointer;box-shadow:0 12px 0 #4b2aa880;transition:.2s}
.gcard:hover{transform:translateY(-8px) rotate(-1deg)}
.gcard .ic{font-size:96px;animation:bob 2.4s infinite;display:block}
.gcard .when{display:inline-block;background:#ffe27a;border-radius:14px;padding:2px 12px;font-weight:900;font-size:18px}
.gcard b{display:block;font-size:32px;margin:6px 0 2px}
.gcard small{font-size:17px;color:#7b6fb5;font-weight:700}
.clsbox{color:#fff;font-weight:800;font-size:18px}
.clsbox input{font:inherit;font-size:18px;border:none;border-radius:12px;padding:4px 10px;width:150px;text-align:center}

/* seat */
.seats{display:grid;grid-template-columns:repeat(10,1fr);gap:12px;margin:18px 0}
.seats button{font:inherit;font-weight:900;font-size:30px;border:none;border-radius:18px;padding:14px 0;background:#fff;box-shadow:0 6px 0 #b9a8ff;cursor:pointer}
.seats button:hover{background:#ffe27a}

/* intro */
.intro{align-items:center;justify-content:center;text-align:center}
.intro .ic{font-size:150px;animation:bob 2s infinite}
.intro .rule{font-size:26px;font-weight:800;background:#fff;border-radius:24px;padding:16px 28px;max-width:900px;margin:16px 0 24px;line-height:1.5}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:240px;font-weight:900;color:#ff5d8f;text-shadow:0 10px 0 #fff;z-index:40;animation:pop .5s}

/* shared question */
.hud{display:flex;align-items:center;gap:16px;font-weight:900;font-size:22px;margin-bottom:10px}
.pill{background:#fff;border-radius:20px;padding:4px 16px}
.qcard{background:#fff;border-radius:26px;padding:14px 24px;box-shadow:0 8px 0 #0001}
.qcard .q{font-size:36px;font-weight:900;margin-top:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.opts button{font:inherit;font-weight:900;font-size:30px;border:none;border-radius:22px;padding:16px 20px;text-align:left;background:#fff;box-shadow:0 7px 0 #b9a8ff;cursor:pointer;transition:.12s;color:#2b2150}
.opts button:hover{transform:translateY(-4px)}
.opts button.good{background:#7be495;box-shadow:0 7px 0 #2f9e4f}
.opts button.bad{background:#ffb3b3;box-shadow:0 7px 0 #c23a3a;animation:shake .4s}
.ov{position:absolute;inset:0;background:#1b1340cc;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;color:#fff;text-align:center;animation:in .3s}

/* gacha */
.shelf{margin-top:auto;background:#fff8;border-radius:20px;padding:8px 14px;display:flex;gap:8px;align-items:center;min-height:66px;font-size:40px}
.shelf small{font-size:16px;font-weight:900;color:#6a5fa0;margin-right:6px}
.chests{display:flex;gap:50px;margin-top:24px}
.chest{font-size:130px;cursor:pointer;animation:wob .5s infinite;filter:drop-shadow(0 8px 0 #0005)}
.chest:nth-child(2){animation-delay:-.2s}.chest:nth-child(3){animation-delay:-.35s}
.rcard{width:300px;height:380px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:flip .8s cubic-bezier(.2,1.4,.4,1);color:#2b2150;position:relative}
@keyframes flip{from{transform:rotateY(180deg) scale(.4)}}
.rcard .e{font-size:140px}
.rcard .r{font-size:40px;font-weight:900}
.rN{background:#e8e8f0}.rR{background:linear-gradient(#bde0ff,#7fb8ff)}.rSR{background:linear-gradient(#e7c6ff,#b07cff)}
.rSSR{background:linear-gradient(135deg,#fff3a0,#ffb703,#ff7aa8,#fff3a0);background-size:300% 300%;animation:flip .8s cubic-bezier(.2,1.4,.4,1),shine 1.5s linear infinite;box-shadow:0 0 60px #ffd700}
@keyframes shine{to{background-position:300% 0}}

/* impostor */
.space{background:radial-gradient(circle at 30% 20%,#3b2a7a,#120c2e 70%)!important;color:#fff}
.space .zh{color:#d4c8ff}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,#0000),radial-gradient(2px 2px at 140px 90px,#fff,#0000),radial-gradient(1px 1px at 80px 160px,#fff,#0000),radial-gradient(2px 2px at 220px 50px,#fffa,#0000);background-size:260px 200px;animation:drift 30s linear infinite}
@keyframes drift{to{background-position:-520px 0}}
.alarm{display:inline-block;background:#ff3b5c;color:#fff;border-radius:14px;padding:4px 14px;font-weight:900;animation:wob .8s infinite}
.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px;flex:1;align-content:start}
.mate{background:#ffffff14;border:3px solid #ffffff30;border-radius:26px;padding:16px 12px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.mate:hover{background:#ffffff26;transform:translateY(-6px)}
.mate .av{width:120px;height:120px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:76px;border:6px solid #fff;animation:bob 3s infinite}
.mate:nth-child(2) .av{animation-delay:-.7s}.mate:nth-child(3) .av{animation-delay:-1.4s}.mate:nth-child(4) .av{animation-delay:-2.1s}
.mate .nm{font-weight:900;font-size:20px;margin:8px 0}
.mate .say{background:#fff;color:#2b2150;border-radius:18px;padding:12px;font-size:23px;font-weight:900;min-height:110px;display:flex;align-items:center;justify-content:center;position:relative}
.mate .say::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:0;border-bottom-color:#fff}
.mate.vote::after{content:"VOTED";position:absolute;top:40px;left:50%;transform:translateX(-50%) rotate(-12deg);background:#ff3b5c;color:#fff;font-weight:900;font-size:30px;padding:4px 16px;border-radius:10px}
.eject{font-size:120px;position:absolute;left:-150px;top:240px;animation:ej 2.4s linear forwards}
@keyframes ej{to{left:1400px;transform:rotate(1080deg)}}
.ejtxt{font-size:44px;font-weight:900;margin-top:200px;min-height:60px}

/* kart */
.track{height:300px;border-radius:24px;position:relative;overflow:hidden;background:linear-gradient(#9fe3ff 0 22%,#7bc96f 22% 26%,#5c5c70 26% 100%);box-shadow:0 8px 0 #0002;flex:none}
.scenery{position:absolute;top:4px;left:0;white-space:nowrap;font-size:46px;animation:scroll 14s linear infinite;letter-spacing:60px}
@keyframes scroll{to{transform:translateX(-50%)}}
.lane{position:absolute;left:0;right:0;height:52px;border-bottom:3px dashed #fff5}
.finish{position:absolute;right:50px;top:78px;bottom:0;width:26px;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/13px 13px}
.car{position:absolute;font-size:46px;transition:left 1.1s cubic-bezier(.3,1.2,.4,1);transform:scaleX(-1)}
.car .lb{position:absolute;top:-6px;left:50%;transform:translateX(-50%) scaleX(-1);font-size:13px;font-weight:900;background:#fff;border-radius:8px;padding:0 6px;white-space:nowrap}
.car.me .lb{background:#ff5d8f;color:#fff}
.car.spin{animation:spin .9s}
@keyframes spin{to{transform:scaleX(-1) rotate(720deg)}}
.boost{position:absolute;font-size:34px;animation:pop .3s}
.kfb{font-size:30px;font-weight:900;text-align:center;min-height:42px;margin-top:6px}
.pads button:nth-child(1){box-shadow:0 7px 0 #ff5d8f}.pads button:nth-child(2){box-shadow:0 7px 0 #5b7cff}.pads button:nth-child(3){box-shadow:0 7px 0 #ffb703}.pads button:nth-child(4){box-shadow:0 7px 0 #2fbf71}
.pads button{font-size:26px;padding:12px 18px}

/* ninja */
.dojo{background:linear-gradient(#3a2470,#7a3f8f 60%,#c86b5a)!important;color:#fff}
.dojo .qcard{color:#2b2150}.dojo .qcard .zh{color:#6a5fa0}
.field{position:absolute;left:0;right:0;top:190px;bottom:0;touch-action:none;cursor:crosshair}
.field canvas{position:absolute;inset:0;pointer-events:none}
.fruit{position:absolute;width:250px;margin-left:-125px;background:#fff;color:#2b2150;border-radius:40px;padding:12px 16px;font-weight:900;font-size:25px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 0 #0004;pointer-events:none;border:5px solid #ffd166}
.fruit .e{font-size:44px;flex:none}
.half{position:absolute;transition:transform 1.1s cubic-bezier(.3,.1,.6,1),opacity 1.1s}
.splash{position:absolute;font-size:80px;animation:pop .3s;pointer-events:none}
.banner{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:52px;font-weight:900;text-shadow:0 5px 0 #0006;z-index:20;animation:pop .35s;pointer-events:none}
.banner small{display:block;font-size:26px;margin-top:6px}

/* result */
.res{align-items:center;text-align:center}
.res .big{font-size:100px;animation:bob 2s infinite}
.code{font-family:Consolas,Menlo,monospace;font-size:54px;font-weight:900;background:#fff;border:6px dashed #ff5d8f;border-radius:22px;padding:6px 26px;letter-spacing:4px;margin:10px 0;user-select:text}
.weak{background:#fff;border-radius:18px;padding:10px 20px;font-size:19px;font-weight:700;max-width:960px;margin:8px 0}

/* teacher */
.tch{overflow:auto;padding:22px 30px;display:block;background:#f6f3ff;user-select:text}
.tch h2{font-size:28px;margin:10px 0}
.tch .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.tch textarea{width:100%;height:80px;font:15px Consolas,monospace;border:2px solid #b9a8ff;border-radius:12px;padding:8px}
.tch input{font:inherit;font-size:16px;border:2px solid #b9a8ff;border-radius:10px;padding:4px 10px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14.5px;margin:6px 0 14px}
th{background:#4b2aa8;color:#fff;padding:6px;text-align:left;position:sticky;top:0}
td{border-bottom:1px solid #e3ddff;padding:6px;vertical-align:top}
.st-r{background:#ffd6d6;font-weight:900;color:#a01818;border-radius:8px;padding:1px 6px;white-space:nowrap}
.st-y{background:#fff1b8;font-weight:900;color:#8a6200;border-radius:8px;padding:1px 6px;white-space:nowrap}
.st-g{background:#d3f5dc;font-weight:900;color:#17703a;border-radius:8px;padding:1px 6px;white-space:nowrap}
.msg{font-weight:800;color:#e0357a}
.guide{background:#fff;border-radius:14px;padding:10px 16px;font-size:15px;line-height:1.6;margin:8px 0}
details{background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0}
summary{cursor:pointer;font-weight:900}
.demo{background:#ffe27a;border-radius:10px;padding:4px 10px;font-weight:900}
</style>
</head>

<script>
const L=window.LESSON;const $=s=>document.querySelector(s);const view=$('#view');const stage=$('#stage');
function fit(){stage.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)*0.98+')'}addEventListener('resize',fit);fit();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function scr(html,cls=''){view.innerHTML=`<div class="scr ${cls}">${html}</div>`;return view.firstChild}

/* ---------- sound ---------- */
let AC;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,d=.4,type='triangle',vol=.22,when=0){const c=ac();if(!c)return;const t=c.currentTime+when;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)}
function sfx(k){({ok:()=>{tone(659,.2);tone(880,.3,'triangle',.22,.1)},bad:()=>{tone(220,.25,'sawtooth',.13);tone(160,.35,'sawtooth',.13,.12)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.22,i*.12)),pop:()=>tone(520,.1,'sine',.15),tick:()=>tone(1000,.05,'square',.08),swoosh:()=>{const c=ac();if(!c)return;tone(900,.12,'sawtooth',.06);tone(500,.15,'sawtooth',.05,.05)},boom:()=>{tone(90,.5,'sawtooth',.2);tone(60,.6,'square',.12,.05)},ssr:()=>[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.5,'triangle',.2,i*.09))}[k]||(()=>{}))()}
const LANG=L.lang||'en-US';const TH=L.theme||{};let voice=null;function pickVoice(){const vs=speechSynthesis.getVoices();voice=LANG==='zh-TW'?(vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null):(vs.find(v=>/en[-_]US/i.test(v.lang)&&/(Samantha|Google US|Aria|Jenny|Natural)/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null)}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
const __TL=((window.LESSON&&window.LESSON.lang)==='zh-TW')?'zh-TW':'en';const __TR=0.95;
let CT=null;(async()=>{try{if(window.claude&&window.claude.use){CT=await window.claude.use('tts')}}catch(e){CT=null}})();
let CTsid=0;
function say(t,pitch=1,rate){
 if(CT){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  const sid=++CTsid;
  let s=String(t).replace(/_+/g,__TL==='zh-TW'?'什麼':' blank ').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}↱➡]/gu,'').trim();
  if(!s)return;
  const v=pitch>=1.3?'airy':pitch<=0.85?'rounded':pitch>=1.1?'glassy':'buttery';
  CT.speak(s,{voice:v,language:__TL,rate:__TR}).catch(e=>{const c=e&&e.code;if(c==='not_granted')CT=null;if(sid===CTsid&&c!=='viewer_stopped')sayWeb(t,pitch,rate)});
  return}
 sayWeb(t,pitch,rate)}

function sayWeb(t){if(!('speechSynthesis' in window))return;t=t.replace(/_+/g,' blank ').replace(/[↱➡️]/g,'');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LANG;if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}

/* ---------- confetti ---------- */
const fx=$('#fx'),fc=fx.getContext('2d');let P=[];
function confetti(n=60,x=640,y=420){const s=P.length;for(let i=0;i<n;i++)P.push({x:x+(Math.random()-.5)*200,y,vx:(Math.random()-.5)*16,vy:-7-Math.random()*12,c:`hsl(${Math.random()*360},90%,60%)`,r:5+Math.random()*7,a:Math.random()*6,l:80+Math.random()*50});if(!s)loop()}
function loop(){fc.clearRect(0,0,1280,720);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;p.l--;fc.save();fc.translate(p.x,p.y);fc.rotate(p.a);fc.fillStyle=p.c;fc.fillRect(-p.r,-p.r/2,p.r*2,p.r);fc.restore()});P=P.filter(p=>p.l>0&&p.y<780);if(P.length)requestAnimationFrame(loop);else fc.clearRect(0,0,1280,720)}

/* ---------- storage ---------- */
const KEY='diag_'+L.id;let MEM={};
function dbLoad(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):{}}catch(e){return MEM}}
function dbSave(d){MEM=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
let CLS=(()=>{try{return localStorage.getItem(KEY+'_cls')||''}catch(e){return ''}})();
function setCls(v){CLS=v.trim();try{localStorage.setItem(KEY+'_cls',CLS)}catch(e){}}
function clsKey(){return CLS||'未命名班級'}
function addRecord(r){const d=dbLoad();const k=clsKey();d[k]=(d[k]||[]).filter(x=>!(x.t===r.t&&x.seat===r.seat));d[k].push(r);dbSave(d)}
function codeOf(r){return L.id+r.t+'-'+r.seat+'-'+r.a}

/* ---------- timer ---------- */
let TM=null;
function startTimer(sec,onEnd,bar){stopTimer();const t0=performance.now();const me={raf:0};TM=me;
 const tick=()=>{if(TM!==me)return;const left=sec-(performance.now()-t0)/1000;if(bar)bar.style.width=Math.max(0,left/sec*100)+'%';if(left<=0){TM=null;onEnd()}else me.raf=requestAnimationFrame(tick)};me.raf=requestAnimationFrame(tick);me.frac=()=>Math.max(0,1-(performance.now()-t0)/1000/sec)}
function stopTimer(){if(!TM)return 0;const f=TM.frac();cancelAnimationFrame(TM.raf);TM=null;return f}

/* ---------- run engine ---------- */
let R=null;
function cfg(t){return t==='1'?L.pre:L.post}
function startRun(t,seat){R={t,seat,items:cfg(t).items,i:0,ans:[],score:0,g:GAMES[cfg(t).game]};R.g.init();nextItem()}
function nextItem(){if(!R)return;if(R.i>=R.items.length)return finishRun();const it=R.items[R.i];R.lock=false;R.g.show(it,shuffle([0,1,2,3]),R.i)}
function submit(idx){if(R.lock)return null;R.lock=true;const it=R.items[R.i];const ok=idx>=0&&!!it.o[idx].ok;R.ans[R.i]=idx<0?'X':'ABCD'[idx];if(ok)R.score++;return ok}
function goNext(){R.i++;nextItem()}
function correctText(it){return it.o.find(o=>o.ok).t}
function finishRun(){stopTimer();const rec={t:R.t,seat:R.seat,a:R.ans.join(''),at:Date.now()};addRecord(rec);
 const n=R.items.length,s=R.score,stars='⭐'.repeat(Math.max(1,Math.round(s/n*3)))+'☆'.repeat(3-Math.max(1,Math.round(s/n*3)));
 const weak=R.items.map((it,i)=>R.ans[i]==='ABCD'[it.o.findIndex(o=>o.ok)]?null:L.concepts[it.c].name).filter(Boolean);
 scr(`<div class="big">${s===n?'🏆':s>=n*.6?'🎉':'💪'}</div>
 <h1>${s} / ${n} 題答對 ${stars}</h1>
 <div style="font-size:28px;font-weight:900;margin:6px 0">${R.g.summary()}</div>
 <div class="zh">把這組代碼交給老師（抄下來或給老師看）：</div>
 <div class="code">${codeOf(rec)}</div>
 <div class="zh" style="font-size:16px">✅ 也已自動存在這台裝置（${esc(clsKey())}・座號 ${rec.seat}）</div>
 ${weak.length?`<div class="weak">${R.t==='1'?'📌 上課要特別注意：':'📌 還要再加油的觀念：'}${weak.map(esc).join('、')}</div>`:'<div class="weak">🌟 全部觀念都掌握了！</div>'}
 <div style="display:flex;gap:16px;margin-top:10px"><button class="btn gold" onclick="seatScreen('${R.t}')">👉 下一位同學</button><button class="btn alt" onclick="home()">🏠 回首頁</button></div>`,'res');
 if(s>=n*.75){confetti(140);sfx('win')}}

/* ---------- screens ---------- */
function home(){stopTimer();R=null;
 scr(`<div class="bg"></div><div class="tag">🎓 ${L.grade}${L.subject||'英語'} ・ ${esc(L.title)}</div>
 <h1>課前・課後 5 分鐘挑戰</h1>
 <div class="gcards">
  <div class="gcard" onclick="seatScreen('1')"><span class="ic">${L.pre.icon}</span><span class="when">課前 5 分鐘・前測</span><b>${L.pre.name}</b><small>${L.pre.en}</small></div>
  <div class="gcard" onclick="seatScreen('2')"><span class="ic">${L.post.icon}</span><span class="when">課後 5 分鐘・後測</span><b>${L.post.name}</b><small>${L.post.en}</small></div>
 </div>
 <div class="clsbox">班級：<input id="clsIn" placeholder="例如 601" value="${esc(CLS)}" onchange="setCls(this.value)"> 　<button class="btn sm gray" onclick="teacher()">👩‍🏫 教師分析表</button></div>`,'home')}
function seatScreen(t){stopTimer();const c=cfg(t);
 let b='';for(let i=1;i<=40;i++)b+=`<button onclick="intro('${t}','${String(i).padStart(2,'0')}')">${i}</button>`;
 scr(`<div style="display:flex;align-items:center;gap:16px"><h2>${c.icon} ${c.name}</h2><span class="zh">請點你的座號</span><button class="btn sm gray" style="margin-left:auto" onclick="home()">🏠</button></div><div class="seats">${b}</div>`)}
function intro(t,seat){const c=cfg(t);
 const el=scr(`<div class="ic">${c.icon}</div><h1>${c.name}</h1><div class="zh" style="font-size:24px">${c.en} ・ 座號 ${seat}</div><div class="rule">${c.rule}</div><button class="btn gold" style="font-size:34px;padding:14px 50px" id="go">▶ 準備好了！</button>`,'intro');
 el.querySelector('#go').onclick=()=>{ac();let n=3;const cd=document.createElement('div');cd.className='count';view.appendChild(cd);
  const step=()=>{if(n>0){cd.textContent=n;cd.style.animation='none';void cd.offsetWidth;cd.style.animation='';sfx('tick');n--;setTimeout(step,650)}else{cd.textContent='GO!';sfx('win');setTimeout(()=>startRun(t,seat),500)}};step()}}

/* ================= GAMES ================= */
const GAMES={};

/* ---- 1. Gacha ---- */
GAMES.gacha={gold:0,col:[],
 init(){this.gold=0;this.col=[]},
 show(it,order,i){const me=this;
  const el=scr(`<div class="hud"><span class="pill">🎁 ${i+1} / 8</span><div class="tbar"><i id="tb"></i></div><span class="pill">💰 <b id="gold">${this.gold}</b></span></div>
  <div class="qcard"><div class="zh">${it.zh}</div><div class="q">${esc(it.q)}<button class="speak" id="spk">🔊</button></div></div>
  <div class="opts">${order.map(k=>`<button data-k="${k}">${esc(it.o[k].t)}</button>`).join('')}</div>
  <div class="shelf"><small>我的收藏</small>${this.col.join('')}</div>`);
  el.querySelector('#spk').onclick=()=>say(it.q);
  el.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>me.pick(+b.dataset.k,it));
  startTimer(30,()=>me.pick(-1,it),el.querySelector('#tb'))},
 pick(k,it){const ok=submit(k);if(ok===null)return;stopTimer();const me=this;
  document.querySelectorAll('.opts button').forEach(b=>{const kk=+b.dataset.k;if(it.o[kk].ok)b.classList.add('good');else if(kk===k)b.classList.add('bad')});
  sfx(ok?'ok':'bad');
  setTimeout(()=>{const ov=document.createElement('div');ov.className='ov';view.appendChild(ov);
   if(ok){ov.innerHTML=`<h1>🎉 答對了！挑一個寶箱！</h1><div class="chests"><div class="chest">🎁</div><div class="chest">🎁</div><div class="chest">🎁</div></div>`;
    ov.querySelectorAll('.chest').forEach(c=>c.onclick=()=>me.open(ov))}
   else{ov.innerHTML=`<div style="font-size:150px;animation:shake .5s 2">🧦</div><h1>${k<0?'⏰ 時間到！':'喔不～'}開到莫札特的臭襪子！</h1><div style="font-size:28px;margin-top:14px">正確答案：<b style="color:#ffe27a">${esc(correctText(it))}</b></div><button class="btn gold" style="margin-top:22px">下一題 ▶</button>`;
    ov.querySelector('button').onclick=()=>goNext()}},650)},
 open(ov){const r=Math.random();const T=r<.08?'SSR':r<.28?'SR':r<.6?'R':'N';
  const POOL={N:[['🎵','Lucky Note'],['🎶','Double Note'],['🔔','Tiny Bell']],R:[['🥁','Drum'],['🎺','Trumpet'],['🎸','Guitar']],SR:[['🎻','Violin'],['🎷','Saxophone'],['🪗','Accordion']],SSR:[['🎹','Golden Piano'],['👑','Maestro Crown']]};
  const G={N:10,R:20,SR:40,SSR:100}[T];const p=POOL[T][Math.floor(Math.random()*POOL[T].length)];
  this.gold+=G;this.col.push(p[0]);sfx(T==='SSR'?'ssr':'win');if(T==='SSR'||T==='SR')confetti(T==='SSR'?160:60);
  ov.innerHTML=`<div class="rcard r${T}"><div class="r">${T}</div><div class="e">${p[0]}</div><div style="font-size:28px;font-weight:900">${p[1]}</div><div style="font-size:24px;font-weight:900">💰 +${G}</div></div><button class="btn gold" style="margin-top:22px">下一題 ▶</button>`;
  ov.querySelector('button').onclick=()=>goNext()},
 summary(){return `💰 金幣 ${this.gold} ・ 收藏 ${this.col.join('')||'（空空的）'}`}};

/* ---- 2. Impostor ---- */
GAMES.impostor={saved:0,
 CREW:TH.crew||[['🐱','Cello Cat','#ff8fb8'],['🐶','Drum Dog','#6ea8ff'],['🐰','Bunny Bass','#8ad66b'],['🐼','Panda Piano','#ffd166']],
 init(){this.saved=0},

  DEMO=false;renderTeacher(n?`✅ 匯入 ${n} 組代碼到「${clsKey()}」`+(other?`（另有 ${other} 組不是這一課的代碼，已略過）`:''):'找不到有效代碼，請確認格式')};
 const copy=(txt)=>{const box=el.querySelector('#cpbox');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>{el.querySelector('.msg').textContent='✅ 已複製，可直接貼到 Google 試算表或 Excel'}).catch(()=>{box.style.display='block';box.value=txt;box.select();el.querySelector('.msg').textContent='請按 Ctrl+C 複製下面的文字'})}
  else{box.style.display='block';box.value=txt;box.select();el.querySelector('.msg').textContent='請按 Ctrl+C 複製下面的文字'}};
 el.querySelector('#cp1').onclick=()=>copy([['班級','觀念代碼','觀念','前測答對率','後測答對率','變化','狀態','前測最常見迷失','比例','說明','後測最常見迷失','比例','說明','錯誤選項分布（有後測以後測為準）','澄清教學建議','下次新遊戲設計方向'].join('\t'),
  ...rows.map(r=>[clsKey()+(DEMO?'(示範)':''),r.c.code,r.c.name,pct(r.pre),pct(r.post),r.d==null?'':Math.round(r.d*100)+'%',statusTxt(r.base.n?r.base.rate:null),r.tmPre?r.tmPre.t:'',r.tmPre?pct(r.tmPre.c/r.preA.n):'',r.tmPre?r.tmPre.m:'',r.tmPost?r.tmPost.t:'',r.tmPost?pct(r.tmPost.c/r.postA.n):'',r.tmPost?r.tmPost.m:'',r.all,r.c.clarify,r.c.next].join('\t'))].join('\n'));
 el.querySelector('#cp2').onclick=()=>copy([['座號','前測分數','後測分數','前測錯的觀念','後測仍錯的觀念'].join('\t'),...stuRows.map(o=>[o.seat,o.s1??'',o.s2??'',o.m1?o.m1.join('、'):'',o.m2?o.m2.join('、'):''].join('\t'))].join('\n'));
 el.querySelector('#dm').onclick=()=>{DEMO=!DEMO;renderTeacher()};
 el.querySelector('#clr').onclick=()=>{if(!clearArm){clearArm=true;renderTeacher();return}const d=dbLoad();delete d[clsKey()];dbSave(d);clearArm=false;DEMO=false;renderTeacher('已清除「'+clsKey()+'」的資料')}}

home();
