<title>Sunday on the Ice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: a cartoon TV set — chunky inked frame around a 16:9 canvas, transport controls below. Single bright look by choice. */
:root{
  --bg:#d6ecfb;
  --ink:#2b2238;
  --paper:#ffffff;
  --accent:#ff5a5f;
  --muted:#4f5f7d;
  --sun:#ffd23f;
  --display:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body)}
.wrap{max-width:1000px;margin:0 auto;padding-block:24px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-weight:500}
.screen{position:relative;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--ink);box-shadow:6px 6px 0 var(--ink)}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(43,34,56,.5);color:var(--paper);border:0;cursor:pointer;font:inherit;padding:16px}
.cover .big{width:clamp(56px,12vw,92px);aspect-ratio:1;border-radius:50%;background:var(--accent);display:grid;place-items:center;border:4px solid var(--paper);box-shadow:4px 4px 0 var(--ink)}
.cover .big svg{width:42%;height:42%;margin-left:8%}
.cover strong{font-family:var(--display);font-size:clamp(22px,5vw,42px);font-weight:800;line-height:1;text-shadow:3px 3px 0 var(--ink)}
.cover span{font-weight:700;font-size:clamp(13px,2.4vw,18px);text-shadow:2px 2px 0 var(--ink)}
.cover:focus-visible{outline:4px solid var(--sun);outline-offset:-8px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl{font:700 15px var(--body);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:inline-flex;align-items:center;gap:6px}
.ctl:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ctl:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ctl.primary{background:var(--sun)}
input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--accent)}
.time{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
[hidden]{display:none!important}
.note{color:var(--muted);font-size:14px;margin:0}
</style>

<div class="wrap">
  <header>
    <h1>Sunday on the Ice</h1>
    <p class="sub">週日溜冰大冒險 · 1 分鐘爆笑短片</p>
  </header>

  <div class="screen">
    <canvas id="stage" width="960" height="540" aria-label="Animated cartoon"></canvas>
    <button class="cover" id="cover" type="button" aria-label="Play">
      <div class="big"><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0 L10 6 L0 12Z" fill="#fff"/></svg></div>
      <strong>Sunday on the Ice</strong>
      <span>按下播放（有音效）</span>
    </button>
  </div>

  <div class="controls">
    <button class="ctl primary" id="play" type="button">▶ 播放</button>
    <button class="ctl" id="restart" type="button">⟲ 重播</button>
    <input type="range" id="seek" min="0" max="60" step="0.01" value="0" aria-label="Seek">
    <span class="time" id="time">0:00 / 1:00</span>
    <button class="ctl" id="snd" type="button" aria-pressed="true">♪ 音效：開</button>
  </div>
  <p class="note">空白鍵可播放／暫停，拖動進度條可跳到任何一段。</p>
</div>

<script>
const W=960,H=540,DUR=60;
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
(function fit(){const d=Math.min(window.devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);})();

const INK='#2b2238';
const DISPLAY="'Baloo 2','Arial Rounded MT Bold',sans-serif";
const CJK="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const easeOut=k=>1-Math.pow(1-k,3);

/* ---------- drawing helpers ---------- */
function paint(f,s,lw){if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw||3;ctx.stroke();}}
function circ(x,y,r,f,s,lw){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);paint(f,s,lw);}
function ell(x,y,rx,ry,f,s,lw){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);paint(f,s,lw);}
function rr(x,y,w,h,r,f,s,lw){ctx.beginPath();ctx.roundRect(x,y,w,h,r);paint(f,s,lw);}
function ln(x1,y1,x2,y2,c,w){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();}
function txt(s,x,y,size,color,font,align,stroke){
  ctx.font=`800 ${size}px ${font||DISPLAY}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function star(x,y,r,f){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();paint(f,INK,2);}
function burst(x,y,r,f,text,size,rot,k){
  if(k<=0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);const s=easeOut(clamp(k*3));ctx.scale(s,s);
  ctx.beginPath();for(let i=0;i<24;i++){const a=i*Math.PI/12,rad=i%2?r*.7:r;ctx.lineTo(Math.cos(a)*rad*1.35,Math.sin(a)*rad);}ctx.closePath();
  paint(f,INK,4);txt(text,0,3,size,'#fff',DISPLAY,'center',7);ctx.restore();
}
function shout(text,x,y,size,color,rot,k){
  if(k<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);const s=easeOut(clamp(k*3));ctx.scale(s,s);
  txt(text,0,0,size,color,DISPLAY,'center',7);ctx.restore();
}
function cloud(x,y,s){circ(x,y,22*s,'#fff');circ(x+24*s,y-10*s,27*s,'#fff');circ(x+50*s,y,22*s,'#fff');rr(x-12*s,y,74*s,20*s,10*s,'#fff');}
function sky(a,b){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

/* ---------- characters ---------- */
const C={
  teddy:{color:'#f2a541',skin:'#a86b3c',hair:'bear',pants:'#6b4426'},
  edison:{color:'#3d7be0',skin:'#f6c9a0',hair:'spiky',hairColor:INK,glasses:true},
  amber:{color:'#9b59d0',skin:'#f3c29b',hair:'pony',hairColor:'#e8742a'},
  mia:{color:'#ff7eb6',skin:'#f6cfab',hair:'pigtails',hairColor:'#3a2a20'},
  rocky:{color:'#3fbf6a',skin:'#e9b48a',hair:'cap',hairColor:'#5a3a22',capColor:'#e8443a'},
  abu:{color:'#ffd23f',skin:'#8a5a3b',hair:'curly',hairColor:'#1f1712'},
  girl:{color:'#e8443a',skin:'#f4c7a1',hair:'pony',hairColor:'#6b3b1f',band:true},
  mate:{color:'#e8443a',skin:'#f0c09a',hair:'helmet',skates:true,pants:'#1d1a2e'},
};
const P=(b,o)=>Object.assign({},C[b],o);

function person(p,t){
  const s=p.s||1;
  ctx.save();
  ctx.translate(p.x,p.y);if(p.pivot){ctx.translate(0,-p.pivot);ctx.rotate(p.rot||0);ctx.translate(0,p.pivot);}else ctx.rotate(p.rot||0);
  ctx.scale(s*(p.flip?-1:1)*(p.sx??1),s);
  ctx.lineCap='round';ctx.lineJoin='round';
  const sw=p.walk!=null?Math.sin(p.walk)*16:0;
  const pants=p.pants||'#3c3a5c';
  // legs
  ln(-11,-54,-11+sw,-8,pants,13);ln(11,-54,11-sw,-8,pants,13);
  if(p.skates){for(const lx of [-11+sw,11-sw]){rr(lx-12,-16,24,12,5,'#f4f7fb',INK,2.5);ln(lx-15,1,lx+13,1,'#8fa3b8',3);}}
  else{ell(-13+sw,-5,12,7,INK);ell(13-sw,-5,12,7,INK);}
  // stick on back
  if(p.stick==='back'){ln(-38,-168,28,-36,'#9a6236',7);ln(28,-36,46,-30,INK,9);}
  // body
  rr(-27,-114,54,66,20,p.color,INK,3);
  if(p.hair==='helmet'||p.band){txt(p.hair==='helmet'?String(p.num||7):'',0,-82,22,'#fff');}
  const sh=-102,m=p.arm||'down';
  const arm=(x1,y1,x2,y2)=>{ln(x1,y1,x2,y2,INK,16);ln(x1,y1,x2,y2,p.color,11);circ(x2,y2,7.5,p.skin,INK,2);};
  const front=(m==='mouth');
  if(!front){
    if(m==='down'){arm(-22,sh,-36-sw*.5,-58);arm(22,sh,36+sw*.5,-58);}
    else if(m==='up'){const w=Math.sin(t*10)*5;arm(-22,sh,-46+w,-156);arm(22,sh,46-w,-156);}
    else if(m==='wave'){arm(-22,sh,-36,-58);arm(22,sh,48+Math.sin(t*14)*12,-156);}
    else if(m==='point'){arm(-22,sh,-36,-58);arm(22,sh,80,-110);}
    else if(m==='cross'){arm(-22,sh,16,-82);arm(22,sh,-16,-78);}
    else if(m==='clasp'){arm(-22,sh,-4,-86);arm(22,sh,4,-86);}
    else if(m==='flail'){arm(-22,sh,-54,-150+Math.sin(t*22)*24);arm(22,sh,56,-70+Math.cos(t*22)*34);}
  }
  if(p.stick==='hold'){ln(36,-58,60,-8,'#9a6236',7);ln(60,-8,86,-5,INK,9);}
  if(p.stick==='raise'){ln(40,-96,60,-262,'#9a6236',7);ln(60,-262,86,-268,INK,9);}
  if(p.brush&&m==='point'){ln(80,-110,106,-122,'#8a5a32',5);circ(108,-123,5,p.brush);}
  head(p,t);
  if(front){arm(-22,sh,-16,-128);arm(22,sh,20,-128);}
  if(p.toast){ctx.save();ctx.translate(30,-132);ctx.rotate(.15);rr(-6,-12,30,24,6,'#d98a3a',INK,2.5);rr(-2,-8,22,16,4,'#f6d38e');ctx.restore();}
  ctx.restore();
}
function head(p,t){
  const hy=-148,R=34,hc=p.hairColor||INK;
  if(p.hair==='pony')ell(-38,hy-2,14,24,hc,INK,2.5);
  if(p.hair==='pigtails'){circ(-40,hy+4,14,hc,INK,2.5);circ(40,hy+4,14,hc,INK,2.5);}
  if(p.hair==='bear'){for(const x of [-25,25]){circ(x,hy-26,14,p.skin,INK,3);circ(x,hy-26,7,'#e9b98a');}}
  circ(0,hy,R,p.skin,INK,3);
  if(p.hair==='bear')ell(3,hy+12,16,12,'#e9c39a');
  const cap=(c)=>{ctx.beginPath();ctx.arc(0,hy,R+2,Math.PI*1.03,Math.PI*1.97);ctx.lineTo(R-6,hy-10);ctx.lineTo(-R+6,hy-10);ctx.closePath();paint(c,INK,2.5);};
  if(p.hair==='spiky'){cap(hc);ctx.fillStyle=hc;for(const x of [-22,-6,10,24]){ctx.beginPath();ctx.moveTo(x-11,hy-26);ctx.lineTo(x+2,hy-50);ctx.lineTo(x+11,hy-26);ctx.closePath();paint(hc,INK,2);}cap(hc);}
  if(p.hair==='pony'||p.hair==='pigtails'){cap(hc);if(p.band){ctx.beginPath();ctx.arc(0,hy,R-1,Math.PI*1.12,Math.PI*1.88);ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();}}
  if(p.hair==='cap'){cap(p.capColor);rr(8,hy-24,44,10,5,p.capColor,INK,2.5);circ(0,hy-36,4,'#fff');}
  if(p.hair==='curly'){for(let i=-3;i<=3;i++)circ(i*10,hy-27+Math.abs(i)*4,11,hc);}
  if(p.hair==='helmet'){ctx.beginPath();ctx.arc(0,hy-2,R+5,Math.PI,Math.PI*2);ctx.closePath();paint('#fff',INK,3);ln(-R,hy-12,R,hy-12,p.color,5);}
  // eyes
  const ex=12,ey=hy-2,e=p.eyes||'normal';
  const blink=((t+p.x*.013)%3.3)<.1;
  if(e==='normal'){
    if(blink){ln(-ex-1,ey,-ex+7,ey,INK,3);ln(ex-1,ey,ex+7,ey,INK,3);}
    else{circ(-ex+3,ey,5,INK);circ(ex+3,ey,5,INK);circ(-ex+4.5,ey-1.6,1.6,'#fff');circ(ex+4.5,ey-1.6,1.6,'#fff');}
  }else if(e==='wide'){circ(-ex+2,ey,9.5,'#fff',INK,2.5);circ(ex+4,ey,9.5,'#fff',INK,2.5);circ(-ex+5,ey,4,INK);circ(ex+7,ey,4,INK);}
  else if(e==='happy'){ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(-ex+3,ey+3,6,Math.PI*1.1,Math.PI*1.9);ctx.stroke();ctx.beginPath();ctx.arc(ex+3,ey+3,6,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}
  else if(e==='dizzy'){for(const cx of [-ex+3,ex+3]){ln(cx-5,ey-5,cx+5,ey+5,INK,3);ln(cx+5,ey-5,cx-5,ey+5,INK,3);}}
  else if(e==='sparkle'){for(const cx of [-ex+3,ex+3]){circ(cx,ey,7.5,INK);circ(cx+2.5,ey-3,2.8,'#fff');circ(cx-2,ey+2.5,1.4,'#fff');}}
  if(p.brows==='angry'){ln(-21,ey-15,-6,ey-9,INK,3.5);ln(9,ey-9,24,ey-15,INK,3.5);}
  if(p.brows==='sad'){ln(-21,ey-10,-6,ey-15,INK,3.5);ln(9,ey-15,24,ey-10,INK,3.5);}
  if(p.glasses){circ(-ex+3,ey,10,null,INK,2.5);circ(ex+3,ey,10,null,INK,2.5);ln(-ex+13,ey,ex-7,ey,INK,2.5);}
  if(e!=='dizzy'){circ(-19,hy+11,6,'rgba(255,110,130,.35)');circ(25,hy+11,6,'rgba(255,110,130,.35)');}
  if(p.hair==='bear')ell(3,hy+5,6,4,INK);
  const my=hy+(p.hair==='bear'?19:16);
  if(p.talk){const o=.35+.65*Math.abs(Math.sin(t*15+p.x));ell(3,my,8,2+7*o,'#7a2238',INK,2);}
  else if(p.mouth==='o')ell(3,my+2,6,8,'#7a2238',INK,2);
  else if(p.mouth==='frown'){ctx.beginPath();ctx.arc(3,my+8,9,Math.PI*1.2,Math.PI*1.8);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();}
  else{ctx.beginPath();ctx.arc(3,my-5,10,Math.PI*.2,Math.PI*.8);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();}
  if(p.stars){for(let i=0;i<3;i++){const a=t*6+i*2.09;star(Math.cos(a)*42,hy-42+Math.sin(a)*10,8,'#ffd23f');}}
}

/* ---------- script ---------- */
const LINES=[
  {s:.4,e:3.4,who:['Teddy'],en:'It’s Sunday. Let’s go out!',zh:'今天是星期日。我們一起出去吧！'},
  {s:3.6,e:6.4,who:['Teddy'],en:'Does she have science class on Monday?',zh:'她星期一有自然課嗎？'},
  {s:6.6,e:8.8,who:['Edison'],en:'Yes, she does.',zh:'是的，她有。'},
  {s:9.4,e:12.0,who:['Amber'],en:"It's time to go, Edison.",zh:'該走了，Edison。'},
  {s:12.8,e:16.4,who:['Edison'],en:'Sorry, I’m late.',zh:'抱歉，我遲到了。'},
  {s:17.4,e:20.4,who:['Girl'],en:'Cool drawing! Do you like art?',zh:'好酷的畫！你喜歡美術嗎？'},
  {s:20.6,e:22.4,who:['Edison'],en:'Yes, I do.',zh:'是的，我喜歡。'},
  {s:22.6,e:24.8,who:['Mia'],en:'Wow! Cool!',zh:'哇！真酷！'},
  {s:25.6,e:28.2,who:['Girl'],en:'Oops, sorry! I’m in a hurry.',zh:'喔，抱歉！我在趕時間。'},
  {s:28.4,e:30.2,who:['Rocky'],en:'What’s that?',zh:'那是什麼？'},
  {s:30.4,e:33.6,who:['Girl'],en:'It’s an ice hockey stick.',zh:'這是一支冰上曲棍球棒。'},
  {s:34.2,e:36.4,who:['Mia'],en:'Do you have PE class today?',zh:'你今天有體育課嗎？'},
  {s:36.6,e:37.8,who:['Girl'],en:'Yes, I do.',zh:'對，我有。'},
  {s:38.0,e:40.0,who:['Mia'],en:'Can we go and watch?',zh:'我們可以去看看嗎？'},
  {s:40.2,e:42.2,who:['Girl'],en:'Sure! Follow me.',zh:'當然可以！跟我來。'},
  {s:43.0,e:45.2,who:['Girl'],en:'They’re my teammates.',zh:'他們是我的隊友。'},
  {s:45.4,e:47.8,who:['Abu','Rocky'],en:'Can we try?',zh:'我們可以試試看嗎？'},
  {s:48.0,e:50.6,who:['Rocky'],en:'Look at me!',zh:'看看我！'},
  {s:51.0,e:53.0,who:['Abu'],en:'Watch out!',zh:'小心！'},
];
const NAMECOL={Teddy:'#c27b2c',Edison:'#3d7be0',Amber:'#9b59d0',Girl:'#e8443a',Mia:'#ff4f9e',Rocky:'#2fa65a',Abu:'#d9a400'};
const PITCH={Teddy:190,Edison:300,Amber:440,Girl:380,Mia:540,Rocky:340,Abu:250};
const sp=(n,T)=>LINES.some(l=>T>=l.s&&T<l.e&&l.who.includes(n));
const curLine=T=>LINES.find(l=>T>=l.s&&T<l.e);

/* ---------- backgrounds ---------- */
function house(x,y,w,h,c){
  ctx.beginPath();ctx.moveTo(x-14,y);ctx.lineTo(x+w/2,y-70);ctx.lineTo(x+w+14,y);ctx.closePath();paint('#e5604f',INK,3);
  rr(x,y,w,h,2,c,INK,3);rr(x+18,y+28,42,40,4,'#fff6c9',INK,3);ln(x+39,y+28,x+39,y+68,INK,2);rr(x+w-58,y+h-78,40,78,4,'#8a5a32',INK,3);
}
function bgStreet(T){
  sky('#8fd3ff','#e8f7ff');
  ctx.save();ctx.translate(850,86);ctx.rotate(T*.4);for(let i=0;i<10;i++){ctx.rotate(Math.PI/5);ln(0,54,0,72,'#ffcf3a',7);}ctx.restore();
  circ(850,86,42,'#ffd84a',INK,3);
  cloud((120+T*16)%1100-120,80,1);cloud((620+T*10)%1100-120,140,.75);
  house(40,270,150,170,'#ffb3a7');house(760,280,150,160,'#b7e3a8');
  ctx.fillStyle='#86cf6b';ctx.fillRect(0,440,W,100);ctx.fillStyle='#e3d3b0';ctx.fillRect(0,432,W,18);
}
function beaker(x,y,T){
  ctx.beginPath();ctx.moveTo(x-10,y-34);ctx.lineTo(x-10,y-10);ctx.lineTo(x-30,y+24);ctx.lineTo(x+30,y+24);ctx.lineTo(x+10,y-10);ctx.lineTo(x+10,y-34);ctx.closePath();paint('#e8fbff',INK,3);
  ctx.beginPath();ctx.moveTo(x-20,y+8);ctx.lineTo(x-30,y+24);ctx.lineTo(x+30,y+24);ctx.lineTo(x+20,y+8);ctx.closePath();paint('#3fbf6a');
  for(let i=0;i<3;i++){const k=(T*1.2+i/3)%1;circ(x-6+i*6,y+10-k*52,3+i,'rgba(63,191,106,.8)');}
}

}

}

];
function fire(a,b){
  for(const s of SFX)if(s.t>a&&s.t<=b)s.f();
  const l=curLine(b);
  if(l&&b-lastBlip>.11){lastBlip=b;const base=PITCH[l.who[0]];tone(base*(.85+Math.random()*.45),.07,'square',.025);}
}

/* ---------- playback ---------- */
let T=0,playing=false,last=null;
const $=id=>document.getElementById(id);
const playBtn=$('play'),seek=$('seek'),timeEl=$('time'),cover=$('cover'),snd=$('snd');
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function ui(){playBtn.textContent=playing?'❚❚ 暫停':'▶ 播放';seek.value=T;timeEl.textContent=`${fmt(T)} / 1:00`;}
function start(){
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}
  if(T>=DUR)T=0;playing=true;cover.hidden=true;ui();
}
function toggle(){playing?(playing=false,ui()):start();}
cover.addEventListener('click',start);
playBtn.addEventListener('click',toggle);
$('restart').addEventListener('click',()=>{T=0;start();});
seek.addEventListener('input',()=>{T=+seek.value;cover.hidden=true;timeEl.textContent=`${fmt(T)} / 1:00`;});
snd.addEventListener('click',()=>{soundOn=!soundOn;snd.textContent=soundOn?'♪ 音效：開':'♪ 音效：關';snd.setAttribute('aria-pressed',soundOn);});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle();}});
function frame(now){
  if(playing){const dt=last==null?0:Math.min(.1,(now-last)/1000);const prev=T;T=Math.min(DUR,T+dt);fire(prev,T);if(T>=DUR)playing=false;ui();}
  last=now;render(T);requestAnimationFrame(frame);
}
if(document.fonts){const zh=LINES.map(l=>l.zh).join('')+'星期日自然課完把自己射進球門了！';
  document.fonts.load(`800 30px 'Baloo 2'`);document.fonts.load(`800 22px 'Noto Sans TC'`,zh);}
requestAnimationFrame(frame);
</script>
