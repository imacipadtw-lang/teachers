<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one fixed iPad screen — top bar, then a stage that flexes to fill the rest. Nothing scrolls; long lists page instead. Single bright theme on purpose. */
:root{--bg:#dff3ff;--card:#fff;--ink:#23305a;--mut:#6a7697;--line:#cfe0f0;--coral:#ff6b4a;--blue:#3d7bff;--sun:#ffc531;--grape:#9a6bff;--leaf:#21b673;--okbg:#ddf7ea;--badbg:#ffe3dd;--soil:#8a5a35;

--u:min(1vh,0.75vw);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{color:var(--ink);font-family:var(--b);font-size:clamp(14px,calc(var(--u)*2.2),20px);line-height:1.4;-webkit-user-select:none;user-select:none;touch-action:manipulation;
background-image:radial-gradient(circle at 10% 6%,#fff8 0 60px,transparent 61px),radial-gradient(circle at 92% 3%,#fff8 0 40px,transparent 41px)}
.w{height:100%;max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:calc(var(--u)*1.4) calc(var(--u)*1.8);display:flex;flex-direction:column;gap:calc(var(--u)*1.4)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.4)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
/* top bar */
.hd{display:flex;align-items:center;gap:12px;flex:none;min-height:calc(var(--u)*7)}
.hd .t{flex:1;min-width:0}
.hd h1{font-family:var(--d);font-weight:800;font-size:clamp(20px,calc(var(--u)*4),36px);line-height:1.1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd p{margin:0;color:var(--mut);font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ow{font-size:clamp(30px,calc(var(--u)*6),52px);line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.back,.chip{background:var(--card);border-radius:999px;font-weight:900;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.back{padding:.5em 1em}.chip{padding:.25em .8em;font-size:.9em}
.wallet{display:flex;gap:8px;flex:none}
/* home */
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none}
.gr{background:var(--card);border-radius:16px;padding:calc(var(--u)*1) 6px;font-weight:900;box-shadow:0 4px 0 var(--line);border:3px solid transparent;line-height:1.2}
.gr small{display:block;font-weight:700;font-size:.75em;color:var(--mut)}
.gr[aria-pressed="true"]{border-color:var(--coral);background:#fff3ef}
.pager{flex:1;min-height:0;display:flex;align-items:stretch;gap:10px}
.arr{flex:none;width:clamp(40px,calc(var(--u)*7),64px);border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:1.8em;font-weight:900;color:var(--blue)}
.arr:disabled{opacity:.3;cursor:default}
.lvs{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:calc(var(--u)*1.6)}
.lv{position:relative;text-align:left;background:var(--card);border-radius:22px;padding:calc(var(--u)*1.6);display:flex;flex-direction:column;gap:2px;box-shadow:0 5px 0 var(--line);transition:transform .12s;overflow:hidden;min-height:0}
.lv:hover{transform:translateY(-3px) rotate(-.6deg)}

.lv .z{font-weight:900;font-size:clamp(16px,calc(var(--u)*2.9),28px);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.lv .s{margin-top:auto;font-size:.85em;font-weight:900;color:#e0a100}
.lv .badge{position:absolute;right:10px;top:8px;font-size:1.6em}
.dots{display:flex;justify-content:center;gap:6px;flex:none}.dots i{width:9px;height:9px;border-radius:50%;background:#fff}.dots i.on{background:var(--blue)}

.gm:hover{transform:translateY(-3px)}
.gm .ic{width:calc(var(--u)*10);height:calc(var(--u)*10);min-width:46px;min-height:46px;border-radius:22px;display:grid;place-items:center;font-size:clamp(26px,calc(var(--u)*5.5),52px);background:var(--c)}
.gm b{font-size:clamp(18px,calc(var(--u)*3.2),30px);line-height:1.2}.gm span{font-size:.9em;color:var(--mut);line-height:1.3}
.gm .st{color:#e0a100;font-weight:900;font-size:1.2em}
.gm .rec{position:absolute;right:12px;top:-9px;background:var(--coral);color:#fff;font-size:.75em;font-weight:900;border-radius:999px;padding:1px 10px}
.off{color:#d4dceb}

.ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.ctrl .mid{display:flex;align-items:center;gap:10px}
.spk{width:clamp(56px,calc(var(--u)*10),92px);height:clamp(56px,calc(var(--u)*10),92px);border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 #d34628;flex:none}
.spk:active{transform:translateY(4px);box-shadow:0 1px 0 #d34628}
.spk svg{width:52%;height:52%}.spk.talk{animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.slow{padding:.45em .9em;border-radius:999px;background:var(--card);font-weight:900;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.tbar{height:8px;border-radius:999px;background:#ffffffaa;overflow:hidden;flex:none}
.tbar i{display:block;height:100%;width:100%;background:var(--sun);transform-origin:left}
.hint{background:#fff;border-radius:14px;padding:.4em 1em;text-align:center;font-weight:900;color:var(--mut);flex:none;margin:0}
.hint button{color:var(--blue);font-weight:900}
/* whack */
.yard{flex:1;min-height:0;background:linear-gradient(#9be27f,#6cc456);border-radius:26px;padding:calc(var(--u)*1.6) 14px;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);gap:calc(var(--u)*1.2) 14px}
.hole{position:relative;min-height:0;overflow:hidden}
.hole::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:26%;max-height:40px;border-radius:50%;background:radial-gradient(#3b2414 40%,var(--soil) 72%);z-index:2}
.mole{position:absolute;left:12%;right:12%;bottom:6%;height:86%;max-height:170px;max-width:220px;margin:0 auto;border-radius:46% 46% 18% 18%;background:#a5713f;transform:translateY(115%);transition:transform .22s cubic-bezier(.3,1.6,.6,1);z-index:1;display:flex;flex-direction:column;align-items:center;padding-top:4%}
.mole::before{content:"• ᴥ •";color:#2b1a0e;font-size:.85em;font-weight:900;letter-spacing:2px}
.mole.up{transform:translateY(0)}
.mole .lab{margin-top:3%;background:#fff;border-radius:10px;padding:2px 8px;font-family:var(--d);font-weight:800;font-size:clamp(15px,calc(var(--u)*2.8),26px);line-height:1.1;max-width:100%;text-align:center;overflow-wrap:anywhere}
.mole .lab small{display:block;font-family:var(--b);font-size:.6em;color:var(--mut)}
.mole.hit{background:#ffd34d}.mole.hit::before{content:"✖ ᴥ ✖"}
.mole.no{background:#c9c9c9}.mole.show{background:var(--leaf)}
/* bubbles */
.pond{position:relative;flex:1;min-height:0;border-radius:26px;overflow:hidden;background:linear-gradient(#bfe9ff,#7fc8f5 70%,#5bb2ea)}
.bub{position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;align-content:center;text-align:center;padding:8px;font-family:var(--d);font-weight:800;line-height:1.05;color:var(--ink);background:radial-gradient(circle at 30% 28%,#fff 0 9%,#ffffffcc 10%,var(--h) 60%,#ffffff55 100%);border:2px solid #ffffffcc;box-shadow:inset -6px -8px 14px #ffffff66;will-change:transform}
.bub small{display:block;font-family:var(--b);font-size:.6em;font-weight:700}
.bub.pop{animation:pop .3s forwards}.bub.bad{animation:shake .35s}

/* memory */
.mem{flex:1;min-height:0;display:grid;gap:calc(var(--u)*1.4);grid-template-columns:repeat(4,1fr)}
.mem.n12{grid-template-rows:repeat(3,1fr)}.mem.n8{grid-template-rows:repeat(2,1fr)}
@media (orientation:landscape){.mem.n12{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr)}}
.cd{min-height:0;border-radius:18px;perspective:700px}
.cd .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.cd.f .in{transform:rotateY(180deg)}
.cd .fa{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.cd .bk{background:repeating-linear-gradient(45deg,var(--grape) 0 12px,#8a59f5 12px 24px);color:#fff;font-family:var(--d);font-weight:800;font-size:clamp(28px,calc(var(--u)*6),56px);box-shadow:0 4px 0 #6b3fd6}
.cd .fr{transform:rotateY(180deg);background:#fff;box-shadow:0 4px 0 var(--line);font-family:var(--d);font-weight:800;font-size:clamp(16px,calc(var(--u)*3),30px);line-height:1.1;overflow-wrap:anywhere}
.cd .fr small{font-family:var(--b);font-size:.6em;color:var(--mut)}
.cd .fr svg{width:45%;height:auto;max-height:55%;color:var(--coral)}
.cd.m .fr{background:var(--okbg);box-shadow:0 4px 0 var(--leaf)}
/* rocket */
.sky{position:relative;height:clamp(40px,calc(var(--u)*7),64px);flex:none;border-radius:999px;background:linear-gradient(90deg,#1f2a66,#4b3aa8);overflow:hidden}
.sky::before{content:"✦ · ✧ · ✦ · ✧ · ✦ · ✧ · ✦ · ✧";position:absolute;inset:0;color:#fff7;letter-spacing:12px;display:flex;align-items:center;padding-left:20px;white-space:nowrap}
.sky .pl{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1.9em}
.sky .rk{position:absolute;top:50%;font-size:1.9em;transform:translate(-50%,-50%) rotate(45deg);transition:left .6s cubic-bezier(.3,1.5,.6,1)}
.combo{color:var(--coral)}
.opts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:calc(var(--u)*1.6)}
.opts.one{grid-template-columns:1fr}
.op{background:#fff;border:3px solid var(--line);border-radius:20px;padding:6px 12px;font-size:clamp(18px,calc(var(--u)*3.6),34px);font-weight:900;box-shadow:0 4px 0 var(--line);overflow-wrap:anywhere;min-height:0}
.op.en{font-family:var(--d);font-size:clamp(20px,calc(var(--u)*4.4),42px)}
.opts.one .op{font-size:clamp(16px,calc(var(--u)*2.8),28px);text-align:left;padding-inline:20px}
.op.ok{border-color:var(--leaf);background:var(--okbg);color:#138556}.op.x{border-color:var(--coral);background:var(--badbg);color:#c23d22;animation:shake .35s}
/* builder & spelling */
.board{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*3)}
.line{min-height:calc(var(--u)*10);background:#fff;border-radius:20px;border:3px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}

.flash{flex:1;min-height:0;display:flex;align-items:stretch;gap:12px}
.fc{flex:1;min-width:0;background:#fff;border-radius:28px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*2) 20px;text-align:center}
.fc .no{font-family:var(--d);font-weight:800;color:var(--coral);font-size:1.1em}
.fc .wd{font-family:var(--d);font-weight:800;font-size:clamp(36px,calc(var(--u)*11),110px);line-height:1;overflow-wrap:anywhere;display:flex;align-items:center;gap:.25em}

.fc .se svg{width:.8em;height:.8em;color:var(--coral);flex:none}

.fc.now{box-shadow:0 0 0 5px var(--sun),0 6px 0 var(--line)}
.bar2{display:flex;justify-content:center;gap:12px;flex:none;flex-wrap:wrap}
.btn{padding:.55em 1.3em;border-radius:999px;background:var(--blue);color:#fff;font-weight:900;box-shadow:0 4px 0 #2554c4;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2554c4}
.btn.c{background:var(--coral);box-shadow:0 4px 0 #d34628}.btn.g{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}

.res{flex:1;min-height:0;background:#fff;border-radius:30px;padding:calc(var(--u)*2) 16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.8);box-shadow:0 6px 0 var(--line)}
.res .big{font-size:clamp(40px,calc(var(--u)*10),90px);letter-spacing:6px;line-height:1;color:#ffb400}
.res h2{font-family:var(--d);font-size:clamp(22px,calc(var(--u)*4.4),40px);margin:0;line-height:1.15}
.res p{margin:0}
.res .stk{font-size:clamp(40px,calc(var(--u)*9),80px);line-height:1;animation:bob 1.6s infinite}
.book{flex:1;min-height:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(4,1fr);gap:calc(var(--u)*1.2)}
@media (orientation:portrait){.book{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr)}.games{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr)}.lvs{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr)}}
.book div{min-height:0;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:clamp(24px,calc(var(--u)*6),54px);box-shadow:0 3px 0 var(--line)}
.book .lk{font-size:1.2em;color:#c3cde0;background:#ffffff88}
/* settings sheet */
.sheet{position:fixed;inset:0;background:#23305a66;display:grid;place-items:center;z-index:7;padding:16px}
.sheet .box{background:#fff;border-radius:24px;padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 #0002}
.sheet h2{margin:0;font-family:var(--d)}
.sheet select{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.note{font-size:.85em;color:var(--mut);margin:0}

.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--d);font-weight:800;font-size:clamp(34px,calc(var(--u)*8),70px);color:#fff;-webkit-text-stroke:2px var(--ink);pointer-events:none;animation:up .9s forwards;z-index:8;white-space:nowrap}

.warn{background:var(--badbg);border-radius:14px;padding:6px 14px;font-weight:900;flex:none}
@media (max-width:620px){.wallet .chip:first-child{display:none}.hd p{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* LEARN: one big flashcard at a time */
function learn(){const L=S.L;S.k=S.k||0;const it=L.items[S.k];
app.innerHTML=hdr('先聽先學',`第 ${L.n} 關・${S.k+1} / ${L.items.length}`,'lv')+`<div class="flash"><button class="arr" data-a="fk" data-d="-1" ${S.k==0?'disabled':''} aria-label="上一個">‹</button>
<div class="fc${S.playing?' now':''}"><span class="no">No. ${it[0]}</span><button class="wd" data-a="say" data-t="${esc(it[1])}">${SPK}${esc(it[1])}</button><span class="zh">${esc(it[2])}</span><button class="se" data-a="say" data-t="${esc(it[3])}">${SPK}${esc(it[3])}</button><span class="sz">${esc(it[4])}</span></div>
<button class="arr" data-a="fk" data-d="1" ${S.k>=L.items.length-1?'disabled':''} aria-label="下一個">›</button></div>
<div class="bar2"><button class="btn c" data-a="all">${S.playing?'■ 停止自動播放':'▶ 自動播放整關'}</button></div>`}
function playAll(){if(!S.playing||S.g!=='learn')return;const L=S.L;if(S.k>=L.items.length){S.playing=false;S.k=L.items.length-1;learn();return}learn();const it=L.items[S.k];
say(it[1],{end:()=>T(()=>{if(S.playing)say(it[3],{end:()=>T(()=>{if(!S.playing)return;S.k++;playAll()},900)})},600)})}
/* WHACK-A-WORD */
function mole(){const L=S.L,d=D(),land=innerWidth>innerHeight,holes=P.grade==1?6:(land?8:9),cols=P.grade==1?3:(land?4:3);S.q=pick(L.items,d.rounds);S.i=0;S.sc=0;
app.innerHTML=hdr('打地鼠',`第 ${L.n} 關・聽到哪個字就敲哪隻！`,'lv')+ctrl('','🔨 0')+`<div class="tbar"><i id="tb"></i></div><div class="yard" style="--cols:${cols};--rows:${Math.ceil(holes/cols)}">${Array.from({length:holes},(_,i)=>`<div class="hole"><button class="mole" id="m${i}" data-a="whack" tabindex="-1"></button></div>`).join('')}</div>`;moleRound()}
function moleRound(){const d=D(),L=S.L;if(S.i>=S.q.length)return finish(S.sc>=S.q.length*.9?3:S.sc>=S.q.length*.7?2:S.sc>=S.q.length*.4?1:0,`敲中 ${S.sc} / ${S.q.length} 隻地鼠`);
const t=S.q[S.i];S.t=t;S.first=true;S.busy=false;S.aud=t[1];$('#cl').textContent=`第 ${S.i+1} / ${S.q.length} 隻`;
$$('.mole').forEach(m=>{m.className='mole';m.innerHTML='';m.dataset.k='';m.tabIndex=-1});
const all=shuf([t,...others(t,d.n-1,x=>x[1],L.items)]),hs=pick([...Array($$('.mole').length).keys()],all.length);
say(t[1],{el:$('#spk')});T(()=>{all.forEach((it,j)=>{const m=$('#m'+hs[j]);m.innerHTML=`<span class="lab">${lab(it)}</span>`;m.dataset.k=it[0];m.classList.add('up');m.tabIndex=0});
const tb=$('#tb');tb.style.transition='none';tb.style.transform='scaleX(1)';void tb.offsetWidth;tb.style.transition=`transform ${d.mole}ms linear`;tb.style.transform='scaleX(0)';
S.to=T(()=>{if(S.busy)return;S.busy=true;sfx.no();$$('.mole.up').forEach(m=>{if(m.dataset.k==t[0])m.classList.add('show');else m.classList.remove('up')});say(t[1]);T(()=>{S.i++;moleRound()},1600)},d.mole+600)},350)}
function whack(m){if(S.busy||!m.classList.contains('up'))return;if(m.dataset.k==S.t[0]){S.busy=true;clearTimeout(S.to);sfx.bonk();sfx.ok();m.classList.add('hit');if(S.first){S.sc++;toast(['Nice!','Great!','Bonk!','Yes!'][Math.random()*4|0])}$('#cr').textContent='🔨 '+S.sc;T(()=>{$$('.mole').forEach(x=>x.classList.remove('up'));T(()=>{S.i++;moleRound()},300)},650)}else{S.first=false;sfx.no();m.classList.add('no');T(()=>m.classList.remove('up'),300)}}
/* BUBBLE POP */
function bubble(){const L=S.L;S.sc=0;S.goal=Math.min(10,L.items.length);S.hp=3;S.B=[];
app.innerHTML=hdr('戳泡泡',`第 ${L.n} 關・戳破你聽到的字！`,'lv')+ctrl(`🫧 0 / ${S.goal}`,'❤️❤️❤️')+`<div class="pond" id="pond"></div>`;
newTarget();const ph=$('#pond').clientHeight;spawnB(ph*.4);spawnB(ph*.75);S.last=performance.now();let lt=performance.now();const loop=now=>{const dt=Math.min(50,now-lt);lt=now;stepB(dt,now);RAF=requestAnimationFrame(loop)};RAF=requestAnimationFrame(loop)}
function newTarget(){const L=S.L;let t;do{t=L.items[Math.random()*L.items.length|0]}while(S.t&&t===S.t&&L.items.length>1);S.t=t;S.aud=t[1];say(t[1],{el:$('#spk')})}
function spawnB(y0){const pond=$('#pond');if(!pond)return;const W=pond.clientWidth,H=pond.clientHeight,L=S.L,hasT=S.B.some(b=>b.it===S.t&&!b.dead);
let it=(!hasT&&Math.random()<.65)?S.t:L.items[Math.random()*L.items.length|0];if(it!==S.t&&it[1]===S.t[1])it=S.t;
const sz=Math.max(100,Math.min(170,W/5.5,H/3.2)),el=document.createElement('button');el.className='bub';el.dataset.a='popb';el.innerHTML=lab(it);
const len=it[1].length,fs=sz/(len>14?8.5:len>9?6.5:4.8);el.style.cssText=`--s:${sz}px;--h:${['#ffd1e8','#d6f5c9','#fff0a8','#d8d1ff','#c9f1ff','#ffd9c2'][Math.random()*6|0]};font-size:${fs}px`;
let x=Math.random()*(W-sz);for(let k=0;k<8;k++){if(S.B.every(b=>b.dead||Math.abs(b.x-x)>sz*.9||b.y<H-sz*1.6))break;x=Math.random()*(W-sz)}
const b={el,it,x,y:y0!=null?y0:H+10,sp:(.06+Math.random()*.035)*D().sp*(H/480),ph:Math.random()*6,dead:false};el._b=b;pond.appendChild(el);S.B.push(b)}
function stepB(dt,now){if(now-S.last>(1150/D().sp)){S.last=now;spawnB()}S.B.forEach(b=>{if(b.dead)return;b.y-=b.sp*dt;const tr=`translate(${b.x+Math.sin(now/600+b.ph)*8}px,${b.y}px)`;b.el.style.setProperty('--tr',tr);b.el.style.transform=tr;if(b.y<-200){b.dead=true;b.el.remove()}});S.B=S.B.filter(b=>!b.dead||b.el.isConnected)}
function popB(el){const b=el._b;if(!b||b.dead||S.hp<=0||S.sc>=S.goal)return;if(b.it===S.t||b.it[1]===S.t[1]){b.dead=true;sfx.pop();sfx.ok();el.classList.add('pop');T(()=>el.remove(),300);S.sc++;$('#cl').textContent=`🫧 ${S.sc} / ${S.goal}`;if(S.sc%3===0)toast('Super!');
if(S.sc>=S.goal)return T(()=>finish(S.hp===3?3:S.hp===2?2:1,`戳破 ${S.sc} 個泡泡，剩下 ${S.hp} 顆愛心`),400);T(newTarget,350)}
else{sfx.no();el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');S.hp--;$('#cr').textContent='❤️'.repeat(Math.max(0,S.hp))+'🤍'.repeat(3-Math.max(0,S.hp));if(S.hp<=0)T(()=>finish(S.sc>=S.goal*.7?1:0,`戳破 ${S.sc} 個泡泡，愛心用完了`),400)}}
/* SOUND MATCH */
function memory(){const L=S.L,d=D(),ps=pick(L.items,Math.min(d.pairs,L.items.length));S.C=shuf(ps.flatMap(it=>[{k:'s',it},{k:'w',it}]));S.open=[];S.mv=0;S.mt=0;S.np=ps.length;S.lock=false;S.aud=null;
app.innerHTML=hdr('聲音翻翻樂',`第 ${L.n} 關・喇叭牌會念單字，找到對應的單字牌！`,'lv')+`<div class="ctrl"><span class="chip" id="mv">翻牌 0 次</span><span class="chip" id="mt">配對 0 / ${S.np}</span></div><div class="mem n${S.C.length}">${S.C.map((c,i)=>`<button class="cd" data-a="flip" data-i="${i}" aria-label="第${i+1}張牌"><span class="in"><span class="fa bk">?</span><span class="fa fr">${c.k==='s'?SPK+'<small>聽聽看</small>':lab(c.it)}</span></span></button>`).join('')}</div>`}
function flip(i){if(S.lock)return;const c=S.C[i],el=$$('.cd')[i];if(c.done||S.open.includes(i))return;el.classList.add('f');if(c.k==='s')say(c.it[1]);else tone([520],'sine',.06,.08);S.open.push(i);
if(S.open.length===2){S.mv++;$('#mv').textContent=`翻牌 ${S.mv} 次`;const[a,b]=S.open.map(j=>S.C[j]);
if(a.it===b.it&&a.k!==b.k){a.done=b.done=true;S.mt++;S.open.forEach(j=>$$('.cd')[j].classList.add('m'));S.open=[];$('#mt').textContent=`配對 ${S.mt} / ${S.np}`;T(()=>{sfx.ok();say(a.it[1]);toast('Match!')},500);
if(S.mt===S.np)T(()=>finish(S.mv<=S.np+3?3:S.mv<=S.np*2+1?2:1,`翻了 ${S.mv} 次就全部配對成功`),1600)}
else{S.lock=true;T(()=>{sfx.no();S.open.forEach(j=>$$('.cd')[j].classList.remove('f'));S.open=[];S.lock=false},1300)}}}
/* ROCKET QUIZ */
function rocket(){const L=S.L,g=P.grade||2;S.mode=g==1?'m':g==2?'w':'s';S.q=pick(L.items,Math.min(10,L.items.length));S.i=0;S.sc=0;S.cb=0;rocketQ()}
function rocketQ(){const L=S.L,d=D(),m=S.mode,key=m==='w'?x=>x[1]:m==='m'?x=>x[2]:x=>x[4];if(S.i>=S.q.length){const r=S.sc/S.q.length;return finish(r>=.9?3:r>=.7?2:r>=.4?1:0,`答對 ${S.sc} / ${S.q.length} 題，火箭飛了 ${S.sc*10} 萬公里！`)}
const t=S.q[S.i];S.t=t;S.aud=m==='s'?t[3]:t[1];S.busy=false;const op=shuf([t,...others(t,d.n-1,key,L.items)]);S.op=op;S.key=key;
const prm=m==='s'?'這句英文是什麼意思？':m==='m'?'這個字是什麼意思？':'是哪一個英文字？';
app.innerHTML=hdr('火箭衝衝衝',`第 ${L.n} 關・${prm}`,'lv')+`<div class="sky"><span class="pl">🪐</span><span class="rk" style="left:${8+S.sc/S.q.length*78}%">🚀</span></div>`+ctrl(`第 ${S.i+1} / ${S.q.length} 題`,S.cb>=2?`<span class="combo">🔥 連對 ${S.cb}</span>`:`答對 ${S.sc}`)+`<div class="opts${m==='s'?' one':''}">${op.map((o,j)=>`<button class="op${m==='w'?' en':''}" data-a="ans" data-j="${j}">${esc(key(o))}</button>`).join('')}</div>`;
say(S.aud,{el:$('#spk')})}
function ans(j,el){if(S.busy)return;S.busy=true;const ok=S.op[j]===S.t||S.key(S.op[j])===S.key(S.t);$$('.op').forEach((b,k)=>{if(S.op[k]===S.t)b.classList.add('ok')});
if(ok){S.sc++;S.cb++;sfx.ok();toast(S.cb>=3?S.cb+' Combo!':'Correct!');const r=$('.rk');if(r)r.style.left=(8+S.sc/S.q.length*78)+'%';T(()=>{S.i++;rocketQ()},1100)}
else{S.cb=0;sfx.no();el.classList.add('x');say(S.mode==='s'?S.t[3]:S.t[1]);T(()=>{S.i++;rocketQ()},2400)}}
/* SENTENCE BUILDER */
function build(){const L=S.L;const pool=L.items.filter(it=>{const n=it[3].split(' ').length;return n>=3&&n<=9});S.q=pick(pool.length?pool:L.items,Math.min(6,pool.length||L.items.length));S.i=0;S.err=0;buildQ()}
function buildQ(){const L=S.L;if(S.i>=S.q.length)return finish(S.err<=2?3:S.err<=6?2:1,`排好 ${S.q.length} 個句子，只錯了 ${S.err} 次`);
const t=S.q[S.i];S.aud=t[3];S.tok=t[3].split(' ');S.pos=0;S.busy=false;const tiles=shuf(S.tok.map(w=>w));
app.innerHTML=hdr('句子排排站',`第 ${L.n} 關・聽句子，把單字照順序排好`,'lv')+ctrl(`第 ${S.i+1} / ${S.q.length} 句`,`錯 ${S.err} 次`)+`<p class="hint">${(P.grade||2)<3?'提示：'+esc(t[4]):'<button data-a="hint">👀 看中文提示</button>'}</p><div class="board"><div class="line" id="ln"></div><div class="tiles">${tiles.map(w=>`<button class="tl" data-a="tile" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>`;say(t[3],{el:$('#spk')})}
function tile(el){if(S.busy||el.disabled)return;const w=el.dataset.w;if(w===S.tok[S.pos]){S.pos++;el.disabled=true;tone([500+S.pos*60],'triangle',.08,.1);const s=document.createElement('span');s.className='tl p';s.textContent=w;$('#ln').appendChild(s);
if(S.pos===S.tok.length){S.busy=true;$('#ln').classList.add('done');sfx.ok();toast('Perfect!');say(S.aud);T(()=>{S.i++;buildQ()},2200)}}
else{S.err++;$('#cr').textContent=`錯 ${S.err} 次`;sfx.no();el.classList.remove('x');void el.offsetWidth;el.classList.add('x')}}
/* SPELLING BEE */
function spell(){const L=S.L;let pool=L.items.filter(it=>/^[A-Za-z]{3,10}$/.test(it[1]));if(pool.length<3)pool=L.items.filter(it=>/^[A-Za-z' -]{2,14}$/.test(it[1]));S.q=pick(pool,Math.min(6,pool.length));S.i=0;S.err=0;
if(!S.q.length){app.innerHTML=hdr('拼字小蜜蜂','這一關都是句子，換玩別的遊戲吧！','lv');return}spellQ()}
function spellQ(){const L=S.L,d=D();if(S.i>=S.q.length)return finish(S.err<=2?3:S.err<=6?2:1,`拼好 ${S.q.length} 個單字，只錯了 ${S.err} 次`);
const t=S.q[S.i];S.aud=t[1];S.w=t[1];S.pos=0;S.busy=false;while(S.pos<S.w.length&&!/[A-Za-z]/.test(S.w[S.pos]))S.pos++;
let ls=[...S.w].filter(ch=>/[A-Za-z]/.test(ch)).map(c=>c.toLowerCase());if(d.first){ls.shift();S.pos++}const ab='abcdefghijklmnopqrstuvwxyz';for(let k=0;k<d.decoy;k++)ls.push(ab[Math.random()*26|0]);
app.innerHTML=hdr('拼字小蜜蜂',`第 ${L.n} 關・聽單字，一個一個拼出來`,'lv')+ctrl(`第 ${S.i+1} / ${S.q.length} 個`,`錯 ${S.err} 次`)+`<p class="hint">意思：${esc(t[2])}</p><div class="board"><div class="line" id="ln">${[...S.w].map((ch,k)=>/[A-Za-z]/.test(ch)?`<span class="slot" id="s${k}">${d.first&&k===0?esc(ch):''}</span>`:`<span class="slot gap">${esc(ch.trim())}</span>`).join('')}</div><div class="tiles">${shuf(ls).map(c=>`<button class="tl" data-a="ltr" data-c="${c}">${c}</button>`).join('')}</div></div>`;say(t[1],{el:$('#spk')})}
function ltr(el){if(S.busy||el.disabled)return;const need=S.w[S.pos];if(el.dataset.c===need.toLowerCase()){el.disabled=true;$('#s'+S.pos).textContent=need;tone([600+S.pos*50],'triangle',.07,.1);S.pos++;while(S.pos<S.w.length&&!/[A-Za-z]/.test(S.w[S.pos]))S.pos++;
if(S.pos>=S.w.length){S.busy=true;$('#ln').classList.add('done');sfx.ok();toast('Buzz! 🐝');say(S.w);T(()=>{S.i++;spellQ()},1900)}}
else{S.err++;$('#cr').textContent=`錯 ${S.err} 次`;sfx.no();el.classList.remove('x');void el.offsetWidth;el.classList.add('x')}}
/* router */
const RUN={learn,mole,bubble,memory,rocket,build,spell};
function go(g){stop();const L=S.L;S={L,g};RUN[g]()}
app.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-a="popb"],[data-a="whack"]');if(!b)return;e.preventDefault();b.dataset.a==='popb'?popB(b):whack(b)});
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a==='home')home();else if(a==='book')book();else if(a==='set')settings();
else if(a==='grade'){P.grade=+b.dataset.g;save();home();sfx.ok()}
else if(a==='hp'){HP+=+b.dataset.d;home()}
else if(a==='lv')level(b.dataset.n||S.L.n);else if(a==='go')go(b.dataset.g);
else if(a==='rep'){if(S.aud)say(S.aud,{el:b})}else if(a==='slow'){if(S.aud)say(S.aud,{slow:1,el:$('#spk')})}
else if(a==='say')say(b.dataset.t,{el:b});
else if(a==='fk'){S.playing=false;stop();S.k=Math.max(0,Math.min(S.L.items.length-1,S.k+ +b.dataset.d));learn();const it=S.L.items[S.k];say(it[1])}
else if(a==='all'){if(S.playing){S.playing=false;stop();learn()}else{S.playing=true;playAll()}}
else if(a==='flip')flip(+b.dataset.i);else if(a==='ans')ans(+b.dataset.j,b);
else if(a==='tile')tile(b);else if(a==='ltr')ltr(b);
else if(a==='hint'){b.parentNode.textContent='提示：'+S.q[S.i][4]}
else if((a==='popb'||a==='whack')&&e.detail===0){a==='popb'?popB(b):whack(b)}});
home();
</script>

</body></html>
