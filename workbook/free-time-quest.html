<title>Free Time Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen arcade cabinet. Sticky HUD on top, a single "stage" card in the middle, big thumb-sized buttons. Neon arcade × ink-splat world, single dark theme by choice. */
:root{
  --bg:#0f0b2a;          /* deep arcade navy */
  --bg2:#1b1448;         /* raised panel */
  --ink:#07051a;         /* outline black */
  --fg:#fff8f0;          /* warm white text */
  --muted:#b9b0e6;       /* lavender grey */
  --pink:#ff3fa4;        /* ink splat magenta */
  --cyan:#2ef2ff;        /* electric cyan */
  --lime:#c6ff3d;        /* acid lime */
  --gold:#ffcb3d;        /* star gold */
  --red:#ff4d4d;         /* damage */
  --display:'Press Start 2P',monospace;
  --en:'Fredoka','Noto Sans TC',sans-serif;
  --zh:'Noto Sans TC','Fredoka',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--zh);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 24px;
  overflow-x:hidden;position:relative;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,63,164,.28), transparent 32%),
    radial-gradient(circle at 88% 12%, rgba(46,242,255,.22), transparent 30%),
    radial-gradient(circle at 70% 90%, rgba(198,255,61,.18), transparent 34%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
.hud{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 12px;margin-top:8px;border-radius:16px;
  background:var(--bg2);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)
}
.hud .brand{font-family:var(--display);font-size:11px;color:var(--lime);text-shadow:2px 2px 0 var(--ink);letter-spacing:.5px;text-decoration:none}
.hud .stats{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:10px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--ink);border:2px solid var(--muted)}
.pill.gold{color:var(--gold);border-color:var(--gold)}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--ink);border:2px solid var(--muted);font-size:18px;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--cyan)}
.view{display:flex;flex-direction:column;gap:14px;animation:slidein .35s cubic-bezier(.2,.9,.3,1.2)}
.stage{
  background:var(--bg2);border:3px solid var(--ink);border-radius:22px;
  box-shadow:0 8px 0 var(--ink),0 0 0 6px rgba(255,255,255,.05);
  padding:18px;min-width:0
}
.eyebrow{font-family:var(--display);font-size:10px;color:var(--cyan);letter-spacing:1px;text-transform:uppercase;margin:0 0 6px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-size:clamp(20px,5vw,34px);line-height:1.35;color:var(--fg);text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--ink)}
h1 span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
h2{font-family:var(--en);font-weight:700;font-size:clamp(20px,4.5vw,28px)}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px;line-height:1.6}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:16px;font-family:var(--en);font-weight:700;font-size:18px;
  background:var(--pink);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;min-width:0
}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.cyan{background:var(--cyan)} .btn.lime{background:var(--lime)} .btn.gold{background:var(--gold)} .btn.ghost{background:var(--bg2);color:var(--fg)}
.btn.small{padding:10px 14px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.nav .btn{flex:1 1 0;padding-inline:8px;white-space:nowrap}
.grid-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mode{
  text-align:left;padding:16px;border-radius:18px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);
  color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative;overflow:hidden;
  transition:transform .12s
}
.mode:hover{transform:translateY(-3px) rotate(-1deg)}
.mode .big{font-size:40px;line-height:1;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}
.mode .name{font-family:var(--en);font-weight:700;font-size:20px}
.mode .zh{font-weight:900;font-size:15px;opacity:.85}
.mode .stars{margin-top:auto;font-size:16px;letter-spacing:2px}
.mode.m1{background:var(--cyan)} .mode.m2{background:var(--lime)} .mode.m3{background:var(--pink)} .mode.m4{background:var(--gold)}
.avatars{display:flex;gap:8px;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:14px;background:var(--ink);border:3px solid var(--muted);font-size:28px;display:grid;place-items:center;transition:transform .12s}
.avatar:hover{transform:scale(1.1) rotate(-6deg)}
.avatar.on{border-color:var(--lime);box-shadow:0 0 0 4px rgba(198,255,61,.3);animation:pop .3s}
.wordcloud{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--en);font-weight:600;font-size:14px;padding:6px 10px;border-radius:999px;background:var(--ink);border:2px solid var(--cyan);color:var(--cyan);animation:bob 2.4s ease-in-out infinite}
.chip:nth-child(2n){border-color:var(--pink);color:var(--pink);animation-delay:-.6s}
.chip:nth-child(3n){border-color:var(--lime);color:var(--lime);animation-delay:-1.2s}
/* progress bars */
.bar{height:16px;border-radius:999px;background:var(--ink);border:2px solid var(--muted);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));transition:width .35s cubic-bezier(.2,.9,.3,1.2)}
.bar.hp > i{background:linear-gradient(90deg,var(--red),var(--pink))}
.bar.time > i{background:var(--gold);transition:width .1s linear}
/* learn */
.flashwrap{perspective:1200px}
.flash{position:relative;width:100%;aspect-ratio:4/3;max-height:380px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.4,1);cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.face.front{background:linear-gradient(160deg,var(--cyan),#7cf7ff);color:var(--ink)}
.face.back{background:linear-gradient(160deg,var(--pink),#ff8ad0);color:var(--ink);transform:rotateY(180deg)}
.face .emoji{font-size:clamp(64px,18vw,110px);line-height:1;animation:bob 2s ease-in-out infinite}
.face .en{font-family:var(--en);font-weight:700;font-size:clamp(26px,7vw,44px);line-height:1.1}
.face .zh{font-weight:900;font-size:clamp(24px,6vw,38px)}
.face .hint{font-family:var(--display);font-size:9px;opacity:.7;margin-top:6px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--muted)}
.dots i.on{background:var(--lime);border-color:var(--lime)}
.dots i.done{background:var(--cyan);border-color:var(--cyan)}
/* match */
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:620px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:3/4;perspective:800px;min-width:0}
.mcard > div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
.mcard.open > div,.mcard.done > div{transform:rotateY(180deg)}
.mcard .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:6px;text-align:center;overflow:hidden}
.mcard .f.b{background:repeating-linear-gradient(45deg,var(--bg2) 0 8px,#241b5e 8px 16px);font-size:28px}
.mcard .f.t{transform:rotateY(180deg);background:var(--fg);color:var(--ink);font-weight:700;font-size:clamp(12px,2.6vw,17px);line-height:1.2;overflow-wrap:anywhere}
.mcard .f.t.en{font-family:var(--en)} .mcard .f.t.zh{font-family:var(--zh);font-weight:900;background:#fff1a8}
.mcard.done .f.t{background:var(--lime);animation:pop .4s}
.mcard.bad > div{animation:shake .4s}
.mcard.done{pointer-events:none}
/* quiz / boss */
.arena{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
@media (max-width:520px){.arena{grid-template-columns:1fr}}
.boss{font-size:clamp(72px,20vw,120px);line-height:1;text-align:center;animation:wobble 2.2s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35))}
.boss.hit{animation:hit .45s}
.boss.ko{animation:ko .9s forwards}
.hearts{font-size:22px;letter-spacing:3px}
.prompt{font-size:clamp(30px,8vw,52px);font-weight:900;text-align:center;padding:14px;border-radius:18px;background:var(--ink);border:3px dashed var(--muted);min-height:92px;display:grid;place-items:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.choices{grid-template-columns:1fr}}
.choice{padding:16px 10px;border-radius:16px;background:var(--fg);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-family:var(--en);font-weight:700;font-size:clamp(17px,4.2vw,22px);transition:transform .08s;min-width:0;overflow-wrap:anywhere}
.choice:hover{transform:translateY(-2px)}
.choice.ok{background:var(--lime);animation:pop .35s}
.choice.no{background:var(--red);color:var(--fg);animation:shake .4s}
.choice[disabled]{cursor:default}
.combo{position:absolute;right:14px;top:-18px;font-family:var(--display);font-size:clamp(14px,4vw,22px);color:var(--gold);text-shadow:3px 3px 0 var(--ink);transform:rotate(8deg);animation:pop .4s}
.stage.rel{position:relative}
.shake{animation:screen .4s}
.flash-red{animation:flashred .4s}
/* spell */
.word{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot{width:clamp(34px,9vw,52px);height:clamp(46px,12vw,66px);border-radius:12px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:clamp(22px,6vw,34px);background:var(--fg);color:var(--ink)}
.slot.gap{background:var(--ink);color:var(--lime);border-color:var(--lime);border-style:dashed}
.slot.gap.filled{border-style:solid;animation:pop .3s}
.slot.space{border:0;box-shadow:none;background:transparent;width:clamp(10px,3vw,18px)}
.word.ok .slot{background:var(--lime);border-color:var(--ink);color:var(--ink);animation:pop .4s}
.word.bad .slot.gap{background:var(--red);color:var(--fg);animation:shake .4s}
.keys{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.key{width:clamp(48px,13vw,64px);height:clamp(48px,13vw,64px);border-radius:50%;background:var(--cyan);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-family:var(--en);font-weight:700;font-size:clamp(22px,6vw,30px);transition:transform .08s}
.key:hover{transform:translateY(-3px) rotate(-4deg)}
.key.used{opacity:.25;transform:scale(.8);pointer-events:none}
/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .bigstars{font-size:clamp(44px,14vw,80px);letter-spacing:4px}
.result .bigstars span{display:inline-block;animation:starin .5s cubic-bezier(.3,1.6,.4,1) both}
.result .bigstars span:nth-child(2){animation-delay:.2s} .result .bigstars span:nth-child(3){animation-delay:.4s}
.result .bigstars span.off{opacity:.25;filter:grayscale(1)}
.result .score{font-family:var(--display);font-size:clamp(14px,4vw,22px);color:var(--lime);text-shadow:3px 3px 0 var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--fg);border:3px solid var(--lime);border-radius:14px;padding:10px 16px;font-weight:700;z-index:20;animation:slidein .3s;max-width:calc(100vw - 32px)}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
.footnote{color:var(--muted);font-size:13px;text-align:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes screen{0%,100%{transform:translate(0,0)}25%{transform:translate(-6px,4px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-4px,-4px)}}
@keyframes flashred{0%{box-shadow:inset 0 0 0 100vmax rgba(255,77,77,.0)}30%{box-shadow:inset 0 0 0 100vmax rgba(255,77,77,.35)}100%{box-shadow:none}}
@keyframes wobble{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-8px)}}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(.8) rotate(-12deg);filter:brightness(3)}100%{transform:scale(1)}}
@keyframes ko{to{transform:translateY(80px) rotate(540deg) scale(.1);opacity:0}}
@keyframes slidein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes starin{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* v2 additions: listening everywhere, sound hunt, gacha prize */
.mode.m5{background:#b388ff}
.mcard .f.t.snd{background:var(--cyan);font-size:34px}
.mcard.done .f.t.snd{font-size:clamp(12px,2.6vw,17px);font-family:var(--en);background:var(--lime)}
.ear{width:clamp(90px,24vw,130px);height:clamp(90px,24vw,130px);border-radius:50%;background:var(--gold);border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);font-size:clamp(40px,10vw,60px);display:grid;place-items:center;margin:0 auto;animation:pulse 1.6s ease-in-out infinite;transition:transform .1s}
.ear:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.ear.playing{animation:pulse .45s ease-in-out infinite;background:var(--lime)}
.earwrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:18px;background:var(--ink);border:3px dashed var(--muted)}
.earwrap .lbl{font-family:var(--display);font-size:10px;color:var(--cyan);letter-spacing:1px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{aspect-ratio:1;border-radius:18px;background:radial-gradient(circle at 50% 40%,#f3f0ff,#cfc6ff);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:clamp(40px,11vw,64px);display:grid;place-items:center;position:relative;transition:transform .1s;min-width:0}
.tile:hover{transform:translateY(-3px) rotate(-2deg)}
.tile.ok{background:var(--lime);animation:pop .4s}
.tile.no{background:var(--red);animation:shake .4s}
.tile.show{background:var(--gold)}
.tile .lbl{position:absolute;bottom:6px;left:4px;right:4px;font-family:var(--en);font-weight:700;font-size:clamp(10px,2.6vw,13px);color:var(--ink);line-height:1.1}
.badge{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:15px}
.prize{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.prize h2{font-family:var(--display);font-size:clamp(16px,4.5vw,26px);color:var(--gold);text-shadow:3px 3px 0 var(--ink);line-height:1.5}
.capsule{width:150px;height:150px;position:relative;margin:28px auto 0}
.cap-top,.cap-bot{position:absolute;left:0;right:0;height:75px;border:4px solid var(--ink);box-shadow:inset -10px -6px 0 rgba(0,0,0,.12)}
.cap-top{top:0;border-radius:75px 75px 0 0;background:var(--pink);transform-origin:left bottom;animation:capopen .9s .7s cubic-bezier(.3,1.4,.4,1) forwards;z-index:2}
.cap-bot{bottom:0;border-radius:0 0 75px 75px;background:var(--fg)}
.cap-toy{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(0);font-size:64px;animation:toypop .6s 1.3s cubic-bezier(.3,1.6,.4,1) forwards;z-index:1}
.capsule.shake{animation:wiggle .7s ease-in-out}
.prize .msg{font-size:clamp(18px,5vw,24px);font-weight:900;line-height:1.5;color:var(--fg)}
.prize .msg b{color:var(--lime)}
.prize .ticket{font-family:var(--display);font-size:10px;color:var(--muted);letter-spacing:1px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes capopen{to{transform:translate(-62px,-48px) rotate(-55deg)}}
@keyframes toypop{to{transform:translate(-50%,-85%) scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
</style>
<canvas class="fx" id="fx"></canvas>
<div class="app" id="app">
  <header class="hud">
    <a class="brand" href="#home">FREE TIME QUEST</a>
    <div class="stats">
      <span class="pill gold" id="hudStars">⭐ 0</span>
      <span class="pill" id="hudAvatar">🐱</span>
      <button class="iconbtn" id="muteBtn" aria-label="音效開關" title="音效開關">🔊</button>
    </div>
  </header>
  <main id="screen" class="view"></main>
  <p class="footnote">單字來源：六年級英語「休閒活動」單元 · 點喇叭可以聽發音</p>
</div>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
// ------------------------------------------------------------ data
const WORDS=[
  {en:'go jogging',zh:'慢跑',ico:'🏃'},
  {en:'listen to music',zh:'聽音樂',ico:'🎧'},
  {en:'play baseball',zh:'打棒球',ico:'⚾'},
  {en:'play basketball',zh:'打籃球',ico:'🏀'},
  {en:'ride a bike',zh:'騎腳踏車',ico:'🚴'},
  {en:'study English',zh:'研讀英語',ico:'📚'},
  {en:'surf the Internet',zh:'上網',ico:'💻'},
  {en:'watch TV',zh:'看電視',ico:'📺'},
  {en:'free time',zh:'休閒時間',ico:'🛋️'}

const SAVE_KEY='ftq-save-v2';
let save={avatar:'🐱',muted:false,stars:{},prize:null};
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object')save={...save,...s,stars:{...(s.stars||{})}};}catch(e){}}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
function totalStars(){return MODES.reduce((a,m)=>a+(save.stars[m.id]||0),0);}
function allCleared(){return MODES.every(m=>(save.stars[m.id]||0)>=1);}
function setStars(mode,n){if(n>(save.stars[mode]||0)){save.stars[mode]=n;persist();}renderHud();}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starsTxt=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);

// ------------------------------------------------------------ sound effects (synth, no files)
let actx=null;
function beep(type){
  if(save.muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const seq={click:[[520,.06,'square']],ok:[[660,.08,'square'],[880,.08,'square'],[1320,.14,'square']],
      bad:[[200,.12,'sawtooth'],[140,.2,'sawtooth']],flip:[[420,.05,'triangle'],[640,.05,'triangle']],
      win:[[523,.1,'square'],[659,.1,'square'],[784,.1,'square'],[1047,.3,'square']],hit:[[90,.18,'sawtooth']],
      fanfare:[[523,.12,'square'],[523,.12,'square'],[784,.12,'square'],[1047,.2,'square'],[784,.12,'square'],[1047,.4,'square']]}[type]||[];
    let t=actx.currentTime;
    seq.forEach(([f,d,w])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.9;});
  }catch(e){}
}
// ------------------------------------------------------------ pronunciation: ElevenLabs clip first, browser TTS fallback
let voices=[],player=null,onSpeak=null;
function pickVoice(){try{voices=speechSynthesis.getVoices();}catch(e){voices=[];}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function ttsSay(text){
  if(!('speechSynthesis' in window)){toast('這個瀏覽器不支援發音');return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;
    const v=voices.find(v=>/^en[-_]US/i.test(v.lang)&&/female|samantha|zira|jenny|aria|google us/i.test(v.name))||voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
    if(v)u.voice=v;u.onend=()=>onSpeak&&onSpeak(false);speechSynthesis.speak(u);onSpeak&&onSpeak(true);}catch(e){}
}
function stopSay(){try{speechSynthesis.cancel();}catch(e){}if(player){try{player.pause();}catch(e){}}onSpeak&&onSpeak(false);}
function say(text){
  stopSay();
  const src=AUDIO[text];
  if(src){try{player=player||new Audio();player.onended=()=>onSpeak&&onSpeak(false);player.src=src;player.currentTime=0;
    const p=player.play();onSpeak&&onSpeak(true);if(p&&p.catch)p.catch(()=>ttsSay(text));return;}catch(e){}}
  ttsSay(text);
}
// a big tappable speaker; shows "playing" state
function earHTML(id,label){return `<div class="earwrap"><button class="ear" id="${id}" aria-label="播放發音">🔊</button><span class="lbl">${label||'TAP TO LISTEN · 點我聽'}</span></div>`;}
function bindEar(id,text){const b=$('#'+id);if(!b)return;onSpeak=on=>{const e=$('#'+id);if(e)e.classList.toggle('playing',!!on);};b.onclick=()=>{beep('click');say(text);};}
// ------------------------------------------------------------ confetti
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRun=false;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',sizeFx);sizeFx();
function confetti(x,y,n=40,big=false){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#ff3fa4','#2ef2ff','#c6ff3d','#ffcb3d','#fff8f0'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(big?6:4)+Math.random()*(big?9:6);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,g:.25,life:60+Math.random()*30,c:cols[i%cols.length],r:Math.random()*Math.PI,w:6+Math.random()*6});}
  if(!fxRun){fxRun=true;requestAnimationFrame(tickFx);}
}
function tickFx(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.98;p.life--;p.r+=.2;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.globalAlpha=Math.min(1,p.life/20);fctx.fillStyle=p.c;fctx.fillRect(-p.w/2,-p.w/2,p.w,p.w*.6);fctx.restore();});
  if(parts.length)requestAnimationFrame(tickFx);else{fxRun=false;}
}
function burstAt(el,n,big){if(!el)return;const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,n,big);}

const screen=$('#screen');
let cleanup=null;
function go(id){if(location.hash==='#'+id)route();else location.hash=id;}
function route(){
  const id=(location.hash||'#home').slice(1);

  stopSay();onSpeak=null;
  screen.className='view';
  const fn={home:renderHome,learn:renderLearn,hunt:renderHunt,match:renderMatch,quiz:renderQuiz,spell:renderSpell}[id]||renderHome;
  screen.innerHTML='';fn();window.scrollTo({top:0});
}

    <p class="eyebrow">${stars===3?'PERFECT!':stars===2?'GREAT!':stars===1?'NICE TRY':'KEEP GOING'}</p>
    <div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}">⭐</span>`).join('')}</div>
    <div class="score">${esc(scoreLine)}</div>
    <p class="sub">${stars>best?'新紀錄！🎉':best?'最佳成績 '+starsTxt(best):''}</p>
    <div class="row">
      ${justCleared?'<button class="btn gold" id="prizeBtn">🎁 領取破關獎勵</button>':''}
      <button class="btn lime" id="againBtn">🔁 再玩一次</button>

// ------------------------------------------------------------ LEARN · word cards (hear first, then flip)
function renderLearn(){
  let i=0,flipped=false;const seen=new Set();
  screen.innerHTML=`
  <section class="stage">
    <div class="row between"><p class="eyebrow" style="margin:0">🃏 Word Cards · 單字卡</p><span class="pill" id="lcount">1 / ${WORDS.length}</span></div>
    <p class="sub">每張卡會先唸給你聽。跟著唸一次，再點卡片翻面看中文。9 張全部看完就能拿星星！</p>
    <div class="flashwrap" style="margin-top:12px"><div class="flash" id="flash" role="button" tabindex="0" aria-label="單字卡，點擊翻面"></div></div>
    <div class="dots" id="dots" style="margin-top:12px"></div>
    <div class="row between nav" style="margin-top:14px">
      <button class="btn ghost small" id="prevBtn">◀ 上一張</button>
      <button class="btn cyan small" id="sayBtn">🔊 再聽一次</button>
      <button class="btn lime small" id="nextBtn">下一張 ▶</button>
    </div>
  </section>`;
  const flash=$('#flash'),dots=$('#dots');
  function draw(){
    const w=WORDS[i];seen.add(i);
    flash.classList.remove('flipped');flipped=false;
    flash.innerHTML=`<div class="face front"><div class="emoji">${w.ico}</div><div class="en">${esc(w.en)}</div><div class="hint">👂 LISTEN · TAP TO FLIP</div></div>
      <div class="face back"><div class="emoji">${w.ico}</div><div class="zh">${esc(w.zh)}</div><div class="en" style="font-size:clamp(18px,4.5vw,26px);opacity:.8">${esc(w.en)}</div></div>`;
    $('#lcount').textContent=`${i+1} / ${WORDS.length}`;
    dots.innerHTML=WORDS.map((_,k)=>`<i class="${k===i?'on':seen.has(k)?'done':''}"></i>`).join('');
    $('#prevBtn').disabled=i===0;
    $('#nextBtn').textContent=i===WORDS.length-1?'完成 ✅':'下一張 ▶';
    say(w.en);
  }
  flash.onclick=()=>{flipped=!flipped;flash.classList.toggle('flipped',flipped);beep('flip');if(flipped)say(WORDS[i].en);};
  flash.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flash.click();}};
  $('#sayBtn').onclick=()=>{beep('click');say(WORDS[i].en);};
  $('#prevBtn').onclick=()=>{if(i>0){i--;beep('click');draw();}};
  $('#nextBtn').onclick=()=>{beep('click');if(i<WORDS.length-1){i++;draw();}else{showResult('learn',3,'9 / 9 WORDS LEARNED',()=>renderLearn());}};
  let sx=null;flash.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
  flash.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50){dx<0?$('#nextBtn').click():$('#prevBtn').click();}});
  draw();
}
// ------------------------------------------------------------ HUNT · hear it, tap the picture
function renderHunt(){
  const TOTAL=12,TL=7000;
  const order=shuffle([...WORDS.map((_,k)=>k),...shuffle(WORDS.map((_,k)=>k)).slice(0,TOTAL-WORDS.length)]);
  const tiles=shuffle(WORDS.map((_,k)=>k));
  let q=0,correct=0,streak=0,best=0,timer=null,tleft=0,locked=false;
  screen.innerHTML=`
  <section class="stage rel" id="huntStage">
    <div class="row between"><p class="eyebrow" style="margin:0">👂 Sound Hunt · 聽音找圖</p><span class="pill" id="hq">1 / ${TOTAL}</span></div>
    <p class="sub">聽到英文後，點出正確的圖片！答對 ≥11 題 ⭐⭐⭐、≥8 題 ⭐⭐。</p>
    <div class="bar time" style="margin:10px 0"><i id="htbar" style="width:100%"></i></div>
    ${earHTML('huntEar')}
    <div class="hgrid" id="hgrid" style="margin-top:14px">${tiles.map(k=>`<button class="tile" data-k="${k}" aria-label="圖片 ${WORDS[k].zh}">${WORDS[k].ico}<span class="lbl" hidden>${esc(WORDS[k].en)}</span></button>`).join('')}</div>
    <div class="row between" style="margin-top:12px"><span class="pill" id="hscore">✅ 0</span><span class="pill gold" id="hstreak">🔥 0</span></div>
  </section>`;
  cleanup=()=>clearInterval(timer);
  function ask(){
    if(q>=TOTAL)return finish();
    locked=false;const w=WORDS[order[q]];
    $('#hq').textContent=`${q+1} / ${TOTAL}`;
    screen.querySelectorAll('.tile').forEach(t=>{t.classList.remove('ok','no','show');t.querySelector('.lbl').hidden=true;t.disabled=false;});
    bindEar('huntEar',w.en);say(w.en);
    tleft=TL;$('#htbar').style.width='100%';clearInterval(timer);
    timer=setInterval(()=>{tleft-=100;$('#htbar').style.width=Math.max(0,tleft/TL*100)+'%';if(tleft<=0){clearInterval(timer);miss(null,w);}},100);
  }
  $('#hgrid').onclick=e=>{const t=e.target.closest('.tile');if(!t||locked)return;clearInterval(timer);const w=WORDS[order[q]];(+t.dataset.k===order[q])?hit(t,w):miss(t,w);};
  function reveal(w){const t=screen.querySelector(`.tile[data-k="${WORDS.indexOf(w)}"]`);if(t){t.classList.add('show');t.querySelector('.lbl').hidden=false;}}
  function hit(t,w){locked=true;correct++;streak++;best=Math.max(best,streak);t.classList.add('ok');t.querySelector('.lbl').hidden=false;beep('ok');burstAt(t,streak>=3?50:24,streak>=3);
    $('#hscore').textContent='✅ '+correct;$('#hstreak').textContent='🔥 '+streak;
    if(streak>=3){const c=document.createElement('div');c.className='combo';c.textContent=`STREAK x${streak}!`;$('#huntStage').appendChild(c);setTimeout(()=>c.remove(),900);}
    q++;setTimeout(ask,900);}
  function miss(t,w){locked=true;streak=0;$('#hstreak').textContent='🔥 0';beep('bad');if(t)t.classList.add('no');reveal(w);
    const st=$('#huntStage');st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake');say(w.en);q++;setTimeout(ask,1400);}
  function finish(){clearInterval(timer);const stars=correct>=11?3:correct>=8?2:correct>=5?1:0;showResult('hunt',stars,`${correct} / ${TOTAL} · BEST STREAK x${best}`,()=>renderHunt());}
  ask();
}

function renderMatch(){
  const cards=shuffle(WORDS.flatMap((w,k)=>[{k,t:'snd'},{k,t:'zh'}]));
  let open=[],lock=false,moves=0,found=0,secs=0;
  screen.innerHTML=`
  <section class="stage">
    <div class="row between"><p class="eyebrow" style="margin:0">🧩 Sound Match · 聲音配對</p>
      <div class="row"><span class="pill" id="mmoves">👆 0</span><span class="pill" id="mtime">⏱ 0s</span></div></div>
    <p class="sub">🔊 聲音牌翻開會唸英文，把它和正確的中文圖卡配成對。配對成功才會露出英文字！（≤14 步 ⭐⭐⭐、≤20 步 ⭐⭐）</p>
    <div class="bar" style="margin:10px 0"><i id="mprog" style="width:0%"></i></div>
    <div class="mgrid" id="mgrid">${cards.map((c,idx)=>`<button class="mcard" data-i="${idx}" aria-label="卡片 ${idx+1}"><div><div class="f b">${save.avatar}</div><div class="f t ${c.t}">${c.t==='snd'?'🔊':esc(WORDS[c.k].ico+' '+WORDS[c.k].zh)}</div></div></button>`).join('')}</div>
  </section>`;
  const timer=setInterval(()=>{secs++;$('#mtime').textContent='⏱ '+secs+'s';},1000);
  cleanup=()=>clearInterval(timer);
  $('#mgrid').onclick=e=>{
    const el=e.target.closest('.mcard');if(!el||lock||el.classList.contains('open')||el.classList.contains('done'))return;
    const c=cards[+el.dataset.i];
    el.classList.add('open');beep('flip');open.push(el);
    if(c.t==='snd')say(WORDS[c.k].en);
    if(open.length===2){
      lock=true;moves++;$('#mmoves').textContent='👆 '+moves;
      const [a,b]=open.map(x=>cards[+x.dataset.i]);
      if(a.k===b.k&&a.t!==b.t){
        setTimeout(()=>{open.forEach(x=>{x.classList.remove('open');x.classList.add('done');const s=x.querySelector('.f.t.snd');if(s)s.textContent=WORDS[a.k].en;});beep('ok');burstAt(open[1],24);
          found++;$('#mprog').style.width=(found/WORDS.length*100)+'%';open=[];lock=false;
          if(found===WORDS.length){clearInterval(timer);const stars=moves<=14?3:moves<=20?2:1;setTimeout(()=>showResult('match',stars,`${moves} MOVES · ${secs}s`,()=>renderMatch()),700);}
        },700);
      }else{
        setTimeout(()=>{open.forEach(x=>x.classList.add('bad'));beep('bad');},600);
        setTimeout(()=>{open.forEach(x=>x.classList.remove('open','bad'));open=[];lock=false;},1300);
      }
    }
  };
}

    tleft=TL;$('#tbar').style.width='100%';clearInterval(timer);
    timer=setInterval(()=>{tleft-=100;$('#tbar').style.width=Math.max(0,tleft/TL*100)+'%';if(tleft<=0){clearInterval(timer);miss(null,w);}},100);
    $('#choices').onclick=e=>{const b=e.target.closest('.choice');if(!b||locked)return;clearInterval(timer);(+b.dataset.i===order[q])?hitBoss(b,w):miss(b,w);};
  }
  function hitBoss(b,w){
    locked=true;b.classList.add('ok');beep('ok');combo++;maxCombo=Math.max(maxCombo,combo);hp--;
    $('#hpBar').style.width=(hp/WORDS.length*100)+'%';$('#hpTxt').textContent=`${hp} / ${WORDS.length}`;
    boss.classList.remove('hit');void boss.offsetWidth;boss.classList.add('hit');burstAt(boss,combo>=3?60:25,combo>=3);
    if(combo>=2){const c=document.createElement('div');c.className='combo';c.textContent=`COMBO x${combo}!`;$('#arenaStage').appendChild(c);setTimeout(()=>c.remove(),900);}
    $('#choices').querySelectorAll('.choice').forEach(x=>x.disabled=true);
    q++;setTimeout(()=>{if(hp<=0){boss.classList.add('ko');beep('win');setTimeout(finish,900);}else ask();},900);
  }
  function miss(b,w){
    locked=true;combo=0;hearts--;setHearts();beep('bad');
    if(b)b.classList.add('no');
    $('#choices').querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(+x.dataset.i===order[q])x.classList.add('ok');});
    const st=$('#arenaStage');st.classList.remove('shake','flash-red');void st.offsetWidth;st.classList.add('shake','flash-red');beep('hit');
    say(w.en);q++;setTimeout(ask,1500);
  }
  function finish(){
    clearInterval(timer);
    const win=hp<=0;const stars=win?hearts:0;
    showResult('quiz',stars,win?`BOSS DOWN · MAX COMBO x${maxCombo}`:`BOSS HP ${hp} LEFT · TRY AGAIN`,()=>renderQuiz());
  }
  setHearts();ask();
}
// ------------------------------------------------------------ SPELL · hear it, fix the missing letters
function renderSpell(){
  const order=shuffle(WORDS.map((_,k)=>k));
  let q=0,mistakes=0,gaps=[],fill=[],busy=false;
  screen.innerHTML=`
  <section class="stage">
    <div class="row between"><p class="eyebrow" style="margin:0">🔤 Spell Fix · 聽音拼字</p><span class="pill" id="sq">1 / ${WORDS.length}</span></div>
    <p class="sub">先聽英文，單字掉了幾個字母！點下面的字母泡泡把它補回去。錯誤越少，星星越多。</p>
    <div class="bar" style="margin:10px 0"><i id="sprog" style="width:0%"></i></div>
    <div class="row" style="justify-content:center;gap:14px;margin-bottom:14px;flex-wrap:nowrap">${earHTML('spellEar','LISTEN · 聽')}<div class="prompt" id="sprompt" style="flex:1;min-height:0;align-self:stretch;font-size:clamp(22px,6vw,32px)"></div></div>
    <div class="word" id="word"></div>
    <div class="keys" id="keys" style="margin-top:18px"></div>
    <div class="row between" style="margin-top:14px"><span class="pill" id="smiss">❌ 0</span><span class="pill">💡 點錯的字母可以收回</span></div>
  </section>`;
  function build(){
    if(q>=order.length)return finish();
    busy=false;const w=WORDS[order[q]];const chars=w.en.split('');
    const letterIdx=chars.map((c,i)=>/[a-z]/i.test(c)?i:-1).filter(i=>i>=0);
    const nGap=letterIdx.length<=8?2:3;gaps=shuffle(letterIdx).slice(0,nGap).sort((a,b)=>a-b);fill=gaps.map(()=>null);
    const need=gaps.map(i=>chars[i].toLowerCase());
    const pool='abcdefghijklmnoprstuvwy'.split('').filter(c=>!need.includes(c));
    const keys=shuffle([...need,...shuffle(pool).slice(0,3)]);
    $('#sq').textContent=`${q+1} / ${order.length}`;$('#sprog').style.width=(q/order.length*100)+'%';
    $('#sprompt').innerHTML=`<span>${w.ico} ${esc(w.zh)}</span>`;
    $('#keys').innerHTML=keys.map((k,i)=>`<button class="key" data-k="${k}" data-i="${i}">${k}</button>`).join('');
    bindEar('spellEar',w.en);say(w.en);
    drawWord(chars);
  }
  function drawWord(chars){
    const wd=$('#word');wd.className='word';
    wd.innerHTML=chars.map((c,i)=>{if(c===' ')return '<span class="slot space"></span>';const g=gaps.indexOf(i);
      if(g<0)return `<span class="slot">${esc(c)}</span>`;const f=fill[g];
      return `<button class="slot gap ${f?'filled':''}" data-g="${g}" aria-label="第 ${g+1} 個空格">${f?esc(/[A-Z]/.test(c)?f.toUpperCase():f):'_'}</button>`;}).join('');
  }
  $('#keys').onclick=e=>{const k=e.target.closest('.key');if(!k||busy)return;const slot=fill.indexOf(null);if(slot<0)return;
    fill[slot]=k.dataset.k;k.classList.add('used');k.dataset.slot=slot;beep('click');drawWord(WORDS[order[q]].en.split(''));if(!fill.includes(null))check();};
  $('#word').onclick=e=>{const s=e.target.closest('.slot.gap.filled');if(!s||busy)return;const g=+s.dataset.g;fill[g]=null;
    const key=[...$('#keys').children].find(x=>x.dataset.slot==g&&x.classList.contains('used'));if(key){key.classList.remove('used');delete key.dataset.slot;}
    beep('flip');drawWord(WORDS[order[q]].en.split(''));};
  function check(){
    busy=true;const w=WORDS[order[q]];const ok=gaps.every((i,g)=>w.en[i].toLowerCase()===fill[g]);
    const wd=$('#word');
    if(ok){wd.classList.add('ok');beep('ok');say(w.en);burstAt(wd,40);q++;setTimeout(build,1100);}
    else{wd.classList.add('bad');beep('bad');mistakes++;$('#smiss').textContent='❌ '+mistakes;say(w.en);
      setTimeout(()=>{fill=gaps.map(()=>null);$('#keys').querySelectorAll('.key').forEach(k=>{k.classList.remove('used');delete k.dataset.slot;});busy=false;drawWord(w.en.split(''));},800);}
  }
  function finish(){const stars=mistakes<=1?3:mistakes<=4?2:1;showResult('spell',stars,`${WORDS.length} WORDS · ${mistakes} MISTAKES`,()=>renderSpell());}
  build();
}
// ------------------------------------------------------------ boot
function start(){
  load();renderHud();
  $('#muteBtn').onclick=()=>{save.muted=!save.muted;persist();renderHud();if(!save.muted)beep('click');toast(save.muted?'音效：關（發音仍會播放）':'音效：開');};
  route();
}
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(start):start();
</script>
