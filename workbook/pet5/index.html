<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麻糬英語">
<meta name="theme-color" content="#22324a">
<meta name="description" content="五年級英語課文 寵物養成闖關：聽英文、選圖卡、排句子、選回應，讓寵物麻糬長大。">
<title>麻糬養成闖關 Pet Pal English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&display=swap">
<style>
:root{
  --ink:#22324a;--ink2:#5a6b82;--mint:#2fb39a;--mint-d:#17806a;--mint2:#dcf7ef;
  --coral:#ff7a5c;--coral-d:#c94a31;--coral2:#ffe7df;--cream:#fff8ec;--purple:#7b68ee;--purple-d:#4f3fc0;--purple2:#ece9ff;
  --sun:#ffc83d;--neon:#36f0d0;--line:#dfe6ea;--ok:#20a582;--bad:#e2563c;
  --en:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --zh:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --vh:100vh;--card:180px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(15px,calc(1.1vmin + 9px),21px)}
html,body{margin:0;height:100%;width:100%;max-width:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--zh);color:var(--ink);background:#e9e4ff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
.en{font-family:var(--en);letter-spacing:.01em}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{position:fixed;left:0;top:0;width:100%;max-width:100%;overflow:hidden;height:var(--vh);display:grid;grid-template-rows:auto minmax(0,1fr);
  background:radial-gradient(90% 70% at 0% 0%,#c8f5e8 0%,rgba(200,245,232,0) 60%),radial-gradient(80% 70% at 100% 100%,#ffe0d4 0%,rgba(255,224,212,0) 60%),linear-gradient(160deg,#e3f7f1 0%,#ebe6ff 55%,#fff0ea 100%)}

/* ---------- top bar ---------- */
#top{min-width:0;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.tb{min-width:48px;min-height:48px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(34,50,74,.16);display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-weight:700;font-size:.92rem;color:var(--ink)}
.tb:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(34,50,74,.16)}
.tb svg{width:24px;height:24px;flex:none}
.tb.off{opacity:.55}
#mission{flex:1 1 0;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.75);border-radius:16px;padding:5px 12px;min-height:48px;justify-content:center}
#missionTitle{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dots{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
#dots i{display:block;height:8px;flex:1;max-width:28px;border-radius:5px;background:#d5dde4}
#dots i.cur{background:var(--sun)}#dots i.ok{background:var(--mint)}#dots i.again{background:var(--coral)}
#energy{flex:none;display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#2b3a5c,#1f2a44);color:#fff;border-radius:16px;padding:0 14px 0 8px;min-height:48px;font-family:var(--en);font-weight:700;font-size:1.15rem;box-shadow:0 4px 0 #111a2e,0 0 0 2px rgba(54,240,208,.35) inset}
#energy svg{width:30px;height:30px}
#energy.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.tblabel{font-size:.8rem}

/* ---------- main ---------- */
#main{display:grid;grid-template-columns:minmax(0,43fr) minmax(0,57fr);gap:12px;padding:4px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));min-height:0}
#stage{position:relative;border-radius:28px;overflow:hidden;min-height:0;background:#ffeedd;box-shadow:0 10px 26px rgba(70,70,140,.18),0 0 0 4px #fff inset}
#room{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
#petWrap{position:absolute;left:50%;bottom:3%;height:57%;aspect-ratio:240/270;transform:translateX(-50%);transition:left .45s ease,height .45s ease;z-index:3}
#petWrap.withNpc{left:68%;height:50%}
#petWrap svg{width:100%;height:100%;overflow:visible;display:block}
#npcWrap{position:absolute;left:27%;bottom:3%;height:50%;aspect-ratio:200/270;transform:translateX(-50%);z-index:2;transition:opacity .3s}
#npcWrap svg{width:100%;height:100%;display:block;overflow:visible}
#npcName{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);background:#22324a;color:#fff;border-radius:10px;padding:2px 10px;font-family:var(--en);font-weight:600;font-size:.85rem;white-space:nowrap}
#petTag{position:absolute;left:12px;top:12px;z-index:5;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.88);border-radius:14px;padding:6px 10px;font-weight:700;font-size:.85rem;box-shadow:0 3px 0 rgba(34,50,74,.12)}
#petTag b{color:var(--purple-d)}
#growBar{width:70px;height:8px;border-radius:5px;background:#e3e8ee;overflow:hidden}
#growBar i{display:block;height:100%;background:linear-gradient(90deg,#36f0d0,#7b68ee);width:0;transition:width .6s}
#bubble{position:absolute;top:13%;z-index:6;width:max-content;max-width:86%;display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:8px 14px 8px 8px;box-shadow:0 6px 0 rgba(34,50,74,.14),0 0 0 3px #22324a inset}
#bubble::after{content:"";position:absolute;bottom:-12px;left:var(--tail,50%);width:22px;height:22px;background:#fff;transform:translateX(-50%) rotate(45deg);border-right:3px solid #22324a;border-bottom:3px solid #22324a;border-radius:0 0 6px 0}
#bubble .say{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(180deg,#5fe0bf,#25a88c);color:#fff;box-shadow:0 4px 0 #17806a;display:flex;align-items:center;justify-content:center;flex:none}
#bubble .say svg{width:30px;height:30px}
#bubble .say.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 #17806a,0 0 0 8px rgba(54,240,208,.35)}}
#subText{font-family:var(--en);font-size:1.12rem;font-weight:600;line-height:1.25;max-width:100%}
#subText.hide{display:none}
#bubble .who{font-size:.75rem;color:var(--ink2);font-family:var(--en)}
#fly{position:fixed;z-index:60;pointer-events:none;width:90px;height:90px;transition:transform .7s cubic-bezier(.3,.7,.3,1),opacity .7s}
.badge{position:absolute;z-index:7;width:22%;aspect-ratio:1;pointer-events:none;animation:pop 1.4s forwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}20%{transform:scale(1.1);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(.6) translateY(-30px);opacity:0}}
.spark{position:absolute;z-index:8;pointer-events:none;font-size:1.6rem;animation:spark 1s forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

/* pet animation */
.pet .pgrow{transition:transform 1.1s cubic-bezier(.34,1.56,.5,1)}
.pet .pbody{animation:bob 2.6s ease-in-out infinite;transform-origin:120px 250px;transform-box:view-box}
@keyframes bob{50%{transform:translateY(-4px) scaleY(1.015)}}
.pet .peye{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.pet.jump .pbody{animation:jump .8s ease-out 2}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.08,.9)}45%{transform:translateY(-38px) scale(.95,1.06)}75%{transform:translateY(0) scale(1.06,.93)}100%{transform:translateY(0) scale(1)}}
.pet .parm-r{transform-origin:156px 194px;transform-box:view-box}
.pet.wave .parm-r{animation:wave .45s ease-in-out 4 alternate}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-55deg)}}
.pet.eat .pmouth{animation:chomp .28s 5 alternate;transform-origin:120px 152px;transform-box:view-box}
@keyframes chomp{to{transform:scaleY(.3)}}
.pet.tilt .pbody{animation:tilt 1s ease-in-out}
@keyframes tilt{30%{transform:rotate(-7deg)}70%{transform:rotate(5deg)}}
.pet .sparkles path{animation:tw 1.6s ease-in-out infinite alternate}
.pet .sparkles path:nth-child(2){animation-delay:.5s}.pet .sparkles path:nth-child(3){animation-delay:1s}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.npc .mo{display:none}.npc.talk .mo{display:block;animation:talk .22s infinite alternate}.npc.talk .mc{display:none}
@keyframes talk{to{transform:scaleY(.4)}}
.npc .mo{transform-origin:100px 150px;transform-box:view-box}
.npc.happy .nbody{animation:jump .8s ease-out 1;transform-origin:100px 255px;transform-box:view-box}

/* ---------- panel ---------- */
#panel{min-height:0;background:#fffdf8;border-radius:28px;box-shadow:0 10px 26px rgba(70,70,140,.16),0 0 0 4px #fff inset;padding:14px 16px;display:flex;flex-direction:column;overflow:hidden}
.pv{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:10px;height:100%;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:10px;min-height:44px}
.chip-type{display:inline-flex;align-items:center;gap:6px;border-radius:14px;padding:6px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.t-pic{background:var(--mint2);color:#11735f}.t-dlg{background:#e3efff;color:#24539a}.t-build{background:var(--purple2);color:var(--purple-d)}.t-reply{background:var(--coral2);color:#b2432c}.t-situ{background:#fff3cf;color:#8a6300}.t-review{background:#22324a;color:#fff}
.ph .ins{font-size:1rem;font-weight:700;line-height:1.3}
.pbody{min-height:0;min-width:0;position:relative;overflow:hidden}
.pf{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:56px}
.pf .sp{flex:1}
.btn{min-height:52px;min-width:52px;border:0;border-radius:18px;background:#fff;box-shadow:0 5px 0 rgba(34,50,74,.18),0 0 0 2px #e6ecf0 inset;padding:0 18px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(34,50,74,.18),0 0 0 2px #e6ecf0 inset}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:26px;height:26px;flex:none}
.btn.primary{background:linear-gradient(180deg,#ff9f84,#ff6d4c);color:#fff;box-shadow:0 5px 0 var(--coral-d)}
.btn.mint{background:linear-gradient(180deg,#62e2c2,#23a78b);color:#fff;box-shadow:0 5px 0 var(--mint-d)}
.btn.purple{background:linear-gradient(180deg,#9b8bff,#6a56e8);color:#fff;box-shadow:0 5px 0 var(--purple-d)}
.btn.dark{background:linear-gradient(180deg,#3a4a6e,#22324a);color:#fff;box-shadow:0 5px 0 #111a2e}
.btn{text-decoration:none}
.btn.big{min-height:64px;font-size:1.15rem;border-radius:22px;padding:0 24px}
.btn.primary:active:not(:disabled),.btn.mint:active:not(:disabled),.btn.purple:active:not(:disabled),.btn.dark:active:not(:disabled){box-shadow:0 2px 0 rgba(0,0,0,.25)}

/* picture cards */
.cards{display:flex;gap:14px;justify-content:center;align-items:center;height:100%}
.cards.two{flex-wrap:wrap;align-content:center}
.card{width:var(--card);height:var(--card);flex:none;border:0;border-radius:26px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 25%,#ffffff 0%,#f4f7fb 60%,#e3ebf2 100%);box-shadow:0 6px 0 rgba(34,50,74,.16),0 0 0 3px #e3eaef inset;padding:0;position:relative;transition:transform .15s}
.card svg{width:calc(var(--card)*.88);height:calc(var(--card)*.88);display:block;flex:none}
.card:active:not(:disabled){transform:translateY(3px) scale(.98)}
.card.no{animation:shake .4s;opacity:.4;filter:grayscale(.8)}
.card.yes{box-shadow:0 6px 0 var(--mint-d),0 0 0 5px var(--mint) inset}
.card.glow{box-shadow:0 6px 0 var(--mint-d),0 0 0 5px var(--sun) inset;animation:glow 1s infinite}
.card .mark,.opt .mark{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.mark.m-ok{background:var(--ok)}.mark.m-no{background:var(--bad)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes glow{50%{transform:scale(1.03)}}

/* option rows */
.opts{display:flex;flex-direction:column;gap:12px;justify-content:center;height:100%}
.orow{display:flex;gap:10px;align-items:stretch;min-width:0}
.orow.gone{display:none}
.opt{min-width:0;overflow-wrap:anywhere}
.opt{flex:1;min-height:60px;border:0;border-radius:20px;background:#fff;box-shadow:0 5px 0 rgba(34,50,74,.16),0 0 0 3px #e3eaef inset;text-align:left;padding:10px 54px 10px 18px;font-family:var(--en);font-weight:600;font-size:1.25rem;line-height:1.25;position:relative;color:var(--ink)}
.opt:active:not(:disabled){transform:translateY(3px)}
.opt.no{animation:shake .4s;opacity:.4;text-decoration:line-through}
.opt.yes{box-shadow:0 5px 0 var(--mint-d),0 0 0 4px var(--mint) inset;background:#effcf7}
.opt.glow{box-shadow:0 5px 0 var(--mint-d),0 0 0 4px var(--sun) inset;animation:glow 1s infinite}
.lis{width:56px;min-height:56px;border:0;border-radius:18px;background:var(--mint2);color:#11735f;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(17,115,95,.25);flex:none}
.lis svg{width:26px;height:26px}
.lis:active{transform:translateY(2px)}
.dlgq{background:#e9f2ff;border-radius:18px;padding:8px 14px;font-weight:700;font-size:1.08rem;line-height:1.4;display:flex;gap:10px;align-items:center;box-shadow:0 0 0 3px #c9dcfb inset;margin-bottom:10px}.dlgq svg{width:30px;height:30px;flex:none}
.pbody .dlgq+.cards{height:calc(100% - 64px)}
.situ{background:#fff7da;border-radius:20px;padding:12px 16px;font-size:1.08rem;line-height:1.45;font-weight:700;display:flex;gap:10px;align-items:flex-start;box-shadow:0 0 0 3px #ffe8a3 inset}
.situ svg{width:34px;height:34px;flex:none}
.sbody{display:flex;flex-direction:column;gap:12px;height:100%}
.sbody .opts{flex:1;min-height:0}

/* build */
.build{display:flex;flex-direction:column;gap:12px;height:100%;justify-content:center}
.zone{min-height:84px;border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;align-items:flex-start}
#ans{background:#f3f0ff;box-shadow:0 0 0 3px #d9d2ff inset;border:0}
#ans.empty::before{content:"點下面的字卡（或拖曳）放到這裡";color:#8d84c9;font-size:.95rem;padding:12px 6px}
#pool{background:#f5f8fa;box-shadow:0 0 0 3px #e3eaef inset}
.tok{min-height:52px;min-width:52px;border:0;border-radius:16px;background:linear-gradient(180deg,#fff,#f2f5f8);box-shadow:0 4px 0 rgba(34,50,74,.2),0 0 0 2px #dbe3e9 inset;padding:0 16px;font-family:var(--en);font-weight:600;font-size:1.3rem;color:var(--ink);touch-action:none}
#ans .tok{background:linear-gradient(180deg,#fff,#f3f0ff);box-shadow:0 4px 0 rgba(79,63,192,.3),0 0 0 2px #cfc6ff inset}
.tok.bad{box-shadow:0 4px 0 var(--coral-d),0 0 0 3px var(--coral) inset!important;background:#fff1ec!important}
.tok.good{box-shadow:0 4px 0 var(--mint-d),0 0 0 3px var(--mint) inset!important;background:#effcf7!important}
.tok.hintme{animation:glow 1s infinite;box-shadow:0 4px 0 #b88a00,0 0 0 3px var(--sun) inset!important}
.tok.ghost{position:fixed;z-index:80;pointer-events:none;opacity:.92;transform:scale(1.08);box-shadow:0 10px 20px rgba(0,0,0,.2)}
.tok.dragging{opacity:.3}
.zh-hint{font-size:1rem;color:var(--purple-d);font-weight:700;min-height:1.2em}

/* feedback */
#fb{border-radius:20px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-weight:700}
#fb.ok{background:#e4f8f1;color:#0f6b56;box-shadow:0 0 0 3px #b6ead9 inset}
#fb.no{background:#fff0eb;color:#a53b25;box-shadow:0 0 0 3px #ffd2c4 inset}
#fb .fbt{flex:1;min-width:0;line-height:1.35}
#fb .fben{font-family:var(--en);font-size:1.15rem;color:var(--ink);font-weight:600}
#fb .fbzh{font-size:.95rem;color:var(--ink2)}
#fb .ico{width:44px;height:44px;flex:none}

/* home / menus */
.home{display:flex;flex-direction:column;gap:12px;height:100%;min-height:0}
.hello{font-size:1.25rem;font-weight:700}
.sub{color:var(--ink2);font-size:.95rem;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.tile{border:0;border-radius:22px;background:#fff;box-shadow:0 5px 0 rgba(34,50,74,.15),0 0 0 3px #e9eef2 inset;min-height:84px;padding:10px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;text-align:left;color:var(--ink)}
.tile svg{width:46px;height:46px;flex:none}
.tile:active{transform:translateY(3px)}
.tile small{display:block;font-weight:400;color:var(--ink2);font-size:.8rem}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding:2px 4px 6px}
.lvcard{display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left;border-radius:22px;background:#fff;box-shadow:0 5px 0 rgba(34,50,74,.15),0 0 0 3px #e9eef2 inset;padding:10px 14px;min-height:76px;margin-bottom:12px;color:var(--ink)}
.lvcard .num{width:52px;height:52px;border-radius:16px;background:linear-gradient(180deg,#9b8bff,#6a56e8);color:#fff;font-family:var(--en);font-weight:700;font-size:1.4rem;display:flex;align-items:center;justify-content:center;flex:none}
.lvcard.lock{opacity:.55}.lvcard.lock .num{background:#c4ccd6}
.lvcard .lt{flex:1;min-width:0}.lvcard .lt b{display:block;font-size:1.05rem}.lvcard .lt span{color:var(--ink2);font-size:.85rem}
.stars{color:#e8a800;font-size:1.2rem;letter-spacing:2px;white-space:nowrap}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item{border:0;border-radius:22px;background:#fff;box-shadow:0 5px 0 rgba(34,50,74,.15),0 0 0 3px #e9eef2 inset;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;color:var(--ink);position:relative}
.item svg{width:74px;height:74px}
.item b{font-size:.95rem}
.item .cost{font-family:var(--en);font-weight:700;color:#7a5a00;font-size:.9rem}
.item.on{box-shadow:0 5px 0 var(--mint-d),0 0 0 4px var(--mint) inset}
.item.lock{opacity:.6}
.item .state{font-size:.8rem;color:var(--ink2)}
.revrow{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 0 0 2px #e9eef2 inset;margin-bottom:8px}
.revrow .rt{flex:1;min-width:0}.revrow .rt .en{font-size:1.08rem;font-weight:600}.revrow .rt div+div{font-size:.85rem;color:var(--ink2)}

/* overlays */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(24,33,58,.55);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.dlg{background:#fffdf8;border-radius:30px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:22px;max-width:760px;width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dlg h2{margin:0 0 8px;font-size:1.45rem}
.dlg .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}
#rotate{z-index:90;display:none;flex-direction:column;gap:18px;color:#fff;text-align:center;background:linear-gradient(160deg,#2b3d63,#1b2440)}
#rotate .ipad{width:120px;height:160px;border-radius:18px;border:6px solid #fff;position:relative;animation:rot 2.2s ease-in-out infinite}
#rotate .ipad::after{content:"";position:absolute;left:50%;bottom:6px;width:10px;height:10px;border-radius:50%;background:#fff;transform:translateX(-50%)}
@keyframes rot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate b{font-size:1.5rem}
@media (orientation:portrait) and (min-width:600px){body:not(.allow-portrait) #rotate{display:flex}}
body.allow-portrait #main{grid-template-columns:1fr;grid-template-rows:minmax(0,40fr) minmax(0,60fr)}
@media (orientation:portrait){body.allow-portrait .tblabel{display:none}}
body.allow-portrait #main{gap:10px}
#toast{position:fixed;left:50%;top:max(76px,calc(env(safe-area-inset-top) + 70px));transform:translateX(-50%);z-index:95;background:#22324a;color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;max-width:min(92vw,620px);box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center;line-height:1.4}
.tut{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.tut .st{background:#fff;border-radius:22px;padding:12px;box-shadow:0 0 0 3px #e9eef2 inset;text-align:center;font-weight:700;line-height:1.4;font-size:.95rem}
.tut .st svg{width:100%;height:auto;max-height:140px}
.hand{animation:tap 1.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,-8px)}}
.done-card{background:linear-gradient(160deg,#e3f7f1,#ebe6ff 55%,#fff0ea);border-radius:26px;padding:16px;display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;box-shadow:0 0 0 4px #fff inset}
.done-card svg.pet{width:200px;height:225px}
.done-card h3{margin:0;font-size:1.6rem;color:var(--purple-d)}
.done-card .big{font-size:1.15rem;font-weight:700;margin-top:6px}
.lst{margin:8px 0 0;padding:0;list-style:none}
.lst li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #d8e0e6}
.lst li .en{font-weight:600;font-size:1.05rem}
.lst li .zh{color:var(--ink2);font-size:.85rem}
.lst li .rt{flex:1;min-width:0}
.lst .lis{width:48px;min-height:48px}

/* teacher */
.ov.teacher .dlg{max-width:980px}
#tText{width:100%;min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.5;border-radius:16px;border:2px solid #d7e0e6;padding:12px;-webkit-user-select:text;user-select:text;color:var(--ink);background:#fff}
.tsec{margin-top:18px}
.tsec h3{margin:0 0 6px;font-size:1.1rem}
.msg{border-radius:12px;padding:8px 12px;margin:6px 0;font-size:.95rem;line-height:1.45;-webkit-user-select:text;user-select:text}
.msg.err{background:#ffeae4;color:#9a2f1b}.msg.warn{background:#fff6d8;color:#7a5600}.msg.okm{background:#e4f8f1;color:#0f6b56}.msg.note{background:#eef2ff;color:#3d3486}
.fmt{background:#f4f6f9;border-radius:14px;padding:10px 14px;font-size:.92rem;line-height:1.6;-webkit-user-select:text;user-select:text}
.fmt code{font-family:ui-monospace,Menlo,monospace;background:#fff;border-radius:6px;padding:1px 5px}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.picgrid div{background:#fff;border-radius:14px;padding:6px;text-align:center;font-size:.78rem;box-shadow:0 0 0 2px #e9eef2 inset;-webkit-user-select:text;user-select:text}
.picgrid svg{width:64px;height:64px}
.prev{font-size:.9rem;line-height:1.5;-webkit-user-select:text;user-select:text}
.prev li{margin:3px 0}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input[type=number],input[type=text]{font:inherit;min-height:48px;border-radius:12px;border:2px solid #d7e0e6;padding:0 10px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
label.ck{display:inline-flex;align-items:center;gap:8px;min-height:48px}
label.ck input{width:26px;height:26px}
#linkBox{flex:1;min-width:240px}
.imgout{max-width:100%;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.2);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}

 '・問句（?）後面接另一人說的句子，會自動出「選回應」題；用 <code>reply</code> 強制出題、<code>noreply</code> 取消。<br>'+
 '・3～10 個字的句子會出「排句子」題；可順序互換的句子請加 <code>nobuild</code>。<br>'+
 '・問句的下一句（回答）如果有 <b>pic=</b>，會再出「聽對話，解問題」素養題；用 <b>ask=</b> 寫中文問題（例如 ask=這個孩子怎麼去上學？）。<br>'+
 '・<b>tip=</b> 會出「情境對話」題。<b>wrong=</b> 是這句當正確答案時的錯誤選項（用「 / 」分隔），沒寫會從教材自動挑。<br>'+
 '・有真人錄音時加上 <code>audio=錄音檔網址.mp3</code>，會優先播放錄音；沒有就用裝置的英語語音。<br>'+
 '・<code>#</code> 開頭的行是註解。</div>'+
 '<div class="tsec"><textarea id="tText" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="教材內容">'+esc(cur)+'</textarea>'+
 '<div class="row" style="justify-content:flex-start"><button class="btn mint" id="tCheck">🔍 檢查教材</button><button class="btn primary" id="tApply">✔ 套用教材</button><button class="btn" id="tDefault">還原示範教材</button></div><div id="tRes"></div></div>'+
 '<div class="tsec"><h3>每次練習</h3><div class="inline"><label>每關題數 <select id="tN">'+[4,5,6,7,8,9,10,12,15].map(function(n){return '<option'+(n===MAT.n?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label><label class="ck"><input type="checkbox" id="tAll"'+(MAT.all?' checked':'')+'> 全部關卡直接開放</label></div><div class="sub">建議 6～10 題，約 5～8 分鐘。答錯的題目會自動在同一關再練一次，並在之後的任務中複習。</div></div>'+
 '<div class="tsec"><h3>學生版輸出</h3><div class="sub">產生帶有目前教材與設定的連結，學生用 iPad 打開即可玩，不需登入；學生版不會顯示「老師設定」。</div><div class="inline" style="margin-top:8px"><input type="text" id="linkBox" readonly aria-label="學生版連結"><button class="btn purple" id="tCopy">複製連結</button>'+(IN_FRAME?'':'<button class="btn" id="tDl">下載學生版檔案</button>')+'</div></div>'+
 '<div class="tsec"><h3>進度</h3><div class="inline"><button class="btn" id="tReset">重設本裝置的學生進度</button></div><div class="sub">只會清除這台裝置、這個瀏覽器中的遊戲進度。</div></div>'+
 (isDefault?'<div class="tsec"><h3>示範教材核對說明</h3>'+DEFAULT_NOTES.map(function(n){return '<div class="msg note">'+esc(n)+'</div>'}).join('')+'</div>':'')+
 '<div class="tsec"><h3>圖卡庫（pic= 後面填英文名稱）</h3><div class="picgrid">'+picLib+'</div></div>'+
 '<div class="row"><button class="btn dark" id="tClose">關閉</button></div>';
 openOv(h,'');
 OV.classList.add('teacher');
 var updLink=function(){$('#linkBox').value=studentLink()};updLink();
 $('#tCheck').onclick=function(){var r=checkReport($('#tText').value);$('#tRes').innerHTML=r.html};
 $('#tApply').onclick=function(){var t=$('#tText').value;var r=checkReport(t);$('#tRes').innerHTML=r.html;if(!r.ok){toast('教材還有錯誤，請依紅色提示修正後再套用。');return}
  var res=applyMaterial(t);if(!res.ok){toast('教材還有錯誤。');return}MAT.text=t;ST.mat={text:t,n:MAT.n,all:MAT.all};save();updLink();toast('教材已更新！題目、答案、圖卡和發音都已同步更新。');};
 $('#tDefault').onclick=function(){twoStep(this,'再按一次：確定還原（會取代文字框內容）',function(){$('#tText').value=DEFAULT_MATERIAL;$('#tRes').innerHTML=checkReport(DEFAULT_MATERIAL).html})};
 $('#tN').onchange=function(){MAT.n=+this.value;ST.mat=ST.mat||{text:MAT.text};ST.mat.n=MAT.n;save();updLink()};
 $('#tAll').onchange=function(){MAT.all=this.checked;ST.mat=ST.mat||{text:MAT.text};ST.mat.all=MAT.all;save();updLink()};
 $('#tCopy').onclick=function(){var v=$('#linkBox').value;var ok=function(){toast('已複製學生版連結！貼到聯絡簿或班級群組給學生。')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,function(){selCopy()});else selCopy();
  function selCopy(){var i=$('#linkBox');i.focus();i.select();i.setSelectionRange(0,99999);try{document.execCommand('copy');ok()}catch(e){toast('請長按連結框，手動複製。')}}};
 if($('#tDl'))$('#tDl').onclick=downloadStudent;
 $('#tReset').onclick=function(){twoStep(this,'再按一次：確定清除進度',resetAll)};
 function resetAll(){var keepMat=ST.mat;try{localStorage.removeItem(SKEY)}catch(e){}ST=freshState();ST.mat=keepMat;ST.tutorial=true;applyMaterial(MAT.text);save();drawRoom();drawPet();refreshTop();toast('進度已重設。');}
 $('#tClose').onclick=function(){closeOv();goHome()};
}
function studentLink(){var base=IN_FRAME?SITE_URL:location.href.split('#')[0];return base+'#m='+b64e(MAT.text)+'&n='+MAT.n+(MAT.all?'&a=1':'')+'&s=1'}
function downloadStudent(){
 var url=location.href.split('#')[0];
 if(location.protocol==='file:'){toast('請在網站上使用「下載學生版檔案」，或改用「複製連結」。');return}
 fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(src){
  var json=JSON.stringify({text:MAT.text,n:MAT.n,all:MAT.all,student:true}).replace(/</g,'\\u003c');
  var out=src.replace(/<script id="preset" type="application\/json">[\s\S]*?<\/script>/,'<script id="preset" type="application/json">'+json+'<\/script>');
  if(out===src)throw 0;
  var blob=new Blob([out],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='麻糬英語-學生版.html';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);toast('已下載學生版檔案。')
 }).catch(function(){toast('下載失敗，請改用「複製連結」交給學生。')});
}

/* ---------------- boot ---------------- */
function readHash(){
 var h=location.hash.replace(/^#/,'');if(!h)return null;var o={};h.split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)o[kv.slice(0,i)]=kv.slice(i+1)});
 if(!o.m)return null;try{return {text:b64d(o.m),n:+o.n||8,all:o.a==='1',student:o.s==='1'}}catch(e){return {bad:true}}
}
function boot(){
 load();setVH();
 var fromHash=readHash(),src=null;
 if(PRESET&&PRESET.text){src={text:PRESET.text,n:PRESET.n||8,all:!!PRESET.all,student:true}}
 else if(fromHash&&!fromHash.bad){src=fromHash}
 else if(ST.mat&&ST.mat.text){src={text:ST.mat.text,n:ST.mat.n||8,all:!!ST.mat.all,student:false}}
 if(fromHash&&fromHash.bad)setTimeout(function(){toast('連結中的教材讀取失敗，改用原本的教材。',5000)},600);
 var ok=false;
 if(src){MAT.text=src.text;MAT.n=clamp(src.n|0||8,3,20);MAT.all=src.all;MAT.student=!!src.student;var r=applyMaterial(MAT.text);ok=r.ok;if(!ok)setTimeout(function(){toast('教材有錯誤，暫時改用示範教材。請老師到「老師設定」檢查。',6000)},600)}
 if(!ok){MAT.text=DEFAULT_MATERIAL;applyMaterial(DEFAULT_MATERIAL)}
 if(fromHash&&!fromHash.bad&&ok&&!PRESET){ST.mat={text:MAT.text,n:MAT.n,all:MAT.all}}
 refreshTop();drawRoom();drawPet();
 $('#bHome').onclick=function(){SFX.tap();closeOv();goHome()};
 $('#bSpeed').onclick=function(){ST.set.rate=(ST.set.rate+1)%RATES.length;save();refreshTop();toast('語速：'+RATES[ST.set.rate].n);if(SCREEN==='quiz'&&Q){unlockAudio();playMain()}};
 $('#bSub').onclick=function(){ST.set.subs=!ST.set.subs;save();refreshTop();showSub();toast(ST.set.subs?'英文字幕：開（建議先用聽的，再看字幕）':'英文字幕：關')};
 $('#bMusic').onclick=function(){ST.set.music=!ST.set.music;save();refreshTop();if(ST.set.music){unlockAudio();startMusic()}else stopMusic()};
 $('#bPause').onclick=showPause;
 $('#bFull').onclick=toggleFull;
 $('#bPortrait').onclick=function(){document.body.classList.add('allow-portrait');setTimeout(setVH,50)};
 goHome();
 if(!ST.tutorial)showTutorial(true);else showSplash();
 save();
}
window.__dbg={get S(){return S},get Q(){return Q},get ST(){return ST},get BANK(){return BANK},get P(){return P},get MAT(){return MAT},parse:parseMaterial,build:buildBank};
boot();
</script>
