<style>
/* Layout: a passport booklet — level "visa pages" as a stamp grid, one big play button per question */
:root{
  --paper:#eef4f1; --page:#ffffff; --ink:#1c2f55; --muted:#5d6b80; --line:#d6e0dc;
  --navy:#1f3d73; --stamp:#d1463a; --gold:#eba22f; --ok:#22915f; --okbg:#e2f4ea; --bad:#c9403a; --badbg:#fbe6e3;
  --chip:#e4ecf6; --shadow:0 2px 0 #c9d5d0;
  --display:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111a2c; --page:#1a2540; --ink:#eef2f9; --muted:#a6b2c7; --line:#2c3a5a;
  --navy:#8fb2f0; --stamp:#f0786c; --gold:#f2b94f; --ok:#4fcf8f; --okbg:#173a2c; --bad:#f07a70; --badbg:#3e1e22;
  --chip:#24324f; --shadow:0 2px 0 #0b1120; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a2c; --page:#1a2540; --ink:#eef2f9; --muted:#a6b2c7; --line:#2c3a5a;
  --navy:#8fb2f0; --stamp:#f0786c; --gold:#f2b94f; --ok:#4fcf8f; --okbg:#173a2c; --bad:#f07a70; --badbg:#3e1e22;
  --chip:#24324f; --shadow:0 2px 0 #0b1120; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:repeating-radial-gradient(circle at 50% -20%, transparent 0 22px, color-mix(in srgb,var(--line) 45%,transparent) 22px 23px);}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.crest{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--page);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;line-height:1;flex:none;text-align:center}
.top h1{font-family:var(--display);font-size:clamp(22px,4.6vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:14px}
.titles{min-width:0;flex:1}
.back{padding:8px 14px;border-radius:999px;background:var(--chip);font-weight:700;font-size:15px}
.panel{background:var(--page);border:1px solid var(--line);border-radius:18px;padding:16px}
.voicebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.voicebar label{font-weight:700;font-size:14px}
.voicebar select{flex:1;min-width:0;max-width:100%;font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--page)}
.pill{padding:8px 14px;border-radius:999px;background:var(--navy);color:var(--page);font-weight:700;font-size:14px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0;flex-basis:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lv{position:relative;text-align:left;background:var(--page);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:118px;overflow:hidden;transition:transform .12s}
.lv:hover{transform:translateY(-2px)}
.lv .no{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;color:var(--stamp)}
.lv .zh{font-weight:900;font-size:17px;line-height:1.25}
.lv .en{font-size:12px;color:var(--muted);line-height:1.3}
.lv .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding-top:6px}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.stampmark{position:absolute;right:-6px;top:8px;transform:rotate(14deg);border:2.5px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:0 6px;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.1em;opacity:.85}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:4px}
.mode{text-align:left;background:var(--page);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.mode .ic{font-family:var(--display);font-weight:800;font-size:13px;color:var(--page);background:var(--navy);border-radius:8px;padding:2px 8px;align-self:flex-start}
.mode b{font-size:18px}
.mode span{color:var(--muted);font-size:14px}
.mode.learn .ic{background:var(--ok)}
/* quiz */
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;margin:4px 0 16px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:14px}
.player{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 18px}
.big{width:128px;height:128px;border-radius:50%;background:var(--stamp);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--stamp) 60%,#000);transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--stamp) 60%,#000)}
.big svg{width:62px;height:62px}
.big.talking{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.big.talking{animation:none}.lv{transition:none}}
.prompt{font-weight:700;font-size:15px;color:var(--muted)}
.slow{padding:8px 16px;border-radius:999px;background:var(--chip);font-weight:700;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.long{grid-template-columns:1fr}
.opt{background:var(--page);border:2px solid var(--line);border-radius:16px;padding:16px 12px;font-size:22px;font-weight:700;min-height:72px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.opt.en{font-family:var(--display);font-size:26px}
.opts.long .opt{font-size:18px;text-align:left;min-height:60px}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--okbg)} .fb.no{background:var(--badbg)}
.fb .v{font-weight:900;font-size:18px}
.fb.ok .v{color:var(--ok)} .fb.no .v{color:var(--bad)}
.fb .w{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.2}
.say{display:inline-flex;align-items:center;gap:6px;text-align:left;border-radius:10px;padding:2px 4px;margin-left:-4px}
.say:hover{background:var(--chip)}
.say svg{width:18px;height:18px;flex:none;color:var(--stamp)}
.next{margin-top:14px;width:100%;padding:14px;border-radius:14px;background:var(--navy);color:var(--page);font-weight:900;font-size:19px}
/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 16px}
.result .bigstars{font-size:54px;color:var(--gold);letter-spacing:6px;line-height:1}
.result .bigstars .off{color:var(--line)}
.result h2{font-family:var(--display);margin:0;font-size:28px}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.result .row button{padding:12px 20px;border-radius:999px;font-weight:900;font-size:16px;background:var(--chip)}
.result .row button.primary{background:var(--navy);color:var(--page)}
.missed{width:100%;text-align:left;margin-top:14px}
.missed h3{font-size:15px;margin:0 0 6px}
/* learn */
.learnbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--page);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:start}
.card.now{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 40%,transparent)}
.card .n{font-family:var(--display);font-weight:800;color:var(--stamp);font-size:15px;font-variant-numeric:tabular-nums;padding-top:4px}
.card .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.card .wd{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.2}
.card .cz{font-weight:700;color:var(--muted)}
.card .st{font-size:16px}
.card .sz{font-size:14px;color:var(--muted)}
.warn{background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:420px){.opt{font-size:19px}.opt.en{font-size:22px}.big{width:112px;height:112px}}
</style>

};
const SPEAK_FIX = {"TWD":"T W D","PE":"P E","MRT":"M R T","BBQ":"barbecue","TV":"T V","Mr.":"Mister","Mrs.":"Missus","OK":"okay","COVID-19":"covid nineteen"};
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };

/* ---------- saved progress (this device only) ---------- */
let prog = {};
try { prog = JSON.parse(localStorage.getItem('tc-listen-v1') || '{}') || {}; } catch(e) { prog = {}; }
prog.stars = prog.stars || {};
function persist(){ try { localStorage.setItem('tc-listen-v1', JSON.stringify(prog)); } catch(e) {} }
function starsOf(n, m){ return (prog.stars[n] && prog.stars[n][m]) || 0; }

/* ---------- speech ---------- */
const synth = window.speechSynthesis || null;
let voices = [];
const PREFER = [/Google US English/i, /\bAva\b.*(Premium|Enhanced)/i, /Samantha.*(Premium|Enhanced)/i, /(Jenny|Aria|Ava|Emma|Guy|Andrew).*Natural/i, /Natural/i, /(Premium|Enhanced)/i, /Samantha/i, /\bAva\b/i, /Google UK English Female/i, /Microsoft (Zira|Jenny|Aria)/i, /Karen|Daniel|Serena|Moira|Allison|Susan/i];
function rankVoice(v){ for(let i=0;i<PREFER.length;i++) if(PREFER[i].test(v.name)) return i; return PREFER.length + (/en[-_]US/i.test(v.lang)?0:1); }
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Fred|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function loadVoices(){
  if(!synth) return;
  voices = synth.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a,b) => rankVoice(a)-rankVoice(b));
  const sel = document.getElementById('voice');
  if(sel) fillVoiceSelect(sel);
}
function currentVoice(){
  if(prog.voice){ const v = voices.find(v => v.name === prog.voice); if(v) return v; }
  return voices[0] || null;
}
function fillVoiceSelect(sel){
  const cur = currentVoice();
  sel.innerHTML = voices.length ? voices.map((v,i) => `<option value="${esc(v.name)}" ${cur && v.name===cur.name?'selected':''}>${i<3 && rankVoice(v)<PREFER.length?'★ ':''}${esc(v.name)} (${esc(v.lang)})</option>`).join('') : '<option>載入聲音中…</option>';
}
if(synth){ loadVoices(); if('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); setTimeout(loadVoices, 2000); }

let talkingEl = null;
function speak(text, opts={}){
  if(!synth){ return; }
  const clean = (SPEAK_FIX[text] || text).replace(/\.\.\./g,'').replace(/…/g,'');
  synth.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  const v = currentVoice();
  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
  u.rate = opts.slow ? 0.55 : (prog.rate || 0.85);
  u.pitch = 1;
  const el = opts.el || null;
  u.onstart = () => { if(talkingEl) talkingEl.classList.remove('talking'); talkingEl = el; if(el) el.classList.add('talking'); };
  u.onend = u.onerror = () => { if(el) el.classList.remove('talking'); if(opts.onend) opts.onend(); };
  synth.speak(u);
  if(synth.paused) synth.resume();
}

/* ---------- little sound effects ---------- */
let actx = null;
function beep(good){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [660, 880] : [300, 220];
    notes.forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = good ? 'triangle' : 'sine'; o.frequency.value = f;
      const t = actx.currentTime + i*0.12;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.25);
    });
  }catch(e){}
}

/* ---------- screens ---------- */
let S = {screen:'home'};
function starRow(n, max=3){ let s=''; for(let i=0;i<max;i++) s += i<n ? '★' : '<span class="off">★</span>'; return s; }

function renderHome(){
  const total = LV.reduce((a,L) => a + ['w','m','s'].reduce((b,m)=>b+starsOf(L.n,m),0), 0);
  $app.innerHTML = `
  <div class="top">
    <div class="crest">TC<br>EN</div>
    <div class="titles"><h1>土城國小英語護照・聽力闖關</h1>
    <p>25 關・700 個單字和句子｜已得 ${total} / ${LV.length*9} 顆星</p></div>
  </div>
  ${synth ? '' : '<div class="warn">這個瀏覽器不支援英文發音。請改用 Chrome、Safari 或 Edge 開啟。</div>'}
  <div class="panel voicebar">
    <label for="voice">發音聲音</label>
    <select id="voice"></select>
    <button class="pill" data-act="test">試聽</button>
    <div class="seg" role="group" aria-label="說話速度">
      <button data-act="rate" data-v="0.7" aria-pressed="${(prog.rate||0.85)==0.7}">慢</button>
      <button data-act="rate" data-v="0.85" aria-pressed="${(prog.rate||0.85)==0.85}">標準</button>
      <button data-act="rate" data-v="1" aria-pressed="${(prog.rate||0.85)==1}">快</button>
    </div>
    <p class="note">★ 是最清楚的聲音。iPad／iPhone 可到「設定 → 輔助使用 → 朗讀內容 → 聲音 → 英文」下載「Ava（高品質）」或「Samantha（高品質）」，發音會更自然。</p>
  </div>
  <div class="grid">
    ${LV.map(L => {
      const st = ['w','m','s'].map(m=>starsOf(L.n,m)); const sum = st.reduce((a,b)=>a+b,0);
      const done = st.every(x=>x>=2);
      return `<button class="lv" data-act="level" data-n="${L.n}">
        ${done ? '<span class="stampmark">PASS</span>' : ''}
        <span class="no">LEVEL ${String(L.n).padStart(2,'0')}</span>
        <span class="zh">第${L.n}關 ${esc(L.zh)}</span>
        <span class="en">${esc(L.en)}</span>
        <span class="meta"><span>${L.items.length} 個</span><span class="stars">★ ${sum}/9</span></span>
      </button>`; }).join('')}
  </div>
  <p class="foot">進度只存在這台裝置的瀏覽器裡。</p>`;
  fillVoiceSelect(document.getElementById('voice'));
}

function renderLevel(){
  const L = S.L;
  $app.innerHTML = `
  <div class="top">
    <button class="back" data-act="home">‹ 關卡</button>
    <div class="titles"><h1>第${L.n}關 ${esc(L.zh)}</h1><p>${esc(L.en)}｜No. ${L.items[0][0]}–${L.items[L.items.length-1][0]}，共 ${L.items.length} 個</p></div>
  </div>
  <div class="modes">
    <button class="mode learn" data-act="learn"><span class="ic">LEARN</span><b>先聽先學</b><span>點單字或句子就會念出來，也可以全部依序播放</span></button>
    ${Object.entries(MODES).map(([k,m]) => `<button class="mode" data-act="start" data-m="${k}"><span class="ic">GAME ${k==='w'?1:k==='m'?2:3}</span><b>${m.t}</b><span>${m.d}</span><span class="stars">${starRow(starsOf(L.n,k))}</span></button>`).join('')}
  </div>`;
}

function renderLearn(){
  const L = S.L;
  $app.innerHTML = `
  <div class="top">
    <button class="back" data-act="level" data-n="${L.n}">‹ 返回</button>
    <div class="titles"><h1>先聽先學・第${L.n}關</h1><p>點英文就會念出來</p></div>
  </div>
  <div class="learnbar">
    <button class="pill" data-act="playall">${S.playing ? '■ 停止播放' : '▶ 依序播放全部單字和句子'}</button>
  </div>
  <div class="cards">
    ${L.items.map((it,i) => `<div class="card" id="c${i}">
      <span class="n">${it[0]}</span>
      <div class="body">
        <button class="say wd" data-act="say" data-t="${esc(it[1])}">${SPK}${esc(it[1])}</button>
        <span class="cz">${esc(it[2])}</span>
        <button class="say st" data-act="say" data-t="${esc(it[3])}">${SPK}${esc(it[3])}</button>
        <span class="sz">${esc(it[4])}</span>
      </div></div>`).join('')}
  </div>`;
}

function playAll(i){
  if(!S.playing || S.screen!=='learn') return;
  const L = S.L;
  document.querySelectorAll('.card.now').forEach(e=>e.classList.remove('now'));
  if(i >= L.items.length){ S.playing=false; renderLearn(); return; }
  const card = document.getElementById('c'+i);
  if(card){ card.classList.add('now'); card.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
  const it = L.items[i];
  speak(it[1], {onend: () => setTimeout(() => {
    if(!S.playing) return;
    speak(it[3], {onend: () => setTimeout(() => playAll(i+1), 900)});
  }, 700)});
}

function keyOf(it, m){ return m==='w' ? it[1] : m==='m' ? it[2] : it[4]; }
function makeQuiz(L, m){
  const pick = shuffle(L.items.slice()).slice(0, Math.min(10, L.items.length));
  return pick.map(it => {
    const ans = keyOf(it, m), seen = new Set([ans]), opts = [];
    for(const o of shuffle(L.items.slice())){
      const k = keyOf(o, m);
      if(!seen.has(k)){ seen.add(k); opts.push(k); }
      if(opts.length === 3) break;
    }
    opts.push(ans);
    return {it, ans, opts: shuffle(opts), audio: m==='s' ? it[3] : it[1]};
  });
}

function renderQuiz(){
  const L = S.L, q = S.qs[S.qi], m = S.mode;
  const pct = Math.round(S.qi / S.qs.length * 100);
  const isEn = m==='w', isLong = m==='s';
  let fb = '';
  if(S.picked != null){
    const good = S.picked === q.ans;
    fb = `<div class="fb ${good?'ok':'no'}">
      <span class="v">${good ? '答對了！Great job!' : '再加油！正確答案是：'}</span>
      <button class="say w" data-act="say" data-t="${esc(q.it[1])}">${SPK}${esc(q.it[1])}</button>
      <span>${esc(q.it[2])}</span>
      <button class="say" data-act="say" data-t="${esc(q.it[3])}">${SPK}${esc(q.it[3])}</button>
      <span>${esc(q.it[4])}</span>
    </div>
    <button class="next" data-act="next">${S.qi+1 < S.qs.length ? '下一題 ›' : '看成績 ›'}</button>`;
  }
  $app.innerHTML = `
  <div class="top">
    <button class="back" data-act="level" data-n="${L.n}">‹ 離開</button>
    <div class="titles"><h1>${MODES[m].t}</h1><p>第${L.n}關 ${esc(L.zh)}</p></div>
  </div>
  <div class="qhead"><span>第 ${S.qi+1} / ${S.qs.length} 題</span><span>答對 ${S.score} 題</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="player">
    <button class="big" id="big" data-act="play" aria-label="再聽一次">${SPK}</button>
    <span class="prompt">${MODES[m].p}</span>
    <button class="slow" data-act="playslow">🐢 慢慢念</button>
  </div>
  <div class="opts ${isLong?'long':''}">
    ${q.opts.map((o,i) => {
      let cls = 'opt' + (isEn?' en':'');
      if(S.picked != null){ if(o===q.ans) cls+=' right'; else if(o===S.picked) cls+=' wrong'; }
      return `<button class="${cls}" data-act="pick" data-i="${i}" ${S.picked!=null?'disabled':''}>${esc(o)}</button>`; }).join('')}
  </div>
  ${fb}`;
}

function renderResult(){
  const L = S.L, n = S.qs.length, sc = S.score, r = sc/n;
  const stars = r >= 0.9 ? 3 : r >= 0.7 ? 2 : r >= 0.4 ? 1 : 0;
  prog.stars[L.n] = prog.stars[L.n] || {};
  if(stars > (prog.stars[L.n][S.mode]||0)){ prog.stars[L.n][S.mode] = stars; persist(); }
  const msg = stars===3 ? 'Excellent! 太厲害了！' : stars===2 ? 'Great! 很棒喔！' : stars===1 ? 'Good try! 再練一次會更好！' : 'Keep going! 先去「先聽先學」練習看看！';
  $app.innerHTML = `
  <div class="top">
    <button class="back" data-act="level" data-n="${L.n}">‹ 第${L.n}關</button>
    <div class="titles"><h1>${MODES[S.mode].t}</h1><p>第${L.n}關 ${esc(L.zh)}</p></div>
  </div>
  <div class="panel result">
    <div class="bigstars">${starRow(stars)}</div>
    <h2>${sc} / ${n}</h2>
    <p>${msg}</p>
    <div class="row">
      <button class="primary" data-act="start" data-m="${S.mode}">再玩一次</button>
      <button data-act="level" data-n="${L.n}">換別的遊戲</button>
      ${L.n < LV.length ? `<button data-act="level" data-n="${L.n+1}">下一關 ›</button>` : ''}
    </div>
    ${S.missed.length ? `<div class="missed"><h3>答錯的要多聽幾次：</h3><div class="cards">${S.missed.map(it => `<div class="card"><span class="n">${it[0]}</span><div class="body">
      <button class="say wd" data-act="say" data-t="${esc(it[1])}">${SPK}${esc(it[1])}</button><span class="cz">${esc(it[2])}</span>
      <button class="say st" data-act="say" data-t="${esc(it[3])}">${SPK}${esc(it[3])}</button><span class="sz">${esc(it[4])}</span></div></div>`).join('')}</div></div>` : ''}
  </div>`;
}

function render(){
  ({home:renderHome, level:renderLevel, learn:renderLearn, quiz:renderQuiz, result:renderResult})[S.screen]();
}
function go(state){ if(synth) synth.cancel(); S = Object.assign({}, state); render(); window.scrollTo(0,0); }

$app.addEventListener('change', e => {
  if(e.target.id === 'voice'){ prog.voice = e.target.value; persist(); speak('Hello! Let\'s learn English.'); }
});
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='home') go({screen:'home'});
  else if(a==='test') speak('Hello! The bird is singing.');
  else if(a==='rate'){ prog.rate = parseFloat(b.dataset.v); persist(); renderHome(); speak('This is my book.'); }
  else if(a==='level'){ const L = LV.find(x => x.n == b.dataset.n); go({screen:'level', L}); }
  else if(a==='learn'){ go({screen:'learn', L:S.L, playing:false}); }
  else if(a==='say'){ speak(b.dataset.t, {el:b}); }
  else if(a==='playall'){
    if(S.playing){ S.playing=false; if(synth) synth.cancel(); renderLearn(); }
    else { S.playing=true; renderLearn(); playAll(0); }
  }
  else if(a==='start'){
    const L = S.L, m = b.dataset.m;
    go({screen:'quiz', L, mode:m, qs:makeQuiz(L,m), qi:0, score:0, picked:null, missed:[]});
    speak(S.qs[0].audio, {el:document.getElementById('big')});
  }
  else if(a==='play'){ speak(S.qs[S.qi].audio, {el:b}); }
  else if(a==='playslow'){ speak(S.qs[S.qi].audio, {slow:true, el:document.getElementById('big')}); }
  else if(a==='pick'){
    if(S.picked != null) return;
    const q = S.qs[S.qi]; S.picked = q.opts[+b.dataset.i];
    const good = S.picked === q.ans;
    if(good) S.score++; else S.missed.push(q.it);
    beep(good);
    renderQuiz();
    setTimeout(() => speak(S.screen==='quiz' && S.mode==='s' ? q.it[3] : q.it[1]), 450);
  }
  else if(a==='next'){
    if(S.qi+1 < S.qs.length){
      S.qi++; S.picked = null; renderQuiz(); window.scrollTo(0,0);
      speak(S.qs[S.qi].audio, {el:document.getElementById('big')});
    } else { S.screen='result'; renderResult(); window.scrollTo(0,0); }
  }
});
render();
</script>

</body></html>
