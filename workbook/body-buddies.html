<title>身體小夥伴 Body Buddies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Huninn&display=swap">
<style>
/* Layout: one candy-colored playroom — mascot header, three big mode tabs, one play area. Single bright theme by choice. */
:root{
  --sky:#d9f1ff; --sky-dot:#c3e7ff;
  --ink:#3d2c63; --ink-soft:#6f5f96;
  --sun:#ffd34e; --sun-deep:#f5b400;
  --pink:#ff8fb1; --pink-deep:#ee5f8c;
  --mint:#6fdcb9; --mint-deep:#2fb98e;
  --lilac:#b9a5ff; --lilac-deep:#8a6ff0;
  --card:#ffffff; --peach:#ffc9a8; --cheek:#ff9bb3;
  --font-en:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-zh:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--sky);color:var(--ink);
  background-image:radial-gradient(var(--sky-dot) 3px,transparent 3.5px);
  background-size:28px 28px;
  font-family:var(--font-zh);font-size:17px;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px dashed var(--lilac-deep);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.buddy{width:84px;height:84px;flex:none;animation:bob 2.6s ease-in-out infinite}
.buddy.jump{animation:jump .6s ease}
.buddy.shake{animation:shake .5s ease}
.title{flex:1;min-width:0}
.title h1{margin:0;font-family:var(--font-en);font-weight:800;font-size:clamp(28px,6vw,44px);line-height:1;letter-spacing:.5px;color:var(--pink-deep);text-shadow:3px 3px 0 #fff}
.title p{margin:4px 0 0;font-size:18px;color:var(--ink-soft)}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:8px 14px;font-size:18px;max-width:280px;box-shadow:4px 4px 0 var(--ink)}
.bubble b{font-family:var(--font-en);font-size:22px;color:var(--pink-deep)}
.stars{display:flex;align-items:center;gap:6px;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:6px 14px 6px 10px;font-family:var(--font-en);font-weight:800;font-size:24px;box-shadow:3px 3px 0 var(--ink)}
.stars svg{width:28px;height:28px}
.stars.pop{animation:pop .5s ease}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tab{border:3px solid var(--ink);border-radius:22px;padding:10px 6px 8px;background:var(--card);box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s,box-shadow .1s}
.tab .ic{font-size:30px;line-height:1}
.tab .zh{font-size:20px}
.tab .en{font-family:var(--font-en);font-weight:700;font-size:14px;color:var(--ink-soft);line-height:1}
.tab:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--sun)}
.tab[data-mode="quiz"][aria-selected="true"]{background:var(--mint)}
.tab[data-mode="memory"][aria-selected="true"]{background:var(--lilac)}

.panel{background:rgba(255,255,255,.55);border:3px solid var(--ink);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:14px}

/* chips + buttons */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{border:3px solid var(--ink);border-radius:999px;padding:6px 16px;background:var(--card);font-size:17px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.big{border:3px solid var(--ink);border-radius:18px;padding:10px 20px;font-size:20px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--ink);text-shadow:1px 1px 0 var(--pink-deep);transition:transform .1s,box-shadow .1s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.big.alt{background:var(--card);color:var(--ink);text-shadow:none}
.big.mint{background:var(--mint-deep)}
.spacer{flex:1}

/* learn cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.wcard{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--ink);transition:transform .12s}
.wcard:hover{transform:translateY(-3px) rotate(-1deg)}
.wcard .pic{font-size:52px;line-height:1.15}
.wcard .en{font-family:var(--font-en);font-weight:800;font-size:23px;line-height:1.1;overflow-wrap:anywhere}
.wcard .en.long{font-size:18px}
.wcard .zh{font-size:16px;color:var(--ink-soft)}
.wcard .spk{position:absolute;top:6px;right:8px;width:24px;height:24px;opacity:.55}
.wcard.feel{background:#fff4f8}
.wcard.playing{animation:wiggle .5s ease;background:var(--sun)}
.legend{font-size:15px;color:var(--ink-soft)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);vertical-align:-2px;margin-right:4px}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;min-width:160px;height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--mint),var(--mint) 10px,var(--mint-deep) 10px,var(--mint-deep) 20px);transition:width .4s}
.qnum{font-family:var(--font-en);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.listen{align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ear{width:120px;height:120px;border-radius:50%;border:4px solid var(--ink);background:var(--sun);box-shadow:0 7px 0 var(--ink);display:grid;place-items:center;transition:transform .1s}
.ear svg{width:62px;height:62px}
.ear:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.ear.ping{animation:pulse 1s ease}
.listen span{font-size:17px;color:var(--ink-soft)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opt{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px 8px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s,opacity .2s}
.opt .pic{font-size:58px;line-height:1.1}
.opt .zh{font-size:21px}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt.right{background:var(--mint);animation:jump .6s ease}
.opt.wrong{background:#ffe1e8;opacity:.45;animation:shake .45s ease}
.opt .en{font-family:var(--font-en);font-weight:800;font-size:22px;color:var(--mint-deep);display:none}
.opt.right .en{display:block;color:var(--ink)}

/* results */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:16px}
.result h2{margin:0;font-size:32px;color:var(--pink-deep)}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:64px;height:64px}
.bigstars svg.on{animation:pop .5s ease both}
.bigstars svg.on:nth-child(2){animation-delay:.2s}
.bigstars svg.on:nth-child(3){animation-delay:.4s}
.result p{margin:0;font-size:20px}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{aspect-ratio:3/3.4;max-width:100%;perspective:600px;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border:3px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 0 var(--ink);padding:4px}
.mcard .back{background:var(--lilac);background-image:radial-gradient(rgba(255,255,255,.45) 4px,transparent 4.5px);background-size:18px 18px;font-family:var(--font-en);font-weight:800;font-size:32px;color:#fff;text-shadow:2px 2px 0 var(--lilac-deep)}
.mcard .front{background:var(--card);transform:rotateY(180deg)}
.mcard .front .pic{font-size:clamp(34px,9vw,52px);line-height:1.1}
.mcard .front .en{font-family:var(--font-en);font-weight:800;font-size:clamp(14px,4.2vw,24px);line-height:1.05;text-align:center;word-break:break-word}
.mcard .front .zh{font-size:clamp(12px,2.8vw,15px);color:var(--ink-soft)}
.mcard.done .front{background:var(--mint)}
.mcard.done{animation:jump .6s ease}
.moves{font-family:var(--font-en);font-weight:700;font-size:20px}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jump{0%{transform:scale(1)}30%{transform:scale(1.12) translateY(-8px)}60%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) scale(1.06)}75%{transform:rotate(5deg) scale(1.06)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%{box-shadow:0 7px 0 var(--ink),0 0 0 0 rgba(255,211,78,.9)}100%{box-shadow:0 7px 0 var(--ink),0 0 0 26px rgba(255,211,78,0)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:560px){
  .buddy{width:64px;height:64px}
  .bubble{order:3;max-width:none;flex-basis:100%}
  .wcard .pic{font-size:44px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .opt .pic{font-size:48px}
  .tab .ic{font-size:26px}.tab .zh{font-size:17px}
}
</style>

/* ---------- sound ---------- */
const players = {};
for (const k in AUDIO){ const a = new Audio(AUDIO[k]); a.preload="auto"; players[k]=a; }
let current=null;
function say(word){
  return new Promise(res=>{
    const a = players[word]; if(!a){res();return;}
    if(current && current!==a){ current.pause(); }
    current=a; a.currentTime=0;
    a.onended=()=>res();
    const p=a.play(); if(p&&p.catch) p.catch(()=>res());
  });
}
let ac=null;
function tone(freqs,type="sine",step=.09,len=.18,vol=.18){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t0=ac.currentTime;
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+i*step);
      g.gain.linearRampToValueAtTime(vol,t0+i*step+.02);
      g.gain.exponentialRampToValueAtTime(.001,t0+i*step+len);
      o.connect(g).connect(ac.destination);o.start(t0+i*step);o.stop(t0+i*step+len+.05);
    });
  }catch(e){}
}
const ding=()=>tone([784,988,1319],"triangle");
const boop=()=>tone([330,262],"sine",.12,.22,.14);
const fanfare=()=>tone([523,659,784,1047,784,1047],"triangle",.12,.25);

/* ---------- mascot ---------- */
const buddy=document.getElementById("buddy"), bubble=document.getElementById("say");
function mood(kind,html){
  if(html) bubble.innerHTML=html;
  buddy.classList.remove("jump","shake"); void buddy.getBoundingClientRect();
  const happy=kind==="happy";
  document.getElementById("eyesOpen").style.display=happy?"none":"";
  document.getElementById("eyesHappy").style.display=happy?"":"none";
  document.getElementById("mouth").setAttribute("d", kind==="oops"?"M52 82 Q60 74 68 82":"M50 76 Q60 88 70 76");
  if(kind==="happy") buddy.classList.add("jump");
  if(kind==="oops") buddy.classList.add("shake");
}

/* ---------- stars ---------- */
let stars=0;
try{ stars=parseInt(localStorage.getItem("bb-stars")||"0",10)||0; }catch(e){}
const starNum=document.getElementById("starNum"), starBox=document.getElementById("starBox");
starNum.textContent=stars;
function addStars(n){
  stars+=n; starNum.textContent=stars;
  starBox.classList.remove("pop"); void starBox.offsetWidth; starBox.classList.add("pop");
  try{ localStorage.setItem("bb-stars",stars); }catch(e){}
}

/* ---------- confetti ---------- */
const cv=document.getElementById("fx"), cx=cv.getContext("2d");
let bits=[], raf=null;
function confetti(n=90){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
  const cols=["#ff8fb1","#ffd34e","#6fdcb9","#b9a5ff","#7cc8ff"];
  for(let i=0;i<n;i++) bits.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.3,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6,s:(6+Math.random()*8)*devicePixelRatio,c:cols[i%5],round:Math.random()<.4});
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.05;b.r+=.1;
    cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;
    if(b.round){cx.beginPath();cx.arc(0,0,b.s/2,0,7);cx.fill();}else cx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);
    cx.restore();});
  bits=bits.filter(b=>b.y<cv.height+30);
  raf = bits.length? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height),null);
}

/* ---------- helpers ---------- */
const panel=document.getElementById("panel");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const SPK='<svg class="spk" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3d2c63"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#3d2c63" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const EAR='<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="#3d2c63"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13" stroke="#3d2c63" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';
const STAR=on=>`<svg class="${on?"on":""}" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2 6.1 20.4l1.3-6.5L2.5 9.3l6.6-.8z" fill="${on?"#ffd34e":"#e7e1f5"}" stroke="#3d2c63" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
let runId=0; // cancels sequences when the mode changes

/* ---------- LEARN ---------- */
let filter="all";
function learn(){
  const id=++runId;
  panel.innerHTML="";
  const bar=el("div","row");
  [["all","全部 21"],["body","身體部位"],["feel","不舒服的感覺"]].forEach(([k,t])=>{
    const b=el("button","chip",t); b.setAttribute("aria-pressed",filter===k);
    b.onclick=()=>{filter=k;learn();}; bar.append(b);
  });
  bar.append(el("span","spacer"));
  const playAll=el("button","big","▶ 全部唸給我聽");
  bar.append(playAll);
  panel.append(bar);
  panel.append(el("div","legend",'<span class="dot" style="background:#fff"></span>身體部位　<span class="dot" style="background:#fff4f8"></span>不舒服的感覺　・點一下卡片就會唸喔！'));
  const grid=el("div","grid"); panel.append(grid);
  const list=WORDS.filter(x=>filter==="all"||x.g===filter);
  const cards={};
  list.forEach(x=>{
    const c=el("button","wcard"+(x.g==="feel"?" feel":""),`${SPK}<span class="pic">${x.e}</span><span class="en${x.w.length>9?" long":""}">${x.w}</span><span class="zh">${x.zh}</span>`);
    c.setAttribute("aria-label",`${x.w} ${x.zh}`);
    c.onclick=()=>{ playing=false; playAll.textContent="▶ 全部唸給我聽"; hit(x,c); };
    cards[x.w]=c; grid.append(c);
  });
  function hit(x,c){
    c.classList.remove("playing"); void c.offsetWidth; c.classList.add("playing");
    mood("happy",`<b>${x.w}</b>　${x.zh}`);
    return say(x.w);
  }
  let playing=false;
  playAll.onclick=async()=>{
    if(playing){playing=false;playAll.textContent="▶ 全部唸給我聽";return;}
    playing=true; playAll.textContent="■ 停一下";
    for(const x of list){
      if(!playing||id!==runId) break;
      cards[x.w].scrollIntoView({block:"nearest",behavior:"smooth"});
      await hit(x,cards[x.w]);
      await new Promise(r=>setTimeout(r,550));
    }
    if(id===runId){playing=false;playAll.textContent="▶ 全部唸給我聽";}
  };
}

/* ---------- QUIZ ---------- */
const QN=10;
function quiz(){
  const id=++runId;
  const order=shuffle(WORDS).slice(0,QN);
  let qi=0, firstTry=0;
  mood("idle","仔細聽，<b>找一找</b>是哪一個？");
  function ask(){
    if(id!==runId) return;
    if(qi>=QN) return finish();
    const ans=order[qi];
    let pool=shuffle(WORDS.filter(x=>x.w!==ans.w&&!tricky(x.w,ans.w)));
    const picks=[];
    for(const x of pool){ if(picks.every(p=>!tricky(p.w,x.w))) picks.push(x); if(picks.length===3) break; }
    const opts=shuffle([ans,...picks]);
    panel.innerHTML="";
    const head=el("div","qhead");
    head.append(el("span","qnum",`${qi+1} / ${QN}`));
    const pr=el("div","progress","<i></i>"); head.append(pr);
    panel.append(head);
    requestAnimationFrame(()=>pr.firstChild.style.width=(qi/QN*100)+"%");
    const lis=el("div","listen");
    const ear=el("button","ear",EAR); ear.setAttribute("aria-label","再聽一次");
    lis.append(ear, el("span","","點我再聽一次"));
    panel.append(lis);
    const play=()=>{ear.classList.remove("ping");void ear.offsetWidth;ear.classList.add("ping");say(ans.w);};
    ear.onclick=play;
    const box=el("div","opts"); panel.append(box);
    let tries=0, done=false;
    opts.forEach(x=>{
      const b=el("button","opt",`<span class="pic">${x.e}</span><span class="zh">${x.zh}</span><span class="en">${x.w}</span>`);
      b.onclick=()=>{
        if(done||b.classList.contains("wrong")) return;
        if(x.w===ans.w){
          done=true; b.classList.add("right"); ding();
          if(tries===0){firstTry++; addStars(1);}
          mood("happy",["好棒！","答對了！","你好厲害！","Yes! 太讚了！"][Math.floor(Math.random()*4)]+` <b>${ans.w}</b>`);
          confetti(40);
          setTimeout(()=>say(ans.w),350);
          setTimeout(()=>{qi++;ask();},1900);
        }else{
          tries++; b.classList.add("wrong"); boop();
          mood("oops","差一點點～<b>再聽一次</b>！");
          setTimeout(play,500);
        }
      };
      box.append(b);
    });
    setTimeout(play,350);
  }
  function finish(){
    const n=firstTry>=9?3:firstTry>=6?2:1;
    panel.innerHTML="";
    const r=el("div","result");
    r.append(el("h2","",n===3?"超級厲害！":n===2?"做得很好！":"繼續加油！"));
    r.append(el("div","bigstars",STAR(n>=1)+STAR(n>=2)+STAR(n>=3)));
    r.append(el("p","",`一次就答對 <b>${firstTry}</b> 題（共 ${QN} 題）`));
    const again=el("button","big mint","再玩一次"); again.onclick=quiz;
    r.append(again); panel.append(r);
    mood("happy",n===3?"你是<b>單字小達人</b>！":"豆豆幫你加油！<b>再挑戰</b>一次？");
    fanfare(); confetti(160);
  }
  ask();
}

/* ---------- MEMORY ---------- */
function memory(){
  const id=++runId;
  let pickW=[];
  for(const x of shuffle(WORDS)){ if(pickW.every(p=>!tricky(p.w,x.w))) pickW.push(x); if(pickW.length===6) break; }
  const deck=shuffle(pickW.flatMap(x=>[{x,kind:"pic"},{x,kind:"word"}]));
  panel.innerHTML="";
  const bar=el("div","row");
  const mv=el("span","moves","翻了 0 次"); bar.append(mv, el("span","spacer"));
  const again=el("button","big alt","換一組"); again.onclick=memory; bar.append(again);
  panel.append(bar);
  panel.append(el("div","legend","把<b>圖片</b>和對應的<b>英文單字</b>配成一對！翻開時會唸給你聽。"));
  const g=el("div","mgrid"); panel.append(g);
  mood("idle","來玩<b>翻翻樂</b>！找出一樣的一對～");
  let open=[], lock=false, moves=0, matched=0;
  deck.forEach(card=>{
    const front = card.kind==="pic"
      ? `<span class="pic">${card.x.e}</span><span class="zh">${card.x.zh}</span>`
      : `<span class="en">${card.x.w}</span>`;
    const b=el("button","mcard",`<div class="in"><div class="face back">?</div><div class="face front">${front}</div></div>`);
    b.setAttribute("aria-label","翻牌");
    b.onclick=()=>{
      if(lock||b.classList.contains("open")) return;
      b.classList.add("open"); say(card.x.w); open.push({b,card});
      if(open.length===2){
        moves++; mv.textContent=`翻了 ${moves} 次`;
        const [a,c]=open; open=[];
        if(a.card.x.w===c.card.x.w){
          matched++;
          setTimeout(()=>{a.b.classList.add("done");c.b.classList.add("done");ding();mood("happy",`配對成功！<b>${a.card.x.w}</b>`);},300);
          if(matched===6) setTimeout(()=>{
            if(id!==runId) return;
            const n=moves<=10?3:moves<=15?2:1; addStars(n);
            fanfare(); confetti(160);
            mood("happy",`全部找到了！你用了 <b>${moves}</b> 次，得到 ${n} 顆星！`);
          },900);
        }else{
          lock=true;
          setTimeout(()=>{boop();mood("oops","不一樣喔～<b>記住位置</b>再試試！");},500);
          setTimeout(()=>{a.b.classList.remove("open");c.b.classList.remove("open");lock=false;},1300);
        }
      }
    };
    g.append(b);
  });
}

/* ---------- tabs ---------- */
const MODES={learn,quiz,memory};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(o=>o.setAttribute("aria-selected",o===t));
  if(current) current.pause();
  MODES[t.dataset.mode]();
});
learn();
</script>
