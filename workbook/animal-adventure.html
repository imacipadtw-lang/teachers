<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>動物大冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: a sunrise-savanna stage built for a classroom projector. Layered hills and slow sun rays sit behind everything; the game board floats above in the middle; a chunky toolbar rides on top. One bright look on purpose: projectors wash out dark themes. */
:root{
  --sky-top:#7fd3f7; --sky-low:#d9f4ff; --sun:#ffc531; --sun-deep:#e09a00;
  --leaf:#1fa45b; --leaf-deep:#127a41; --leaf-soft:#d8f6e4;
  --coral:#ff6b57; --coral-deep:#d1432f; --teal:#13a3b8; --teal-deep:#0b7686;
  --ink:#12354a; --ink-soft:#4b6b7d; --paper:#ffffff; --sand:#fff4d6;
  --red-team:#ff4f64; --red-deep:#c62c40; --blue-team:#2f8cff; --blue-deep:#1b5fc0;
  --en:"Baloo 2","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --zh:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--zh);background:var(--sky-low);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--teal);outline-offset:4px}

/* ---------- scenery ---------- */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-low) 62%,#fff1c9)}
.rays{position:absolute;left:50%;top:-40vmax;width:160vmax;height:160vmax;margin-left:-80vmax;opacity:.33;
  background:repeating-conic-gradient(from 0deg,#fff 0 6deg,transparent 6deg 18deg);animation:spin 120s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0,#000 30%,transparent 62%);mask:radial-gradient(circle,#000 0,#000 30%,transparent 62%)}
.sunball{position:absolute;left:50%;top:-14vmax;width:34vmax;height:34vmax;margin-left:-17vmax;border-radius:50%;
  background:radial-gradient(circle at 50% 60%,#fff8d8,#ffe27a 45%,#ffd04a 70%,transparent 71%);opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;height:44px;width:140px;background:#fff;border-radius:44px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:64px;height:64px;left:22px;top:-30px}.cloud::after{width:46px;height:46px;left:70px;top:-20px}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}
.hills{position:absolute;left:0;right:0;bottom:0;height:26vh;min-height:150px}
.hills svg{position:absolute;bottom:0;left:0;width:100%;height:100%}
.parade{position:absolute;left:0;right:0;bottom:3vh;height:12vh;min-height:70px;pointer-events:none}
.walker{position:absolute;bottom:0;height:100%;animation:walk linear infinite}
.walker img{height:100%;width:auto;animation:hop .55s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes walk{from{transform:translateX(-14vh)}to{transform:translateX(calc(100vw + 14vh))}}
@keyframes hop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-14%) rotate(4deg)}}

.app{position:relative;max-width:1500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 16px}
.ico{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.pic{display:inline-flex;align-items:center;justify-content:center;line-height:1}

/* ---------- home ---------- */
.hero{display:grid;justify-items:center;gap:4px;padding-top:min(3vh,24px);text-align:center}
.title{margin:0;font-weight:900;line-height:1;font-size:clamp(46px,7.4vw,104px);letter-spacing:.04em;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .02em}
.title span{display:inline-block;color:#fff;-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .09em 0 var(--ink);animation:dropin .7s cubic-bezier(.2,1.7,.45,1) both}
.title span:nth-child(odd){color:var(--sun)}
@keyframes dropin{from{transform:translateY(-120%) scale(.5);opacity:0}}
.sub-en{font-family:var(--en);font-weight:800;font-size:clamp(22px,2.8vw,40px);color:var(--ink);background:#fff;border-radius:999px;padding:2px 26px;box-shadow:0 6px 0 #0e2a3b33;animation:pop .6s .7s both}
.badge-real{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(15px,1.6vw,20px);background:var(--leaf);color:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 var(--leaf-deep);animation:pop .6s .9s both}
.badge-real i{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 #fff;animation:pulse 1.6s infinite;font-style:normal}
@keyframes pulse{70%{box-shadow:0 0 0 10px #fff0}100%{box-shadow:0 0 0 0 #fff0}}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:center;align-items:center}
.seg{display:flex;background:#ffffffd9;border-radius:20px;padding:5px;gap:4px;box-shadow:0 5px 0 #0e2a3b26}
.seg button{border-radius:15px;padding:8px 16px;font-weight:900;font-size:clamp(15px,1.6vw,20px);color:var(--ink-soft);min-height:48px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg .lab{align-self:center;padding:0 8px 0 10px;font-weight:900;color:var(--ink);font-size:clamp(14px,1.5vw,18px)}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.mode{position:relative;background:var(--paper);border-radius:30px;padding:18px 12px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  border:5px solid var(--c);box-shadow:0 10px 0 var(--cd),0 22px 30px #0e2a3b33;transition:transform .18s;animation:rise .6s both}
.mode:nth-child(2){animation-delay:.08s}.mode:nth-child(3){animation-delay:.16s}.mode:nth-child(4){animation-delay:.24s}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.mode:hover{transform:translateY(-6px) rotate(-1deg)}
.mode:active{transform:translateY(6px);box-shadow:0 4px 0 var(--cd)}
.mode .pics{display:flex;align-items:center;justify-content:center;gap:2px;height:clamp(78px,9vw,124px)}
.mode .pics .pic{width:clamp(70px,8vw,112px);height:100%}
.mode .pics .pic:nth-child(2){margin-left:-14px;transform:rotate(8deg)}
.mode b{font-size:clamp(23px,2.5vw,34px);font-weight:900;line-height:1.2}
.mode .en{font-family:var(--en);font-weight:800;font-size:clamp(17px,1.8vw,24px);color:var(--cd);line-height:1.1}
.mode .kind{position:absolute;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--c);color:#fff;font-weight:900;font-size:14px;border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 var(--cd)}
.mode.star{background:linear-gradient(160deg,#fffbe9,#fff)}
.mode.star .kind{background:var(--ink);box-shadow:0 3px 0 #000}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.howto li{background:#ffffffd9;border-radius:20px;padding:12px 16px;font-size:clamp(15px,1.55vw,19px);line-height:1.55;font-weight:700;display:flex;gap:12px;align-items:flex-start}
.howto li .pic{flex:none;width:44px;height:44px}
.foot{display:flex;justify-content:center;align-items:center;gap:12px 18px;flex-wrap:wrap}
.keys{font-weight:700;font-size:15px;color:var(--ink-soft);background:#ffffffb0;border-radius:999px;padding:8px 16px}
@media (hover:none) and (pointer:coarse){.keys{display:none}}
.link{font-weight:900;color:var(--ink);background:#ffffffd9;border-radius:999px;padding:8px 18px;font-size:16px;box-shadow:0 4px 0 #0e2a3b26;min-height:44px}
.warn{background:#fff3cd;border:3px solid var(--sun);border-radius:16px;padding:10px 16px;font-size:17px;font-weight:700;text-align:center}

/* ---------- toolbar ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tool{background:#fff;border-radius:18px;min-width:60px;min-height:60px;padding:0 14px;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 #0e2a3b33}
.tool:active{transform:translateY(4px);box-shadow:0 1px 0 #0e2a3b33}
.tool span{font-size:19px}
.tool.sun{background:var(--sun);box-shadow:0 5px 0 var(--sun-deep)}
.tool[disabled]{opacity:.45;cursor:default}
.topic{flex:1;min-width:0;text-align:center;font-family:var(--en);font-weight:800;font-size:clamp(20px,2.4vw,32px);line-height:1.1}
.topic small{display:block;font-family:var(--zh);font-size:.55em;font-weight:900;color:var(--ink-soft)}
.score{display:flex;gap:8px;align-items:center}
.pill{position:relative;background:#fff;border-radius:18px;padding:6px 16px;min-height:60px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 5px 0 #0e2a3b33;transition:transform .2s}
.pill small{font-size:13px;font-weight:900;color:var(--ink-soft);line-height:1.1}
.pill b{font-family:var(--en);font-weight:800;font-size:clamp(24px,2.6vw,34px);line-height:1;font-variant-numeric:tabular-nums}
.pill.red{background:var(--red-team);color:#fff;box-shadow:0 5px 0 var(--red-deep)}
.pill.blue{background:var(--blue-team);color:#fff;box-shadow:0 5px 0 var(--blue-deep)}
.pill.red small,.pill.blue small{color:#ffffffd9}
.pill.turn{transform:scale(1.12);animation:glow 1.2s ease-in-out infinite}
.pill.dim{opacity:.55;transform:scale(.92)}
@keyframes glow{50%{box-shadow:0 5px 0 #0003,0 0 0 8px #fff9,0 0 30px 6px #fff}}
.pill.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.35)}}
.turnflag{font-weight:900;font-size:clamp(18px,2vw,26px);padding:6px 16px;border-radius:999px;color:#fff;white-space:nowrap}

/* ---------- memory board ---------- */
.board{flex:1;display:flex;align-items:center;justify-content:center;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--cw));gap:var(--gap);justify-content:center}
.card{position:relative;width:var(--cw);height:calc(var(--cw)/.84);max-width:100%;perspective:1000px;touch-action:none;outline:none}
.card.deal{animation:deal .6s cubic-bezier(.2,1.25,.4,1) both}
@keyframes deal{from{transform:translate(var(--dx),var(--dy)) rotate(var(--dr)) scale(.3);opacity:0}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.45,.5,1)}
.card.up .flip{transform:rotateY(180deg)}
.card.drag{z-index:30}
.card.drag .flip{transform:scale(1.08) rotate(-5deg);transition:transform .1s}
.card.target .face.back{box-shadow:0 0 0 7px var(--sun),0 9px 0 #0003}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--cw)*.13);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;overflow:hidden}
.back{--bc:var(--coral);--bd:var(--coral-deep);background:var(--bc);box-shadow:inset 0 -10px 0 #0002,inset 0 5px 0 #fff6,0 9px 0 var(--bd),0 16px 22px #0e2a3b40}
.back::before{content:"";position:absolute;inset:7%;border-radius:calc(var(--cw)*.09);border:3px dashed #ffffffa0}
.back::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 18%,#ffffff70 0 14%,transparent 15%),repeating-linear-gradient(45deg,#ffffff14 0 10px,transparent 10px 20px)}
.card:nth-child(3n+2) .back{--bc:var(--leaf);--bd:var(--leaf-deep)}
.card:nth-child(3n) .back{--bc:var(--teal);--bd:var(--teal-deep)}
.back .pic{width:46%;height:40%;position:relative;z-index:1;filter:drop-shadow(0 4px 0 #0003)}
.back .pic img{filter:brightness(0) invert(1)}
.back i{position:relative;z-index:1;font-style:normal;font-family:var(--en);font-weight:800;color:#fff;font-size:calc(var(--cw)*.2);line-height:1;text-shadow:0 3px 0 #0003}
.front{transform:rotateY(180deg);background:linear-gradient(#fff,#f2f7fb);border:5px solid #fff;box-shadow:inset 0 -9px 0 #dbe7ef,0 9px 0 #a8c1d1,0 16px 22px #0e2a3b40}
.front .pic{width:66%;height:56%;filter:drop-shadow(0 8px 6px #0e2a3b33)}
.front .w{font-family:var(--en);font-weight:800;font-size:calc(var(--cw)*.17);line-height:1;color:var(--ink);max-width:92%;text-align:center;overflow-wrap:anywhere}
.front.word{background:linear-gradient(#fffaf0,var(--sand));box-shadow:inset 0 -9px 0 #f3dca0,0 9px 0 #d8b558,0 16px 22px #0e2a3b40}
.front.word .w{font-size:calc(var(--cw)*.24)}
.front .ear{position:absolute;top:6%;right:7%;width:calc(var(--cw)*.17);height:calc(var(--cw)*.17);border-radius:50%;background:var(--leaf);display:grid;place-items:center;color:#fff;font-size:calc(var(--cw)*.09);box-shadow:0 3px 0 var(--leaf-deep)}
.card.match .front{border-color:var(--leaf);background:linear-gradient(#f3fff8,var(--leaf-soft));box-shadow:inset 0 -9px 0 #b4ecce,0 9px 0 var(--leaf-deep),0 0 0 8px #1fa45b66}
.card.match .flip{animation:won .7s .05s}
.card.bad .flip{animation:shake .5s}
.card.bad .front{border-color:var(--coral)}
.card.gone{opacity:.9}
@keyframes won{40%{transform:rotateY(180deg) translateY(-24px) scale(1.08)}}
@keyframes shake{20%,60%{transform:rotateY(180deg) translateX(-12px)}40%,80%{transform:rotateY(180deg) translateX(12px)}}

/* ---------- listening quest ---------- */
.quest{flex:1;display:grid;grid-template-rows:auto auto 1fr;gap:clamp(8px,1.6vh,18px);align-items:start;justify-items:center}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots i{width:22px;height:22px;border-radius:50%;background:#ffffffb0;border:3px solid #fff;display:block}
.dots i.now{background:var(--sun);transform:scale(1.3);box-shadow:0 0 0 4px #ffc53155}
.dots i.ok{background:var(--leaf)}.dots i.miss{background:var(--coral)}
.speaker{position:relative;display:flex;align-items:center;gap:18px;background:#fff;border-radius:999px;padding:10px 30px 10px 12px;box-shadow:0 8px 0 #0e2a3b33}
.speaker .disc{position:relative;width:clamp(84px,11vh,120px);height:clamp(84px,11vh,120px);border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:clamp(40px,5.4vh,58px);box-shadow:0 6px 0 var(--sun-deep)}
.speaker .disc::before,.speaker .disc::after{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid var(--sun);opacity:0}
.speaker.playing .disc::before{animation:ring 1s infinite}.speaker.playing .disc::after{animation:ring 1s .45s infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.speaker .say{text-align:left;font-weight:900;font-size:clamp(20px,2.4vw,32px);line-height:1.2}
.speaker .say small{display:block;font-size:.6em;color:var(--ink-soft)}
.timer{width:min(560px,80vw);height:14px;border-radius:999px;background:#ffffffa0;overflow:hidden;border:3px solid #fff}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--leaf),var(--sun));transform-origin:left;border-radius:999px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2.2vw,34px);width:min(1200px,100%);align-self:center}
.opt{position:relative;aspect-ratio:1;max-height:calc(100dvh - 380px);justify-self:center;width:100%;border-radius:50%;background:radial-gradient(circle at 32% 24%,#fff 0 12%,#ffffffd0 13%,#e9f8ff 55%,#bfe9fb);
  border:6px solid #fff;box-shadow:0 10px 0 #7cc4e0,0 20px 30px #0e2a3b40;display:grid;place-items:center;animation:float 3.2s ease-in-out infinite;transition:transform .15s}
.opt:nth-child(2){animation-delay:-.8s}.opt:nth-child(3){animation-delay:-1.6s}.opt:nth-child(4){animation-delay:-2.4s}
.opt .pic{width:70%;height:70%;filter:drop-shadow(0 8px 6px #0e2a3b33)}
.opt .key{position:absolute;top:4%;left:8%;width:clamp(30px,3vw,42px);height:clamp(30px,3vw,42px);border-radius:50%;background:var(--ink);color:#fff;font-family:var(--en);font-weight:800;font-size:clamp(17px,1.7vw,24px);display:grid;place-items:center;box-shadow:0 3px 0 #0005}
.opt.wordopt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%}
.opt.wordopt .wtxt{font-family:var(--en);font-weight:800;font-size:clamp(26px,3.6vw,56px);line-height:1;color:var(--ink);max-width:86%;overflow-wrap:anywhere;text-align:center}
.opt.wordopt .minipic{position:absolute;left:50%;bottom:9%;width:28%;height:28%;transform:translateX(-50%);opacity:0;transition:opacity .25s}
.opt.wordopt .minipic .pic{width:100%;height:100%}
.opt.wordopt.show .minipic{opacity:1}
.opt .lbl{position:absolute;bottom:-6%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--en);font-weight:800;font-size:clamp(18px,2vw,30px);border-radius:999px;padding:0 16px;white-space:nowrap;opacity:0;transition:opacity .2s}
.opt.show .lbl{opacity:1}
.opt:hover{transform:scale(1.05)}
.opt:active{transform:scale(.95)}
@keyframes float{50%{translate:0 -10px}}
.opt.right{background:radial-gradient(circle at 32% 24%,#fff 0 12%,#f0fff6 13%,var(--leaf-soft) 55%,#8fe0b4);border-color:var(--leaf);box-shadow:0 10px 0 var(--leaf-deep),0 0 0 10px #1fa45b55;animation:winpop .6s}
.opt.wrong{filter:grayscale(1);opacity:.45;animation:shake2 .45s;pointer-events:none}
.opt.reveal{border-color:var(--sun);box-shadow:0 10px 0 var(--sun-deep),0 0 0 10px #ffc53177;animation:winpop .6s}
@keyframes winpop{40%{transform:scale(1.14)}}
@keyframes shake2{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}

/* ---------- feedback & fx ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.fb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
.bubble{background:#fff;border-radius:40px;padding:20px 36px;display:flex;align-items:center;gap:20px;max-width:94vw;flex-wrap:wrap;justify-content:center;
  box-shadow:0 12px 0 var(--leaf-deep),0 30px 60px #0e2a3b55;border:6px solid var(--leaf);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.bubble .pic{width:clamp(80px,11vw,140px);height:clamp(80px,11vw,140px)}
.bubble .t{font-family:var(--en);font-weight:800;font-size:clamp(32px,4.8vw,64px);line-height:1.1}
.bubble .t small{display:block;font-family:var(--zh);font-size:.45em;color:var(--ink-soft);font-weight:900}
.stamp{font-family:var(--en);font-weight:800;font-size:clamp(60px,11vw,150px);color:var(--sun);-webkit-text-stroke:.06em var(--ink);paint-order:stroke fill;text-shadow:0 .08em 0 var(--ink);animation:stamp .9s cubic-bezier(.2,1.6,.4,1) both;text-align:center;line-height:1}
.stamp small{display:block;font-family:var(--zh);font-size:.32em;color:#fff;font-weight:900}
@keyframes stamp{from{transform:scale(3) rotate(-14deg);opacity:0}60%{transform:scale(.95) rotate(-6deg);opacity:1}to{transform:scale(1) rotate(-6deg)}}
.fb .x{font-family:var(--en);font-weight:800;font-size:min(300px,55vw);color:var(--coral);-webkit-text-stroke:8px #fff;paint-order:stroke fill;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.turnbanner{font-weight:900;font-size:clamp(40px,7vw,90px);color:#fff;padding:16px 50px;border-radius:40px;animation:pop .45s cubic-bezier(.2,1.6,.4,1);box-shadow:0 12px 0 #0003}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.float{position:fixed;z-index:55;pointer-events:none;font-family:var(--en);font-weight:800;font-size:clamp(30px,4vw,54px);color:var(--leaf);-webkit-text-stroke:6px #fff;paint-order:stroke fill;animation:up 1.1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes up{to{margin-top:-120px;opacity:0}}

/* ---------- end ---------- */
.endbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(14px,1.6vh);text-align:center}
.trophy{width:clamp(90px,min(17vw,19vh),210px);height:clamp(90px,min(17vw,19vh),210px);animation:trophy 1s cubic-bezier(.2,1.6,.4,1) both,bob 2.4s 1s ease-in-out infinite}
@keyframes trophy{from{transform:scale(0) rotate(-30deg)}}
@keyframes bob{50%{transform:translateY(-12px)}}
.stars{display:flex;gap:10px}
.stars i{font-style:normal;font-size:clamp(44px,min(8vw,9vh),96px);line-height:1;color:var(--sun);-webkit-text-stroke:3px var(--sun-deep);animation:starin .5s cubic-bezier(.2,1.8,.4,1) both}
.stars i:nth-child(2){animation-delay:.25s}.stars i:nth-child(3){animation-delay:.5s}
.stars i.off{color:#fff;-webkit-text-stroke:3px #b7cbd8}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.big{margin:0;font-size:clamp(26px,min(5vw,6.2vh),64px);font-weight:900;line-height:1.2}
.big b{font-family:var(--en);font-size:1.2em}
.big .g{color:var(--leaf)}.big .r{color:var(--coral)}
.winner{font-size:clamp(34px,min(7vw,7.5vh),90px);font-weight:900;color:#fff;padding:8px 40px;border-radius:30px;box-shadow:0 10px 0 #0003}
.sub{margin:0;font-size:clamp(18px,2.2vw,28px);font-weight:700;color:var(--ink-soft)}
.btn{border-radius:24px;padding:10px 34px;font-size:clamp(22px,min(2.8vw,3.6vh),34px);font-weight:900;color:#fff;background:var(--leaf);box-shadow:0 8px 0 var(--leaf-deep);min-height:min(80px,9vh)}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--leaf-deep)}
.btn.alt{background:var(--teal);box-shadow:0 8px 0 var(--teal-deep)}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.review{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1200px}
.review button{background:#fff;border-radius:18px;padding:4px 14px 4px 6px;display:flex;align-items:center;gap:6px;font-family:var(--en);font-weight:700;font-size:clamp(16px,min(1.8vw,2.6vh),24px);box-shadow:0 5px 0 #0e2a3b33;min-height:50px}
.review button small{font-family:var(--zh);font-size:.7em;color:var(--ink-soft);font-weight:900}
.review .pic{width:min(44px,5vh);height:min(44px,5vh)}

/* ---------- credits dialog ---------- */
dialog{border:0;border-radius:28px;padding:0;max-width:min(860px,94vw);width:100%;max-height:86vh;color:var(--ink);background:#fff;box-shadow:0 30px 80px #0e2a3b66}
dialog::backdrop{background:#0e2a3b99}
.dlg{padding:22px 24px;display:flex;flex-direction:column;gap:12px;max-height:86vh}
.dlg h2{margin:0;font-size:26px;font-weight:900}
.dlg p{margin:0;font-size:16px;line-height:1.6;color:var(--ink-soft);font-weight:500}
.dlg .list{overflow:auto;border-radius:16px;border:2px solid #e3eef4}
.dlg table{width:100%;border-collapse:collapse;font-size:15px}
.dlg td,.dlg th{padding:8px 10px;border-bottom:1px solid #e3eef4;text-align:left;vertical-align:middle}
.dlg th{position:sticky;top:0;background:#f3f9fc;font-weight:900}
.dlg td:first-child{font-family:var(--en);font-weight:800;font-size:18px}
.dlg a{color:var(--teal-deep);font-weight:700}
.dlg .play{width:40px;height:40px;border-radius:50%;background:var(--leaf);color:#fff;font-size:16px}
.dlg .close{align-self:flex-end}

@media (max-width:980px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}.howto{grid-template-columns:1fr}}
@media (max-width:760px){.tool span{display:none}.bar .topic{order:-1;flex-basis:100%}.bar #fs{display:none}.bar .score{margin-left:auto}.tool,.pill{min-height:52px;min-width:52px}.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{max-height:none;width:min(100%,38vw)}.speaker{padding-right:20px}}
@media (max-width:480px){.modes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

 if(G.open.length===2){G.lock=true;setTimeout(check,1100)}return true}
async function check(){if(!G||G.kind!=='mem')return;const g=G;const [a,b]=g.open,A=g.cards[a],B=g.cards[b],ea=el(a),eb=el(b);
 if(A.p===B.p){A.done=B.done=true;g.ok++;g.found++;g.combo++;g.best=Math.max(g.best,g.combo);ea.classList.add('match');eb.classList.add('match');
  const pts=g.combo>1?2:1;if(g.team){g.sc[g.turn]+=pts;document.getElementById(g.turn?'sB':'sR').textContent=g.sc[g.turn];bump(g.turn?'pB':'pR')}else{document.getElementById('ok').textContent=g.ok;bump('pOk')}
  const [x1,y1]=centerOf(ea),[x2,y2]=centerOf(eb);burst(x1,y1,34);burst(x2,y2,34);sfx(g.combo>1?'combo':'ok');
  if(g.combo>1)floatText(`COMBO ×${g.combo}`,(x1+x2)/2,(y1+y2)/2,'var(--sun)');else floatText(g.team?'+1':'Nice!',(x1+x2)/2,(y1+y2)/2);
  const p=g.ps[A.p];
  show(`<div class="bubble">${pic(p[0])}${p[2]?pic(p[2]):''}<div class="t">${p[4]}<small>${ZH[p[1]]||''}${p[2]&&ZH[p[3]]?'・'+ZH[p[3]]:''}</small></div></div>`,2600);
  if(S.sentence&&synth)await speakSentence(p[4]);else await wait(1500);
  if(G!==g)return;g.open=[];g.lock=false;if(g.found===g.ps.length)setTimeout(endMem,400);
 }else{g.no++;g.combo=0;ea.classList.add('bad');eb.classList.add('bad');sfx('no');show('<div class="x">✗</div>',700);
  if(!g.team){document.getElementById('no').textContent=g.no;bump('pNo')}
  setTimeout(()=>{if(G!==g)return;ea.classList.remove('bad','up');eb.classList.remove('bad','up');g.open=[];g.lock=false;
   if(g.team){g.turn^=1;paintTurn();teamBanner()}},1300)}}
function bind(e){const i=+e.dataset.i;let sx,sy,pid=null,moved=false;
 e.addEventListener('keydown',k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();flip(i)}});
 e.addEventListener('pointerdown',ev=>{if(!G||G.lock||G.cards[i].done)return;pid=ev.pointerId;sx=ev.clientX;sy=ev.clientY;moved=false;try{e.setPointerCapture(pid)}catch(x){}});
 e.addEventListener('pointermove',ev=>{if(ev.pointerId!==pid)return;const dx=ev.clientX-sx,dy=ev.clientY-sy;
  if(!moved&&Math.hypot(dx,dy)>12){moved=true;e.classList.add('drag')}
  if(moved){e.style.transform=`translate(${dx}px,${dy}px)`;mark(ev)}});
 const up=ev=>{if(ev.pointerId!==pid)return;pid=null;e.classList.remove('drag');e.style.transform='';const t=moved?target(ev):null;mark(null);
  if(!moved){flip(i);return}
  if(t!==null&&t!==i){if(!G.open.includes(i))flip(i);setTimeout(()=>flip(t),G.open.length<2?140:0)}};
 e.addEventListener('pointerup',up);
 e.addEventListener('pointercancel',ev=>{if(ev.pointerId!==pid)return;pid=null;e.classList.remove('drag');e.style.transform='';mark(null)})}
function target(ev){for(const c of document.querySelectorAll('.card')){if(c.classList.contains('drag'))continue;const r=c.getBoundingClientRect();
 if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){const j=+c.dataset.i;return G.cards[j].done?null:j}}return null}
function mark(ev){document.querySelectorAll('.card.target').forEach(c=>c.classList.remove('target'));if(!ev)return;const t=target(ev);if(t!==null)el(t).classList.add('target')}
function endMem(){const g=G;const st=g.no<=Math.ceil(g.ps.length/3)?3:g.no<=g.ps.length?2:1;
 endScreen({topic:g.m.en,zh:g.m.zh,stars:st,
  line:g.team?'':`全班答對 <b class="g">${g.ok}</b> 次・答錯 <b class="r">${g.no}</b> 次`,
  sub:`全部 ${g.ps.length} 對都找到了！最高連續配對 ${g.best} 次。點下面的卡片再聽一次 👇`,
  review:g.ps.map(p=>({imgs:[p[0],p[2]].filter(Boolean),txt:p[4],zh:'',say:()=>S.sentence&&synth?speakSentence(p[4]):playWord(p[1])})),
  again:()=>start(g.m.id)})}

/* ---------- listening quest ---------- */
function quest(){parade(false);stopAll();
 const qs=shuffle(POOL).slice(0,QUESTIONS).map(t=>{const others=shuffle(POOL.filter(x=>x.w!==t.w)).slice(0,3);return{t,opts:shuffle([t,...others])}});
 preload(qs.map(q=>q.t.w));
 G={kind:'quest',qs,i:0,score:0,sc:[0,0],team:S.team,turn:0,combo:0,best:0,ok:0,no:0,tries:0,lock:true,res:[],t0:0,tm:null};
 $app.innerHTML=`
 <div class="bar">
  <button class="tool" id="home" aria-label="回主畫面">🏠<span>主畫面</span></button>
  <div class="topic">Listen &amp; Catch!<small>聽音抓動物</small></div>
  <div class="score">${G.team?scoreHTML():`<div class="pill" id="pOk"><small>分數</small><b id="pts">0</b></div><div class="pill" id="pC"><small>連擊</small><b id="cmb">0</b></div>`}</div>
  <button class="tool" id="say" aria-label="再聽一次（R）" title="再聽一次（R）">🔊</button>
  <button class="tool" id="slow" aria-label="慢速再聽（S）" title="慢速再聽（S）">🐢</button>
  <button class="tool" id="fs" aria-label="全螢幕">⛶</button>
 </div>
 <div class="quest" id="q"></div>`;
 wireBar();document.getElementById('say').onclick=()=>{if(G&&G.kind==='quest'){sfx('tick');listen()}};document.getElementById('slow').onclick=()=>{if(G&&G.kind==='quest'){sfx('tick');listen(.7)}};
 paintTurn();ask();}
function listen(rate=1){const sp=document.querySelector('.speaker');sp&&sp.classList.add('playing');return playWord(G.qs[G.i].t.w,rate).then(()=>{sp&&sp.classList.remove('playing')})}
async function ask(){const g=G;const q=g.qs[g.i];g.tries=0;g.lock=true;
 document.getElementById('q').innerHTML=`
  <div class="dots">${g.qs.map((_,k)=>`<i class="${k<g.i?(g.res[k]?'ok':'miss'):k===g.i?'now':''}"></i>`).join('')}</div>
  <button class="speaker" id="spk" aria-label="播放題目發音"><span class="disc">🔊</span><span class="say">${S.qmode==='word'?'聽一聽，是哪個英文字？':'聽一聽，是哪一個？'}<small>第 ${g.i+1} 題 / 共 ${g.qs.length} 題${g.team?`・${g.turn?'藍隊':'紅隊'}作答`:''}</small></span></button>
  <div class="opts" id="opts">${q.opts.map((o,k)=>`<button class="opt${S.qmode==='word'?' wordopt':''}" data-k="${k}" aria-label="選項 ${k+1}"><span class="key" aria-hidden="true">${k+1}</span>${S.qmode==='word'?`<span class="wtxt">${o.w}</span><span class="minipic">${pic(o.img)}</span>`:`${pic(o.img)}<span class="lbl">${o.w}</span>`}</button>`).join('')}</div>
  <div class="timer" aria-hidden="true"><i id="tbar"></i></div>`;
 document.getElementById('spk').onclick=()=>{sfx('tick');listen()};
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k,b));
 if(g.team&&g.i>0)teamBanner();
 await wait(g.team&&g.i>0?950:450);if(G!==g)return;
 await listen();if(G!==g)return;g.lock=false;g.t0=performance.now();runTimer(g)}
function runTimer(g){const bar=document.getElementById('tbar');const dur=8000;cancelAnimationFrame(g.tm);
 const step=()=>{if(G!==g||!bar.isConnected)return;const f=Math.max(0,1-(performance.now()-g.t0)/dur);bar.style.transform=`scaleX(${f})`;if(f>0&&!g.lock)g.tm=requestAnimationFrame(step)};step()}
async function pick(k,btn){const g=G;if(!g||g.lock)return;const q=g.qs[g.i];const o=q.opts[k];
 if(o.w===q.t.w){g.lock=true;btn.classList.add('right','show');const [x,y]=centerOf(btn);
  const speed=Math.max(0,1-(performance.now()-g.t0)/8000);const first=g.tries===0;
  if(first){g.combo++;g.best=Math.max(g.best,g.combo)}else g.combo=0;
  const mult=Math.min(3,1+Math.floor(g.combo/3));let pts=first?Math.round((100+50*speed)*mult):50;
  g.res[g.i]=first;first?g.ok++:g.no++;
  if(g.team){g.sc[g.turn]+=pts;document.getElementById(g.turn?'sB':'sR').textContent=g.sc[g.turn];bump(g.turn?'pB':'pR')}
  else{g.score+=pts;document.getElementById('pts').textContent=g.score;document.getElementById('cmb').textContent=g.combo;bump('pOk');if(g.combo)bump('pC')}
  burst(x,y,60,1.2);sfx(g.combo>=3&&first?'combo':'ok');floatText('+'+pts,x,y-40);
  if(first&&g.combo>=3&&g.combo%3===0){show(`<div class="stamp">COMBO ×${mult}<small>連續答對 ${g.combo} 題！</small></div>`,1300);rain()}
  await wait(250);await playWord(q.t.w);if(G!==g)return;
  document.querySelectorAll('.opt').forEach(b=>b.classList.add('show'));
  await wait(1100);if(G!==g)return;next(g)}
 else{g.tries++;g.combo=0;btn.classList.add('wrong','show');sfx('no');if(!g.team)document.getElementById('cmb').textContent=0;
  if(g.team||g.tries>=2){g.lock=true;g.res[g.i]=false;g.no++;const right=[...document.querySelectorAll('.opt')][q.opts.findIndex(x=>x.w===q.t.w)];
   await wait(400);right.classList.add('reveal','show');await playWord(q.t.w);if(G!==g)return;await wait(1200);if(G!==g)return;next(g)}
  else{await wait(350);if(G===g)listen()}}}
function next(g){g.i++;if(g.team)g.turn^=1;paintTurn();if(g.i>=g.qs.length)endQuest();else ask()}
function endQuest(){const g=G;const st=g.ok>=9?3:g.ok>=6?2:1;
 endScreen({topic:'Listen & Catch!',zh:'聽音抓動物',stars:st,
  line:g.team?'':`總分 <b class="g">${g.score}</b>・答對 <b class="g">${g.ok}</b> / ${g.qs.length} 題`,
  sub:`最高連擊 ${g.best} 題！點下面的動物再聽一次真人發音 👇`,
  review:g.qs.map((q,k)=>({imgs:[q.t.img],txt:q.t.w,zh:ZH[q.t.w],bad:!g.res[k],say:()=>playWord(q.t.w)})),
  again:quest})}

/* ---------- end screen ---------- */
function endScreen(o){const g=G;clearTimeout(show.t);$fb.hidden=true;$fb.innerHTML='';sfx('win');rain();setTimeout(rain,700);
 let head='';if(g.team){const [r,b]=g.sc;head=r===b?`<div class="winner" style="background:var(--teal)">平手！兩隊都好棒</div>`:`<div class="winner" style="background:${r>b?'var(--red-team)':'var(--blue-team)'}">${r>b?'紅隊':'藍隊'}獲勝！</div>`;
  o.line=`紅隊 <b class="r">${r}</b> 分・藍隊 <b style="color:var(--blue-team)">${b}</b> 分`}
 speakSentence(g.team?'Great game!':o.stars===3?'Excellent!':o.stars===2?'Great job!':'Good try!');
 $app.innerHTML=`
 <div class="bar"><button class="tool" id="home">🏠<span>主畫面</span></button><div class="topic">${o.topic}<small>${o.zh}</small></div></div>
 <div class="endbox">
  <span class="pic trophy">${IMG.trophy?`<img class="ico" src="${IMG.trophy}" alt="">`:'🏆'}</span>
  ${head}
  <div class="stars">${[0,1,2].map(i=>`<i class="${i<o.stars?'':'off'}">★</i>`).join('')}</div>
  <p class="big">${o.line}</p>
  <p class="sub">${o.sub}</p>
  <div class="review">${o.review.map((r,i)=>`<button data-i="${i}" ${r.bad?'style="box-shadow:0 5px 0 var(--coral)"':''}>${r.imgs.map(pic).join('')}<span>${r.txt}${r.zh?` <small>${r.zh}</small>`:''}</span></button>`).join('')}</div>
  <div class="row"><button class="btn" id="again">再玩一次 🔄</button><button class="btn alt" id="change">換主題</button></div>
 </div>`;
 document.getElementById('home').onclick=home;document.getElementById('change').onclick=home;document.getElementById('again').onclick=o.again;
 $app.querySelectorAll('.review button').forEach(b=>b.onclick=()=>o.review[+b.dataset.i].say());
 const t=document.querySelector('.trophy');setTimeout(()=>{if(t.isConnected){const [x,y]=centerOf(t);burst(x,y,80,1.4,'star')}},500)}

/* ---------- credits ---------- */
function credits(){const d=document.getElementById('credits');const ws=Object.keys(ZH).sort();
 d.innerHTML=`<div class="dlg"><h2>🎧 真人錄音來源與授權</h2>
 <p>每個單字的發音都是真人錄音，取自 Wikimedia Commons（維基共享資源），透過 Wiktionary 英文詞條找到，大多由同一位美國錄音者錄製。檔案依原授權使用，只轉成 MP3 並調整整體音量，沒有剪接。每個錄音都核對過 Wikimedia 檔案說明（單字、美式發音、詞性，例如 desert 用名詞「沙漠」的念法），並用 Whisper 語音辨識逐一確認念的是正確的字。配對後念的整句是瀏覽器的電腦語音，可在主畫面關閉。</p>

 ${ws.map(w=>{const c=CREDITS[w];return `<tr><td>${w} <small style="font-family:var(--zh);font-weight:700;color:var(--ink-soft)">${ZH[w]}</small></td>

  <td>${c?(c.artist||'—'):'—'}</td><td>${c?c.license:'—'}</td><td>${c?`<a href="${c.page}" target="_blank" rel="noopener">${c.file}</a>`:'—'}</td></tr>`}).join('')}
 </tbody></table></div>
 <p>插圖：Microsoft Fluent Emoji（MIT 授權）。</p>
 <button class="btn close" id="cx">關閉</button></div>`;
 d.querySelectorAll('.play').forEach(b=>b.onclick=()=>playWord(b.dataset.w));
 document.getElementById('cx').onclick=()=>d.close();
 try{d.showModal()}catch(e){d.setAttribute('open','')}}

let keyBuf='',keyT=0;
function flipByNumber(n){if(!G||G.kind!=='mem')return;const i=n-1;if(i>=0&&i<G.cards.length){const e=el(i);if(e){e.focus({preventScroll:true});flip(i)}}}
document.addEventListener('keydown',e=>{if(!G||e.ctrlKey||e.metaKey||e.altKey)return;if(document.getElementById('credits').open)return;
 const k=e.key.toLowerCase();
 if(k==='r'||(k===' '&&e.target===document.body)){e.preventDefault();G.kind==='quest'?listen():replay(false);return}
 if(k==='s'){e.preventDefault();G.kind==='quest'?listen(.7):replay(true);return}
 if(!/^[0-9]$/.test(k))return;
 if(G.kind==='quest'){const n=+k;if(n>=1&&n<=4){const b=document.querySelector(`.opt[data-k="${n-1}"]`);if(b&&!b.classList.contains('wrong'))pick(n-1,b)}return}
 if(G.kind==='mem'){clearTimeout(keyT);keyBuf+=k;const n=+keyBuf;
  if(n*10>G.cards.length||keyBuf.length>=2){keyBuf='';flipByNumber(n)}else keyT=setTimeout(()=>{const m=+keyBuf;keyBuf='';flipByNumber(m)},650)}});
home();
