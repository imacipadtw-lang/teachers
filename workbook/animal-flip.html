<title>動物翻翻樂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: toy-box stage for a projector. Glossy candy-colored 3D cards in a 4x3 grid that fills the screen height; big toolbar on top. Single bright look on purpose: projectors wash out dark themes. */
:root{
  --sky1:#bfe6ff; --sky2:#e9f7ff; --ink:#1b2a4e; --muted:#4d5f85; --paper:#ffffff;
  --berry:#ff5d8f; --berry-d:#c93468; --grape:#7b5cff; --grape-d:#5136c9;
  --mint:#18b56a; --mint-d:#0c7d47; --mint-soft:#dcf7e8; --red:#ef3b3b; --sun:#ffc93c; --sun-d:#d99a00;
  --en:"Fredoka","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --zh:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--zh);overflow-x:hidden;
  background:radial-gradient(circle at 15% 12%,#fff 0 70px,transparent 71px),radial-gradient(circle at 22% 10%,#fff 0 50px,transparent 51px),
  radial-gradient(circle at 85% 18%,#fff 0 60px,transparent 61px),radial-gradient(circle at 91% 15%,#fff 0 42px,transparent 43px),
  linear-gradient(var(--sky1),var(--sky2) 70%,#d8f5c8);background-attachment:fixed;background-color:var(--sky2);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--grape);outline-offset:4px}
.app{max-width:1400px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:14px 18px}
.ico{width:1em;height:1em;object-fit:contain;vertical-align:-.15em;display:inline-block}
.emo{display:inline-flex;align-items:center;justify-content:center;line-height:1}
/* home */
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;text-align:center;padding-top:6px}
h1{margin:0;font-size:clamp(40px,6.4vw,84px);font-weight:900;line-height:1.1;text-wrap:balance;
  color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
h1 .en{font-family:var(--en);color:var(--sun);display:block;font-size:.55em;margin-top:6px}
.hero .ico{font-size:clamp(70px,10vw,130px);animation:bob 2.6s ease-in-out infinite}
.hero .ico:last-child{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,26px)}
.mode{background:linear-gradient(#fff,#f1f5ff);border-radius:32px;padding:22px 16px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 10px 0 var(--c,var(--grape)),0 18px 30px #1b2a4e30;border:4px solid var(--c,var(--grape));transition:transform .15s}
.mode:hover{transform:translateY(-4px)}
.mode:active{transform:translateY(6px);box-shadow:0 4px 0 var(--c,var(--grape))}
.mode .pics{font-size:clamp(64px,8vw,110px);display:flex;align-items:center;gap:4px}
.mode .pics .ico{width:clamp(80px,10vw,140px);height:clamp(80px,10vw,140px)}
.mode{padding-block:28px 32px}
.mode .pics small{font-family:var(--en);font-size:.5em;color:var(--muted);font-weight:700}
.mode b{font-size:clamp(26px,3.2vw,40px);font-weight:900}
.mode span{font-family:var(--en);font-size:clamp(20px,2.3vw,30px);font-weight:600;color:var(--c)}
.tip{background:#ffffffcc;border-radius:22px;padding:14px 20px;font-size:clamp(17px,1.8vw,22px);line-height:1.6;margin:0}
.warn{background:#fff3cd;border:3px solid var(--sun);border-radius:16px;padding:12px 16px;font-size:18px}
/* bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tool{background:#fff;border-radius:18px;min-width:64px;min-height:64px;padding:0 16px;font-size:28px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 5px 0 #9bb2d6}
.tool:active{transform:translateY(4px);box-shadow:0 1px 0 #9bb2d6}
.tool span{font-size:21px}
.tool.yel{background:var(--sun);box-shadow:0 5px 0 var(--sun-d)}
.pill{background:#fff;border-radius:999px;padding:8px 20px;font-size:clamp(20px,2.3vw,30px);font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 5px 0 #9bb2d6;white-space:nowrap}
.pill b{font-family:var(--en)}
.pill.ok b{color:var(--mint)} .pill.no b{color:var(--red)}
.topic{font-size:clamp(20px,2.3vw,30px);font-weight:900;font-family:var(--en);color:var(--ink);flex:1;min-width:0;text-align:center}
/* board */
.board{flex:1;display:flex;align-items:center;justify-content:center}
.grid{--h:calc((100dvh - 210px)/3);display:grid;grid-template-columns:repeat(4,min(calc(var(--h)*.86),calc((100vw - 120px)/4)));gap:clamp(10px,1.6vw,22px);justify-content:center}
.card{position:relative;aspect-ratio:.86;perspective:900px;touch-action:none;width:100%}
.card.drag{z-index:30}
.card.drag .flip{transform:scale(1.08) rotate(-4deg);transition:transform .1s}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.card.up .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%}
.back{background:radial-gradient(circle at 30% 22%,#ffffff88 0 14%,transparent 15%),linear-gradient(150deg,#a78bff,var(--grape) 55%,#5a3ee0);
  box-shadow:inset 0 -10px 0 #00000026,inset 0 6px 0 #ffffff55,0 9px 0 var(--grape-d),0 16px 22px #1b2a4e40}
.card:nth-child(3n+2) .back{background:radial-gradient(circle at 30% 22%,#ffffff88 0 14%,transparent 15%),linear-gradient(150deg,#ff9ab9,var(--berry) 55%,#e83f78);box-shadow:inset 0 -10px 0 #00000026,inset 0 6px 0 #ffffff55,0 9px 0 var(--berry-d),0 16px 22px #1b2a4e40}
.card:nth-child(3n) .back{background:radial-gradient(circle at 30% 22%,#ffffff88 0 14%,transparent 15%),linear-gradient(150deg,#7fd8ff,#2fa5ef 55%,#1f86d6);box-shadow:inset 0 -10px 0 #00000026,inset 0 6px 0 #ffffff55,0 9px 0 #1667a8,0 16px 22px #1b2a4e40}
.back .emo{font-size:calc(var(--h)*.42);filter:drop-shadow(0 6px 0 #00000030)}
.back i{font-style:normal;font-family:var(--en);font-weight:700;color:#fff;font-size:calc(var(--h)*.14);text-shadow:0 3px 0 #00000035}
.front{transform:rotateY(180deg);background:linear-gradient(#fff,#f3f6ff);border:5px solid #fff;
  box-shadow:inset 0 -9px 0 #dbe4f7,0 9px 0 #a9bce0,0 16px 22px #1b2a4e40}
.front .emo{font-size:calc(var(--h)*.5);filter:drop-shadow(0 8px 6px #1b2a4e33)}
.front .w{font-family:var(--en);font-weight:700;font-size:calc(var(--h)*.16);line-height:1;color:var(--ink)}
.front.word .w{font-size:calc(var(--h)*.22);padding:0 6%;text-align:center;overflow-wrap:anywhere}
.front.word{background:linear-gradient(#fffbe8,#fff1b8);box-shadow:inset 0 -9px 0 #f3d97a,0 9px 0 #d9b443,0 16px 22px #1b2a4e40}
.card.match .front{border-color:var(--mint);background:linear-gradient(#f2fff8,var(--mint-soft));box-shadow:inset 0 -9px 0 #b3ecd0,0 9px 0 var(--mint-d),0 0 0 8px #18b56a55}
.card.match .flip{animation:hop .6s .1s}
.card.bad .flip{animation:shake .5s}
.card.bad .front{border-color:var(--red)}
.card.gone{opacity:.92}
@keyframes hop{40%{transform:rotateY(180deg) translateY(-22px) scale(1.06)}}
@keyframes shake{20%,60%{transform:rotateY(180deg) translateX(-12px)}40%,80%{transform:rotateY(180deg) translateX(12px)}}
/* feedback */
.fb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none}
.bubble{background:#fff;border-radius:40px;padding:22px 40px;display:flex;align-items:center;gap:22px;max-width:92vw;
  box-shadow:0 12px 0 var(--mint-d),0 30px 60px #1b2a4e55;border:6px solid var(--mint);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.bubble .emo{font-size:clamp(70px,11vw,140px)}
.bubble .t{font-family:var(--en);font-weight:700;font-size:clamp(34px,5vw,66px);color:var(--ink);line-height:1.15}
.bubble .ok{color:var(--mint);font-size:clamp(70px,10vw,130px);font-family:var(--en);font-weight:700}
.fb.no .x{font-family:var(--en);font-weight:700;font-size:min(300px,55vw);color:var(--red);text-shadow:0 10px 0 #9e1b1b55;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.conf{position:fixed;top:45%;left:50%;width:18px;height:12px;border-radius:4px;z-index:49;pointer-events:none;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}
/* end */
.endbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.trophy{font-size:clamp(110px,16vw,190px);animation:bob 2.4s ease-in-out infinite}
.stars{font-size:clamp(56px,8vw,96px);letter-spacing:10px;color:var(--sun);-webkit-text-stroke:3px var(--sun-d);line-height:1}
.stars .off{color:#ffffff;-webkit-text-stroke:3px #b9c8e3}
.score{margin:0;font-size:clamp(38px,6vw,76px);font-weight:900;line-height:1.2}
.score b{font-family:var(--en);font-size:1.25em}
.score .g{color:var(--mint)} .score .r{color:var(--red)}
.sub{margin:0;font-size:clamp(20px,2.4vw,30px);font-weight:700;color:var(--muted)}
.big{border-radius:24px;padding:16px 36px;font-size:clamp(26px,3vw,38px);font-weight:900;color:#fff;background:var(--mint);box-shadow:0 8px 0 var(--mint-d);min-height:84px}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 var(--mint-d)}
.big.alt{background:var(--grape);box-shadow:0 8px 0 var(--grape-d)}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.review{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1100px}
.review button{background:#fff;border-radius:20px;padding:8px 18px;display:flex;align-items:center;gap:10px;font-family:var(--en);font-weight:600;font-size:clamp(20px,2.2vw,28px);box-shadow:0 5px 0 #9bb2d6}
.review .emo{font-size:46px}
@media (max-width:760px){.modes{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,calc((100vw - 64px)/3));--h:calc((100vw - 64px)/3/.86)}.tool span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  ['cat',  'cat',null,'cat',"It's a cat."],['dog','dog',null,'dog',"It's a dog."],['pig','pig',null,'pig',"It's a pig."],
  ['rabbit','rabbit',null,'rabbit',"It's a rabbit."],['tiger','tiger',null,'tiger',"It's a tiger."],['lion','lion',null,'lion',"It's a lion."],
  ['elephant','elephant',null,'elephant',"It's an elephant."],['monkey','monkey',null,'monkey',"It's a monkey."],['panda','panda',null,'panda',"It's a panda."],
  ['frog','frog',null,'frog',"It's a frog."],['chick','chick',null,'chick',"It's a chick."],['koala','koala',null,'koala',"It's a koala."]]}
];
const PAIRS=6,RATE=.85;
let G=null,last='';
const $app=document.getElementById('app'),$fb=document.getElementById('fb');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* voice */
const synth=window.speechSynthesis;let voice=null;
function pickVoice(){if(!synth)return;const v=synth.getVoices().filter(x=>/^en[-_]/i.test(x.lang));
 for(const p of ['Samantha','Ava','Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Allison']){voice=v.find(x=>x.name.includes(p));if(voice)break}
 if(!voice)voice=v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function speak(t){if(!synth||!t)return;last=t;try{synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=RATE;synth.speak(u)}catch(e){}}

/* sound */
let ac=null;
function sfx(kind){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 const S={flip:[[700,0,.08,'sine',.12],[980,.05,.08,'sine',.1]],ok:[[523,0,.25,'triangle',.25],[659,.1,.25,'triangle',.25],[784,.2,.25,'triangle',.25],[1047,.32,.4,'triangle',.25]],
  no:[[260,0,.25,'square',.12],[180,.2,.35,'square',.12]],win:[[523,0,.2,'triangle',.25],[659,.15,.2,'triangle',.25],[784,.3,.2,'triangle',.25],[1047,.45,.2,'triangle',.25],[1319,.6,.5,'triangle',.25]]}[kind];
 S.forEach(([f,t,d,type,v])=>{const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d+.05)})}catch(e){}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cs=['#ff5d8f','#ffc93c','#18b56a','#7b5cff','#2fa5ef'];
 for(let i=0;i<46;i++){const d=document.createElement('div');d.className='conf';const a=Math.random()*Math.PI*2,r=200+Math.random()*380;
  d.style.background=cs[i%5];d.style.setProperty('--x',Math.cos(a)*r+'px');d.style.setProperty('--y',Math.sin(a)*r+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}}
function show(html,cls,ms){$fb.className='fb '+cls;$fb.innerHTML=html;$fb.hidden=false;clearTimeout(show.t);show.t=setTimeout(()=>{$fb.hidden=true},ms)}

/* home */
function home(){G=null;
 $app.innerHTML=`
 <div class="hero">${pic('panda')}<h1>動物翻翻樂<span class="en">Animal Memory Game</span></h1>${pic('rabbit')}</div>
 ${synth?'':'<div class="warn">這個瀏覽器不能念英文，請改用 Chrome 或 Edge 開啟。</div>'}
 <div class="modes">${MODES.map(m=>`<button class="mode" data-m="${m.id}" style="--c:${m.c}">
   <div class="pics">${pic(m.demo[0])}${m.demo[1]?pic(m.demo[1]):'<small>panda</small>'}</div><b>${m.zh}</b><span>${m.en}</span></button>`).join('')}</div>
 <p class="tip">玩法：一次翻兩張牌，配成一對就答對。點牌就能翻，也可以把一張牌拖到另一張牌上，兩張一起翻開。翻開的牌會念出英文，配對成功會念整句。每局 6 對、12 張牌，位置每次都不一樣。</p>`;
 $app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m));
}

/* game */
function start(id){const m=MODES.find(x=>x.id===id);const ps=shuffle(m.pairs).slice(0,PAIRS);
 let cards=[];const lab=m.id!=='name';ps.forEach((p,i)=>{cards.push({p:i,img:p[0],w:p[1],say:p[1],lab});cards.push({p:i,img:p[2],w:p[3],say:p[3],lab:true})});
 G={m,ps,cards:shuffle(cards),open:[],lock:false,ok:0,no:0,found:0};
 $app.innerHTML=`
 <div class="bar">
  <button class="tool" id="home" aria-label="回主畫面">🏠<span>主畫面</span></button>
  <button class="tool yel" id="peek" aria-label="全部偷看 3 秒">👀<span>偷看 3 秒</span></button>
  <div class="topic">${m.en}</div>
  <div class="pill ok">答對 <b id="ok">0</b></div>
  <div class="pill no">答錯 <b id="no">0</b></div>
  <button class="tool" id="say" aria-label="再念一次">🔊</button>
  <button class="tool" id="fs" aria-label="全螢幕">⛶</button>
 </div>
 <div class="board"><div class="grid" id="grid">${G.cards.map((c,i)=>`
  <div class="card" data-i="${i}" role="button" tabindex="0" aria-label="card ${i+1}">
   <div class="flip"><div class="face back">${pic('paw')}<i>${i+1}</i></div>
   <div class="face front${c.img?'':' word'}">${c.img?pic(c.img)+(c.lab?`<div class="w">${c.w}</div>`:''):`<div class="w">${c.w}</div>`}</div></div>
  </div>`).join('')}</div></div>`;
 document.getElementById('home').onclick=home;
 document.getElementById('say').onclick=()=>speak(last);
 document.getElementById('peek').onclick=peek;
 document.getElementById('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
 document.querySelectorAll('.card').forEach(bind);
}
function el(i){return document.querySelector(`.card[data-i="${i}"]`)}
function peek(){if(G.lock||G.open.length)return;G.lock=true;const hid=[...document.querySelectorAll('.card:not(.up)')];
 hid.forEach(c=>c.classList.add('up'));setTimeout(()=>{hid.forEach(c=>c.classList.remove('up'));G.lock=false},3000)}
function flip(i){if(!G||G.lock)return false;const c=G.cards[i],e=el(i);
 if(c.done||G.open.includes(i)||G.open.length>=2)return false;
 e.classList.add('up');G.open.push(i);sfx('flip');speak(c.say);
 if(G.open.length===2){G.lock=true;setTimeout(check,900)}return true}
function check(){const [a,b]=G.open,A=G.cards[a],B=G.cards[b],ea=el(a),eb=el(b);
 if(A.p===B.p){A.done=B.done=true;G.ok++;G.found++;ea.classList.add('match');eb.classList.add('match');
  const p=G.ps[A.p];sfx('ok');confetti();speak(p[4]);
  show(`<div class="bubble"><span class="ok">✓</span>${pic(p[0])}${p[2]?pic(p[2]):''}<div class="t">${p[4]}</div></div>`,'ok',2300);
  G.open=[];setTimeout(()=>{G.lock=false;if(G.found===G.ps.length)setTimeout(end,500)},1300);
 }else{G.no++;ea.classList.add('bad');eb.classList.add('bad');sfx('no');show('<div class="x">✗</div>','no',700);
  setTimeout(()=>{ea.classList.remove('bad','up');eb.classList.remove('bad','up');G.open=[];G.lock=false},1300)}
 document.getElementById('ok').textContent=G.ok;document.getElementById('no').textContent=G.no}
function bind(e){const i=+e.dataset.i;let sx,sy,pid=null,moved=false;
 e.addEventListener('keydown',k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();flip(i)}});
 e.addEventListener('pointerdown',ev=>{if(!G||G.lock||G.cards[i].done)return;pid=ev.pointerId;sx=ev.clientX;sy=ev.clientY;moved=false;e.setPointerCapture(pid)});
 e.addEventListener('pointermove',ev=>{if(ev.pointerId!==pid)return;const dx=ev.clientX-sx,dy=ev.clientY-sy;
  if(!moved&&Math.hypot(dx,dy)>12){moved=true;e.classList.add('drag')}
  if(moved){e.style.transform=`translate(${dx}px,${dy}px)`;mark(ev)}});
 const up=ev=>{if(ev.pointerId!==pid)return;pid=null;e.classList.remove('drag');e.style.transform='';const t=moved?target(ev):null;mark(null);
  if(!moved){flip(i);return}
  if(t!==null&&t!==i){if(!G.open.includes(i))flip(i);setTimeout(()=>flip(t),G.open.length<2?120:0)}};
 e.addEventListener('pointerup',up);
 e.addEventListener('pointercancel',ev=>{if(ev.pointerId!==pid)return;pid=null;e.classList.remove('drag');e.style.transform='';mark(null)});
}
function target(ev){for(const c of document.querySelectorAll('.card')){if(c.classList.contains('drag'))continue;const r=c.getBoundingClientRect();
 if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){const j=+c.dataset.i;return G.cards[j].done?null:j}}return null}
function mark(ev){document.querySelectorAll('.card').forEach(c=>c.style.outline='');if(!ev)return;const t=target(ev);
 if(t!==null){const c=el(t);if(!c.classList.contains('drag'))c.style.outline='6px solid #ffc93c',c.style.borderRadius='28px'}}

/* end */
function end(){const ok=G.ok,no=G.no,st=no<=2?3:no<=5?2:1;sfx('win');confetti();speak(st===3?'Excellent!':st===2?'Great job!':'Good try!');
 $app.innerHTML=`
 <div class="bar"><button class="tool" id="home">🏠<span>主畫面</span></button><div class="topic">${G.m.en}</div></div>
 <div class="endbox">
  <div class="trophy">${pic('trophy')}</div>
  <div class="stars">${[0,1,2].map(i=>i<st?'★':'<span class="off">★</span>').join('')}</div>
  <p class="score">全班答對 <b class="g">${ok}</b> 次・答錯 <b class="r">${no}</b> 次</p>
  <p class="sub">全部 ${G.ps.length} 對都找到了！點下面的圖再聽一次 👇</p>
  <div class="review">${G.ps.map((p,i)=>`<button data-i="${i}">${pic(p[0])}${p[2]?pic(p[2]):''}${p[4]}</button>`).join('')}</div>
  <div class="row"><button class="big" id="again">再玩一次 🔄</button><button class="big alt" id="change">換主題</button></div>
 </div>`;
 const m=G.m;document.getElementById('home').onclick=home;document.getElementById('change').onclick=home;
 document.getElementById('again').onclick=()=>start(m.id);
 $app.querySelectorAll('.review button').forEach(b=>b.onclick=()=>speak(G.ps[+b.dataset.i][4]));
}
document.addEventListener('keydown',e=>{if(e.key===' '&&e.target===document.body&&G){e.preventDefault();speak(last)}});
home();
</script>

</body></html>
