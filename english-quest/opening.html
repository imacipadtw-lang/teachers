<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Opening Show</title>
<link rel="stylesheet" href="css/core.css">
<style>
  body{background:radial-gradient(120% 90% at 50% 10%,#2a4bb0,#0a1633 70%)}
  .scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4rem;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s}
  .scene.on{opacity:1;pointer-events:auto}
  .en{font-size:6.4rem;font-weight:700;line-height:1.05;text-shadow:0 .6rem 0 rgba(0,0,0,.3);max-width:90vw}
  .zh2{font-size:3rem;color:var(--sun);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-weight:700}
  .row{display:flex;gap:3rem;align-items:center;justify-content:center;flex-wrap:wrap}
  .big{width:30vh;height:30vh;filter:drop-shadow(0 2vh 2vh rgba(0,0,0,.4))}
  .ollie-wrap{width:34vh;height:40vh}
  .pop{animation:popIn .7s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes popIn{from{transform:scale(.2) rotate(-10deg);opacity:0}}
  .flyin{animation:fly 1.2s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes fly{from{transform:translate(-80vw,30vh) rotate(-30deg)}}
  .gate{display:flex;flex-direction:column;align-items:center;gap:.6rem;font-size:2.4rem;font-weight:700}
  .gate img{width:15vh;height:15vh;filter:drop-shadow(0 1vh 1vh rgba(0,0,0,.4))}
  .gate b{display:grid;place-items:center;width:5rem;height:5rem;border-radius:1.4rem;color:#0a1633;font-size:2.6rem}
  .card{background:#fff;color:#0a1633;border-radius:2rem;padding:1.6rem 2.4rem;font-size:3rem;font-weight:700;box-shadow:0 1.6rem 3rem rgba(0,0,0,.4)}
  .arrow{font-size:6rem;color:var(--sun)}
  .slots{display:flex;gap:1.2rem}
  .slot{width:12rem;height:14rem;border-radius:1.6rem;border:.6rem solid var(--sun);display:grid;place-items:center;font-size:9rem;font-weight:700;background:rgba(255,255,255,.06)}
  .slot.on{background:var(--sun);color:#0a1633;animation:popIn .5s both}
  .wave{width:60vw;height:12vh}
  .badge{display:inline-flex;gap:1rem;align-items:center;padding:1rem 2.4rem;border-radius:3rem;background:linear-gradient(90deg,#2ee6b6,#4cc9ff);color:#062b3a;font-size:3.4rem;font-weight:700;box-shadow:0 0 4rem rgba(46,230,182,.7)}
  .count{font-size:30vh;font-weight:700;color:var(--sun);text-shadow:0 2vh 0 rgba(0,0,0,.3)}
  .ctrl{position:fixed;bottom:1.6rem;right:2rem;display:flex;gap:1rem;z-index:5}
  .ctrl button{background:var(--panel);border:2px solid var(--line);border-radius:1rem;padding:.6rem 1.4rem;font-size:1.4rem}
  .dots{position:fixed;bottom:2.2rem;left:50%;transform:translateX(-50%);display:flex;gap:.8rem}
  .dots i{width:1.4rem;height:1.4rem;border-radius:50%;background:rgba(255,255,255,.25)}.dots i.on{background:var(--sun)}
  .tag{position:fixed;left:2rem;bottom:1.6rem;font-size:1.2rem;color:var(--ink2)}
</style>
</head>
<body>
<div id="scenes"></div>
<div class="dots" id="dots"></div>
<div class="ctrl"><button id="prev">◀</button><button id="play">▶ 自動播放</button><button id="next">▶▶</button></div>
<div class="tag zh">按空白鍵或點畫面換下一頁 · 歐力的聲音為電腦語音</div>
<script src="js/content.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script>
  const { h, sleep } = TC;
  const G = TC_CONTENT.gates, EMB = { 1: "kart", 2: "rainbow", 3: "mystegg", 4: "mic", 5: "gift", 6: "trophy" };
  const S = [
    { say: "Hello, Tucheng! I'm Ollie-Bot!", build: () => [h("div", { class: "ollie-wrap flyin", html: TC.ollieSVG("cheer") }), h("div", { class: "en" }, "Hello, Tucheng! I'm Ollie-Bot!"), h("div", { class: "zh2" }, "哈囉，土城國小！我是機器貓頭鷹歐力！")] },
    { say: "Bring your passport. Scan your QR card at every gate!", build: () => [h("div", { class: "row" }, h("div", { class: "card pop" }, "🛂 PASSPORT"), h("div", { class: "arrow" }, "➜"), h("div", { class: "card pop", style: "animation-delay:.3s" }, "▣ QR"), h("div", { class: "arrow" }, "➜"), h("div", { class: "card pop", style: "animation-delay:.6s" }, "✓ Hello, Amy!")),
        h("div", { class: "en" }, "Bring your passport. Scan your QR card!"), h("div", { class: "zh2" }, "帶著護照，在每一關掃描你的 QR 登機卡！")] },
    { say: "Six gates. Six cities. Six games!", build: () => [h("div", { class: "row" }, ...[1, 2, 3, 4, 5, 6].map((n, i) => h("div", { class: "gate pop", style: `animation-delay:${i * 0.18}s` }, TC.artImg(EMB[n]), h("b", { style: `background:${G[n].color}` }, n), G[n].city))),
        h("div", { class: "en" }, "6 gates · 6 cities · 6 games!"), h("div", { class: "zh2" }, "六關、六座城市、六個遊戲！")] },
    { say: "Talk with your teacher in English. The AI is listening!", build: () => { const cv = h("canvas", { class: "wave", width: 1200, height: 200 }); waveDemo(cv);
        return [h("div", { class: "row" }, h("div", { class: "ollie-wrap", html: TC.ollieSVG("talk") }), cv), h("div", { class: "badge pop", style: "animation-delay:1.2s" }, "🤖 AI 聽懂了！ “It's a tiger.”"), h("div", { class: "en" }, "Talk with your teacher. AI is listening!"), h("div", { class: "zh2" }, "用英文和老師對話，AI 正在聽！")]; } },
    { say: "Solve the Passport Code! Find the word, say it, and get a secret letter.", build: () => [h("div", { class: "row" }, h("div", { class: "card pop" }, "No. 26"), h("div", { class: "arrow" }, "➜"), h("div", { class: "card pop", style: "animation-delay:.4s" }, "father"), h("div", { class: "arrow" }, "➜"), h("div", { class: "slot on", style: "animation-delay:.8s" }, "F")),
        h("div", { class: "en" }, "Solve the Passport Code!"), h("div", { class: "zh2" }, "翻護照找到編號單字，說出來，得到秘密字母！")] },
    { say: "Collect six letters. Crack the code at the Final Gate!", build: () => { const sl = "??????".split("").map(() => h("div", { class: "slot" }, "?")); setTimeout(async () => { for (let i = 0; i < 6; i++) { await sleep(450); sl[i].textContent = "FRIEND"[i]; sl[i].classList.add("on"); TC.sfx("coin"); } }, 900);
        return [h("div", { class: "slots" }, ...sl), h("div", { class: "en" }, "Crack the code at the Final Gate!"), h("div", { class: "zh2" }, "集滿六個字母，到終點登機門解開密碼！")]; } },
    { say: "Are you ready? Three, two, one. Let's go!", build: () => { const c = h("div", { class: "count" }, "3"); setTimeout(async () => { for (const t of ["3", "2", "1", "GO!"]) { c.textContent = t; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); TC.sfx(t === "GO!" ? "fanfare" : "tick"); await sleep(900); } TC.confetti(300); }, 1800);
        return [h("div", { class: "en" }, "Are you ready?"), c, h("div", { class: "zh2" }, "準備好了嗎？出發！Let's go!")]; } }
  ];
  function waveDemo(cv) { const g = cv.getContext("2d"); let t = 0, started = false; requestAnimationFrame(function f() { if (!cv.isConnected) { if (!started) return requestAnimationFrame(f); return; } started = true; t += 0.08; g.clearRect(0, 0, 1200, 200); const gr = g.createLinearGradient(0, 0, 1200, 0); gr.addColorStop(0, "#2ee6b6"); gr.addColorStop(0.5, "#ffc83d"); gr.addColorStop(1, "#ff5fa2"); g.strokeStyle = gr; g.lineWidth = 8; g.beginPath(); for (let x = 0; x < 1200; x += 6) { const y = 100 + Math.sin(x / 40 + t * 3) * 60 * Math.sin(t + x / 300) * Math.exp(-Math.pow((x - 600) / 450, 2)); x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); requestAnimationFrame(f); }); }
  let cur = -1, auto = false, timer = null;
  const root = document.getElementById("scenes"), dots = document.getElementById("dots");
  S.forEach(() => dots.append(h("i")));
  async function show(i) {
    if (i < 0 || i >= S.length) return; cur = i; TC.ac();
    root.innerHTML = ""; const sc = h("div", { class: "scene" }, ...S[i].build()); root.append(sc); requestAnimationFrame(() => sc.classList.add("on"));
    [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
    TC.sfx("whoosh"); clearTimeout(timer);
    await sleep(500); await TC.speak(S[i].say, { rate: 0.9 });
    if (auto && cur === i && i < S.length - 1) timer = setTimeout(() => show(i + 1), 2200);
  }
  document.getElementById("next").onclick = (e) => { e.stopPropagation(); show(cur + 1); };
  document.getElementById("prev").onclick = (e) => { e.stopPropagation(); show(cur - 1); };
  document.getElementById("play").onclick = (e) => { e.stopPropagation(); auto = !auto; e.target.textContent = auto ? "⏸ 暫停" : "▶ 自動播放"; if (auto) show(cur < 0 || cur >= S.length - 1 ? 0 : cur + 1); };
  document.addEventListener("click", () => show(cur + 1 < S.length ? cur + 1 : 0));
  TC.onKey = (e) => { if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); show(cur + 1); } else if (e.key === "ArrowLeft") show(cur - 1); };
  show(0);
</script>
<script>if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
