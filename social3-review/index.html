/* Layout: a schoolyard trail of five stations; each station = flip cards to learn, then tap-to-answer challenges with a cheering mascot */
:root {
  --sky: #EAF6FF;
  --paper: #FFFDF7;
  --ink: #26324A;
  --soft: #5B6780;
  --sun: #FFC93C;
  --sun-deep: #B7791F;
  --leaf: #3FA36C;
  --leaf-bg: #E3F6EA;
  --berry: #E5546C;
  --berry-bg: #FDE7EB;
  --sea: #2F76C9;
  --line: #CFE0F0;
  --face: 'Bpmf Huninn', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink); font-family: var(--face); font-size: 22px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--sea); outline-offset: 3px; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 22px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; }
.stars { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 3px solid var(--sun); border-radius: 999px; padding: 4px 18px; font-size: 24px; font-weight: 700; }
.stars svg { width: 30px; height: 30px; }
.btn { border: 0; border-radius: 18px; padding: 12px 22px; font-size: 22px; font-weight: 700; background: var(--paper); box-shadow: 0 4px 0 var(--line); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.go { background: var(--sun); box-shadow: 0 5px 0 var(--sun-deep); }
.btn.go:active { box-shadow: 0 2px 0 var(--sun-deep); }

/* hero */
.hero { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 20px; background: var(--paper); border-radius: 28px; padding: 22px 26px; }
.hero h1 { margin: 0; font-size: 40px; line-height: 1.3; text-wrap: balance; }
.hero p { margin: 6px 0 0; color: var(--soft); font-size: 22px; }
.mascot { width: 130px; height: 130px; }
.mascot.jump { animation: jump .6s ease; }
.mascot.shake { animation: shake .5s ease; }
@keyframes jump { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-26px) rotate(-6deg) } 70% { transform: translateY(4px) } }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-10px) } 75% { transform: translateX(10px) } }
.bob { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

/* trail */
.trail { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
.trail::before { content: ""; position: absolute; left: 8%; right: 8%; top: 64px; border-top: 6px dashed var(--line); }
.stop { position: relative; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; }
.stop .disc { width: 128px; height: 128px; border-radius: 50%; background: var(--paper); border: 6px solid var(--c); display: grid; place-items: center; transition: transform .2s; }
.stop:hover .disc { transform: scale(1.06) rotate(-3deg); }
.stop .disc svg { width: 70px; height: 70px; }
.stop .name { font-size: 22px; font-weight: 700; text-align: center; line-height: 1.4; }
.stop .badge { position: absolute; top: -6px; right: 6px; width: 46px; height: 46px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; box-shadow: 0 3px 0 var(--sun-deep); }
.stop .badge svg { width: 28px; height: 28px; }

/* station */
.panel { background: var(--paper); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.panel h2 { margin: 0; font-size: 34px; display: flex; align-items: center; gap: 12px; }
.panel h2 svg { width: 52px; height: 52px; }
.hint { margin: 0; color: var(--soft); font-size: 20px; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { perspective: 900px; border: 0; background: transparent; padding: 0; min-height: 150px; display: block; width: 100%; }
.card .in { display: block; position: relative; width: 100%; height: 100%; min-height: 150px; transition: transform .5s; transform-style: preserve-3d; }
.card.flip .in { transform: rotateY(180deg); }
.card .f, .card .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 22px; padding: 18px 20px; display: flex; align-items: center; gap: 14px; text-align: left; font-size: 24px; font-weight: 700; }
.card .f { background: var(--cbg); border: 3px solid var(--c); }
.card .f svg { width: 56px; height: 56px; flex: none; }
.card .f > span:not(.tap), .card .b { min-width: 0; }
.card .b { background: var(--c); color: var(--paper); transform: rotateY(180deg); font-size: 21px; font-weight: 400; line-height: 1.55; }
.card .tap { position: absolute; right: 12px; bottom: 6px; font-size: 16px; color: var(--soft); font-weight: 400; }

/* quiz */
.q { font-size: 28px; font-weight: 700; line-height: 1.5; margin: 0; text-wrap: balance; }
.qnum { font-size: 18px; color: var(--soft); letter-spacing: .05em; }
.opts { display: grid; gap: 14px; }
.opt { border: 3px solid var(--line); background: var(--paper); border-radius: 20px; padding: 14px 20px; font-size: 24px; text-align: left; display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 0 var(--line); }
.opt .k { width: 44px; height: 44px; border-radius: 50%; background: var(--sky); display: grid; place-items: center; font-weight: 700; flex: none; }
.opt.right { border-color: var(--leaf); background: var(--leaf-bg); box-shadow: 0 4px 0 var(--leaf); }
.opt.right .k { background: var(--leaf); color: var(--paper); }
.opt.wrong { border-color: var(--berry); background: var(--berry-bg); animation: shake .4s; }
.feedback { min-height: 44px; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.feedback.good { color: var(--leaf); }
.feedback.try { color: var(--berry); }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.dots { display: flex; gap: 8px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--sun); }

/* finish */
.cert { text-align: center; align-items: center; border: 6px double var(--sun); }
.cert h2 { justify-content: center; font-size: 40px; }
.cert .big { width: 160px; height: 160px; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100%; }
.burst { position: fixed; pointer-events: none; z-index: 21; font-weight: 700; color: var(--sun-deep); font-size: 30px; animation: up 0.9s ease forwards; }
@keyframes up { from { opacity: 1; transform: translateY(0) scale(.8) } to { opacity: 0; transform: translateY(-70px) scale(1.2) } }

@media (max-width: 760px) {
  .trail { grid-template-columns: repeat(2, 1fr); }
  .trail::before { display: none; }
  .cards { grid-template-columns: 1fr; }

const KEY = 'social3-trail-v1';

const app = document.getElementById('app');
const KEYS = ['A', 'B', 'C'];

function bar(back) {

}

function home() {

function station(i) {
  const s = STATIONS[i];

  app.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => b.classList.toggle('flip')));
}

function quiz(i, n = 0, score = 0) {
  const s = STATIONS[i], q = s.qs[n];
  let first = true;
  app.innerHTML = bar(true) + `
  <section class="panel" style="--c:${s.c};--cbg:${s.cbg}">

  <div class="opts">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${KEYS[k]}</span><span>${zy(o)}</span></button>`).join('')}</div>

  <div class="row"><span></span><button class="btn go" id="next" hidden>${zy(n + 1 < s.qs.length ? '下一題 →' : '完成這一關！')}</button></div></section>`;

  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', e => {
    const k = +b.dataset.k;
    if (!document.getElementById('next').hidden) return;
    if (k === q.a) {
      b.classList.add('right'); if (first) score++;
      fb.className = 'feedback good'; fb.textContent = zy((first ? '答對了！好棒！' : '答對了！') + q.tip);

      pop(e.clientX, e.clientY, first ? '+1' : '✓'); sparkle(e.clientX, e.clientY, 40);
      document.getElementById('next').hidden = false;
    } else {
      first = false; b.classList.add('wrong'); b.disabled = true;
      fb.className = 'feedback try'; fb.textContent = zy('再想想看！提示：' + q.tip);
      m.classList.remove('jump'); void m.offsetWidth; m.classList.add('shake');
    }
  }));
  document.getElementById('next').addEventListener('click', () => {
    if (n + 1 < s.qs.length) quiz(i, n + 1, score);
    else { done[s.id] = Math.max(done[s.id] || 0, score); save(); cleared(i, score); }

function cleared(i, score) {

}

  for (let k = 0; k < 4; k++) setTimeout(() => sparkle(innerWidth * (0.2 + 0.2 * k), innerHeight / 3, 70), k * 250);

app.addEventListener('click', e => {

  else if (t.dataset.quiz != null) quiz(+t.dataset.quiz);
  else if (t.dataset.go === 'home') home();
  else if (t.dataset.go === 'finish') finish();
  else if (t.dataset.go === 'reset') { done = {}; save(); home(); }
  window.scrollTo({ top: 0 });
});

// ---------- 小動畫 ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('fx'), cx = cv.getContext('2d'); let parts = [], running = false;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener('resize', size); size();
const COLORS = ['#FFC93C', '#3FA36C', '#2F76C9', '#E5546C', '#7A5CC4'];
function sparkle(x, y, n) {
  if (reduce) return;
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 2, r: 4 + Math.random() * 5, c: COLORS[i % 5], life: 60 + Math.random() * 30, rot: Math.random() * 6 });
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .3; p.life--; p.rot += .2; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 20);
  if (parts.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
}
function pop(x, y, t) { if (reduce) return; const d = document.createElement('div'); d.className = 'burst'; d.textContent = t; d.style.left = (x - 10) + 'px'; d.style.top = (y - 30) + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 900); }

home();
</script>
